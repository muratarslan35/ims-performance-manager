{% extends "base.html" %}

{% block title %}Yeni Şifre | IMS Performans Yönetimi{% endblock %}

{% block content %}
<div class="auth-shell">
    <section class="auth-card auth-card-narrow">
        <div class="auth-brand"><span class="auth-brand-icon"><i class="bi bi-shield-lock-fill"></i></span><div><p class="auth-eyebrow">HESAP GÜVENLİĞİ</p><h1>Yeni şifre belirleyin</h1><p>Güçlü ve daha önce kullanmadığınız bir şifre seçin.</p></div></div>
        <form method="post" class="auth-form">
            <div class="mb-3"><label class="form-label" for="password">Yeni şifre</label><input id="password" name="password" type="password" class="form-control" autocomplete="new-password" required minlength="8"></div>
            <div class="mb-3"><label class="form-label" for="password_confirm">Şifre tekrarı</label><input id="password_confirm" name="password_confirm" type="password" class="form-control" autocomplete="new-password" required minlength="8"></div>
            <button class="btn btn-primary w-100" type="submit">Şifreyi güncelle</button>
        </form>
    </section>
</div>
{% endblock %}
