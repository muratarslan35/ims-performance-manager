{% extends "base.html" %}

{% block title %}Hesap Oluştur | BİLİM İLAÇ IMS{% endblock %}

{% block content %}
<div class="auth-shell">
    <div class="auth-layout">
    <aside class="auth-identity-panel" aria-label="Bilim İlaç">
        <img src="{{ url_for('static', filename='img/bilim-ilac-white.svg') }}" alt="Bilim İlaç" class="auth-identity-logo">
    </aside>
    <section class="auth-card">

        <h2 class="auth-welcome">Hesabınızı oluşturun</h2>
        <p class="auth-subtitle">Performans verilerinize güvenle erişmek için bilgilerinizi tamamlayın.</p>

        <form method="post" action="{{ url_for('auth.register') }}" class="auth-form" novalidate>

            <div class="mb-3">
                <label class="form-label" for="full_name">Ad Soyad</label>
                <input id="full_name" name="full_name" type="text" class="form-control" autocomplete="name" required minlength="3" value="{{ request.form.get('full_name', '') }}">
            </div>

            <div class="mb-3">
                <label class="form-label" for="email">E-Posta Adresi</label>
                <input id="email" name="email" type="email" class="form-control" autocomplete="email" required value="{{ request.form.get('email', '') }}">
            </div>

            <div class="mb-3">
                <label class="form-label" for="phone">Telefon</label>
                <input id="phone" name="phone" type="tel" class="form-control" autocomplete="tel" placeholder="+90 5XX XXX XX XX" value="{{ request.form.get('phone', '') }}">
            </div>

            <div class="mb-3">
                <label class="form-label" for="region">Bölge</label>
                <select id="region" name="region" class="form-select" required>
                    <option value="">Bölge seçiniz</option>
                    {% for region, city in regions %}
                    <option value="{{ region }}" {% if request.form.get('region') == region %}selected{% endif %}>{{ region }} {{ city }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label" for="password">Şifre</label>
                    <input id="password" name="password" type="password" class="form-control" autocomplete="new-password" required minlength="8">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label" for="password_confirm">Şifre Tekrar</label>
                    <input id="password_confirm" name="password_confirm" type="password" class="form-control" autocomplete="new-password" required minlength="8">
                </div>
            </div>

            <p class="form-hint mb-3">Şifreniz en az 8 karakter olmalıdır.</p>

            <button class="btn btn-primary w-100 btn-auth-submit" type="submit">
                <i class="bi bi-person-check-fill me-2"></i>Hesap Oluştur
            </button>

        </form>

        <p class="auth-footer">Zaten hesabınız var mı? <a href="{{ url_for('auth.login') }}">Giriş Yapın</a></p>
    </section>
    </div>
</div>
{% endblock %}
