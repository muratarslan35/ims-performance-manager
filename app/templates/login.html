{% extends "base.html" %}

{% block content %}

<div class="auth-shell"><section class="auth-card auth-card-narrow"><div class="auth-brand"><span class="auth-brand-icon"><i class="bi bi-graph-up-arrow"></i></span><div><p class="auth-eyebrow">IMS PERFORMANS</p><h1>Tekrar hoş geldiniz</h1><p>Performans yönetim alanınıza giriş yapın.</p></div></div><form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">

<div class="mb-3">

<label class="form-label">

E-Posta

</label>

<input
type="email"
name="email"
class="form-control"
placeholder="ornek@firma.com"
required>

</div>

<div class="mb-2">

<label class="form-label">

Şifre

</label>

<input

<div class="text-end mb-4"><a class="auth-link" href="{{ url_for('auth.forgot_password') }}">Şifremi unuttum</a></div><button class="btn btn-primary w-100" type="submit"><i class="bi bi-box-arrow-in-right me-2"></i>Giriş yap</button></form><p class="auth-footer">Hesabınız yok mu? <a href="{{ url_for('auth.register') }}">Kayıt olun</a></p></section></div>
