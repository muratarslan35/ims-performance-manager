{% extends "base.html" %}

{% block styles %}
<link href="{{ url_for('static', filename='css/auth-branding.css') }}" rel="stylesheet">
{% endblock %}

{% block title %}Giriş Yap | BİLİM İLAÇ IMS{% endblock %}

{% block content %}
<div class="auth-shell">
    <div class="auth-system-title">IMS PERFORMANS TAKİP SİSTEMİ</div>
    <div class="auth-layout auth-layout-narrow">
    <aside class="auth-identity-panel" aria-label="Bilim İlaç">
        <img src="{{ url_for('static', filename='img/bilim-ilac.jpg') }}" alt="Bilim İlaç" class="auth-identity-logo">
    </aside>
    <section class="auth-card auth-card-narrow">

        <h2 class="auth-welcome">Tekrar hoş geldiniz</h2>
        <p class="auth-subtitle">Performans yönetim alanınıza giriş yapın.</p>

        <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">

            <div class="mb-3">
                <label class="form-label" for="login_email">E-Posta</label>
                <input
                    type="email"
                    id="login_email"
                    name="email"
                    class="form-control"
                    placeholder="ornek@firma.com"
                    autocomplete="email"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="login_password">Şifre</label>
                <input
                    type="password"
                    id="login_password"
                    name="password"
                    class="form-control"
                    placeholder="••••••••"
                    autocomplete="current-password"
                    required>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check mb-0">
                    <input class="form-check-input" type="checkbox" name="remember" id="remember_me">
                    <label class="form-check-label text-secondary" for="remember_me">Beni Hatırla</label>
                </div>
                <a class="auth-link" href="{{ url_for('auth.forgot_password') }}">Şifremi Unuttum</a>
            </div>

            <button class="btn btn-primary w-100 btn-auth-submit" type="submit">
                <i class="bi bi-box-arrow-in-right me-2"></i>Giriş Yap
            </button>

        </form>

        <p class="auth-footer">Hesabınız yok mu? <a href="{{ url_for('auth.register') }}">Kayıt Olun</a></p>
    </section>
    </div>
</div>
{% endblock %}
