    <rect x="279" y="42" width="20" height="36" rx="5" fill="url(#accent)"/>
    <rect x="313" y="32" width="20" height="46" rx="5" fill="url(#accent)"/>
    <rect x="347" y="22" width="20" height="56" rx="5" fill="url(#accent)"/>
    <path d="M395 10 L435 14 L420 48 Z" fill="#45eadf"/>

    <text x="260" y="151" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="92" font-weight="900" letter-spacing="7" fill="url(#ink)">IMS</text>
  </g>
