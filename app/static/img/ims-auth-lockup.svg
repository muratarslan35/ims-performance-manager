<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" role="img" aria-labelledby="title desc">
  <title id="title">IMS Performans Takip Sistemi</title>
  <desc id="desc">Şeffaf zeminde IMS harfleri ve yükselen performans grafiği.</desc>
  <defs>
    <linearGradient id="ink" x1="92" y1="100" x2="430" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a4f9f"/>
      <stop offset=".55" stop-color="#083e86"/>
      <stop offset="1" stop-color="#061f52"/>
    </linearGradient>
    <linearGradient id="accent" x1="85" y1="78" x2="427" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#168dff"/>
      <stop offset=".55" stop-color="#17d7f2"/>
      <stop offset="1" stop-color="#50f1de"/>
