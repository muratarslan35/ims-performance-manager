<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 150" role="img" aria-labelledby="title desc">
  <title id="title">IMS Performans Takip Sistemi</title>
  <desc id="desc">Şeffaf zeminde IMS monogramı ve yükselen performans grafiği.</desc>
  <defs>
    <linearGradient id="imsInk" x1="45" y1="86" x2="220" y2="132" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b5db8"/>
      <stop offset=".55" stop-color="#083e86"/>
      <stop offset="1" stop-color="#061f52"/>
    </linearGradient>
    <linearGradient id="rise" x1="30" y1="73" x2="225" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#168dff"/>
      <stop offset=".55" stop-color="#17d7f2"/>
      <stop offset="1" stop-color="#50f1de"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#083e86" flood-opacity=".16"/>
    </filter>
  </defs>

  <ellipse cx="130" cy="77" rx="112" ry="60" fill="#2d7ff9" opacity=".035"/>

  <g filter="url(#soft)">
    <path d="M27 71 C72 70 111 64 146 54 C179 45 201 35 224 21" fill="none" stroke="url(#rise)" stroke-width="10" stroke-linecap="round"/>
    <rect x="137" y="49" width="17" height="24" rx="4" fill="url(#rise)"/>
    <rect x="165" y="41" width="17" height="32" rx="4" fill="url(#rise)"/>
    <rect x="193" y="31" width="17" height="42" rx="4" fill="url(#rise)"/>
    <path d="M215 13 L239 17 L228 39 Z" fill="#45eadf"/>

    <text x="130" y="133" text-anchor="middle"
          font-family="Inter,Segoe UI,Arial,sans-serif"
          font-size="82" font-weight="900" letter-spacing="7"
          fill="url(#imsInk)">IMS</text>
  </g>
</svg>