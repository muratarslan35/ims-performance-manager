<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 110" role="img" aria-labelledby="title desc">
  <title id="title">IMS Performans Takip Sistemi</title>
  <desc id="desc">Şeffaf zeminde IMS monogramı ve yükselen performans grafiği.</desc>
  <defs>
    <linearGradient id="ink" x1="70" y1="66" x2="245" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b5db8"/>
      <stop offset=".55" stop-color="#083e86"/>
      <stop offset="1" stop-color="#061f52"/>
    </linearGradient>
    <linearGradient id="rise" x1="47" y1="48" x2="270" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#168dff"/>
      <stop offset=".55" stop-color="#17d7f2"/>
      <stop offset="1" stop-color="#50f1de"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-35%" width="140%" height="185%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#083e86" flood-opacity=".15"/>
    </filter>
  </defs>

  <ellipse cx="160" cy="58" rx="138" ry="44" fill="#2d7ff9" opacity=".035"/>

  <g filter="url(#soft)">
    <path d="M42 48 C88 47 126 43 160 37 C198 30 232 22 270 11"
          fill="none" stroke="url(#rise)" stroke-width="8" stroke-linecap="round"/>
    <rect x="176" y="31" width="14" height="18" rx="3.5" fill="url(#rise)"/>
    <rect x="200" y="26" width="14" height="23" rx="3.5" fill="url(#rise)"/>
    <rect x="224" y="20" width="14" height="29" rx="3.5" fill="url(#rise)"/>
    <path d="M262 5 L286 8 L275 28 Z" fill="#45eadf"/>

    <text x="160" y="99" text-anchor="middle"
          font-family="Inter,Segoe UI,Arial,sans-serif"
          font-size="64" font-weight="900" letter-spacing="6"
          fill="url(#ink)">IMS</text>
  </g>
</svg>