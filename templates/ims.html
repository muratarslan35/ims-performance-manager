{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

<h2>

IMS Merkezi

</h2>

<hr>

<div class="card p-4">

<form

method="POST"

action="{{ url_for('ims.upload') }}"

enctype="multipart/form-data">

<div class="mb-3">

<label class="form-label">

IMS Excel Dosyası

</label>

<input

type="file"

class="form-control"

name="file"

accept=".xlsx"

required>

</div>

<button

class="btn btn-success">

Dosyayı Yükle

</button>

</form>

</div>

</div>

{% endblock %}
