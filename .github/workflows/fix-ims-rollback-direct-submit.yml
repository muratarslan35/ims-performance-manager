name: One-shot IMS rollback direct submit repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-ims-rollback-direct-submit.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply narrow rollback interaction repair
        run: python scripts/repair_ims_rollback_interaction.py

      - name: Validate syntax and focused interaction contracts
        run: |
          python -m py_compile app/services/ims_upload_lifecycle_ui.py scripts/repair_ims_rollback_interaction.py
          git diff --check
          python -m pip install -q pytest
          python -m pytest -q tests/test_ims_rollback_interaction_contract.py tests/test_ims_rollback_button_visibility_contract.py

      - name: Commit verified repair and remove one-shot helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/services/ims_upload_lifecycle_ui.py app/templates/ims.html tests/test_ims_rollback_interaction_contract.py tests/test_ims_upload_lifecycle_contract.py
          git rm .github/workflows/fix-ims-rollback-direct-submit.yml scripts/repair_ims_rollback_interaction.py
          git commit -m 'Fix IMS rollback button interaction end to end'
          git push origin HEAD:main
