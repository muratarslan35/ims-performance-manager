name: One-shot IMS rollback direct submit repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-ims-rollback-direct-submit.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace brittle rollback click wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/services/ims_upload_lifecycle_ui.py')
          text = path.read_text(encoding='utf-8')
          start_marker = "    const firstRollback = (cfg.firstPeriodRollbacks || {{}})[String(id)];"
          end_marker = "    if (row.querySelector('.ims-lifecycle-cell')) return;"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('First-period rollback UI block not found; refusing broad edit')

          replacement = r'''    const firstRollback = (cfg.firstPeriodRollbacks || {{}})[String(id)];
    if (firstRollback && firstRollback.allowed) {{
      const actionCell = row.children[8];
      const rollbackButton = actionCell && Array.from(actionCell.querySelectorAll('button')).find((button) =>
        button.textContent.includes("Önceki IMS'e dön")
      );
      if (rollbackButton) {{
        rollbackButton.disabled = false;
        rollbackButton.removeAttribute('disabled');
        rollbackButton.removeAttribute('title');
        rollbackButton.classList.remove('btn-outline-secondary');
        rollbackButton.classList.add('btn-outline-warning');
        rollbackButton.type = 'submit';
        rollbackButton.dataset.firstPeriodRollback = String(id);

        let rollbackForm = rollbackButton.closest('[data-first-period-rollback-form]');
        if (!rollbackForm) {{
          rollbackForm = document.createElement('form');
          rollbackForm.method = 'post';
          rollbackForm.action = `/ims/uploads/${{id}}/rollback-first-period`;
          rollbackForm.dataset.firstPeriodRollbackForm = '1';
          rollbackForm.style.display = 'inline-block';
          rollbackButton.parentNode.insertBefore(rollbackForm, rollbackButton);
          rollbackForm.appendChild(rollbackButton);
        }}

        rollbackForm.addEventListener('submit', (event) => {{
          const period = `${{row.dataset.year || ''}}/${{row.dataset.month || ''}}`;
          const week = row.dataset.week ? ` ${{row.dataset.week}}. hafta` : '';
          const confirmed = window.confirm(
            `${{period}}${{week}} IMS geri alınacak. ` +
            'Bu dönem yükleme öncesi temiz duruma dönecek ve bir önceki aktif IMS tekrar öne çıkacak. Devam edilsin mi?'
          );
          if (!confirmed) {{
            event.preventDefault();
            return;
          }}
          rollbackButton.disabled = true;
          rollbackButton.innerHTML = '<span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span>Geri alınıyor...';
        }});
      }}
    }}

'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')

          template = Path('app/templates/ims.html')
          source = template.read_text(encoding='utf-8')
          old = '''              <button class="btn btn-sm btn-outline-warning py-1 px-2 ims-lifecycle-open" type="button" style="font-size:11px;" data-confirm-id="rollback-confirm-{{ item.id }}"><i class="bi bi-arrow-counterclockwise me-1"></i>Önceki IMS'e dön</button>
              <div class="alert alert-warning py-2 px-2 mb-0 w-100 ims-lifecycle-confirm" id="rollback-confirm-{{ item.id }}" hidden>
                <strong class="d-block mb-1" style="font-size:11px;">Son IMS geri alınacak. Emin misiniz?</strong>
                <form class="d-flex gap-1" method="post" action="{{ url_for('ims.rollback_upload', upload_id=item.id) }}">
                  <button class="btn btn-sm btn-warning" type="submit" style="font-size:11px;">Onayla ve geri al</button>
                  <button class="btn btn-sm btn-light ims-lifecycle-cancel" type="button" style="font-size:11px;">Vazgeç</button>
                </form>
              </div>'''
          new = '''              <form method="post" action="{{ url_for('ims.rollback_upload', upload_id=item.id) }}" class="d-inline-block ims-rollback-direct-form" onsubmit="return window.confirm('Son aktif IMS geri alınacak ve aynı dönemdeki bir önceki doğrulanmış IMS yeniden aktif olacak. Devam edilsin mi?');">
                <button class="btn btn-sm btn-outline-warning py-1 px-2" type="submit" style="font-size:11px;"><i class="bi bi-arrow-counterclockwise me-1"></i>Önceki IMS'e dön</button>
              </form>'''
          if old not in source:
              raise SystemExit('Standard rollback confirmation block not found; refusing broad edit')
          source = source.replace(old, new, 1)
          template.write_text(source, encoding='utf-8')

          test_path = Path('tests/test_ims_rollback_interaction_contract.py')
          test_path.write_text('''from pathlib import Path\n\n\ndef test_standard_rollback_is_direct_confirmed_post():\n    template = Path("app/templates/ims.html").read_text(encoding="utf-8")\n    assert "ims-rollback-direct-form" in template\n    assert "url_for('ims.rollback_upload', upload_id=item.id)" in template\n    assert "onsubmit=\\\"return window.confirm(" in template\n    assert 'data-confirm-id="rollback-confirm-' not in template\n\n\ndef test_first_period_rollback_uses_native_form_submit_not_popup_toggle():\n    source = Path("app/services/ims_upload_lifecycle_ui.py").read_text(encoding="utf-8")\n    assert "data.firstPeriodRollback" not in source\n    assert "rollbackButton.dataset.firstPeriodRollback" in source\n    assert "rollbackForm.method = 'post'" in source\n    assert "rollbackForm.action = `/ims/uploads/${{id}}/rollback-first-period`" in source\n    assert "rollbackForm.addEventListener('submit'" in source\n    assert "window.confirm(" in source\n    assert "panel.hidden = !panel.hidden" not in source\n''', encoding='utf-8')
          PY

          python -m py_compile app/services/ims_upload_lifecycle_ui.py
          git diff --check

      - name: Run rollback interaction tests
        run: |
          python -m pytest -q \
            tests/test_ims_rollback_interaction_contract.py \
            tests/test_ims_rollback_button_visibility_contract.py \
            tests/test_ims_upload_lifecycle_contract.py

      - name: Commit verified repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/services/ims_upload_lifecycle_ui.py app/templates/ims.html tests/test_ims_rollback_interaction_contract.py
          if git diff --cached --quiet; then
            echo 'No change produced'
            exit 1
          fi
          git commit -m 'Fix IMS rollback button interaction end to end'
          git push origin HEAD:main
