name: Patch region product unit gap
on:
  push:
    branches: [fix/region-product-unit-gap]
    paths: [.github/workflows/patch-region-unit-gap.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/region-product-unit-gap
      - name: Patch unit gap data and table only
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path('app/services/region_performance_service.py')
          s = service.read_text(encoding='utf-8')

          old = '''from app.models import IMSRawData, IMSUpload, Product, ProductionRegionProductResult, Representative, Target\n'''
          new = '''from app.models import IMSSummary, IMSRawData, IMSUpload, Product, ProductionRegionProductResult, Representative, Target\n'''
          if old not in s:
              raise SystemExit('models import anchor missing')
          s = s.replace(old, new, 1)

          old = '''        return db.session.query(\n            Target.year, Target.month, Target.representative_id, Target.product_id,\n            func.coalesce(func.sum(Target.tl_target), 0.0),\n        ).filter(Target.representative_id.in_(self.rep_ids), or_(*conditions)).group_by(\n'''
          new = '''        return db.session.query(\n            Target.year, Target.month, Target.representative_id, Target.product_id,\n            func.coalesce(func.sum(Target.tl_target), 0.0),\n            func.coalesce(func.sum(Target.unit_target), 0.0),\n        ).filter(Target.representative_id.in_(self.rep_ids), or_(*conditions)).group_by(\n'''
          if old not in s:
              raise SystemExit('target rows anchor missing')
          s = s.replace(old, new, 1)

          anchor = '''    def aggregate(self, months):\n'''
          helper = '''    def _official_region_unit_month(self, year, month):\n        \"\"\"Return authoritative region/product box targets and actuals.\n\n        This deliberately uses stored unit fields only. It never derives boxes\n        from TL or realization percentages. P2/P1 region product rows have\n        priority; IMS official region aggregates are the fallback.\n        \"\"\"\n        production_upload = ProductionResultService.final_upload(year, month)\n        if production_upload is not None:\n            rows = ProductionRegionProductResult.query.filter_by(\n                upload_id=production_upload.id, region_code=self.region_key\n            ).all()\n            if rows:\n                return {\n                    row.product_id: [\n                        Decimal(str(row.target_unit or 0)),\n                        Decimal(str(row.actual_unit or 0)),\n                        True,\n                    ]\n                    for row in rows\n                }\n\n        targets = OfficialAggregateService.rows(year, month, self.region_key, TARGET_TYPE)\n        if not targets:\n            return {}\n        actuals = {\n            row.product_id: row\n            for row in OfficialAggregateService.rows(year, month, self.region_key, ACTUAL_TYPE)\n        }\n        upload_id = OfficialAggregateService.latest_upload_id(year, month, TARGET_TYPE)\n        balances = {}\n        if upload_id:\n            balances = {\n                product_id: Decimal(str(balance_unit or 0))\n                for product_id, balance_unit in db.session.query(\n                    IMSRawData.product_id, IMSRawData.unit\n                ).filter(\n                    IMSRawData.upload_id == upload_id,\n                    IMSRawData.sheet_type == \"dashboard_balance_region\",\n                    IMSRawData.territory == self.region_key,\n                ).all()\n            }\n        result = {}\n        for target in targets:\n            target_unit = Decimal(str(target.unit or 0))\n            actual = actuals.get(target.product_id)\n            if actual is not None:\n                result[target.product_id] = [\n                    target_unit, Decimal(str(actual.unit or 0)), True\n                ]\n            elif target.product_id in balances:\n                result[target.product_id] = [\n                    target_unit, target_unit - balances[target.product_id], True\n                ]\n            else:\n                result[target.product_id] = [target_unit, Decimal(\"0\"), False]\n        return result\n\n'''
          if anchor not in s:
              raise SystemExit('aggregate anchor missing')
          s = s.replace(anchor, helper + anchor, 1)

          old = '''        cells = defaultdict(lambda: {\"target\": Decimal(\"0\"), \"actual\": Decimal(\"0\"), \"complete\": True})\n        for year, month, rep_id, product_id, target in self._target_rows(months):\n            key = (year, month, rep_id, product_id)\n            exact_target = Decimal(str(target or 0))\n            cells[key][\"target\"] += exact_target\n            effective = ProductionResultService.effective_product(year, month, rep_id, product_id)\n            if not effective[\"complete\"] or effective[\"actual_tl\"] is None:\n                cells[key][\"complete\"] = False\n            else:\n                cells[key][\"actual\"] += Decimal(str(effective[\"actual_tl\"]))\n'''
          new = '''        cells = defaultdict(lambda: {\n            \"target\": Decimal(\"0\"), \"actual\": Decimal(\"0\"), \"complete\": True,\n            \"target_unit\": Decimal(\"0\"), \"actual_unit\": Decimal(\"0\"), \"unit_complete\": True,\n        })\n        for year, month, rep_id, product_id, target, target_unit in self._target_rows(months):\n            key = (year, month, rep_id, product_id)\n            exact_target = Decimal(str(target or 0))\n            cells[key][\"target\"] += exact_target\n            cells[key][\"target_unit\"] += Decimal(str(target_unit or 0))\n            effective = ProductionResultService.effective_product(year, month, rep_id, product_id)\n            if not effective[\"complete\"] or effective[\"actual_tl\"] is None:\n                cells[key][\"complete\"] = False\n            else:\n                cells[key][\"actual\"] += Decimal(str(effective[\"actual_tl\"]))\n\n            if str(effective.get(\"source\") or \"\").startswith(\"PRODUCTION_\"):\n                production_row = ProductionResultService.final_product_result(year, month, rep_id, product_id)\n                if production_row is None or production_row.actual_unit is None:\n                    cells[key][\"unit_complete\"] = False\n                else:\n                    cells[key][\"actual_unit\"] += Decimal(str(production_row.actual_unit))\n            elif not effective[\"complete\"] or effective.get(\"actual_unit\") is None:\n                cells[key][\"unit_complete\"] = False\n            else:\n                cells[key][\"actual_unit\"] += Decimal(str(effective[\"actual_unit\"]))\n'''
          if old not in s:
              raise SystemExit('aggregate cells anchor missing')
          s = s.replace(old, new, 1)

          old = '''        person_month_product = defaultdict(lambda: [Decimal(\"0\"), Decimal(\"0\"), True])\n        for (year, month, rep_id, product_id), values in cells.items():\n            target, actual, row_complete = values[\"target\"], values[\"actual\"], values[\"complete\"]\n'''
          new = '''        person_month_product = defaultdict(lambda: [Decimal(\"0\"), Decimal(\"0\"), True])\n        person_month_product_units = defaultdict(lambda: [Decimal(\"0\"), Decimal(\"0\"), True])\n        for (year, month, rep_id, product_id), values in cells.items():\n            target, actual, row_complete = values[\"target\"], values[\"actual\"], values[\"complete\"]\n'''
          if old not in s:
              raise SystemExit('person month anchor missing')
          s = s.replace(old, new, 1)

          old = '''            bucket = person_month_product[(year, month, product_id)]\n            bucket[0] += target\n            bucket[1] += actual\n            bucket[2] = bucket[2] and row_complete\n\n        product_totals = defaultdict(lambda: [Decimal(\"0\"), Decimal(\"0\"), True])\n'''
          new = '''            bucket = person_month_product[(year, month, product_id)]\n            bucket[0] += target\n            bucket[1] += actual\n            bucket[2] = bucket[2] and row_complete\n            unit_bucket = person_month_product_units[(year, month, product_id)]\n            unit_bucket[0] += values[\"target_unit\"]\n            unit_bucket[1] += values[\"actual_unit\"]\n            unit_bucket[2] = unit_bucket[2] and values[\"unit_complete\"]\n\n        product_totals = defaultdict(lambda: [Decimal(\"0\"), Decimal(\"0\"), True])\n        product_unit_totals = defaultdict(lambda: [Decimal(\"0\"), Decimal(\"0\"), True])\n'''
          if old not in s:
              raise SystemExit('unit bucket anchor missing')
          s = s.replace(old, new, 1)

          old = '''            for (_, _, product_id), vals in month_source.items():\n                target, actual, row_complete = vals\n                all_product_ids.add(product_id)\n                for bucket in (product_totals[product_id], month_totals[(year, month)]):\n                    bucket[0] += target\n                    bucket[1] += actual\n                    bucket[2] = bucket[2] and row_complete\n\n        products = {\n'''
          new = '''            for (_, _, product_id), vals in month_source.items():\n                target, actual, row_complete = vals\n                all_product_ids.add(product_id)\n                for bucket in (product_totals[product_id], month_totals[(year, month)]):\n                    bucket[0] += target\n                    bucket[1] += actual\n                    bucket[2] = bucket[2] and row_complete\n\n            official_units = self._official_region_unit_month(year, month)\n            if official_units:\n                month_unit_source = official_units\n            else:\n                month_unit_source = {\n                    key[2]: vals for key, vals in person_month_product_units.items()\n                    if key[0] == year and key[1] == month\n                }\n            for product_id, vals in month_unit_source.items():\n                target_unit, actual_unit, unit_complete = vals\n                unit_bucket = product_unit_totals[product_id]\n                unit_bucket[0] += target_unit\n                unit_bucket[1] += actual_unit\n                unit_bucket[2] = unit_bucket[2] and unit_complete\n\n        products = {\n'''
          if old not in s:
              raise SystemExit('month source anchor missing')
          s = s.replace(old, new, 1)

          old = '''        product_rows = [\n            {\n                \"product_id\": pid,\n                \"product_name\": products[pid].product_name if pid in products else f\"Ürün {pid}\",\n                **result_row(vals),\n            }\n            for pid, vals in product_totals.items()\n        ]\n'''
          new = '''        product_rows = []\n        for pid, vals in product_totals.items():\n            unit_vals = product_unit_totals.get(pid, [Decimal(\"0\"), Decimal(\"0\"), False])\n            unit_target, unit_actual, unit_complete = unit_vals\n            product_rows.append({\n                \"product_id\": pid,\n                \"product_name\": products[pid].product_name if pid in products else f\"Ürün {pid}\",\n                \"target_unit\": unit_target,\n                \"actual_unit\": unit_actual if unit_complete else None,\n                \"unit_difference\": (unit_actual - unit_target) if unit_complete else None,\n                \"unit_complete\": unit_complete,\n                **result_row(vals),\n            })\n'''
          if old not in s:
              raise SystemExit('product rows anchor missing')
          s = s.replace(old, new, 1)
          service.write_text(s, encoding='utf-8')

          template = Path('app/templates/region_performance.html')
          t = template.read_text(encoding='utf-8')
          old = '''<th>Ürün</th><th>Hedef ₺</th><th>Gerçekleşen ₺</th><th>Fark</th><th>Realizasyon</th>'''
          new = '''<th>Ürün</th><th>Hedef ₺</th><th>Gerçekleşen ₺</th><th>Kutu Farkı</th><th>₺ Farkı</th><th>Realizasyon</th>'''
          if old not in t:
              raise SystemExit('table header anchor missing')
          t = t.replace(old, new, 1)
          old = '''<td><span class=\"metric-main\">{{ \"{:,.0f}\".format(item.actual_tl) }} ₺</span></td><td class=\"{% if item.gap_tl > 0 %}text-danger{% else %}text-success{% endif %}\">{{ \"{:,.0f}\".format(item.gap_tl|abs) }} ₺</td><td>'''
          new = '''<td><span class=\"metric-main\">{{ \"{:,.0f}\".format(item.actual_tl) }} ₺</span></td><td class=\"{% if item.unit_difference is none %}text-muted{% elif item.unit_difference > 0 %}text-success{% elif item.unit_difference < 0 %}text-danger{% endif %}\">{% if item.unit_difference is not none %}{{ \"{:,.0f}\".format(item.unit_difference|abs) }} kutu{% else %}—{% endif %}</td><td class=\"{% if item.gap_tl > 0 %}text-danger{% else %}text-success{% endif %}\">{{ \"{:,.0f}\".format(item.gap_tl|abs) }} ₺</td><td>'''
          if old not in t:
              raise SystemExit('table row anchor missing')
          t = t.replace(old, new, 1)
          template.write_text(t, encoding='utf-8')

          test_path = Path('tests/test_region_read_v2.py')
          tests = test_path.read_text(encoding='utf-8')
          addition = '''\n\ndef test_region_product_unit_gap_uses_official_stored_units(tmp_path):\n    app = _app(tmp_path)\n    from app.extensions import db\n    from app.models import IMSRawData, IMSUpload, Product, Representative, Target\n    from app.services.official_aggregate_service import TARGET_TYPE, ACTUAL_TYPE\n    from app.services.region_performance_service import RegionPerformanceService\n\n    with app.app_context():\n        db.create_all()\n        product = Product(product_code=\"UNITGAP\", product_name=\"Unit Gap\", is_active=True)\n        rep = Representative(rep_code=\"UNITR\", rep_name=\"Unit Rep\", region=\"901\", city=\"Diyarbakır\", active=True)\n        db.session.add_all([product, rep]); db.session.flush()\n        upload = IMSUpload(file_name=\"units.xlsx\", year=2026, month=2, week_number=9, status=\"COMPLETED\", completed_at=datetime(2026, 2, 28))\n        db.session.add(upload); db.session.flush()\n        db.session.add(Target(year=2026, month=2, representative_id=rep.id, product_id=product.id, tl_target=1000, unit_target=100))\n        db.session.add_all([\n            IMSRawData(upload_id=upload.id, year=2026, month=2, sheet_name=\"BAKIYE\", sheet_type=TARGET_TYPE, source_row=0, product_id=product.id, territory=\"901\", unit=100, tl=1000, raw_json=\"{}\"),\n            IMSRawData(upload_id=upload.id, year=2026, month=2, sheet_name=\"CIKIS\", sheet_type=ACTUAL_TYPE, source_row=0, product_id=product.id, territory=\"901\", unit=112, tl=1100, raw_json=\"{}\"),\n        ])\n        db.session.commit()\n        row = RegionPerformanceService(\"901\", 2026, 2).report()[\"periods\"][\"monthly\"][\"products\"][0]\n        assert row[\"target_unit\"] == Decimal(\"100.0\")\n        assert row[\"actual_unit\"] == Decimal(\"112.0\")\n        assert row[\"unit_difference\"] == Decimal(\"12.0\")\n\n\ndef test_region_product_table_has_unit_gap_and_tl_gap_headers():\n    template = Path(\"app/templates/region_performance.html\").read_text(encoding=\"utf-8\")\n    assert \"<th>Kutu Farkı</th><th>₺ Farkı</th>\" in template\n    assert \"item.unit_difference\" in template\n'''
          if 'test_region_product_unit_gap_uses_official_stored_units' not in tests:
              tests += addition
          test_path.write_text(tests, encoding='utf-8')
          PY
          rm .github/workflows/patch-region-unit-gap.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Add DB-backed unit gap to region product table'
          git push origin HEAD:fix/region-product-unit-gap
