name: Read-only January PP audit

on:
  push:
    branches: [audit/january-pp-readonly]
    paths: [.github/workflows/january-pp-audit.yml]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Audit January latest completed IMS
        run: |
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          venv/bin/python - <<'PY'
          import json, sqlite3
          from collections import defaultdict

          db=sqlite3.connect('instance/ipm.db', timeout=30)
          db.row_factory=sqlite3.Row
          try:
              upload=db.execute('''
                SELECT id,file_name,year,month,week_number,status,completed_at
                FROM ims_uploads
                WHERE year=2026 AND month=1 AND status='COMPLETED'
                ORDER BY COALESCE(week_number,0) DESC, COALESCE(completed_at,uploaded_at) DESC,id DESC
                LIMIT 1
              ''').fetchone()
              if upload is None:
                  print('JAN_PP_AUDIT|'+json.dumps({'error':'no_completed_january_upload'})); raise SystemExit(0)
              uid=upload['id']
              pp_rows=db.execute('''
                SELECT territory,subterritory,product_group,product_name,metric_value,is_company_product,is_competitor,sheet_name
                FROM ims_competition_data
                WHERE upload_id=? AND metric_type='MARKET_SHARE'
                  AND UPPER(sheet_name) LIKE '%REKABET%' AND UPPER(sheet_name) LIKE '%PP%'
              ''',(uid,)).fetchall()
              unit_rows=db.execute('''
                SELECT territory,subterritory,product_group,product_name,SUM(metric_value) v,is_company_product,is_competitor
                FROM ims_competition_data
                WHERE upload_id=? AND metric_type='UNIT'
                  AND COALESCE(is_subtotal,0)=0 AND COALESCE(is_grand_total,0)=0
                  AND UPPER(sheet_name) LIKE '%AYLIK%' AND UPPER(sheet_name) LIKE '%REKABET%' AND UPPER(sheet_name) LIKE '%KUTU%'
                GROUP BY territory,subterritory,product_group,product_name,is_company_product,is_competitor
              ''',(uid,)).fetchall()
              sheets=[dict(r) for r in db.execute('''SELECT sheet_name,metric_type,COUNT(*) n FROM ims_competition_data WHERE upload_id=? GROUP BY sheet_name,metric_type ORDER BY sheet_name,metric_type''',(uid,))]
          finally: db.close()

          norm=lambda v:' '.join(str(v or '').strip().upper().split())
          def region(territory):
              t=norm(territory); return t.split()[0] if t else ''
          pp_region={}
          region_groups=defaultdict(set)
          for r in pp_rows:
              if norm(r['territory'])==norm(r['subterritory']):
                  k=(region(r['territory']),norm(r['product_group']),norm(r['product_name']))
                  pp_region[k]=float(r['metric_value'] or 0)
                  region_groups[(k[0],k[1])].add(k[2])

          unit_region=defaultdict(float)
          unit_group=defaultdict(float)
          for r in unit_rows:
              rg=region(r['territory']); g=norm(r['product_group']); p=norm(r['product_name'])
              unit_region[(rg,g,p)]+=float(r['v'] or 0)
              unit_group[(rg,g)]+=float(r['v'] or 0)

          missing=[]; matched=0
          for k,v in unit_region.items():
              if k in pp_region: matched+=1
              else:
                  total=unit_group[k[:2]]
                  missing.append({'region':k[0],'group':k[1],'product':k[2],'unit':round(v,2),'fallback_pp':round(v*100/total,6) if total else 0})

          pp_group_sums=[]
          for (rg,g), products in sorted(region_groups.items()):
              vals=[pp_region[(rg,g,p)] for p in products]
              pp_group_sums.append({'region':rg,'group':g,'products':len(products),'raw_sum':round(sum(vals),6)})

          result={
            'upload':dict(upload), 'pp_rows_total':len(pp_rows), 'pp_region_rows':len(pp_region),
            'unit_rows_total':len(unit_rows), 'matched_unit_to_pp':matched, 'fallback_count':len(missing),
            'fallback_samples':missing[:40], 'pp_group_count':len(pp_group_sums),
            'pp_group_sum_non100':[x for x in pp_group_sums if abs(x['raw_sum']-100)>0.01][:40],
            'sheets':sheets,
          }
          print('JAN_PP_AUDIT|'+json.dumps(result,ensure_ascii=False,sort_keys=True))
          PY
          REMOTE
