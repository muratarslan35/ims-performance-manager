name: Murat Monthly Market Comparison Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/murat-monthly-market-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
      COMPARISON_CONTRACT_SHA: 6e1a5844e5793ccd7a221d438a8c6de2028127b4
    steps:
      - name: Configure SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Verify comparison contract is live
        run: |
          set -Eeuo pipefail
          state="$(ssh -i ~/.ssh/key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "cd '$IMS_PATH' && live_sha=\$(git rev-parse HEAD) && if git merge-base --is-ancestor '$COMPARISON_CONTRACT_SHA' \"\$live_sha\"; then echo \"\$live_sha|contains\"; else echo \"\$live_sha|missing\"; fi")"
          echo "LIVE_STATE|$state"
          echo "$state" | grep -q '|contains$'

      - name: Wait for IMS queue idle
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 180); do
            state="$(ssh -i ~/.ssh/key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          from app import create_app
          from app.models import IMSImportJob

          app=create_app()
          with app.app_context():
              busy=IMSImportJob.query.filter(
                  IMSImportJob.status.in_((IMSImportJob.STATUS_QUEUED, IMSImportJob.STATUS_PROCESSING))
              ).count()
              print(f"IMS_BUSY|{busy}")
          PY
          REMOTE
          )"
            echo "$state"
            if echo "$state" | grep -q 'IMS_BUSY|0'; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Restart worker and queue active-month refresh
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          sudo systemctl restart ims-import-worker.service
          test "$(sudo systemctl is-active ims-import-worker.service)" = "active"
          echo "WORKER_RESTART|PASS"

          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          from app import create_app
          from app.services.period_service import PeriodService
          from app.services.representative_snapshot_refresh_queue import RepresentativeSnapshotRefreshQueue

          app=create_app()
          with app.app_context():
              period=PeriodService.get_active_period()
              year, month=int(period["year"]), int(period["month"])
              item=RepresentativeSnapshotRefreshQueue.enqueue(
                  year, month, reason="monthly_comparison_fix_live_acceptance"
              )
              print(f"REFRESH_QUEUED|year={year}|month={month}|reason={item['reason']}")
          PY
          REMOTE

      - name: Verify live snapshot arithmetic
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 240); do
            set +e
            output="$(ssh -i ~/.ssh/key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          import sqlalchemy as sa
          from app import create_app
          from app.models import Representative
          from app.services.period_service import PeriodService
          from app.services.persistent_representative_snapshot_service import PersistentRepresentativeSnapshotService
          from app.services.production_result_service import ProductionResultService

          def n(v):
              try:
                  return float(v or 0)
              except Exception:
                  return 0.0

          app=create_app()
          with app.app_context():
              period=PeriodService.get_active_period()
              year, month=int(period["year"]), int(period["month"])
              rep=Representative.query.filter(
                  sa.func.upper(Representative.rep_name)=="MURAT ARSLAN"
              ).first()
              assert rep is not None

              ws=PersistentRepresentativeSnapshotService.get_active(rep.id, year, month) or {}
              version=int(ws.get("read_model_version") or 0)
              market=((((ws.get("snapshots") or {}).get("monthly") or {}).get("market_analysis")) or {})
              rows=market.get("comparison_rows") or []
              if version < 2 or not rows:
                  print(f"VERIFY|WAITING|version={version}|rows={len(rows)}")
                  raise SystemExit(2)

              prev_year, prev_month=(year, month-1) if month>1 else (year-1, 12)
              current=ProductionResultService.effective_products(year, month, rep.id)
              previous=ProductionResultService.effective_products(prev_year, prev_month, rep.id)
              failures=[]
              names=set()

              for row in rows:
                  product=row.get("product") or {}
                  pid=int(row.get("product_id") or (product.get("id") if isinstance(product,dict) else 0) or 0)
                  name=(product.get("product_name") if isinstance(product,dict) else str(pid)) or str(pid)
                  names.add(name.upper())

                  actual=n(row.get("actual_unit"))
                  prior=n(row.get("previous_actual_unit"))
                  delta=n(row.get("actual_change_unit"))
                  pct=row.get("actual_change_percent")
                  comp=n(row.get("competitor_unit"))
                  prior_comp=n(row.get("previous_competitor_unit"))
                  comp_delta=n(row.get("competitor_change_unit"))

                  expected_actual=n((current.get(pid) or {}).get("actual_unit"))
                  expected_prior=n((previous.get(pid) or {}).get("actual_unit"))
                  expected_delta=expected_actual-expected_prior
                  expected_pct=(expected_delta*100.0/expected_prior) if expected_prior else None

                  if abs(actual-expected_actual)>0.05: failures.append(f"{name}:current")
                  if abs(prior-expected_prior)>0.05: failures.append(f"{name}:previous")
                  if abs(delta-expected_delta)>0.05: failures.append(f"{name}:delta")
                  if expected_pct is None:
                      if pct is not None: failures.append(f"{name}:percent")
                  elif pct is None or abs(n(pct)-expected_pct)>0.11:
                      failures.append(f"{name}:percent")
                  if abs(comp_delta-(comp-prior_comp))>0.05:
                      failures.append(f"{name}:competitor_delta")

                  print(
                      f"ROW|{name}|previous={prior:.0f}|current={actual:.0f}|delta={delta:.0f}|"
                      f"percent={pct}|previous_comp={prior_comp:.0f}|current_comp={comp:.0f}|"
                      f"competitor_delta={comp_delta:.0f}|source={row.get('source')}|"
                      f"previous_source={row.get('previous_source')}"
                  )

              required={"TRAVAZOL","MONUROL","ACNEMIX","MIXOVUL","STIDERM","BRIMODER","FENTIVAG"}
              missing=sorted(required-names)
              if missing: failures.append("missing=" + ",".join(missing))
              if failures:
                  print("VERIFY|FAIL|" + ",".join(failures))
                  raise SystemExit(3)
              print(f"VERIFY|PASS|year={year}|month={month}|version={version}|rows={len(rows)}")
          PY
          REMOTE
          )"
            rc=$?
            set -e
            echo "$output"
            if echo "$output" | grep -q 'VERIFY|PASS'; then
              exit 0
            fi
            sleep 5
          done
          exit 1
