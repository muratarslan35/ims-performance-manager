name: Dashboard Ranking Refresh

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/august-production-ranking-refresh.yml"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_key
          chmod 600 ~/.ssh/ims_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Wait for deploy and refresh August September rankings
        run: |
          set -Eeuo pipefail
          for poll in $(seq 1 90); do
            live=$(ssh -i ~/.ssh/ims_key -p "$IMS_PORT" -o BatchMode=yes \
              "$IMS_USER@$IMS_HOST" "cd '$IMS_PATH' && git rev-parse HEAD")
            [ "$live" = "$GITHUB_SHA" ] && break
            [ "$poll" -lt 90 ] || { echo "Deploy did not reach $GITHUB_SHA"; exit 1; }
            sleep 5
          done

          ssh -i ~/.ssh/ims_key -p "$IMS_PORT" -o BatchMode=yes \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          from app import create_app
          from app.cache.dashboard_cache import DashboardCache
          from app.constants.dashboard_constants import DashboardConstants
          from app.services.dashboard_service import DashboardService
          from app.services.ims_publication_service import IMSPublicationService
          from app.services.persistent_dashboard_snapshot_service import PersistentDashboardSnapshotService
          from app.services.production_result_service import ProductionResultService

          app = create_app()
          with app.app_context():
              year = 2026

              chain = []
              for source_month in range(1, 10):
                  ims_id, _production_id = PersistentDashboardSnapshotService.source_identity(
                      year, source_month
                  )
                  final_upload = ProductionResultService.final_upload(year, source_month)
                  if final_upload is not None:
                      source = f"P{int(final_upload.production_stage)}#{int(final_upload.id)}"
                  elif ims_id:
                      source = f"IMS#{int(ims_id)}"
                  else:
                      source = "NONE"
                  chain.append(f"{source_month:02d}:{source}")
              print("YTD_SOURCE_CHAIN|" + ",".join(chain))

              refreshed = []
              for month in (8, 9):
                  ims_id, production_id = PersistentDashboardSnapshotService.source_identity(
                      year, month
                  )
                  if not ims_id:
                      raise RuntimeError(
                          f"No completed IMS source for required period {year}-{month:02d}"
                      )

                  pending = IMSPublicationService.pending_job(year, month)
                  if pending is not None:
                      raise RuntimeError(
                          "Pending publication blocks required period "
                          f"{year}-{month:02d}|job_id={int(pending.id)}"
                      )

                  cache_key = DashboardConstants.CACHE_KEY_TEMPLATE.format(
                      year=year, month=month, rep_id=None
                  )
                  DashboardCache().invalidate(cache_key)
                  payload = DashboardService(year=year, month=month).run()

                  assert int(payload.get("top_representative_ranking_version") or 0) >= 3
                  representatives = payload.get("top_representatives") or []
                  assert 0 < len(representatives) <= 10

                  ytd = payload.get("ytd_product_rankings") or {}
                  products = ytd.get("products") or []
                  assert int(ytd.get("year") or 0) == year
                  assert int(ytd.get("through_month") or 0) == month
                  assert products

                  PersistentDashboardSnapshotService.publish(year, month, payload)
                  verified = PersistentDashboardSnapshotService.get_active(year, month) or {}
                  assert verified.get("top_representatives") == representatives
                  assert verified.get("ytd_product_rankings") == ytd

                  final_upload = ProductionResultService.final_upload(year, month)
                  selected_source = (
                      f"P{int(final_upload.production_stage)}#{int(final_upload.id)}"
                      if final_upload is not None
                      else f"IMS#{int(ims_id)}"
                  )
                  top_rep = representatives[0]
                  print(
                      "RANKING_REFRESH|PASS|period={period}|source={source}|"
                      "ims={ims}|production={production}|rep_rows={rep_rows}|"
                      "product_tabs={product_tabs}|top_rep={top_rep}|top_percent={top_percent}".format(
                          period=f"{year}-{month:02d}",
                          source=selected_source,
                          ims=int(ims_id),
                          production=int(production_id),
                          rep_rows=len(representatives),
                          product_tabs=len(products),
                          top_rep=top_rep.get("rep_name"),
                          top_percent=top_rep.get("realization_percent"),
                      )
                  )
                  refreshed.append(month)

              assert refreshed == [8, 9]
              september = PersistentDashboardSnapshotService.get_active(2026, 9) or {}
              september_ytd = september.get("ytd_product_rankings") or {}
              assert int(september_ytd.get("through_month") or 0) == 9
              assert september.get("top_representatives")
              print(
                  "RANKING_REFRESH_FINAL|PASS|months=08,09|"
                  "september_rep_rows={rep_rows}|september_product_tabs={product_tabs}".format(
                      rep_rows=len(september.get("top_representatives") or []),
                      product_tabs=len(september_ytd.get("products") or []),
                  )
              )
          PY
          REMOTE
