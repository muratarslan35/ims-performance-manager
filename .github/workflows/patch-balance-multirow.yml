name: Patch multi-row BAKIYE parser
on:
  push:
    branches: [fix/balance-unit-parser-authority]
permissions:
  contents: write
jobs:
  patch-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/balance-unit-parser-authority
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Patch direct import parser
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/services/ims_import_service.py')
          text = path.read_text(encoding='utf-8')

          old = '''        sections, current = {}, ""
        for column in range(frame.shape[1]):
            label = self.clean_text(frame.iloc[header_row, column])
            normalized_label = AliasService.normalize(label)
            if "HEDEF" in normalized_label:
                current = "target_tl"
            elif "CIKIS" in normalized_label:
                current = "actual_tl"
            elif "BAKIYE" in normalized_label:
                current = "balance_unit" if "KUTU" in normalized_label else "balance_tl"
            sections[column] = current
        has_weekly_sales = any(
'''
          new = '''        sections, current = {}, ""
        for column in range(frame.shape[1]):
            label = self.clean_text(frame.iloc[header_row, column])
            normalized_label = AliasService.normalize(label)
            if "HEDEF" in normalized_label:
                current = "target_tl"
            elif "CIKIS" in normalized_label:
                current = "actual_tl"
            elif "BAKIYE" in normalized_label:
                current = "balance_unit" if "KUTU" in normalized_label else "balance_tl"
            sections[column] = current

        # BAKİYE uses a hierarchical/multi-row header in current IMS files:
        # metric groups (HEDEF / ÇIKIŞ / MF'siz KUTU BAKİYE) live on one row
        # while product names live on another. Resolve those two dimensions
        # independently instead of requiring one cell to contain both labels.
        product_header_row = None
        product_columns = {}
        for candidate_row in range(max(0, header_row - 2), min(len(frame), header_row + 5)):
            candidate_columns = {}
            for column in range(frame.shape[1]):
                if sections.get(column) not in {"target_tl", "actual_tl", "balance_tl", "balance_unit"}:
                    continue
                product_match = self.resolve_product_match(self.clean_text(frame.iloc[candidate_row, column]))
                if product_match["matched"]:
                    candidate_columns[column] = (product_match["object"].id, sections[column])
            if len(candidate_columns) > len(product_columns):
                product_header_row = candidate_row
                product_columns = candidate_columns
        if product_header_row is None or not product_columns:
            self.warnings.append(f"{sheet_name}: BAKİYE ürün başlığı bulunamadı.")
            return

        has_weekly_sales = any(
'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          old = '''        for _, row in frame.iloc[header_row + 1:].iterrows():
'''
          new = '''        for _, row in frame.iloc[product_header_row + 1:].iterrows():
'''
          # Only the balance-summary occurrence must change; weekly has its own header variable later.
          assert text.count(old) >= 1, text.count(old)
          text = text.replace(old, new, 1)

          old = '''            values = {}
            for column in range(frame.shape[1]):
                product_match = self.resolve_product_match(self.clean_text(frame.iloc[header_row, column]))
                if not product_match["matched"]:
                    continue
                product_id = product_match["object"].id
                metric = self.safe_float(row.iloc[column])
                section = sections[column]
                if section == "target_tl":
                    values.setdefault(product_id, {})["target"] = metric
                elif section == "actual_tl":
                    values.setdefault(product_id, {})["actual"] = metric
                elif section == "balance_tl":
                    values.setdefault(product_id, {})["balance_tl"] = metric
                elif section == "balance_unit":
                    values.setdefault(product_id, {})["balance_unit"] = metric
'''
          new = '''            values = {}
            for column, (product_id, section) in product_columns.items():
                raw_value = row.iloc[column]
                # Blank and zero are different business facts. A blank balance
                # means "source unavailable" and permits TTS fallback; numeric
                # zero is an explicit remaining balance and must stay authoritative.
                if section == "balance_unit" and not self.clean_text(raw_value):
                    continue
                metric = self.safe_float(raw_value)
                if section == "target_tl":
                    values.setdefault(product_id, {})["target"] = metric
                elif section == "actual_tl":
                    values.setdefault(product_id, {})["actual"] = metric
                elif section == "balance_tl":
                    values.setdefault(product_id, {})["balance_tl"] = metric
                elif section == "balance_unit":
                    values.setdefault(product_id, {})["balance_unit"] = metric
'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          text = text.replace(
              '        ``TTS HAFTALIK ÇIKIŞLARI`` is the canonical representative-level\n'
              '        actual-sales source.  BAKİYE can contain a different reconciliation\n'
              '        scope, so allowing it to overwrite TTS creates product-level drift.\n'
              '        Its target columns remain the authoritative target source; its actual\n'
              '        columns are retained solely as a compatibility fallback for workbooks\n'
              '        which do not include a TTS weekly sales report.\n',
              '        BAKİYE remains the target source. Its MF\'siz KUTU BAKİYE block is\n'
              '        authoritative for remaining boxes, so representative IMS unit actual\n'
              '        equals unit target minus that balance. TTS remains the TL actual source\n'
              '        and a unit fallback only when an explicit balance-unit cell is absent.\n',
              1,
          )
          path.write_text(text, encoding='utf-8')

          # The direct parser fix supersedes the temporary adapter.
          init = Path('app/__init__.py')
          init_text = init.read_text(encoding='utf-8')
          init_text = init_text.replace('from app.services.balance_unit_authority import install_balance_unit_authority\n', '')
          init_text = init_text.replace('    install_balance_unit_authority()\n', '')
          init.write_text(init_text, encoding='utf-8')
          Path('app/services/balance_unit_authority.py').unlink()
          PY
      - name: Install dependencies
        run: python -m pip install -q -r requirements.txt pytest
      - name: Targeted balance tests
        run: pytest -q tests/test_balance_unit_authority.py tests/test_direct_weekly_unit_source.py tests/test_ims_summary_integrity.py
      - name: Full test suite
        run: pytest -q tests/
      - name: Commit tested fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-balance-multirow.yml
          git add app/__init__.py app/services/ims_import_service.py app/services/balance_unit_authority.py tests/test_balance_unit_authority.py
          git commit -m "Resolve multi-row BAKIYE product headers"
          git push origin HEAD:fix/balance-unit-parser-authority
