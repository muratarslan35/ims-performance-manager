name: Patch region balance archive source

on:
  push:
    branches: ["fix/region-unit-balance-archive-source"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/region-unit-balance-archive-source
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply patch
        run: python scripts/patch_region_balance_archive_source.py
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/services/region_performance_service.py tests/test_passive_user_and_region_unit_gap_contract.py tests/test_region_read_v2.py
          git commit -m "Read regional MF siz kutu balance from archive [patched]"
          git push origin HEAD:fix/region-unit-balance-archive-source
