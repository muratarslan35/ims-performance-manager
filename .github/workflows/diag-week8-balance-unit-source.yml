name: Temporary Week 8 Balance Unit Source Audit
on:
  push:
    branches: [diag/week8-balance-unit-live-repair]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Read-only source audit
        run: |
          ssh -i ~/.ssh/k -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          venv/bin/python - <<'PY'
          import sqlite3, json
          c=sqlite3.connect('file:instance/ipm.db?mode=ro', uri=True, timeout=10)
          c.row_factory=sqlite3.Row
          def rr(q,a=()): return [dict(x) for x in c.execute(q,a).fetchall()]
          def one(q,a=()):
              r=c.execute(q,a).fetchone(); return dict(r) if r else None
          print('STATE|'+json.dumps({'journal':c.execute('pragma journal_mode').fetchone()[0],'quick':c.execute('pragma quick_check').fetchone()[0],'processing':c.execute("select count(*) from ims_import_jobs where status='PROCESSING'").fetchone()[0]}))
          up=one("select id,file_name,year,month,week_number,status,completed_at from ims_uploads where status='COMPLETED' and year=2026 and month=2 order by week_number desc,completed_at desc,id desc limit 1")
          print('UPLOAD|'+json.dumps(up,ensure_ascii=False,default=str))
          rep=one("select id,rep_name from representatives where upper(rep_name)='MURAT ARSLAN' limit 1")
          print('REP|'+json.dumps(rep,ensure_ascii=False))
          rid=rep['id']
          print('TARGETS|'+json.dumps(rr("select p.product_name,t.unit_target,t.unit_realization,t.tl_target,t.tl_realization from targets t join products p on p.id=t.product_id where t.year=2026 and t.month=2 and t.representative_id=? order by p.display_order,p.product_name",(rid,)),ensure_ascii=False))
          cols=[x[1] for x in c.execute('pragma table_info(ims_raw_data)')]
          print('RAW_COLS|'+','.join(cols))
          selected=[x for x in ['id','upload_id','sheet_name','sheet_type','source_row','representative_id','product_id','representative','product','unit','tl','metrics_json','raw_json'] if x in cols]
          q='select '+','.join(selected)+' from ims_raw_data where year=2026 and month=2 and upload_id=? and (upper(sheet_name) like %s or upper(sheet_type) like %s) and (representative_id=? or upper(representative)=upper(?)) order by source_row,id limit 80' % ("'%BAKIYE%'","'%BALANCE%'")
          rows=rr(q,(up['id'],rid,'MURAT ARSLAN'))
          print('RAW_BALANCE|'+json.dumps(rows,ensure_ascii=False,default=str))
          c.close()
          PY
          REMOTE
