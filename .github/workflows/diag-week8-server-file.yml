name: Inspect Stored Week 8 Workbook
on:
  push:
    branches: [diag/week8-raw-balance-source]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Locate workbook
        run: |
          ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=20 -i ~/.ssh/k -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "HEAD|$(git rev-parse HEAD)"
          echo "PROCESSING|$(venv/bin/python - <<'PY'
          import sqlite3
          c=sqlite3.connect('instance/ipm.db'); print(c.execute("select count(*) from ims_import_jobs where status='PROCESSING'").fetchone()[0]); c.close()
          PY
          )"
          echo 'FILES_BEGIN'
          find "$IMS_PATH" /tmp -maxdepth 5 -type f \( -iname '*8*Hafta*.xlsx' -o -iname '*Subat*Brick*Analizi*.xlsx' -o -iname '*Şubat*Brick*Analizi*.xlsx' \) -printf '%p|%s|%TY-%Tm-%Td %TH:%TM:%TS\n' 2>/dev/null | head -100
          echo 'FILES_END'
          echo 'QUEUE_DIRS'
          find "$IMS_PATH" -maxdepth 4 -type d \( -name 'ims_queue' -o -name 'uploads' -o -name 'archive' \) -print 2>/dev/null
          REMOTE
