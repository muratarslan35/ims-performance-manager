name: Week16 Full Excel-to-DB Reconciliation

on:
  push:
    branches:
      - agent/shadow-production-copy-proof
    paths:
      - ".github/workflows/week16-full-reconciliation.yml"

permissions:
  contents: read

concurrency:
  group: ims-week16-full-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Exhaustive Week16 reconciliation on isolated DB copy
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=12 -o TCPKeepAlive=yes \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          test "$(git branch --show-current)" = main
          test -z "$(git status --porcelain)"

          LIVE_DB="$IMS_PATH/instance/ipm.db"
          test -s "$LIVE_DB"
          workdir="$IMS_PATH/instance/week16-reconcile-$(date +%Y%m%d-%H%M%S)-$$"
          mkdir -p "$workdir"
          cleanup(){ rm -rf "$workdir" || true; }
          trap cleanup EXIT
          COPY_DB="$workdir/ims-acceptance-week16.db"
          SOURCE_FILE="$workdir/source-path.txt"

          echo "W16_RECON|PHASE|preflight"
          read -r latest_id latest_year latest_month latest_week active_jobs journal_mode <<EOF
          $(venv/bin/python - <<'PY'
          import sqlite3
          con=sqlite3.connect('file:instance/ipm.db?mode=ro',uri=True,timeout=30)
          con.execute('PRAGMA busy_timeout=30000')
          latest=con.execute("SELECT id,year,month,week_number FROM ims_uploads WHERE status='COMPLETED' ORDER BY year DESC,month DESC,week_number DESC,id DESC LIMIT 1").fetchone()
          active=con.execute("SELECT COUNT(*) FROM ims_import_jobs WHERE status IN ('QUEUED','PROCESSING')").fetchone()[0]
          mode=con.execute('PRAGMA journal_mode').fetchone()[0]
          con.close()
          print(latest[0],latest[1],latest[2],latest[3],active,mode)
          PY
          )
          EOF
          echo "W16_RECON|LIVE_BASELINE|upload=$latest_id|year=$latest_year|month=$latest_month|week=$latest_week|active_jobs=$active_jobs|journal=$journal_mode"
          test "$latest_id" = 31
          test "$latest_year" = 2026
          test "$latest_month" = 4
          test "$latest_week" = 16
          test "$active_jobs" = 0
          test "${journal_mode,,}" = wal
          live_sha_before=$(sha256sum "$LIVE_DB" | awk '{print $1}')
          echo "W16_RECON|LIVE_SHA_BEFORE|$live_sha_before"

          echo "W16_RECON|PHASE|source_discovery_and_full_cell_scan"
          SOURCE_FILE="$SOURCE_FILE" venv/bin/python - <<'PY'
          import hashlib,json,os,sqlite3,unicodedata,re
          from pathlib import Path
          from openpyxl import load_workbook
          con=sqlite3.connect('file:instance/ipm.db?mode=ro',uri=True,timeout=30)
          con.row_factory=sqlite3.Row
          up=con.execute("SELECT * FROM ims_uploads WHERE id=31 AND status='COMPLETED'").fetchone()
          assert up is not None
          file_name=str(up['file_name'])
          con.close()
          def norm(s):
              s=unicodedata.normalize('NFKC',str(s)).casefold()
              return re.sub(r'[^a-z0-9çğıöşü]+','',s)
          skip_dirs={'.git','venv','__pycache__','node_modules','.cache'}
          all_xlsx=[]
          for root,dirs,files in os.walk('/home/ubuntu'):
              dirs[:]=[d for d in dirs if d not in skip_dirs and not d.startswith('week16-reconcile-')]
              for name in files:
                  if Path(name).suffix.casefold() in {'.xlsx','.xlsm','.xls'}:
                      all_xlsx.append(Path(root)/name)
          exact=[p for p in all_xlsx if p.name.casefold()==file_name.casefold()]
          normalized=[p for p in all_xlsx if norm(p.name)==norm(file_name)]
          likely=[p for p in all_xlsx if '16' in p.name and ('nisan' in p.name.casefold() or 'tayfun' in p.name.casefold())]
          print('W16_RECON|SOURCE_INVENTORY|count='+str(len(all_xlsx))+'|likely='+json.dumps([str(p) for p in likely[:80]],ensure_ascii=False))
          source=(exact or normalized or likely or [None])[0]
          if source is None:
              raise SystemExit('Week16 workbook not found anywhere under /home/ubuntu')
          matched=exact or normalized or likely
          if len(matched)>1:
              print('W16_RECON|SOURCE_DISCOVERY|MULTIPLE|'+json.dumps([str(p) for p in matched[:80]],ensure_ascii=False))
          Path(os.environ['SOURCE_FILE']).write_text(str(source.resolve()))
          sha=hashlib.sha256()
          with source.open('rb') as f:
              for chunk in iter(lambda:f.read(1024*1024),b''): sha.update(chunk)
          print(f'W16_RECON|WORKBOOK|path={source}|bytes={source.stat().st_size}|sha256={sha.hexdigest()}')
          wb_f=load_workbook(source,read_only=True,data_only=False)
          wb_v=load_workbook(source,read_only=True,data_only=True)
          h=hashlib.sha256(); sheets=[]; populated=0; formulas=0; cached=0
          for wsf,wsv in zip(wb_f.worksheets,wb_v.worksheets):
              sh=hashlib.sha256(); count=0; fcount=0
              for rf,rv in zip(wsf.iter_rows(),wsv.iter_rows()):
                  for cf,cv in zip(rf,rv):
                      vf,vv=cf.value,cv.value
                      if vf is None and vv is None: continue
                      populated+=1; count+=1
                      if isinstance(vf,str) and vf.startswith('='): formulas+=1; fcount+=1
                      if vv is not None: cached+=1
                      rec=json.dumps([wsf.title,cf.coordinate,vf,vv],ensure_ascii=False,default=str,separators=(',',':')).encode()+b'\n'
                      h.update(rec); sh.update(rec)
              sheets.append({'sheet':wsf.title,'populated_cells':count,'formula_cells':fcount,'sha256':sh.hexdigest()})
          wb_f.close(); wb_v.close()
          print('W16_RECON|CELL_SCAN|'+json.dumps({'sheet_count':len(sheets),'populated_cells':populated,'formula_cells':formulas,'cached_nonempty_cells':cached,'cell_sha256':h.hexdigest()},ensure_ascii=False,sort_keys=True))
          print('W16_RECON|SHEET_SCAN|'+json.dumps(sheets,ensure_ascii=False,sort_keys=True))
          PY
          source_path=$(cat "$SOURCE_FILE")
          test -s "$source_path"

          echo "W16_RECON|PHASE|fast_consistent_online_backup"
          venv/bin/python - "$LIVE_DB" "$COPY_DB" <<'PY'
          import hashlib,sqlite3,sys,time
          from pathlib import Path
          src,dst=map(Path,sys.argv[1:3]); dst.unlink(missing_ok=True)
          s=sqlite3.connect(f'file:{src}?mode=ro',uri=True,timeout=30)
          d=sqlite3.connect(dst,timeout=30)
          s.execute('PRAGMA busy_timeout=30000'); d.execute('PRAGMA busy_timeout=30000')
          t=time.monotonic()
          try:
              s.backup(d,pages=4096,sleep=0.001)
              d.commit(); q=d.execute('PRAGMA quick_check').fetchone()[0]
              if str(q).lower()!='ok': raise SystemExit(f'backup quick_check={q}')
          finally:
              d.close(); s.close()
          h=hashlib.sha256()
          with dst.open('rb') as f:
              for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
          print(f'W16_RECON|BACKUP|PASS|bytes={dst.stat().st_size}|sha256={h.hexdigest()}|seconds={time.monotonic()-t:.3f}')
          PY

          echo "W16_RECON|PHASE|locked_month_baseline"
          DATABASE_URL="sqlite:///$COPY_DB" venv/bin/python - <<'PY'
          import hashlib,json,os,sqlite3
          from pathlib import Path
          dbp=os.environ['DATABASE_URL'].removeprefix('sqlite:///')
          con=sqlite3.connect(dbp,timeout=30)
          def th(table,m):
              cols=[r[1] for r in con.execute(f'PRAGMA table_info({table})')]; order=','.join(cols)
              h=hashlib.sha256(); n=0
              for r in con.execute(f'SELECT * FROM {table} WHERE year=? AND month=? ORDER BY {order}',(2026,m)):
                  h.update(json.dumps(list(r),ensure_ascii=False,default=str,separators=(',',':')).encode()+b'\n'); n+=1
              return [n,h.hexdigest()]
          locked={str(m):{t:th(t,m) for t in ('ims_summary','targets')} for m in (1,2,3)}
          Path(dbp+'.locked.json').write_text(json.dumps(locked,sort_keys=True))
          print('W16_RECON|LOCKED_BASELINE|'+json.dumps(locked,sort_keys=True))
          con.close()
          PY

          echo "W16_RECON|PHASE|real_importer_rebuild_from_archived_excel"
          DATABASE_URL="sqlite:///$COPY_DB" IMS_ACCEPTANCE_UPLOAD_ID=31 W16_SOURCE="$source_path" PYTHONPATH="$IMS_PATH" \
          venv/bin/python - <<'PY' | tee "$workdir/acceptance.log"
          import os,sys
          from pathlib import Path
          import verify_ims_acceptance as v
          source=Path(os.environ['W16_SOURCE'])
          if not source.is_file(): raise SystemExit(f'source missing: {source}')
          v._source_path=lambda app,upload: source
          try:
              sys.exit(v.main())
          except Exception as exc:
              import json
              print('IMS_ACCEPTANCE|'+json.dumps({'result':'FAIL','error':str(exc)},ensure_ascii=False))
              raise
          PY
          grep -q 'IMS_ACCEPTANCE|.*"result": "PASS"' "$workdir/acceptance.log"

          echo "W16_RECON|PHASE|locked_month_and_april_assertions"
          DATABASE_URL="sqlite:///$COPY_DB" venv/bin/python - <<'PY'
          import hashlib,json,os,sqlite3
          from pathlib import Path
          dbp=os.environ['DATABASE_URL'].removeprefix('sqlite:///')
          con=sqlite3.connect(dbp,timeout=30)
          def th(table,m):
              cols=[r[1] for r in con.execute(f'PRAGMA table_info({table})')]; order=','.join(cols)
              h=hashlib.sha256(); n=0
              for r in con.execute(f'SELECT * FROM {table} WHERE year=? AND month=? ORDER BY {order}',(2026,m)):
                  h.update(json.dumps(list(r),ensure_ascii=False,default=str,separators=(',',':')).encode()+b'\n'); n+=1
              return [n,h.hexdigest()]
          before=json.loads(Path(dbp+'.locked.json').read_text())
          after={str(m):{t:th(t,m) for t in ('ims_summary','targets')} for m in (1,2,3)}
          if before!=after: raise SystemExit(f'Locked Jan-Mar changed: before={before} after={after}')
          print('W16_RECON|LOCKED_JAN_MAR|PASS|'+json.dumps(after,sort_keys=True))
          latest=con.execute("SELECT id,year,month,week_number,status,reconciliation_status,source_record_count,stored_source_record_count,invalid_metric_count FROM ims_uploads WHERE status='COMPLETED' ORDER BY id DESC LIMIT 1").fetchone()
          print('W16_RECON|ISOLATED_LATEST|'+json.dumps(list(latest),default=str))
          fact_cols={r[1] for r in con.execute('PRAGMA table_info(ims_facts)')}
          bad_identity=0
          if {'representative_id','product_id'} <= fact_cols:
              bad_identity=con.execute("SELECT COUNT(*) FROM ims_facts WHERE year=2026 AND month=4 AND (representative_id IS NULL OR product_id IS NULL)").fetchone()[0]
          checks={
              'april_fact_rows':con.execute("SELECT COUNT(*) FROM ims_facts WHERE year=2026 AND month=4").fetchone()[0],
              'april_summary_rows':con.execute("SELECT COUNT(*) FROM ims_summary WHERE year=2026 AND month=4").fetchone()[0],
              'april_target_rows':con.execute("SELECT COUNT(*) FROM targets WHERE year=2026 AND month=4").fetchone()[0],
              'bad_fact_identity':bad_identity,
          }
          if bad_identity: raise SystemExit(f'bad_fact_identity={bad_identity}')
          print('W16_RECON|APRIL_INVARIANTS|PASS|'+json.dumps(checks,sort_keys=True))
          con.close()
          PY

          echo "W16_RECON|PHASE|live_unchanged_and_smoke"
          live_sha_after=$(sha256sum "$LIVE_DB" | awk '{print $1}')
          echo "W16_RECON|LIVE_SHA_AFTER|$live_sha_after"
          test "$live_sha_after" = "$live_sha_before"
          systemctl is-active --quiet ims-performance-manager.service
          if systemctl list-unit-files | grep -q '^ims-import-worker.service'; then systemctl is-active --quiet ims-import-worker.service; fi
          curl -fsS --max-time 20 http://127.0.0.1:8000/login >/dev/null || curl -fsS --max-time 20 http://127.0.0.1/login >/dev/null
          echo "W16_RECON|LIVE_SMOKE|PASS"
          echo "W16_RECON|FINAL|PASS"
          REMOTE
