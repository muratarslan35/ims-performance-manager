name: January PP detail audit

on:
  push:
    branches: [audit/january-pp-readonly]
    paths: [.github/workflows/january-pp-detail.yml]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Inspect PP components
        run: |
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          venv/bin/python - <<'PY'
          import json,sqlite3
          db=sqlite3.connect('instance/ipm.db',timeout=30); db.row_factory=sqlite3.Row
          try:
            uid=db.execute("SELECT id FROM ims_uploads WHERE year=2026 AND month=1 AND status='COMPLETED' ORDER BY COALESCE(week_number,0) DESC,COALESCE(completed_at,uploaded_at) DESC,id DESC LIMIT 1").fetchone()[0]
            rows=[dict(r) for r in db.execute("SELECT territory,subterritory,product_group,product_name,metric_value,is_company_product,is_competitor,is_subtotal,is_grand_total,source_row FROM ims_competition_data WHERE upload_id=? AND metric_type='MARKET_SHARE' AND UPPER(sheet_name) LIKE '%REKABET%' AND UPPER(sheet_name) LIKE '%PP%' AND (UPPER(product_group) LIKE '%ACNEMIX%' OR UPPER(product_group) LIKE '%FENTIVAG%') AND territory=subterritory ORDER BY territory,product_group,source_row",(uid,))]
          finally: db.close()
          norm=lambda v:' '.join(str(v or '').strip().upper().split())
          detail=[]
          for r in rows:
            k=norm(r['product_name']); total=bool(r['is_subtotal'] or r['is_grand_total'] or 'SUBTOTAL' in k or 'GRAND TOTAL' in k or k.endswith(' TOTAL'))
            detail.append({**r,'is_total_by_service':total})
          print('JAN_PP_DETAIL|'+json.dumps(detail,ensure_ascii=False))
          PY
          REMOTE
