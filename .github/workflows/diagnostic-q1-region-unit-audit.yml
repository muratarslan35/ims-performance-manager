name: Diagnostic Q1 Region Unit Audit

on:
  push:
    branches:
      - diagnostic/q1-region-unit-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure production SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
          IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
          IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_diag_key
          chmod 600 ~/.ssh/ims_diag_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Audit live Q1 region unit calculations read-only
        env:
          IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
          IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
          IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
          IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_diag_key -p "$IMS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 \
            "$IMS_USER@$IMS_HOST" \
            "cd '$IMS_PATH' && test \"\$(git branch --show-current)\" = main && test -z \"\$(git status --porcelain)\" && venv/bin/python -" \
            < scripts/audit_q1_region_units.py
          ssh -i ~/.ssh/ims_diag_key -p "$IMS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 \
            "$IMS_USER@$IMS_HOST" \
            "cd '$IMS_PATH' && venv/bin/python scripts/audit_production_result_sources.py --year 2026 --month 3 --stage 2"
