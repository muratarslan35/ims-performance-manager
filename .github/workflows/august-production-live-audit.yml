name: Week 41 Official Region Recovery
on:
  push:
    branches: [codex/week41-compat-audit]
    paths:
      - ".github/workflows/august-production-live-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure read-only SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/audit_key
          chmod 600 ~/.ssh/audit_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Compare only requested week-41 region values
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/audit_key -p "$IMS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=20 \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          echo "WEB_ACTIVE|$(sudo systemctl is-active ims-performance-manager.service)"
          echo "WORKER_ACTIVE|$(sudo systemctl is-active ims-import-worker.service)"

          test "$(git rev-parse HEAD)" = 'cdbe9f7c2caf475217fab2fa044808fc9502da9a'
          test -f instance/official-region-history-before-week41.json
          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          from decimal import Decimal
          import sqlalchemy as sa
          from app import create_app
          from app.extensions import db
          from app.services.region_performance_service import RegionPerformanceService
          from app.services.persistent_region_snapshot_service import PersistentRegionSnapshotService
          app=create_app()
          with app.app_context():
              db.session.execute(sa.text("PRAGMA query_only=ON"))
              failures=[]
              checked=0
              for region in PersistentRegionSnapshotService.region_keys(2026,10):
                  service=RegionPerformanceService(region,2026,10)
                  report=service.report()
                  monthly={}
                  for key,period in report["periods"].items():
                      spans=[(int(m["year"]),int(m["month"])) for m in period.get("months",[])]
                      if not any(service._uses_official_region_only(*ym) for ym in spans):continue
                      for ym in spans:
                          if ym not in monthly:monthly[ym]={int(r["product_id"]):r for r in service.aggregate([ym]).get("products",[])}
                      for row in period.get("products",[]):
                          pid=int(row["product_id"])
                          for field in ("target_tl","actual_tl","target_unit","actual_unit"):
                              values=[monthly[ym][pid].get(field) for ym in spans if pid in monthly[ym]]
                              if any(v is None for v in values):continue
                              expected=sum((Decimal(str(v)) for v in values),Decimal(0))
                              if row.get(field) is None or abs(Decimal(str(row[field]))-expected)>Decimal("0.011"):failures.append((region,key,pid,field,str(row.get(field)),str(expected)))
                          checked+=1
              print("REGION_REPLAY_PREFLIGHT|"+str({"checked":checked,"failures":failures}),flush=True)
              assert not failures
              db.session.rollback()
          PY
          PYTHONPATH="$IMS_PATH" venv/bin/python scripts/queue_verified_ims_reimport.py --source-upload 54
          REMOTE
