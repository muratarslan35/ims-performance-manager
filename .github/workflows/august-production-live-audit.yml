name: Week 41 Summary Schema Audit
on:
  push:
    branches: [codex/week41-compat-audit]
    paths:
      - ".github/workflows/august-production-live-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure read-only SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/audit_key
          chmod 600 ~/.ssh/audit_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Audit Week 41 authorities with redacted public evidence
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/audit_key -p "$IMS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=20 \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          echo "WEB_ACTIVE|$(sudo systemctl is-active ims-performance-manager.service)"
          echo "WORKER_ACTIVE|$(sudo systemctl is-active ims-import-worker.service)"

          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          from app import create_app
          from app.services.ims_import_service import IMSImportService
          from app.services.adaptive_kpi_target_authority import _norm,_pair_views
          app=create_app()
          with app.app_context():
           path=Path(app.config['UPLOAD_FOLDER'])/'ims_archive'/'upload-55.xlsx'
           a=IMSImportService(str(path));a.workbook=pd.read_excel(path,sheet_name=None,header=None,nrows=20);v=_pair_views(a)
           names=list(a.workbook)[:2];allowed={_norm(p) for p in v['products']}|{'BOLGE','TTS','IL','HEDEF','URUN CIKIS','NATIONAL','TURKIYE TOPLAM','REAL','REA','RANK','TTS BRICK'}
           out=[]
           for name in names:
            f=pd.read_excel(path,sheet_name=name,header=None)
            headers=[]
            for i in range(min(10,len(f))):
             labels=[]
             for j in range(f.shape[1]):
              value=f.iloc[i,j]
              if isinstance(value,str):
               label=_norm(value)
               if label in allowed or label.startswith(('HEDEF','URUN CIKIS','REAL','REA ','TTS ','BOLGE ')):labels.append([j,label])
             if labels:headers.append(dict(row=i,labels=labels))
            out.append(dict(sheet=name,rows=len(f),columns=f.shape[1],semantic_headers=headers))
           print('WEEK41_SUMMARY_SHEET_SCHEMA|'+json.dumps(out,ensure_ascii=True),flush=True)
          
          PY
          REMOTE
