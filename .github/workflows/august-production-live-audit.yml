name: Week 41 Monthly Difference Audit
on:
  push:
    branches: [codex/week41-compat-audit]
    paths:
      - ".github/workflows/august-production-live-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure read-only SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/audit_key
          chmod 600 ~/.ssh/audit_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Audit Week 41 authorities with redacted public evidence
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/audit_key -p "$IMS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=20 \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          echo "WEB_ACTIVE|$(sudo systemctl is-active ims-performance-manager.service)"
          echo "WORKER_ACTIVE|$(sudo systemctl is-active ims-import-worker.service)"


          
          umask 077
          git fetch origin fa65eb8870c6c17a834bcb5ceaee13d86328d514 > instance/week41-shadow-fetch.log 2>&1
          shadow="$(mktemp -d instance/week41-shadow.XXXXXX)"
          git archive FETCH_HEAD | tar -x -C "$shadow"
          export IMS_SHADOW_PATH="$PWD/$shadow"
          set +e
          venv/bin/python -u - <<'PY' > instance/week41-monthly-difference-audit.log 2>&1
          import os,sys,json,hashlib,time,re
          from pathlib import Path
          from collections import Counter
          from concurrent.futures import ThreadPoolExecutor
          os.umask(0o077);live=Path.cwd()
          import config as live_config
          meta=json.loads((live/'instance/week41-unit-timing-session.json').read_text())
          sys.path.insert(0,os.environ['IMS_SHADOW_PATH'])
          import app as module
          module.create_database=lambda application:None
          class ReadOnlyConfig(live_config.Config):
           SQLALCHEMY_DATABASE_URI='sqlite:///file:'+meta['database']+'?mode=ro&uri=true'
          from app.extensions import db
          from app.models import IMSUpload,Representative
          from app.services.representative_period_workspace import build_representative_workspace_payload
          from app.services.persistent_representative_snapshot_service import PersistentRepresentativeSnapshotService as Snap
          from app.services.annual_realization_service import AnnualRealizationService
          from app.services.representative_query_optimizer import use_snapshot_upload_ids
          from app.services.kpi_market_single_source import _upload_has_authority
          from app.cache.representative_monthly_market_cache import RepresentativeMonthlyMarketCache as Monthly
          app=module.create_app(ReadOnlyConfig);app.instance_path=str(live/'instance')
          with app.app_context():
           pin={}
           for upload in IMSUpload.query.filter_by(status='COMPLETED').order_by(IMSUpload.year,IMSUpload.month,IMSUpload.week_number.desc(),IMSUpload.completed_at.desc(),IMSUpload.id.desc()):
            pin.setdefault((int(upload.year),int(upload.month)),int(upload.id))
           annual=AnnualRealizationService.build_snapshot_inputs(2026)
           authority={uid:_upload_has_authority(uid) for uid in set(pin.values()) if uid}
          records=json.loads((live/'instance/week41-monthly-cache-bootstrap-results-private.json').read_text())
          ids=[r['id'] for r in records if not r['same']]
          def canonical(value):return json.dumps(value,sort_keys=True,separators=(',',':'),default=Snap._json_default)
          def compare(a,b,path='root',counts=None,paths=None):
           if a==b:return
           if isinstance(a,dict) and isinstance(b,dict):
            for key in set(a)|set(b):
             label=str(key) if re.fullmatch('[a-z_0-9]+',str(key)) else 'key'
             if key not in a or key not in b:counts['presence']+=1;paths[path+'.'+label+':presence']+=1
             else:compare(a[key],b[key],path+'.'+label,counts,paths)
           elif isinstance(a,list) and isinstance(b,list):
            if Counter(canonical(x) for x in a)==Counter(canonical(x) for x in b):
             counts['list_order_only']+=1;paths[path+':list_order_only']+=1;return
            if len(a)!=len(b):counts['length']+=1;paths[path+':length']+=1
            for i,(x,y) in enumerate(zip(a,b)):compare(x,y,path+'.'+str(i),counts,paths)
           else:
            kind='numeric' if type(a) in (int,float) and type(b) in (int,float) else 'other'
            if kind=='numeric' and abs(a-b)<1e-7:kind='numeric_epsilon'
            counts[kind]+=1;paths[path+':'+kind]+=1
          def member(rid):
           with app.app_context(),use_snapshot_upload_ids(pin,authority_by_upload=authority):
            reference=live/'instance'/f'week41-reference-member-{rid}-private.json'
            before=json.loads(reference.read_text()) if reference.exists() else Snap.get_exact_active_many([rid],2026,10).get(rid)
            after=Snap._json_ready(build_representative_workspace_payload(db.session.get(Representative,rid),2026,10,annual_snapshot_inputs=annual))
            (live/'instance'/f'week41-monthly-audit-member-{rid}-private.json').write_text(canonical(after))
            counts=Counter();paths=Counter();compare(before,after,counts=counts,paths=paths)
            db.session.rollback()
            return dict(id=rid,counts=dict(counts),paths=dict(paths))
          started=time.perf_counter()
          with ThreadPoolExecutor(max_workers=3) as pool:results=list(pool.map(member,ids))
          (live/'instance/week41-monthly-differences-private.json').write_text(json.dumps(results))
          counts=Counter();paths=Counter()
          for result in results:counts.update(result['counts']);paths.update(result['paths'])
          print('WEEK41_MONTHLY_DIFFERENCE_AUDIT|'+json.dumps(dict(members=len(ids),seconds=round(time.perf_counter()-started,3),categories=dict(counts),paths=dict(paths))),flush=True)
          print('WEEK41_MONTHLY_CACHE_STATS|'+json.dumps(Monthly.statistics()),flush=True)
          
          PY
          result=$?
          set -e
          grep -E '^WEEK41_' instance/week41-monthly-difference-audit.log || true
          echo "WEEK41_AUDIT_EXIT|$result"
          exit "$result"
          REMOTE
          