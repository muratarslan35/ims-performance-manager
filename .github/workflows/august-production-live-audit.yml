name: Week 41 TL Source Relationship Audit
on:
  push:
    branches: [codex/week41-compat-audit]
    paths:
      - ".github/workflows/august-production-live-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure read-only SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/audit_key
          chmod 600 ~/.ssh/audit_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Audit Week 41 authorities with redacted public evidence
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/audit_key -p "$IMS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=20 \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          echo "WEB_ACTIVE|$(sudo systemctl is-active ims-performance-manager.service)"
          echo "WORKER_ACTIVE|$(sudo systemctl is-active ims-import-worker.service)"


          umask 077
          venv/bin/python - <<'PY' > instance/week41-tl-relation.log 2>&1
          import json,sqlite3
          from pathlib import Path
          from decimal import Decimal
          from collections import Counter,defaultdict
          from app.services.ims_unit_authority import representative_name_key
          from app.services.adaptive_kpi_target_authority import _norm
          meta=json.loads(Path('instance/week41-unit-timing-session.json').read_text())
          c=sqlite3.connect('file:'+meta['database']+'?mode=ro',uri=True,isolation_level=None)
          c.row_factory=sqlite3.Row
          data=json.loads(Path('instance/week41-tl-summary-comparison-private.json').read_text())
          products={}
          for p in c.execute('SELECT id,product_name,product_code,ims_name,unit_price FROM products'):
           for key in ('product_name','product_code','ims_name'):
            if p[key]:products[_norm(p[key])]=dict(p)
          reps=defaultdict(list)
          for r in c.execute('SELECT id,rep_name,region FROM representatives'):reps[representative_name_key(r['rep_name'])].append(dict(r))
          counts=Counter();ratios=defaultdict(list);private=[]
          for diff in data['differences']:
           key=diff['identity'];product=products.get(key[-1]);candidates=reps.get(key[-2],[])
           candidates=[r for r in candidates if str(r['region'] or '').split()[0]==key[1]] or candidates
           if product is None or len(candidates)!=1:counts['unresolved_identity']+=1;continue
           target=c.execute('SELECT unit_target,tl_target FROM targets WHERE year=2026 AND month=10 AND representative_id=? AND product_id=?',(candidates[0]['id'],product['id'])).fetchone()
           price=c.execute('SELECT unit_price FROM product_unit_price_history WHERE product_id=? AND (effective_year<2026 OR (effective_year=2026 AND effective_month<=10)) ORDER BY effective_year DESC,effective_month DESC LIMIT 1',(product['id'],)).fetchone()
           price=Decimal(str(price[0] if price else product['unit_price']))
           units=Decimal(str(target['unit_target']));summary=Decimal(diff['summary']);matrix=Decimal(diff['matrix'])
           counts['checked']+=1;counts['product_'+str(product['id'])]+=1
           counts['summary_less_than_matrix' if summary<matrix else 'summary_greater_than_matrix']+=1
           if abs(summary-units*price)<1:counts['summary_matches_boxes_times_locked_price']+=1
           if abs(matrix-units*price)<1:counts['matrix_matches_boxes_times_locked_price']+=1
           ratios[product['id']].append(summary/matrix if matrix else Decimal(0))
           private.append(dict(product=product['id'],identity=key,summary=str(summary),matrix=str(matrix),boxes=str(units),price=str(price)))
          counts['products_with_consistent_summary_matrix_ratio']=sum(max(v)-min(v)<Decimal('.00001') for v in ratios.values())
          Path('instance/week41-tl-source-inconsistency-detail-private.json').write_text(json.dumps(dict(counts=dict(counts),details=private)))
          print('WEEK41_TL_SOURCE_RELATION|'+json.dumps(dict(counts)),flush=True)
          
          PY
          grep -E '^WEEK41_' instance/week41-tl-relation.log
          REMOTE
          