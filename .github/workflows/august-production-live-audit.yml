name: Week 41 Independent Monthly Financial Reference
on:
  push:
    branches: [codex/week41-compat-audit]
    paths:
      - ".github/workflows/august-production-live-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure read-only SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/audit_key
          chmod 600 ~/.ssh/audit_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Audit Week 41 authorities with redacted public evidence
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/audit_key -p "$IMS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=20 \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          echo "WEB_ACTIVE|$(sudo systemctl is-active ims-performance-manager.service)"
          echo "WORKER_ACTIVE|$(sudo systemctl is-active ims-import-worker.service)"


          
          umask 077
          set +e
          venv/bin/python -u - <<'PY' > instance/week41-independent-period-reference.log 2>&1
          import os,sys,json,hashlib,time
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          os.umask(0o077);live=Path.cwd();sys.path.insert(0,str(live))
          import config
          meta=json.loads((live/'instance/week41-unit-timing-session.json').read_text())
          import app as module
          module.create_database=lambda application:None
          class ReadOnlyConfig(config.Config):
           SQLALCHEMY_DATABASE_URI='sqlite:///file:'+meta['database']+'?mode=ro&uri=true'
          from app.extensions import db
          from app.models import IMSUpload,IMSFact
          from app.services.production_result_service import ProductionResultService as Production
          from app.services.representative_period_workspace import _aggregate_sales,_period_months,PERIOD_OPTIONS
          from app.services.annual_realization_service import AnnualRealizationService as Annual
          from app.services.representative_query_optimizer import use_snapshot_upload_ids
          from app.services.persistent_representative_snapshot_service import PersistentRepresentativeSnapshotService as Snap
          app=module.create_app(ReadOnlyConfig);app.instance_path=str(live/'instance')
          periods=[(2025,12)]+[(2026,m) for m in range(1,11)]
          with app.app_context():
           # Independent reference: the original calculator's single-month API is
           # unaffected by the batch-variable bug; union only its official answers.
           quota={}
           for period in periods:
            for pid,detected in Production._quota_product_months_uncached([period]).items():quota.setdefault(pid,set()).update(detected)
           def stable_quota(cls,months):
            requested={tuple(p) for p in months}
            return {pid:sorted(found & requested) for pid,found in quota.items() if found & requested}
           Production.quota_product_months=classmethod(stable_quota)
           annual=Annual.build_snapshot_inputs(2026)
           pin={}
           for upload in IMSUpload.query.filter_by(status='COMPLETED').order_by(IMSUpload.year,IMSUpload.month,IMSUpload.week_number.desc(),IMSUpload.completed_at.desc(),IMSUpload.id.desc()):
            pin.setdefault((int(upload.year),int(upload.month)),int(upload.id))
           ids=[r[0] for r in db.session.query(IMSFact.representative_id).filter_by(upload_id=56,report_type='brick_sales').distinct()]
          def canonical(value):return json.dumps(value,sort_keys=True,separators=(',',':'),default=Snap._json_default)
          def member(rid):
           with app.app_context(),use_snapshot_upload_ids(pin):
            sales={};assignments={};result={'snapshots':{}}
            for key,label,kind in PERIOD_OPTIONS:
             months=_period_months(2026,10,key)
             rows,totals,assigned,sources=_aggregate_sales(rid,months,sales_cache=sales,assignment_cache=assignments)
             result['snapshots'][key]={'products':rows,'totals':totals,'assignments':assigned}
            result['annual_realization']=Annual.build(2026,[rid],snapshot_inputs=annual)
            financial=canonical(Snap._json_ready(result))
            (live/'instance'/f'week41-period-financial-reference-{rid}-private.json').write_text(financial)
            original=live/'instance'/f'week41-reference-member-{rid}-private.json'
            original=json.loads(original.read_text()) if original.exists() else Snap.get_exact_active_many([rid],2026,10).get(rid)
            market={key:part['market_analysis'] for key,part in original['snapshots'].items()}
            encoded_market=canonical(market)
            db.session.rollback()
            return str(rid),dict(financial_sha256=hashlib.sha256(financial.encode()).hexdigest(),market_sha256=hashlib.sha256(encoded_market.encode()).hexdigest())
          started=time.perf_counter()
          with ThreadPoolExecutor(max_workers=3) as pool:references=dict(pool.map(member,ids))
          (live/'instance/week41-independent-period-reference-hashes.json').write_text(json.dumps(references))
          print('WEEK41_INDEPENDENT_PERIOD_REFERENCE|'+json.dumps(dict(result='PASS',members=len(references),quota_product_periods=sum(map(len,quota.values())),seconds=round(time.perf_counter()-started,3))),flush=True)
          
          PY
          result=$?
          set -e
          grep -E '^WEEK41_' instance/week41-independent-period-reference.log || true
          echo "WEEK41_REFERENCE_EXIT|$result"
          exit "$result"
          REMOTE
          