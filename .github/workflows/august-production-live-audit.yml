name: Week 41 Integrity and Performance Status
on:
  push:
    branches: [codex/week41-compat-audit]
    paths:
      - ".github/workflows/august-production-live-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure read-only SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/audit_key
          chmod 600 ~/.ssh/audit_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Audit Week 41 authorities with redacted public evidence
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/audit_key -p "$IMS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=20 \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          echo "WEB_ACTIVE|$(sudo systemctl is-active ims-performance-manager.service)"
          echo "WORKER_ACTIVE|$(sudo systemctl is-active ims-import-worker.service)"


          venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          from collections import Counter
          from decimal import Decimal,ROUND_DOWN,ROUND_UP,ROUND_HALF_UP
          p=Path('instance/week41-tl-summary-comparison-private.json')
          if p.exists():
           data=json.loads(p.read_text());counts=Counter()
           for row in data['differences']:
            a=Decimal(row['summary']);b=Decimal(row['matrix']);delta=abs(a-b)
            counts['le_one_lira' if delta<=1 else 'le_ten_lira' if delta<=10 else 'over_ten_lira']+=1
            for label,mode in [('truncate_integer',ROUND_DOWN),('ceil_integer',ROUND_UP),('round_integer',ROUND_HALF_UP)]:
             if a==b.quantize(Decimal(1),rounding=mode):counts[label]+=1
           print('WEEK41_TL_DIFFERENCE_SHAPE|'+json.dumps(counts),flush=True)
          for name in ('week41-html-acceptance.log','week41-final-history-validation.log','week41-final-generations-validation.log','week41-performance-baseline.log'):
           p=Path('instance')/name
           if p.exists():
            for line in p.read_text(errors='replace').splitlines():
             if line.startswith('WEEK41_'):print(line,flush=True)
          
          PY
          REMOTE
          