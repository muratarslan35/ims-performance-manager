name: Week 41 Monthly Bootstrap Progress
on:
  push:
    branches: [codex/week41-compat-audit]
    paths:
      - ".github/workflows/august-production-live-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure read-only SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/audit_key
          chmod 600 ~/.ssh/audit_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Audit Week 41 authorities with redacted public evidence
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/audit_key -p "$IMS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=20 \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          echo "WEB_ACTIVE|$(sudo systemctl is-active ims-performance-manager.service)"
          echo "WORKER_ACTIVE|$(sudo systemctl is-active ims-import-worker.service)"


          venv/bin/python - <<'PY'
          import json,re
          from pathlib import Path
          from datetime import datetime,timezone
          for name in ('week41-monthly-cache-bootstrap.log','week41-monthly-cache-hot.log'):
           p=Path('instance')/name
           if p.exists():
            for line in p.read_text(errors='replace').splitlines():
             if re.match(r'^WEEK41_(SHARED_SOURCE_SETUP|PROFILE_CANDIDATE|PROFILE_EQUIVALENCE|PROFILE_DIFFERENCE_PATHS|SHADOW_ROSTER_PROGRESS|SHADOW_ROSTER_ACCEPTANCE|MONTHLY_CACHE)',line):print(line,flush=True)
          root=Path('instance/representative_monthly_market')
          files=list(root.glob('*.json.gz')) if root.exists() else []
          print('WEEK41_MONTHLY_CACHE_CURRENT_FILES|'+json.dumps(dict(files=len(files),bytes=sum(p.stat().st_size for p in files))),flush=True)
          print('WEEK41_STATUS_TIME|'+datetime.now(timezone.utc).isoformat(),flush=True)
          
          PY
          REMOTE
          