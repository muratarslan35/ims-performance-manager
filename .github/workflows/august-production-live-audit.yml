name: Week 41 Vacancy Identity Audit
on:
  push:
    branches: [codex/week41-compat-audit]
    paths:
      - ".github/workflows/august-production-live-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure read-only SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/audit_key
          chmod 600 ~/.ssh/audit_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Audit Week 41 authorities with redacted public evidence
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/audit_key -p "$IMS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=20 \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          echo "WEB_ACTIVE|$(sudo systemctl is-active ims-performance-manager.service)"
          echo "WORKER_ACTIVE|$(sudo systemctl is-active ims-import-worker.service)"

          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          import json,re
          from pathlib import Path
          import pandas as pd
          from app import create_app
          from app.services.ims_import_service import IMSImportService
          from app.services.adaptive_kpi_target_authority import _pair_views,_norm
          from app.services.vacancy_matching import vacancy_identity
          app=create_app()
          def key(value):
           vacancy=vacancy_identity(value)
           return 'VACANCY:'+vacancy[0] if vacancy else _norm(value)
          with app.app_context():
           path=Path(app.config['UPLOAD_FOLDER'])/'ims_archive'/'upload-55.xlsx'
           importer=IMSImportService(str(path));importer.workbook=pd.read_excel(path,sheet_name=None,header=None,nrows=20)
           views=_pair_views(importer)
           expected={('REPRESENTATIVE',territory.split()[0],key(name)) for territory,name in views['tl_reps']}
           expected.update(('AGGREGATE',territory) for territory,_name in views['tl_aggregates'])
           frame=pd.read_excel(path,sheet_name=list(importer.workbook)[1],header=None)
           header=next(i for i in range(12) if 'BOLGE' in [_norm(v) for v in frame.iloc[i]] and 'TTS' in [_norm(v) for v in frame.iloc[i]])
           labels=[_norm(v) for v in frame.iloc[header]];rc=labels.index('BOLGE');tc=labels.index('TTS')
           actual=set();region=''
           for i in range(header+1,len(frame)):
            r=_norm(frame.iloc[i,rc]);name=frame.iloc[i,tc];n=_norm(name)
            if r:region=r
            if not n:continue
            if n in ('NATIONAL','TURKIYE TOPLAM','TURKIYE TOPLAMI'):identity=('AGGREGATE','NATIONAL')
            elif re.match(r'^\d{3}\b',n):identity=('AGGREGATE',n.split()[0])
            else:identity=('REPRESENTATIVE',region.split()[0],key(name))
            if identity in actual:raise RuntimeError('Duplicate accent-sensitive summary identity')
            actual.add(identity)
           print('WEEK41_ACCENT_SENSITIVE_ROSTER|'+json.dumps(dict(result='PASS' if actual==expected else 'FAIL',expected=len(expected),summary=len(actual),extra=len(actual-expected),missing=len(expected-actual))),flush=True)
           if actual!=expected:raise SystemExit(1)
          
          PY
          REMOTE
