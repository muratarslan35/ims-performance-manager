name: Week 41 Paired Canonical Recalculation
on:
  push:
    branches: [codex/week41-compat-audit]
    paths:
      - ".github/workflows/august-production-live-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure read-only SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/audit_key
          chmod 600 ~/.ssh/audit_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Audit Week 41 authorities with redacted public evidence
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/audit_key -p "$IMS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=20 \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          echo "WEB_ACTIVE|$(sudo systemctl is-active ims-performance-manager.service)"
          echo "WORKER_ACTIVE|$(sudo systemctl is-active ims-import-worker.service)"

          
          umask 077
          cat > instance/week41-paired-recalc.py <<'PY'
          import os,sys,json,time,hashlib,inspect
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor,as_completed
          live=Path.cwd()
          sys.path.insert(0,str(live))
          import config as live_config
          meta=json.loads((live/'instance/week41-unit-timing-session.json').read_text())
          shadow=os.environ.get('IMS_SHADOW_PATH')
          if shadow:sys.path.insert(0,shadow)
          import app as module
          module.create_database=lambda application:None
          class ReadOnlyConfig(live_config.Config):
           SQLALCHEMY_DATABASE_URI='sqlite:///file:'+meta['database']+'?mode=ro&uri=true'
          from app.extensions import db
          from app.models import IMSUpload,Representative
          from app.services.representative_period_workspace import build_representative_workspace_payload
          from app.services.persistent_representative_snapshot_service import PersistentRepresentativeSnapshotService as Snap
          from app.services.annual_realization_service import AnnualRealizationService
          from app.services.representative_query_optimizer import use_snapshot_upload_ids
          from app.services.kpi_market_single_source import _upload_has_authority
          from app.cache.representative_analysis_cache import RepresentativeAnalysisCache
          RepresentativeAnalysisCache.enabled=classmethod(lambda cls:False)
          app=module.create_app(ReadOnlyConfig);app.instance_path=str(live/'instance')
          with app.app_context():
           pin={}
           for upload in IMSUpload.query.filter_by(status='COMPLETED').order_by(IMSUpload.year,IMSUpload.month,IMSUpload.week_number.desc(),IMSUpload.completed_at.desc(),IMSUpload.id.desc()):
            pin.setdefault((int(upload.year),int(upload.month)),int(upload.id))
           annual=AnnualRealizationService.build_snapshot_inputs(2026)
           authority={uid:_upload_has_authority(uid) for uid in set(pin.values()) if uid}
          ids=[r['id'] for r in json.loads((live/'instance/week41-shadow-roster-results-private.json').read_text()) if not r['same']]
          label='candidate' if shadow else 'reference'
          def member(rid):
           with app.app_context():
            options={'authority_by_upload':authority} if 'authority_by_upload' in inspect.signature(use_snapshot_upload_ids).parameters else {}
            with use_snapshot_upload_ids(pin,**options):
             workspace=build_representative_workspace_payload(db.session.get(Representative,rid),2026,10,annual_snapshot_inputs=annual)
             payload=Snap._json_ready(workspace)
             encoded=json.dumps(payload,sort_keys=True,separators=(',',':'),default=Snap._json_default)
             (live/'instance'/f'week41-{label}-member-{rid}-private.json').write_text(encoded)
             db.session.rollback()
             return hashlib.sha256(encoded.encode()).hexdigest()
          started=time.perf_counter()
          with ThreadPoolExecutor(max_workers=3) as pool:hashes=list(pool.map(member,ids))
          print('WEEK41_PAIRED_RECALCULATION|'+json.dumps(dict(stage=label,members=len(ids),seconds=round(time.perf_counter()-started,3))),flush=True)
          if shadow:
           same=0;categories={};paths={}
           def walk(a,b,path='root'):
            if a==b:return
            if isinstance(a,dict) and isinstance(b,dict):
             for key in set(a)|set(b):
              if key not in a or key not in b:
               categories['presence']=categories.get('presence',0)+1;continue
              walk(a[key],b[key],path+'.'+str(key))
            elif isinstance(a,list) and isinstance(b,list):
             if len(a)!=len(b):categories['length']=categories.get('length',0)+1
             for i,(x,y) in enumerate(zip(a,b)):walk(x,y,path+'.'+str(i))
            else:
             kind='numeric' if type(a) in (int,float) and type(b) in (int,float) else 'other'
             if kind=='numeric' and abs(a-b)<1e-7:kind='numeric_epsilon'
             categories[kind]=categories.get(kind,0)+1
             prefix='.'.join(path.split('.')[:5]);paths[prefix]=paths.get(prefix,0)+1
           for rid in ids:
            a=json.loads((live/'instance'/f'week41-reference-member-{rid}-private.json').read_text())
            b=json.loads((live/'instance'/f'week41-candidate-member-{rid}-private.json').read_text())
            if a==b:same+=1
            else:walk(a,b)
           print('WEEK41_PAIRED_CANONICAL_EQUIVALENCE|'+json.dumps(dict(result='PASS' if same==len(ids) else 'FAIL',members=len(ids),identical=same,difference_categories=categories,paths=paths)),flush=True)
           if same!=len(ids):raise SystemExit(1)
          
          PY
          unset IMS_SHADOW_PATH
          venv/bin/python -u instance/week41-paired-recalc.py > instance/week41-paired-reference.log 2>&1
          grep -E '^WEEK41_' instance/week41-paired-reference.log
          git fetch origin 5b1c986750226e4877373a48fbee3a4f3bc22339 > instance/week41-shadow-fetch.log 2>&1
          echo "SHADOW_COMMIT|$(git rev-parse FETCH_HEAD)"
          shadow="$(mktemp -d instance/week41-shadow.XXXXXX)"
          git archive FETCH_HEAD | tar -x -C "$shadow"
          export IMS_SHADOW_PATH="$PWD/$shadow"
          set +e
          venv/bin/python -u instance/week41-paired-recalc.py > instance/week41-paired-candidate.log 2>&1
          result=$?
          set -e
          grep -E '^WEEK41_' instance/week41-paired-candidate.log || true
          exit "$result"
          REMOTE
          