name: Week 41 Official Region Recovery
on:
  push:
    branches: [codex/week41-compat-audit]
    paths:
      - ".github/workflows/august-production-live-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure read-only SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/audit_key
          chmod 600 ~/.ssh/audit_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Compare only requested week-41 region values
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/audit_key -p "$IMS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=20 \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          echo "WEB_ACTIVE|$(sudo systemctl is-active ims-performance-manager.service)"
          echo "WORKER_ACTIVE|$(sudo systemctl is-active ims-import-worker.service)"

          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          from collections import defaultdict
          import pandas as pd
          from app import create_app
          from app.models import IMSRawData
          from app.services.ims_import_service import IMSImportService
          from app.services.adaptive_kpi_target_authority import _pair_views,_norm
          app=create_app()
          with app.app_context():
           for uid in (49,53):
            path=Path(app.config['UPLOAD_FOLDER'])/'ims_archive'/f'upload-{uid}.xlsx'
            a=IMSImportService(str(path));a.workbook=pd.read_excel(path,sheet_name=None,header=None,nrows=20)
            v=_pair_views(a);ids=defaultdict(set)
            for r in IMSRawData.query.filter_by(upload_id=uid).filter(IMSRawData.representative_id.isnot(None)):ids[_norm(r.representative)].add(r.representative_id)
            reps=[]
            for (region,name),products in v['tl_reps'].items():
             if region.split()[0]!='501':continue
             reps.append(dict(name=name,ids=sorted(ids[_norm(name)]),vacant=a._is_vacancy_representative(name),target=sum(p['target'] for p in products.values()),actual=sum(p['actual'] for p in products.values())))
            region=next(p for ident,p in v['tl_aggregates'].items() if ident[0]=='501')
            print('ANKARA_SOURCE_POSITIONS|'+json.dumps(dict(upload=uid,positions=reps,official_target=sum(p['target'] for p in region.values()),official_actual=sum(p['actual'] for p in region.values())),default=str),flush=True)
          
          PY
          REMOTE
