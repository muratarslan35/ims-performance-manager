name: Week 41 Official Region Recovery
on:
  push:
    branches: [codex/week41-compat-audit]
    paths:
      - ".github/workflows/august-production-live-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure read-only SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/audit_key
          chmod 600 ~/.ssh/audit_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Compare only requested week-41 region values
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/audit_key -p "$IMS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=20 \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          echo "WEB_ACTIVE|$(sudo systemctl is-active ims-performance-manager.service)"
          echo "WORKER_ACTIVE|$(sudo systemctl is-active ims-import-worker.service)"

          PYTHONPATH="$IMS_PATH" nice -n 10 venv/bin/python - <<'PY'
          import hashlib,json,sqlite3
          from pathlib import Path
          from app import create_app
          from app.extensions import db
          from app.models import IMSImportJob
          from app.services.ims_upload_lifecycle_service import IMSUploadLifecycleService
          app=create_app()
          with app.app_context():
           job=IMSImportJob.query.filter_by(ims_upload_id=53).order_by(IMSImportJob.id.desc()).first()
           print('SEP_JOB_INFO|'+json.dumps(dict(id=job.id if job else None,status=job.status if job else None,summary=job.result_summary if job else None,sealed=IMSUploadLifecycleService.snapshot_master_state_sealed(upload_id=53)),default=str),flush=True)
           result={}
           conn=sqlite3.connect('file:'+str(Path(db.engine.url.database).resolve())+'?mode=ro',uri=True)
           def digest(key,sql):
            h=hashlib.sha256();n=0
            for row in conn.execute(sql):
             h.update(json.dumps(row,ensure_ascii=True,separators=(',',':'),default=str).encode());h.update(b'\n');n+=1
            result[key]=dict(rows=n,sha256=h.hexdigest())
           for table in ('ims_uploads','ims_facts','ims_summary','ims_raw_data','targets','ims_competition_data'):
            digest(table,f'SELECT * FROM {table} WHERE year=2026 AND month=9 ORDER BY id')
           for sets,rows in [('manager_region_snapshot_sets','manager_region_snapshots'),('representative_snapshot_sets','representative_snapshots')]:
            where="NOT (s.year=2026 AND s.month=9)" if rows=='manager_region_snapshots' else '1=1'
            digest(rows,f"SELECT r.* FROM {rows} r JOIN {sets} s ON s.id=r.set_id WHERE s.status='ACTIVE' AND {where} ORDER BY r.id")
           files={}
           root=Path(app.instance_path)/'dashboard_snapshots'
           for path in sorted(root.glob('*.json')):
            if not path.name.startswith('dashboard-2026-09'):files[path.name]=hashlib.sha256(path.read_bytes()).hexdigest()
           result['other_dashboard_files']=files
           baseline=Path('instance/september-authority-protected-before.json')
           if baseline.exists():
            before=json.loads(baseline.read_text()); changed=[k for k in set(before)|set(result) if before.get(k)!=result.get(k)]
            print('SEPTEMBER_PROTECTED_COMPARE|'+json.dumps(dict(result='FAIL' if changed else 'PASS',changed=changed,tables={k:v for k,v in result.items() if k!='other_dashboard_files'},dashboard_files=len(files))),flush=True)
            if changed:raise SystemExit(1)
           else:
            baseline.write_text(json.dumps(result),encoding='utf-8')
            print('SEPTEMBER_PROTECTED_BASELINE|'+json.dumps(dict(tables={k:v for k,v in result.items() if k!='other_dashboard_files'},dashboard_files=len(files))),flush=True)
          
          PY
          REMOTE
