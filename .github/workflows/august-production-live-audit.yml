name: Quota Representative Readonly Progress
on:
  push:
    branches: [codex/week41-compat-audit]
    paths:
      - ".github/workflows/august-production-live-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure read-only SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/audit_key
          chmod 600 ~/.ssh/audit_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Audit Week 41 authorities with redacted public evidence
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/audit_key -p "$IMS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=20 \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          echo "WEB_ACTIVE|$(sudo systemctl is-active ims-performance-manager.service)"
          echo "WORKER_ACTIVE|$(sudo systemctl is-active ims-import-worker.service)"


          echo 'QUOTA_PROGRESS_CHECK|1793570760299'
          umask 077
          venv/bin/python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path('instance')
          pid_path=root/'quota-representative-shadow.pid'
          pid=int(pid_path.read_text()) if pid_path.exists() else 0
          running=bool(pid and Path('/proc',str(pid)).exists())
          lines=(root/'quota-representative-shadow.log').read_text(errors='replace').splitlines()
          progress=[s for s in lines if s.startswith(('QUOTA_REP_PROGRESS|','QUOTA_REP_SHADOW|'))]
          for line in progress[-3:]:print(line,flush=True)
          summary=root/'quota-candidate-representatives-summary.json'
          if summary.exists():
           data=json.loads(summary.read_text())
           print('QUOTA_REP_RESULT|'+json.dumps(data['summary']),flush=True)
           if data['summary']['result']!='PASS':print('QUOTA_REP_ISSUES|'+json.dumps(data['failures'][:3]),flush=True)
          print('QUOTA_REP_PROCESS|'+json.dumps(dict(running=running,pid=pid)),flush=True)
          if not running and not summary.exists():
           print('QUOTA_REP_UNEXPECTED_STOP|'+json.dumps(dict(last_line=lines[-1] if lines else 'no-log')),flush=True)
          PY
          REMOTE
          
