           references={int(r.representative_id):json.loads(r.payload_json) for r in db.session.execute(sa.select(representative_snapshots.c.representative_id,representative_snapshots.c.payload_json).where(representative_snapshots.c.set_id==set_id))}
           assert len(references)==113
          def pid(row):return int((row.get('product') or {}).get('id') or row.get('product_id'))
          def member(rid):
           with app.app_context(),use_snapshot_upload_ids(pin,authority_by_upload=authority):
            try:
             workspace=Snap._json_ready(build_representative_workspace_payload(db.session.get(Representative,rid),2026,10,annual_snapshot_inputs=annual))
             before=references[rid];issues=[]
