name: Week 41 Region Period Catalog Probe
on:
  push:
    branches: [codex/week41-compat-audit]
    paths:
      - ".github/workflows/august-production-live-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure read-only SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/audit_key
          chmod 600 ~/.ssh/audit_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Audit Week 41 authorities with redacted public evidence
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/audit_key -p "$IMS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=20 \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          echo "WEB_ACTIVE|$(sudo systemctl is-active ims-performance-manager.service)"
          echo "WORKER_ACTIVE|$(sudo systemctl is-active ims-import-worker.service)"


          umask 077
          venv/bin/python -u - <<'PY'
          import os,signal,json,time,sqlite3
          from pathlib import Path
          root=Path.cwd();stopped=0
          for proc in Path('/proc').iterdir():
           if not proc.name.isdigit():continue
           try:
            args=(proc/'cmdline').read_bytes().split(b'\0')
            if b'instance/week41-region-budget-bootstrap-v2.py' not in args:continue
            if (proc/'cwd').resolve()!=root or proc.stat().st_uid!=os.getuid():continue
            os.kill(int(proc.name),signal.SIGTERM);stopped+=1
           except (OSError,ProcessLookupError):continue
          print('WEEK41_SUPERSEDED_SHADOW_PREPARATION_STOPPED|'+str(stopped),flush=True)
          time.sleep(2)
          meta=json.loads((root/'instance/week41-performance-timing-session.json').read_text())
          expected={}
          for path in sorted((root/'instance').glob('week41-region-reference-*-private.json')):
           value=json.loads(path.read_text());code=str(value['report']['region_key'])
           expected[code]=value['market_analysis']['available_periods']
          assert len(expected)==11
          codes=sorted(expected);started=time.perf_counter()
          with sqlite3.connect('file:'+meta['database']+'?mode=ro',uri=True) as con:
           sql="SELECT DISTINCT u.year,u.month,substr(c.territory,1,3) FROM ims_competition_data c JOIN ims_uploads u ON u.id=c.upload_id WHERE u.status='COMPLETED' AND c.metric_type='UNIT' AND substr(c.territory,1,3) IN ("+','.join('?' for _ in codes)+") ORDER BY u.year DESC,u.month DESC"
           rows=con.execute(sql,codes).fetchall()
          actual={code:[] for code in codes}
          for year,month,code in rows:actual[code].append(dict(year=year,month=month,label=f'{month:02d}/{year}'))
          changed=[code for code in codes if expected[code]!=actual[code]]
          summary=dict(result='FAIL' if changed else 'PASS',regions=len(codes),changed=changed,seconds=round(time.perf_counter()-started,3))
          (root/'instance/week41-period-catalog-probe.json').write_text(json.dumps(summary))
          print('WEEK41_PERIOD_CATALOG_PROBE|'+json.dumps(summary),flush=True)
          assert not changed
          PY
          REMOTE
          
