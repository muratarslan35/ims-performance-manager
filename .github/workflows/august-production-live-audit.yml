name: Week 41 Authenticated HTML Acceptance
on:
  push:
    branches: [codex/week41-compat-audit]
    paths:
      - ".github/workflows/august-production-live-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure read-only SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/audit_key
          chmod 600 ~/.ssh/audit_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Audit Week 41 authorities with redacted public evidence
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/audit_key -p "$IMS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=20 \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          echo "WEB_ACTIVE|$(sudo systemctl is-active ims-performance-manager.service)"
          echo "WORKER_ACTIVE|$(sudo systemctl is-active ims-import-worker.service)"

          
          umask 077
          venv/bin/python -u - <<'PY' > instance/week41-html-acceptance.log 2>&1
          import json,re
          from app import create_app
          from app.extensions import db
          from app.models import User
          from app.services.persistent_region_snapshot_service import PersistentRegionSnapshotService
          app=create_app()
          from flask import template_rendered
          seen=[]
          def capture(sender,template,context,**extra):seen.append(context)
          template_rendered.connect(capture,app)
          with app.app_context():
           user=User.query.filter(User.active.is_(True),db.func.lower(User.role).in_(['admin','administrator'])).first()
           assert user is not None
           client=app.test_client()
           from verify_region_manager_production import _login_as
           _login_as(client,user.id)
           snapshots=PersistentRegionSnapshotService.get_active_all(2026,10)
           checked=0
           for region,payload in snapshots.items():
            seen.clear()
            response=client.get('/regions/'+region+'?year=2026&month=10')
            assert response.status_code==200,(region,'HTTP status')
            assert seen,(region,'render context')
            context=seen[-1];market=context['market_analysis']
            expected='{:,.0f}'.format(market['totals']['effective_company_unit'])
            html=response.get_data(as_text=True)
            match=re.search(r'BÖLGESEL ŞİRKET TOPLAM KUTU ÇIKIŞI</span><strong>(.*?)</strong>',html)
            assert match and match.group(1)==expected,(region,'rendered official company units')
            checked+=1
           print('WEEK41_REGION_HTML_ACCEPTANCE|'+json.dumps(dict(result='PASS',regions=checked)),flush=True)
           db.session.rollback()
          
          PY
          grep -E '^WEEK41_' instance/week41-html-acceptance.log
          REMOTE
          