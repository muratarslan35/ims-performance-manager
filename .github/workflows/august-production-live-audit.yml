name: Week 41 Deployed Cache Readonly Probe
on:
  push:
    branches: [codex/week41-compat-audit]
    paths:
      - ".github/workflows/august-production-live-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure read-only SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/audit_key
          chmod 600 ~/.ssh/audit_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Audit Week 41 authorities with redacted public evidence
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/audit_key -p "$IMS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=20 \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          echo "WEB_ACTIVE|$(sudo systemctl is-active ims-performance-manager.service)"
          echo "WORKER_ACTIVE|$(sudo systemctl is-active ims-import-worker.service)"


          umask 077
          ps -eo etimes,pcpu,pmem,comm | awk '$4 ~ /(python|gunicorn)/'
          test "$(git rev-parse HEAD)" = "446e0f21da2d0e9c8faf1787c397dd352a15e8ff"
          cat > instance/week41-deployed-cache-probe.py <<'PY'
          import os,sys,json,hashlib,time
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor,as_completed
          os.umask(0o077);live=Path.cwd();sys.path.insert(0,str(live))
          import config
          meta=json.loads((live/'instance/week41-unit-timing-session.json').read_text())
          
          import app as module
          module.create_database=lambda application:None
          class ReadOnlyConfig(config.Config):
           SQLALCHEMY_DATABASE_URI='sqlite:///file:'+meta['database']+'?mode=ro&uri=true'
          from app.extensions import db
          from app.models import IMSUpload,Representative
          from app.services.representative_period_workspace import build_representative_workspace_payload
          from app.services.persistent_representative_snapshot_service import PersistentRepresentativeSnapshotService as Snap
          from app.services.annual_realization_service import AnnualRealizationService as Annual
          from app.services.representative_query_optimizer import use_snapshot_upload_ids
          from app.services.kpi_market_single_source import _upload_has_authority
          from app.cache.representative_monthly_market_cache import RepresentativeMonthlyMarketCache as Monthly
          app=module.create_app(ReadOnlyConfig);app.instance_path=str(live/'instance')
          phase='deployed-probe';started=time.perf_counter()
          with app.app_context():
           pin={}
           for upload in IMSUpload.query.filter_by(status='COMPLETED').order_by(IMSUpload.year,IMSUpload.month,IMSUpload.week_number.desc(),IMSUpload.completed_at.desc(),IMSUpload.id.desc()):
            pin.setdefault((int(upload.year),int(upload.month)),int(upload.id))
           assert pin[(2026,10)]==56
           annual=Annual.build_snapshot_inputs(2026)
           authority={uid:_upload_has_authority(uid) for uid in set(pin.values()) if uid}
          references=json.loads((live/'instance/week41-independent-period-reference-hashes.json').read_text())
          ids=sorted(map(int,references))[:1]
          def canonical(value):return json.dumps(value,sort_keys=True,separators=(',',':'),default=Snap._json_default)
          def digest(value):return hashlib.sha256(canonical(value).encode()).hexdigest()
          def member(rid):
           with app.app_context(),use_snapshot_upload_ids(pin,authority_by_upload=authority):
            try:
             workspace=Snap._json_ready(build_representative_workspace_payload(db.session.get(Representative,rid),2026,10,annual_snapshot_inputs=annual))
             financial={'annual_realization':workspace['annual_realization'],'snapshots':{key:{field:part[field] for field in ('products','totals','assignments')} for key,part in workspace['snapshots'].items()}}
             market={key:part['market_analysis'] for key,part in workspace['snapshots'].items()}
             expected=references[str(rid)]
             result=dict(id=rid,financial=digest(financial)==expected['financial_sha256'],market=digest(market)==expected['market_sha256'],workspace_sha256=digest(workspace))
             if not result['financial'] or not result['market']:
              (live/'instance'/f'week41-{phase}-gate-member-{rid}-private.json').write_text(canonical(workspace))
             return result
            except Exception as exc:
             import traceback
             (live/'instance'/f'week41-{phase}-gate-member-{rid}-error-private.log').write_text(traceback.format_exc())
             return dict(id=rid,financial=False,market=False,error_type=type(exc).__name__)
            finally:db.session.rollback()
          results=[]
          with ThreadPoolExecutor(max_workers=3) as pool:
           for future in as_completed([pool.submit(member,rid) for rid in ids]):
            results.append(future.result())
            if len(results)%8==0 or len(results)==len(ids):print('WEEK41_GATE_PROGRESS|'+json.dumps(dict(phase=phase,done=len(results),total=len(ids),seconds=round(time.perf_counter()-started,3))),flush=True)
          results.sort(key=lambda r:r['id'])
          (live/'instance'/f'week41-{phase}-stable-gate-results-private.json').write_text(json.dumps(results))
          failed_financial=sum(not r['financial'] for r in results);failed_market=sum(not r['market'] for r in results)
          stable=True
          if phase=='hot':
           previous=json.loads((live/'instance/week41-bootstrap-stable-gate-results-private.json').read_text())
           stable=all(a.get('workspace_sha256')==b.get('workspace_sha256') for a,b in zip(previous,results))
          summary=dict(result='PASS' if not failed_financial and not failed_market and stable else 'FAIL',phase=phase,members=len(results),financial_failures=failed_financial,market_failures=failed_market,stable_across_processes=stable,seconds=round(time.perf_counter()-started,3),cache=Monthly.statistics(),errors=[r.get('error_type') for r in results if r.get('error_type')])
          (live/'instance'/f'week41-{phase}-stable-gate-summary.json').write_text(json.dumps(summary))
          print('WEEK41_STABLE_GATE_ACCEPTANCE|'+json.dumps(summary),flush=True)
          if summary['result']!='PASS':raise SystemExit(1)
          
          assert Monthly.statistics().get('hits') == 10 and not Monthly.statistics().get('misses'), 'Verified monthly cache is not portable to deployed code'
          print('WEEK41_DEPLOYED_CACHE|PASS|hits=10',flush=True)
          PY
          set +e
          venv/bin/python instance/week41-deployed-cache-probe.py > instance/week41-deployed-cache-probe.log 2>&1
          probe_rc=$?
          set -e
          grep '^WEEK41_' instance/week41-deployed-cache-probe.log || true
          echo "WEEK41_DEPLOYED_CACHE_EXIT|$probe_rc"
          test "$probe_rc" = "0"
          REMOTE
          
