name: Quota Deployment Activation Progress
on:
  push:
    branches: [codex/week41-compat-audit]
    paths:
      - ".github/workflows/august-production-live-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure read-only SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/audit_key
          chmod 600 ~/.ssh/audit_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Audit Week 41 authorities with redacted public evidence
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/audit_key -p "$IMS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=20 \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          echo "WEB_ACTIVE|$(sudo systemctl is-active ims-performance-manager.service)"
          echo "WORKER_ACTIVE|$(sudo systemctl is-active ims-import-worker.service)"


          umask 077
          venv/bin/python - <<'PY'
          import json,sqlite3
          from pathlib import Path
          meta=json.loads(Path('instance/week41-performance-timing-session.json').read_text())
          with sqlite3.connect('file:'+meta['database']+'?mode=ro',uri=True) as con:
           tables=[r[0] for r in con.execute("SELECT name FROM sqlite_master WHERE type='table' AND (name LIKE '%refresh%' OR name LIKE '%finalization%')")]
           counts={}
           for table in tables:
            columns=[r[1] for r in con.execute('PRAGMA table_info("'+table+'")')]
            if 'status' in columns:counts[table]=con.execute('SELECT status,count(*) FROM "'+table+'" GROUP BY status').fetchall()
           print('QUOTA_DEPLOY_QUEUES|'+json.dumps(counts),flush=True)
          scripts={'verify_production_snapshot_finalization.py','finalize_latest_snapshot_publication.py','verify_region_manager_production.py','production_resource_gate.py','verify_live_ims_gate.py'}
          active=[]
          for directory in Path('/proc').iterdir():
           if not directory.name.isdigit():continue
           try:
            args=(directory/'cmdline').read_bytes().split(b'\0')
            matched=[Path(a.decode(errors='replace')).name for a in args if Path(a.decode(errors='replace')).name in scripts]
            if matched:active.append(dict(pid=int(directory.name),script=matched[0]))
           except (PermissionError,FileNotFoundError,ProcessLookupError):pass
          print('QUOTA_DEPLOY_ACTIVE_CHECKS|'+json.dumps(active),flush=True)
          PY
          REMOTE
          
