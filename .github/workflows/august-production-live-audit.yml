name: Week 41 Lightweight Publication Status
on:
  push:
    branches: [codex/week41-compat-audit]
    paths:
      - ".github/workflows/august-production-live-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure read-only SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/audit_key
          chmod 600 ~/.ssh/audit_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Audit Week 41 authorities with redacted public evidence
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/audit_key -p "$IMS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=20 \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          echo "WEB_ACTIVE|$(sudo systemctl is-active ims-performance-manager.service)"
          echo "WORKER_ACTIVE|$(sudo systemctl is-active ims-import-worker.service)"

          venv/bin/python - <<'PY'
          import json,re,sqlite3
          from datetime import datetime,timezone
          from pathlib import Path
          meta=json.loads(Path('instance/week41-unit-timing-session.json').read_text());job_id=int(meta['job_id']);root=Path(meta['root'])
          connection=sqlite3.connect('file:'+meta['database']+'?mode=ro',uri=True,isolation_level=None,timeout=5)
          connection.row_factory=sqlite3.Row
          row=connection.execute('SELECT status,ims_upload_id,queued_at,started_at,completed_at,result_summary,error_message FROM ims_import_jobs WHERE id=?',(job_id,)).fetchone()
          summary=json.loads(row['result_summary'] or '{}')
          try:progress=json.loads((root/'ims_progress'/f'job-{job_id}.json').read_text())
          except (OSError,ValueError):progress={}
          stage=str(progress.get('stage') or '')
          if not re.fullmatch('[a-z_]{1,48}',stage):stage='other_stage'
          fraction=re.search(r'(\d+)\s*/\s*(\d+)',progress.get('detail') or '')
          now=datetime.now(timezone.utc)
          queued=datetime.fromisoformat(row['queued_at']).replace(tzinfo=timezone.utc)
          result=dict(job_id=job_id,status=row['status'],upload_id=row['ims_upload_id'],publication_ready=summary.get('publication_ready') is True,
           stage=stage,percent=progress.get('percent'),elapsed_seconds=round((now-queued).total_seconds(),1),
           queued_at=row['queued_at'],started_at=row['started_at'],import_completed_at=row['completed_at'],
           has_error=bool(row['error_message']),sample_time_utc=now.isoformat())
          if fraction:result.update(representatives_done=int(fraction.group(1)),representatives_total=int(fraction.group(2)))
          timeline=root/f'week41-job-{job_id}-timing.jsonl'
          if timeline.exists():
           lines=timeline.read_text().splitlines()
           if lines:
            latest=json.loads(lines[-1]);result['observer_samples']=len(lines)
            result['latest_worker_rss_bytes']=latest.get('worker_rss_bytes')
            result['latest_worker_cpu_percent']=latest.get('worker_cpu_percent')
            result['latest_available_memory_bytes']=latest.get('available_memory_bytes')
            result['observer_latest_at']=latest.get('observed_at')
          final=root/f'week41-job-{job_id}-timing-summary.json'
          if final.exists():
           timing=json.loads(final.read_text());result['timing']={k:v for k,v in timing.items() if k not in ('stage_telemetry','stage_transitions')}
          print('WEEK41_LIVE_STATUS|'+json.dumps(result),flush=True)
          
          PY
          REMOTE
