name: September Final Read Only Acceptance
on:
  push:
    branches: [codex/week41-compat-audit]
    paths:
      - ".github/workflows/august-production-live-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure read-only SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/audit_key
          chmod 600 ~/.ssh/audit_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Verify September rendered cards and protected snapshots
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/audit_key -p "$IMS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=20 \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          echo "WEB_ACTIVE|$(sudo systemctl is-active ims-performance-manager.service)"
          echo "WORKER_ACTIVE|$(sudo systemctl is-active ims-import-worker.service)"

          test "$(git rev-parse HEAD)" = f04b524ac1b8e9c80be25f14c823638dc93b2dea
          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          import sqlalchemy as sa
          from app import create_app
          from app.extensions import db
          from app.models import User
          from app.services.persistent_region_snapshot_service import PersistentRegionSnapshotService as RS
          from verify_region_manager_production import _login_as
          app=create_app()
          failures=[];checked=[]
          with app.app_context():
           admin=next(u for u in User.query.filter_by(active=True).all() if (u.role or '').lower()=='admin')
           payloads=RS.get_active_all(2026,9)
           assert len(payloads)==11
           client=app.test_client();_login_as(client,admin.id)
           for region,payload in payloads.items():
            market=payload['market_analysis']
            expected=sum(float(r['company_unit']) for r in market['rows'])
            assert abs(expected-float(market['totals']['effective_company_unit']))<.001
            response=client.get('/regions/'+region+'?year=2026&month=9')
            html=response.get_data(as_text=True)
            match=re.search(r'BÖLGESEL ŞİRKET TOPLAM KUTU ÇIKIŞI</span><strong>([^<]+)</strong>',html)
            actual=match.group(1) if match else None
            if response.status_code!=200 or actual!=format(expected,',.0f'):
             failures.append(dict(region=region,status=response.status_code,actual=actual,expected=format(expected,',.0f')))
            checked.append(dict(region=region,company_exit_boxes=expected,rendered=actual))
           print('SEPTEMBER_REGION_HTML_ACCEPTANCE|'+json.dumps(dict(result='FAIL' if failures else 'PASS',regions=checked,failures=failures)),flush=True)
           baseline=json.loads(Path('instance/september-authority-protected-before.json').read_text())
           current={}
           for sets,rows in [('manager_region_snapshot_sets','manager_region_snapshots'),('representative_snapshot_sets','representative_snapshots')]:
            where="NOT (s.year=2026 AND s.month=9)" if rows=='manager_region_snapshots' else '1=1'
            digest=hashlib.sha256();count=0
            for row in db.session.execute(sa.text(f"SELECT r.* FROM {rows} r JOIN {sets} s ON s.id=r.set_id WHERE s.status='ACTIVE' AND {where} ORDER BY r.id")):
             digest.update(json.dumps(tuple(row),ensure_ascii=True,separators=(',',':'),default=str).encode());digest.update(b'\n');count+=1
            current[rows]=dict(rows=count,sha256=digest.hexdigest())
           files={}
           for path in sorted((Path(app.instance_path)/'dashboard_snapshots').glob('*.json')):
            if not path.name.startswith('dashboard-2026-09'):files[path.name]=hashlib.sha256(path.read_bytes()).hexdigest()
           current['other_dashboard_files']=files
           changed=[k for k,v in current.items() if baseline.get(k)!=v]
           print('SEPTEMBER_FINAL_PROTECTED_SNAPSHOTS|'+json.dumps(dict(result='FAIL' if changed else 'PASS',changed=changed,region_rows=current['manager_region_snapshots']['rows'],representative_rows=current['representative_snapshots']['rows'],dashboard_files=len(files))),flush=True)
           if failures or changed:raise SystemExit(1)
          
          PY
          sudo systemctl is-active ims-performance-manager.service ims-import-worker.service ims-report-worker.service
          REMOTE
