name: Quota Final Source Consistency Shadow
on:
  push:
    branches: [codex/week41-compat-audit]
    paths:
      - ".github/workflows/august-production-live-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure read-only SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/audit_key
          chmod 600 ~/.ssh/audit_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Audit Week 41 authorities with redacted public evidence
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/audit_key -p "$IMS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=20 \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          echo "WEB_ACTIVE|$(sudo systemctl is-active ims-performance-manager.service)"
          echo "WORKER_ACTIVE|$(sudo systemctl is-active ims-import-worker.service)"


          umask 077
          test "$(git rev-parse HEAD)" = "4effa51befff54a23b33c33e3b89bf3f96e0585d"
          pkill -f '^venv/bin/python instance/quota-representative-shadow.py
          shadow_dir="$(mktemp -d "$IMS_PATH/instance/quota-target-first-shadow.XXXXXX")"
          git archive 09bef569aff1d41ac2b7b080dd6f0925425560e0 | tar -x -C "$shadow_dir"
          export IMS_SHADOW_PATH="$shadow_dir"
          printf '%s' "$shadow_dir" > instance/quota-target-first-shadow-path.txt
          cat > instance/quota-dashboard-shadow.py <<'PY'
          import os,sys,json,hashlib,time
          from pathlib import Path
          from contextlib import nullcontext
          live=Path.cwd();sys.path.insert(0,str(live))
          import config
          meta=json.loads((live/'instance/week41-performance-timing-session.json').read_text())
          sys.path.insert(0,os.environ['IMS_SHADOW_PATH'])
          import app as module
          module.create_database=lambda application:None
          class ReadOnlyConfig(config.Config):
           SQLALCHEMY_DATABASE_URI='sqlite:///file:'+meta['database']+'?mode=ro&uri=true'
          from app.extensions import db
          from app.models import IMSUpload,Representative
          from app.services.persistent_representative_snapshot_service import PersistentRepresentativeSnapshotService as Snap,representative_snapshots,representative_snapshot_sets
          from app.services.persistent_region_snapshot_service import PersistentRegionSnapshotService as Regions
          from app.services.region_performance_service import RegionPerformanceService
          from app.services.region_market_service import RegionMarketService
          import sqlalchemy as sa
          app=module.create_app(ReadOnlyConfig);app.instance_path=str(live/'instance')
          def canonical(value):return json.dumps(value,sort_keys=True,separators=(',',':'),default=Snap._json_default)
          def digest(value):return hashlib.sha256(canonical(value).encode()).hexdigest()
          
          from app.query.dashboard_query import DashboardQuery
          from app.query.filters import DashboardFilterParams
          from app.services.production_result_service import ProductionResultService as Production
          from app.services.official_aggregate_service import OfficialAggregateService
          with app.app_context():
           filters=DashboardFilterParams(year=2026,month=10);query=DashboardQuery()
           scope=Production.ims_target_scope(2026,10)
           national=query.load_national_dashboard_metrics(filters)
           assert {int(r['product_id']) for r in national['products']}==set(scope)
           official={int(r['product_id']):r for r in OfficialAggregateService.product_totals(2026,10,'NATIONAL')}
           for row in national['products']:
            source=official[int(row['product_id'])]
            assert abs(float(row['target_tl'])-float(source['target_tl']))<0.011
            assert abs(float(row['actual_tl'])-float(source['actual_tl']))<0.011
           maps=query.load_region_performance(filters);assert len(maps)==11
           for row in maps:
            official=OfficialAggregateService.product_totals(2026,10,str(row.region))
            for field,source_field in [('tl_target','target_tl'),('tl_actual','actual_tl')]:
             assert abs(float(getattr(row,field))-sum(float(r[source_field]) for r in official if int(r['product_id']) in scope))<0.02
           ranking=query.load_top_representatives(filters);assert len(ranking)==113
           print('QUOTA_DASHBOARD_SHADOW|'+json.dumps(dict(result='PASS',national_products=len(national['products']),map_regions=len(maps),ranked_representatives=len(ranking),cities=len(query.load_city_performance(filters)))),flush=True)
           db.session.rollback()
          
          PY
          set +e
          venv/bin/python instance/quota-dashboard-shadow.py > instance/quota-dashboard-shadow.log 2>&1
          dash_rc=$?
          set -e
          grep '^QUOTA_' instance/quota-dashboard-shadow.log || true
          echo "QUOTA_DASHBOARD_EXIT|$dash_rc"
          test "$dash_rc" = "0"
          cat > instance/quota-region-shadow.py <<'PY'
          import os,sys,json,hashlib,time
          from pathlib import Path
          from contextlib import nullcontext
          live=Path.cwd();sys.path.insert(0,str(live))
          import config
          meta=json.loads((live/'instance/week41-performance-timing-session.json').read_text())
          sys.path.insert(0,os.environ['IMS_SHADOW_PATH'])
          import app as module
          module.create_database=lambda application:None
          class ReadOnlyConfig(config.Config):
           SQLALCHEMY_DATABASE_URI='sqlite:///file:'+meta['database']+'?mode=ro&uri=true'
          from app.extensions import db
          from app.models import IMSUpload,Representative
          from app.services.persistent_representative_snapshot_service import PersistentRepresentativeSnapshotService as Snap,representative_snapshots,representative_snapshot_sets
          from app.services.persistent_region_snapshot_service import PersistentRegionSnapshotService as Regions
          from app.services.region_performance_service import RegionPerformanceService
          from app.services.region_market_service import RegionMarketService
          import sqlalchemy as sa
          app=module.create_app(ReadOnlyConfig);app.instance_path=str(live/'instance')
          def canonical(value):return json.dumps(value,sort_keys=True,separators=(',',':'),default=Snap._json_default)
          def digest(value):return hashlib.sha256(canonical(value).encode()).hexdigest()
          
          from app.cache.ims_generation_reads import isolated_generation_reads
          from app.services.production_result_service import ProductionResultService as Production
          started=time.perf_counter()
          with app.app_context(),isolated_generation_reads():
           scope=Production.ims_target_scope(2026,10);keys=Regions.region_keys(2026,10);assert len(keys)==11
           summaries=[]
           for key in keys:
            service=RegionPerformanceService(key,2026,10);report=Snap._json_ready(service.report())
            previous=Regions.get_active(key,2026,10)
            old_periods=previous['report']['periods']
            for period_key,period in report['periods'].items():
             old={int(r['product_id']):r for r in old_periods[period_key]['products']}
             rows={int(r['product_id']):r for r in period['products']}
             if period_key=='monthly':assert set(rows)==set(scope),('scope',key)
             for pid,row in rows.items():
              assert pid in old
              for field in ('target_tl','actual_tl','target_unit','actual_unit'):
               assert abs(float(row.get(field) or 0)-float(old[pid].get(field) or 0))<0.011,('source change',key,period_key,field)
            market=Snap._json_ready(RegionMarketService(report['region_key'],service.rep_ids,2026,10).build())
            assert len(market['rows'])==7
            for row in market['rows']:
             if int(row['product_id']) not in scope:assert not row.get('target_unit') and not row.get('company_unit'),('targetless company market',key)
            (live/'instance'/f'quota-candidate-region-{key}-private.json').write_text(canonical(dict(report=report,market_analysis=market)))
            summaries.append(str(key));print('QUOTA_REGION_PROGRESS|'+json.dumps(dict(done=len(summaries),total=11,seconds=round(time.perf_counter()-started,3))),flush=True)
           print('QUOTA_REGION_SHADOW|'+json.dumps(dict(result='PASS',regions=len(summaries),seconds=round(time.perf_counter()-started,3))),flush=True)
           db.session.rollback()
          
          PY
          set +e
          venv/bin/python instance/quota-region-shadow.py > instance/quota-region-shadow.log 2>&1
          region_rc=$?
          set -e
          grep '^QUOTA_' instance/quota-region-shadow.log || true
          echo "QUOTA_REGION_EXIT|$region_rc"
          if [ "$region_rc" != "0" ]; then tail -n 5 instance/quota-region-shadow.log | sed -E 's/[0-9]+([.][0-9]+)?/[redacted]/g'; exit 1; fi
          cat > instance/quota-representative-shadow.py <<'PY'
