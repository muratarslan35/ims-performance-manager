name: Week 41 Performance Publication Progress
on:
  push:
    branches: [codex/week41-compat-audit]
    paths:
      - ".github/workflows/august-production-live-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure read-only SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/audit_key
          chmod 600 ~/.ssh/audit_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Audit Week 41 authorities with redacted public evidence
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/audit_key -p "$IMS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=20 \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          echo "WEB_ACTIVE|$(sudo systemctl is-active ims-performance-manager.service)"
          echo "WORKER_ACTIVE|$(sudo systemctl is-active ims-import-worker.service)"


          venv/bin/python - <<'PY'
          from pathlib import Path
          from datetime import datetime
          import json,sqlite3
          meta=json.loads(Path('instance/week41-performance-timing-session.json').read_text())
          with sqlite3.connect('file:'+meta['database']+'?mode=ro',uri=True,timeout=3) as con:
           con.row_factory=sqlite3.Row
           row=dict(con.execute('SELECT id,status,queued_at,started_at,completed_at,ims_upload_id,result_summary FROM ims_import_jobs WHERE id=?',(meta['job_id'],)).fetchone())
           summary=json.loads(row.pop('result_summary') or '{}')
          progress=json.loads((Path(meta['root'])/'ims_progress'/f"job-{meta['job_id']}.json").read_text())
          row.update(stage=progress.get('stage'),percent=progress.get('percent'),updated_at=progress.get('updated_at'),publication_ready=summary.get('publication_ready'),elapsed_seconds=round((datetime.utcnow()-datetime.fromisoformat(row['queued_at'])).total_seconds(),3))
          print('WEEK41_PERFORMANCE_STATUS|'+json.dumps(row),flush=True)
          for p in [Path(meta['root'])/f"week41-job-{meta['job_id']}-timing-summary.json"]:
           if p.exists():print('WEEK41_PERFORMANCE_TIMING|'+p.read_text(),flush=True)
          PY
          REMOTE
          
