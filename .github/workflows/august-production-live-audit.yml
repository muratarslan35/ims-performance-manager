name: Week 41 Final Verification Status
on:
  push:
    branches: [codex/week41-compat-audit]
    paths:
      - ".github/workflows/august-production-live-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure read-only SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/audit_key
          chmod 600 ~/.ssh/audit_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Audit Week 41 authorities with redacted public evidence
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/audit_key -p "$IMS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=20 \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          echo "WEB_ACTIVE|$(sudo systemctl is-active ims-performance-manager.service)"
          echo "WORKER_ACTIVE|$(sudo systemctl is-active ims-import-worker.service)"


          venv/bin/python - <<'PY'
          import json,re,sqlite3
          from pathlib import Path
          from collections import defaultdict
          meta=json.loads(Path('instance/week41-unit-timing-session.json').read_text());root=Path(meta['root'])
          samples=[json.loads(l) for l in (root/'week41-job-46-timing.jsonl').read_text().splitlines()]
          groups=defaultdict(list)
          for sample in samples:groups[sample['stage']].append(sample)
          metrics={}
          for stage,rows in groups.items():
           metrics[stage]=dict(samples=len(rows),minimum_available_memory_bytes=min(r.get('available_memory_bytes',10**15) for r in rows),
           minimum_free_swap_bytes=min(r.get('free_swap_bytes',10**15) for r in rows),
           peak_worker_rss_bytes=max(r.get('worker_rss_bytes',0) for r in rows),
           mean_cpu_percent=round(sum(r.get('worker_cpu_percent',0) for r in rows)/len(rows),2))
           for key in ('worker_read_bytes','worker_write_bytes'):
            values=[r[key] for r in rows if key in r]
            metrics[stage][key+'_delta']=max(values)-min(values) if values else None
          print('WEEK41_RESOURCE_PHASES|'+json.dumps(metrics),flush=True)
          for name in ('week41-post-publication-validation.log','week41-final-history-validation.log','week41-final-generations-validation.log','week41-final-timing-evidence.log','week41-tl-classification.log'):
           path=root/name
           if path.exists():
            lines=path.read_text(errors='replace').splitlines()
            for line in lines:
             if re.match(r'^WEEK41_[A-Z_]+\|',line):print(line,flush=True)
            error=re.match(r'^([A-Za-z.]+(?:Error|Exception))(?::|$)',lines[-1] if lines else '')
            if error:print('WEEK41_PRIVATE_LOG_ERROR|'+json.dumps(dict(log=name,error_type=error.group(1))),flush=True)
          artifact=root/'official-publication-acceptance-56.json'
          if artifact.exists():
           a=json.loads(artifact.read_text())
           print('WEEK41_CURRENT_ACCEPTANCE|'+json.dumps({k:a[k] for k in ('result','upload_id','week','counts')}),flush=True)
           if a.get('failures'):print('WEEK41_ACCEPTANCE_FAILURE_CONTEXTS|'+json.dumps([f['context'] for f in a['failures']]),flush=True)
          
          PY
          REMOTE
          