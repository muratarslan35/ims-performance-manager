name: Quota Deployment Service Transition State
on:
  push:
    branches: [codex/week41-compat-audit]
    paths:
      - ".github/workflows/august-production-live-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure read-only SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/audit_key
          chmod 600 ~/.ssh/audit_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Audit Week 41 authorities with redacted public evidence
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/audit_key -p "$IMS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=20 \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          echo "WEB_ACTIVE|$(sudo systemctl is-active ims-performance-manager.service)"
          echo "WORKER_ACTIVE|$(sudo systemctl is-active ims-import-worker.service)"


          umask 077
          sudo systemctl show ims-performance-manager.service ims-import-worker.service ims-report-worker.service --property=Id,MainPID,ActiveState,SubState,ActiveEnterTimestamp --no-pager
          sudo systemctl list-jobs --no-pager
          venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          names={'git','systemctl','journalctl','install_systemd_service.sh','verify_runtime.py','verify_region_manager_production.py','verify_production_snapshot_finalization.py','finalize_latest_snapshot_publication.py','sudo'}
          result=[]
          for directory in Path('/proc').iterdir():
           if not directory.name.isdigit():continue
           try:
            args=[a.decode(errors='replace') for a in (directory/'cmdline').read_bytes().split(b'\0') if a]
            if args and any(Path(a).name in names for a in args):
             result.append(dict(pid=int(directory.name),command=[Path(a).name for a in args[:3]]))
           except (PermissionError,FileNotFoundError,ProcessLookupError):pass
          print('QUOTA_DEPLOY_PROCESS_STATE|'+json.dumps(result),flush=True)
          PY
          REMOTE
          
