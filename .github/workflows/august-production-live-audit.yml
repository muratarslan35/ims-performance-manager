name: Week 41 Source Catalog Validation Progress
on:
  push:
    branches: [codex/week41-compat-audit]
    paths:
      - ".github/workflows/august-production-live-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure read-only SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/audit_key
          chmod 600 ~/.ssh/audit_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Audit Week 41 authorities with redacted public evidence
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/audit_key -p "$IMS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=20 \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          echo "WEB_ACTIVE|$(sudo systemctl is-active ims-performance-manager.service)"
          echo "WORKER_ACTIVE|$(sudo systemctl is-active ims-import-worker.service)"


          venv/bin/python - <<'PY'
          from pathlib import Path
          import json
          root=Path('instance')
          for name in ('week41-region-budget-candidate-final.log','week41-region-budget-candidate-hot.log','week41-region-budget-bootstrap-final.log'):
           p=root/name
           if p.exists():
            lines=[l for l in p.read_text(errors='replace').splitlines() if l.startswith('WEEK41_')]
            for line in lines[-2:]:print(line,flush=True)
          for name in ('week41-region-budget-candidate-final-summary.json','week41-region-budget-candidate-hot-summary.json','week41-region-budget-bootstrap-summary.json'):
           p=root/name
           if p.exists():print('WEEK41_FINAL_BUDGET_SUMMARY|'+p.read_text(),flush=True)
          memory={line.split(':')[0]:line.split(':')[1].strip() for line in Path('/proc/meminfo').read_text().splitlines()}
          print('WEEK41_VALIDATION_MEMORY|'+json.dumps({k:memory[k] for k in ('MemAvailable','SwapFree')}),flush=True)
          PY
          REMOTE
          
