name: Post289 Read Check
on:
  push:
    branches: [fix/region-representative-read-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - env: { IMS_DEPLOY_SSH_KEY: "${{ secrets.IMS_DEPLOY_SSH_KEY }}" }
        run: |
          mkdir -p ~/.ssh; printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/k; chmod 600 ~/.ssh/k; ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - run: |
          ssh -i ~/.ssh/k -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "cd '$IMS_PATH' && venv/bin/python -" <<'PY'
          from app import create_app
          from app.models import Representative
          from app.services.region_performance_service import RegionPerformanceService
          from app.services.representative_period_snapshot_service import RepresentativePeriodSnapshotService
          app=create_app()
          with app.app_context():
              report=RegionPerformanceService('901',2026,2).report()
              for k in ('monthly','quarterly','half_year'):
                  p=report['periods'][k]; print('REGION',k,float(p['target_tl']),None if p['actual_tl'] is None else float(p['actual_tl']),p['realization_percent'],p['complete'])
              rep=Representative.query.filter_by(rep_name='MURAT ARSLAN').first()
              periods=RepresentativePeriodSnapshotService.build(rep.id,2026,2)
              for k in ('monthly','quarterly','half_year'):
                  p=periods[k]; print('REP',k,float(p['target_tl']),None if p['actual_tl'] is None else float(p['actual_tl']),p['realization_percent'],p['complete'])
          PY