name: IMS Rollback Diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ims-rollback-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Repair verified rollback snapshot
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" -o BatchMode=yes "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          venv/bin/python - <<'PY'
          import json
          from run import app
          from app.models import IMSImportJob, IMSUpload
          from app.services.ims_upload_lifecycle_service import IMSUploadLifecycleService
          from app.services.ims_upload_lifecycle_ui import _first_period_rollback_permission
          from app.services.persistent_dashboard_snapshot_service import PersistentDashboardSnapshotService

          def by_id(rows):
              return {int(row['id']): row for row in rows if row.get('id') is not None}

          with app.app_context():
              active_job = IMSImportJob.query.filter(
                  IMSImportJob.status.in_((IMSImportJob.STATUS_QUEUED, IMSImportJob.STATUS_PROCESSING))
              ).first()
              if active_job is not None:
                  raise SystemExit('Refused: active IMS import exists')

              latest = IMSUpload.query.filter_by(status=IMSUpload.STATUS_COMPLETED).order_by(
                  IMSUpload.year.desc(), IMSUpload.month.desc(), IMSUpload.week_number.desc(),
                  IMSUpload.completed_at.desc(), IMSUpload.id.desc(),
              ).first()
              identity = (int(latest.id), int(latest.year), int(latest.month), int(latest.week_number or 0))
              print('LATEST', identity)
              if identity != (49, 2026, 9, 36):
                  raise SystemExit(f'Refused: unexpected live IMS {identity}')

              path = IMSUploadLifecycleService.upload_snapshot_path(latest.id)
              if not path.is_file():
                  raise SystemExit('Refused: rollback snapshot missing')
              payload = json.loads(path.read_text(encoding='utf-8'))
              if int(payload.get('version', 0)) != 3:
                  raise SystemExit('Refused: snapshot version is not 3')
              if payload.get('source_upload_id') not in (None, 0, '', '0'):
                  raise SystemExit('Refused: snapshot is not first-period baseline')
              if payload.get('sealed_upload_id') not in (None, 0, '', '0') or payload.get('master_after'):
                  raise SystemExit('Refused: snapshot already sealed or contains master_after')
              if (int(payload.get('year', 0)), int(payload.get('month', 0))) != (2026, 9):
                  raise SystemExit('Refused: snapshot period mismatch')

              active_ims_id, production_id = PersistentDashboardSnapshotService.source_identity(2026, 9)
              if int(active_ims_id or 0) != 49 or int(production_id or 0) != 0:
                  raise SystemExit(f'Refused: live source identity changed ims={active_ims_id} production={production_id}')
              if int(payload.get('dashboard_production_upload_id', 0) or 0) != 0:
                  raise SystemExit('Refused: captured production identity changed')

              current = IMSUploadLifecycleService._master_state()
              diffs = {}
              for key in ('representatives', 'products'):
                  before = by_id((payload.get('master_before') or {}).get(key) or [])
                  now = by_id(current.get(key) or [])
                  added = sorted(set(now) - set(before))
                  removed = sorted(set(before) - set(now))
                  changed = {}
                  for row_id in sorted(set(before) & set(now)):
                      fields = sorted(
                          name for name in set(before[row_id]) | set(now[row_id])
                          if before[row_id].get(name) != now[row_id].get(name)
                      )
                      if fields:
                          changed[row_id] = fields
                  diffs[key] = {'added': added, 'removed': removed, 'changed': changed}
              print('MASTER_DIFFS', diffs)
              expected = {
                  'representatives': {'added': [191, 192], 'removed': [], 'changed': {113: ['active']}},
                  'products': {'added': [], 'removed': [], 'changed': {}},
              }
              if diffs != expected:
                  raise SystemExit(f'Refused: master state differs from verified import-only delta: {diffs}')

              IMSUploadLifecycleService.seal_snapshot_master_state(upload_id=latest.id)
              allowed, reason = _first_period_rollback_permission(latest)
              print('FIRST_PERIOD_AFTER_REPAIR', allowed, reason)
              if not allowed:
                  raise SystemExit(f'Repair failed: {reason}')
              print('ROLLBACK_SNAPSHOT_REPAIR|PASS|upload_id=49|week=36')
          PY
          REMOTE
