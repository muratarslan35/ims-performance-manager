name: IMS Rollback Diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ims-rollback-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Read live rollback state
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" -o BatchMode=yes "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          venv/bin/python - <<'PY'
          import json
          from run import app
          from app.models import IMSUpload
          from app.services.ims_upload_lifecycle_service import IMSUploadLifecycleService
          from app.services.ims_upload_lifecycle_ui import _first_period_rollback_permission

          def by_id(rows):
              return {int(row['id']): row for row in rows if row.get('id') is not None}

          with app.app_context():
              latest = IMSUpload.query.filter_by(status=IMSUpload.STATUS_COMPLETED).order_by(
                  IMSUpload.year.desc(), IMSUpload.month.desc(), IMSUpload.week_number.desc(),
                  IMSUpload.completed_at.desc(), IMSUpload.id.desc(),
              ).first()
              print('LATEST', latest.id, latest.year, latest.month, latest.week_number, latest.status)
              print('STANDARD', IMSUploadLifecycleService.can_rollback(latest))
              print('FIRST_PERIOD', _first_period_rollback_permission(latest))
              path = IMSUploadLifecycleService.upload_snapshot_path(latest.id)
              print('SNAPSHOT_EXISTS', path.is_file(), path)
              if path.is_file():
                  payload = json.loads(path.read_text(encoding='utf-8'))
                  print('SNAPSHOT_META', {
                      'version': payload.get('version'),
                      'source_upload_id': payload.get('source_upload_id'),
                      'sealed_upload_id': payload.get('sealed_upload_id'),
                      'year': payload.get('year'),
                      'month': payload.get('month'),
                      'dashboard_production_upload_id': payload.get('dashboard_production_upload_id'),
                      'master_before': bool(payload.get('master_before')),
                      'master_after': bool(payload.get('master_after')),
                  })
                  current = IMSUploadLifecycleService._master_state()
                  for key in ('representatives', 'products'):
                      before = by_id((payload.get('master_before') or {}).get(key) or [])
                      now = by_id(current.get(key) or [])
                      added = sorted(set(now) - set(before))
                      removed = sorted(set(before) - set(now))
                      changed = {}
                      for row_id in sorted(set(before) & set(now)):
                          fields = sorted(name for name in set(before[row_id]) | set(now[row_id]) if before[row_id].get(name) != now[row_id].get(name))
                          if fields:
                              changed[row_id] = fields
                      print('MASTER_DIFF', key, {'added': added, 'removed': removed, 'changed': changed})
          PY
          REMOTE
