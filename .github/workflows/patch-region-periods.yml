name: Patch region rolling periods
on:
  push:
    branches: [fix/region-rolling-period-kpis]
    paths: [.github/workflows/patch-region-periods.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/region-rolling-period-kpis
      - name: Patch region period semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/services/region_performance_service.py')
          s = path.read_text(encoding='utf-8')
          old = '''    def period_months(self, length):
        if length is None:
            return [(self.year, month) for month in range(1, self.month + 1)]
        return [self.shift_month(self.year, self.month, delta) for delta in range(-(length - 1), 1)]
'''
          new = '''    def _latest_completed_period(self):
        row = db.session.query(IMSUpload.year, IMSUpload.month).filter(
            IMSUpload.status == "COMPLETED",
            IMSUpload.year == self.year,
        ).order_by(
            IMSUpload.month.desc(), IMSUpload.week_number.desc(),
            IMSUpload.completed_at.desc(), IMSUpload.id.desc(),
        ).first()
        return (int(row[0]), int(row[1])) if row else (self.year, self.month)

    def period_months(self, length):
        # Monthly follows the month explicitly selected in the page. Rolling
        # 3/6-month and YTD views follow the latest completed IMS period in the
        # selected year so historical-month inspection does not freeze the
        # cumulative KPI/product tables on that single month.
        if length == 1:
            return [(self.year, self.month)]
        anchor_year, anchor_month = self._latest_completed_period()
        if length is None:
            return [(anchor_year, month) for month in range(1, anchor_month + 1)]
        return [self.shift_month(anchor_year, anchor_month, delta) for delta in range(-(length - 1), 1)]
'''
          if old not in s:
              raise SystemExit('period_months block not found')
          path.write_text(s.replace(old, new), encoding='utf-8')

          tpath = Path('tests/test_region_read_v2.py')
          t = tpath.read_text(encoding='utf-8')
          addition = '''\n\ndef test_region_rolling_periods_use_latest_completed_ims_while_monthly_keeps_selection(monkeypatch):\n    from app.services.region_performance_service import RegionPerformanceService\n\n    service = object.__new__(RegionPerformanceService)\n    service.year = 2026\n    service.month = 1\n    monkeypatch.setattr(service, "_latest_completed_period", lambda: (2026, 2))\n\n    assert service.period_months(1) == [(2026, 1)]\n    assert service.period_months(3) == [(2025, 12), (2026, 1), (2026, 2)]\n    assert service.period_months(6) == [(2025, 9), (2025, 10), (2025, 11), (2025, 12), (2026, 1), (2026, 2)]\n    assert service.period_months(None) == [(2026, 1), (2026, 2)]\n'''
          if 'test_region_rolling_periods_use_latest_completed_ims_while_monthly_keeps_selection' not in t:
              t += addition
          tpath.write_text(t, encoding='utf-8')
          PY
          rm .github/workflows/patch-region-periods.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix rolling region KPI periods'
          git push origin HEAD:fix/region-rolling-period-kpis
