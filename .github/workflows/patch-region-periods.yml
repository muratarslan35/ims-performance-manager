name: Patch region rolling periods
"on":
  push:
    branches:
      - fix/region-rolling-period-kpis
    paths:
      - .github/workflows/patch-region-periods.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/region-rolling-period-kpis
      - name: Patch region period semantics
        run: |
          echo '' | base64 -d | python
          rm .github/workflows/patch-region-periods.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix rolling region KPI periods'
          git push origin HEAD:fix/region-rolling-period-kpis
