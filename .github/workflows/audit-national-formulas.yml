name: Audit national and region formulas

on:
  push:
    branches:
      - audit/fentivag-monural-prod
    paths:
      - .github/workflows/audit-national-formulas.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Inspect source formulas
        run: |
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          venv/bin/python - <<'PY'
          from openpyxl import load_workbook
          from app.services.alias_service import AliasService
          import re
          p='uploads/Tayfun-1_3.Hafta_Ocak_Brick_Analizi_.xlsx'
          wbv=load_workbook(p,data_only=True,read_only=False)
          wbf=load_workbook(p,data_only=False,read_only=False)
          def n(v): return AliasService.normalize(v)
          def rc(v):
              m=re.match(r'^(\d{3})\b',n(v)); return m.group(1) if m else ''
          for sname in ['BAKİYE','TTS HAFTALIK ÇIKIŞLARI']:
              v=wbv[sname]; f=wbf[sname]
              print('===SHEET|'+sname+'===')
              for r in range(1,v.max_row+1):
                  loc=v.cell(r,1).value; rep=v.cell(r,2).value
                  rn=n(rep); ln=n(loc)
                  if rn=='NATIONAL' or (rn and rn==ln and rc(loc)):
                      print(f'AGGROW|{r}|LOC={loc}|REP={rep}')
                      entries=[]
                      for c in range(1,min(v.max_column,70)+1):
                          val=v.cell(r,c).value; form=f.cell(r,c).value
                          if isinstance(form,str) and form.startswith('='):
                              entries.append(f'{f.cell(r,c).coordinate}:{form}=>{val}')
                      print('FORMULAS|'+' || '.join(entries[:40]))
              # print rows around every aggregate to see included personnel boundaries
              print('ROWMAP')
              for r in range(1,v.max_row+1):
                  loc=v.cell(r,1).value; rep=v.cell(r,2).value
                  if loc or rep:
                      print(f'ROW|{r}|LOC={loc}|REP={rep}')
          wbv.close(); wbf.close()
          PY
          REMOTE
