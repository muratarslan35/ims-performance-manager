name: Patch official aggregate and unit sources

on:
  push:
    branches:
      - fix/ims-official-aggregate-units
    paths:
      - .github/workflows/patch-official-aggregate-units.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ims-official-aggregate-units
      - name: Wire official aggregates and exact target import
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/services/ims_import_service.py')
          s = p.read_text(encoding='utf-8')
          import_anchor = 'from app.services.target_box_calculation_service import TargetBoxCalculationService\n'
          import_line = 'from app.services.official_aggregate_service import persist_official_aggregates\n'
          if import_line not in s:
              if import_anchor not in s:
                  raise SystemExit('IMS import anchor missing')
              s = s.replace(import_anchor, import_anchor + import_line, 1)
          call_anchor = '        self.apply_weekly_sales_summary(year, month)\n        self.persist_national_dashboard_metrics(year, month)\n'
          call_new = '        self.apply_weekly_sales_summary(year, month)\n        persist_official_aggregates(self, year, month)\n        self.persist_national_dashboard_metrics(year, month)\n'
          if 'persist_official_aggregates(self, year, month)' not in s:
              if call_anchor not in s:
                  raise SystemExit('IMS process anchor missing')
              s = s.replace(call_anchor, call_new, 1)
          p.write_text(s, encoding='utf-8')

          t = Path('app/services/target_import_service.py')
          x = t.read_text(encoding='utf-8')
          x = x.replace('from app.models import (\n    Target,\n)', 'from app.models import (\n    Representative,\n    Target,\n)', 1)
          x = x.replace('        unit_target = float(round(unit_target or 0))', '        unit_target = float(unit_target or 0)', 1)
          vacancy_anchor = '        tokens = normalized.split()\n        if any(token in self.REPRESENTATIVE_NOISE_TOKENS for token in tokens):\n'
          vacancy_new = '        tokens = normalized.split()\n        if any(token in {"BOS", "KADRO"} for token in tokens) and len(tokens) >= 2:\n            return True\n        if any(token in self.REPRESENTATIVE_NOISE_TOKENS for token in tokens):\n'
          if vacancy_anchor in x:
              x = x.replace(vacancy_anchor, vacancy_new, 1)
          resolve_old = '            res = AliasService.find_representative(representative_name)\n            self._representative_match_cache[normalized] = res\n'
          resolve_new = '            res = AliasService.find_representative(representative_name)\n            if not res["matched"] and any(token in {"BOS", "KADRO"} for token in normalized.split()):\n                matches = [rep for rep in Representative.query.all() if AliasService.normalize(rep.rep_name) == normalized]\n                if len(matches) == 1:\n                    res = {"matched": True, "object": matches[0], "method": "VACANCY_EXACT"}\n            self._representative_match_cache[normalized] = res\n'
          if resolve_old not in x:
              raise SystemExit('Target representative resolver anchor missing')
          x = x.replace(resolve_old, resolve_new, 1)
          t.write_text(x, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/services/ims_import_service.py app/services/target_import_service.py
          git commit -m "fix: wire official aggregates and exact target units"
          git push origin HEAD:fix/ims-official-aggregate-units
