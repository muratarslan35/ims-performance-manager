name: Patch official aggregate and unit sources

on:
  push:
    branches:
      - fix/ims-official-aggregate-units
    paths:
      - .github/workflows/patch-official-aggregate-units.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ims-official-aggregate-units
      - name: Patch source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/services/ims_import_service.py')
          s=p.read_text()
          old='''                if balance_tl is not None and balance_unit not in (None, 0):\n                    # BAKİYE's MF'siz kutu block carries the representative /\n                    # product-specific net unit factor.  It is the source\n                    # used by the workbook's own remaining-box calculation.\n                    net_unit_price = balance_tl / balance_unit\n                    if net_unit_price > 0:\n                        target.unit_target = float(round(target.tl_target / net_unit_price))\n'''
          new='''                if balance_tl is not None and balance_unit not in (None, 0):\n                    # BAKİYE's TL/KUTU bakiye ratio is the workbook's exact\n                    # representative/product net unit factor. Preserve the\n                    # resulting authoritative unit target without rounding.\n                    net_unit_price = balance_tl / balance_unit\n                    if net_unit_price > 0:\n                        target.unit_target = float(target.tl_target / net_unit_price)\n'''
          assert old in s
          s=s.replace(old,new,1)
          old2='''                derived_unit_actual = None\n                if target is not None and target.unit_target and target.tl_target:\n                    net_unit_price = target.tl_target / target.unit_target\n                    if net_unit_price > 0 and "tl" in metrics:\n                        derived_unit_actual = metrics["tl"] / net_unit_price\n                if derived_unit_actual is not None:\n                    summary.unit = derived_unit_actual\n                    target.unit_realization = derived_unit_actual\n                elif "unit" in metrics:\n                    summary.unit = metrics["unit"]\n                    if target is not None:\n                        target.unit_realization = metrics["unit"]\n'''
          new2='''                # KUTU ÇIKIŞI is an explicit source metric in the TTS weekly\n                # workbook. Never re-derive it from TL or a price factor; zero\n                # is also a valid real source value (for example Fentivag).\n                if "unit" in metrics:\n                    summary.unit = metrics["unit"]\n                    if target is not None:\n                        target.unit_realization = metrics["unit"]\n'''
          assert old2 in s
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/services/ims_import_service.py
          git commit -m "fix: preserve source box targets and weekly units"
          git push origin HEAD:fix/ims-official-aggregate-units
