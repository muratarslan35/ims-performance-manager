name: Patch official aggregate and unit sources

on:
  push:
    branches:
      - fix/ims-official-aggregate-units
    paths:
      - .github/workflows/patch-official-aggregate-units.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ims-official-aggregate-units
      - name: Patch exact unit sources
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/services/ims_import_service.py')
          s = p.read_text(encoding='utf-8')
          old = "                    if net_unit_price > 0:\n                        target.unit_target = float(round(target.tl_target / net_unit_price))"
          new = "                    if net_unit_price > 0:\n                        target.unit_target = float(target.tl_target / net_unit_price)"
          if old not in s:
              raise SystemExit('unit target rounding block not found')
          s = s.replace(old, new, 1)
          start = s.index('                derived_unit_actual = None')
          end_marker = '                if target is not None:\n                    target.realization_percent'
          end = s.index(end_marker, start)
          replacement = "                # KUTU CIKISI is an explicit workbook source metric. Never derive it from TL.\n                if \"unit\" in metrics:\n                    summary.unit = metrics[\"unit\"]\n                    if target is not None:\n                        target.unit_realization = metrics[\"unit\"]\n"
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/services/ims_import_service.py
          git commit -m "fix: preserve exact workbook unit sources"
          git push origin HEAD:fix/ims-official-aggregate-units
