name: Patch official aggregate and unit sources

on:
  push:
    branches:
      - fix/ims-official-aggregate-units
    paths:
      - .github/workflows/patch-official-aggregate-units.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ims-official-aggregate-units
      - name: Apply official KPI patch
        run: |
          python tools/patch_official_aggregate_kpis.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/query/dashboard_query.py app/services/region_performance_service.py
          git commit -m "fix: use official national and region aggregate KPIs"
          git push origin HEAD:fix/ims-official-aggregate-units
