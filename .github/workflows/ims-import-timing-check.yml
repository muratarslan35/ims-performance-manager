name: IMS Import Timing Check

on:
  push:
    branches:
      - test/week7-post270-isolated-benchmark

permissions:
  contents: read

jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Read latest completed IMS job timing
        shell: bash
        run: |
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          venv/bin/python - <<'PY'
          import json, sqlite3
          db='instance/ipm.db'
          con=sqlite3.connect(f'file:{db}?mode=ro', uri=True, timeout=30)
          con.row_factory=sqlite3.Row
          try:
              row=con.execute('''
                  SELECT id,status,file_name,year,month,queued_at,started_at,completed_at,result_summary,ims_upload_id
                  FROM ims_import_jobs
                  WHERE status='COMPLETED'
                  ORDER BY completed_at DESC, id DESC
                  LIMIT 1
              ''').fetchone()
              if row is None:
                  raise SystemExit('No completed IMS import job found')
              payload=dict(row)
              stats={}
              if payload.get('result_summary'):
                  try: stats=json.loads(payload['result_summary'])
                  except Exception: stats={}
              payload['background_job_seconds']=stats.get('background_job_seconds')
              payload['processing_time']=stats.get('processing_time')
              payload['competition_execution_time']=stats.get('competition_execution_time')
              payload['stage_telemetry']=stats.get('stage_telemetry')
              payload.pop('result_summary',None)
              print('IMS_IMPORT_TIMING|'+json.dumps(payload,ensure_ascii=False,default=str,sort_keys=True))
          finally:
              con.close()
          PY
          REMOTE
