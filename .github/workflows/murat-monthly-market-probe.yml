name: Murat Monthly Market Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/murat-monthly-market-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Probe live comparison refresh
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_SHA|$(git rev-parse HEAD)"
          echo "WORKER|$(sudo systemctl is-active ims-import-worker.service)"
          echo "REFRESH_QUEUE_BEGIN"
          find instance/representative_refresh_queue -maxdepth 1 -type f -name '*.json' -print -exec cat {} \; 2>/dev/null || true
          echo "REFRESH_QUEUE_END"
          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          import json
          import sqlalchemy as sa
          from app import create_app
          from app.models import Representative
          from app.services.period_service import PeriodService
          from app.services.persistent_representative_snapshot_service import (
              PersistentRepresentativeSnapshotService,
              representative_snapshot_sets,
              representative_snapshots,
          )
          from app.extensions import db

          app=create_app()
          with app.app_context():
              period=PeriodService.get_active_period()
              year,month=int(period["year"]),int(period["month"])
              rep=Representative.query.filter(sa.func.upper(Representative.rep_name)=="MURAT ARSLAN").first()
              print(f"PERIOD|{year}-{month:02d}|rep={rep.id if rep else 0}")
              rows=db.session.execute(
                  sa.select(
                      representative_snapshot_sets.c.id,
                      representative_snapshot_sets.c.status,
                      representative_snapshot_sets.c.source_upload_id,
                      representative_snapshot_sets.c.production_upload_id,
                      representative_snapshot_sets.c.representative_count,
                      representative_snapshot_sets.c.created_at,
                      representative_snapshot_sets.c.activated_at,
                  ).where(
                      representative_snapshot_sets.c.year==year,
                      representative_snapshot_sets.c.month==month,
                  ).order_by(representative_snapshot_sets.c.id.desc()).limit(6)
              ).all()
              for row in rows:
                  count=int(db.session.execute(
                      sa.select(sa.func.count()).select_from(representative_snapshots).where(
                          representative_snapshots.c.set_id==int(row.id)
                      )
                  ).scalar() or 0)
                  print(f"SET|id={row.id}|status={row.status}|count={count}|declared={row.representative_count}|ims={row.source_upload_id}|prod={row.production_upload_id}|created={row.created_at}|activated={row.activated_at}")
              if rep:
                  ws=PersistentRepresentativeSnapshotService.get_active(rep.id,year,month) or {}
                  print(f"VISIBLE_VERSION|{int(ws.get('read_model_version') or 0)}")
                  market=((((ws.get("snapshots") or {}).get("monthly") or {}).get("market_analysis")) or {})
                  for r in market.get("comparison_rows") or []:
                      p=r.get("product") or {}
                      name=p.get("product_name") if isinstance(p,dict) else str(r.get("product_id"))
                      print(
                          f"ROW|{name}|prev={r.get('previous_actual_unit')}|cur={r.get('actual_unit')}|"
                          f"delta={r.get('actual_change_unit')}|pct={r.get('actual_change_percent')}|"
                          f"prev_comp={r.get('previous_competitor_unit')}|cur_comp={r.get('competitor_unit')}|"
                          f"comp_delta={r.get('competitor_change_unit')}|source={r.get('source')}|"
                          f"prev_source={r.get('previous_source')}"
                      )
          PY
          echo "WORKER_JOURNAL_BEGIN"
          sudo journalctl -u ims-import-worker.service --since "10 minutes ago" --no-pager | tail -n 120 || true
          echo "WORKER_JOURNAL_END"
          REMOTE
