name: Patch January repair competition fingerprint

on:
  push:
    branches: [fix/january-repair-competition-fingerprint]
    paths: [.github/workflows/patch-january-repair-fingerprint.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/january-repair-competition-fingerprint
      - name: Fix CompetitionData fingerprint field
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('repair_january_ims_actuals.py')
          s = p.read_text()
          if 'row.sheet_type' not in s:
              raise SystemExit('sheet_type reference not found')
          p.write_text(s.replace('row.sheet_type', 'row.period_type', 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repair_january_ims_actuals.py
          git commit -m "fix: use CompetitionData period_type in January repair fingerprint"
          git push origin HEAD:fix/january-repair-competition-fingerprint
