name: Validated Week 8 Balance Unit Repair V3
on:
  push:
    branches: [diag/week8-balance-unit-repair-v3]
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify source
        run: |
          python - <<'PY'
          import base64,json,zlib,pathlib,hashlib
          parts=[]
          for path in sorted(pathlib.Path('scripts/week8_balance_chunks').glob('*.txt')):
              parts.append(path.read_text(encoding='utf-8').strip())
          assert len(parts)==10, len(parts)
          encoded=''.join(parts)
          assert len(encoded)==14940, len(encoded)
          raw=zlib.decompress(base64.b64decode(encoded))
          payload=json.loads(raw)
          pairs=sum(sum(v is not None for v in row['balance_units'].values()) for row in payload['rows'])
          murat=[row for row in payload['rows'] if row['representative']=='MURAT ARSLAN']
          assert (payload['year'],payload['month'],payload['week'])==(2026,2,8)
          assert len(payload['rows'])==113
          assert pairs==791
          assert len(murat)==1
          assert round(float(murat[0]['balance_units']['TRAVAZOL']))==612
          pathlib.Path('/tmp/week8_balance_unit_repair_data.json').write_bytes(raw)
          print('SOURCE_OK|rows=113|pairs=791|encoded_sha256='+hashlib.sha256(encoded.encode()).hexdigest()+'|murat_balance='+str(murat[0]['balance_units']['TRAVAZOL']))
          PY
      - name: Configure SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Copy verified repair inputs
        run: |
          scp -o ServerAliveInterval=15 -o ServerAliveCountMax=40 -i ~/.ssh/k -P "$IMS_PORT" \
            /tmp/week8_balance_unit_repair_data.json scripts/repair_week8_balance_units.py \
            "$IMS_USER@$IMS_HOST:/tmp/"
      - name: Execute guarded repair
        run: |
          ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=80 -i ~/.ssh/k -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          venv/bin/python -u /tmp/repair_week8_balance_units.py instance/ipm.db /tmp/week8_balance_unit_repair_data.json
          rm -f /tmp/repair_week8_balance_units.py /tmp/week8_balance_unit_repair_data.json
          REMOTE
