name: Week 32 UI publication fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-stale-week32-maintenance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Finish Week 32 durable snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Finish snapshots and verify live Week 32
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=40 \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          test -z "$(git status --porcelain)"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          export PYTHONPATH="$IMS_PATH${PYTHONPATH:+:$PYTHONPATH}"
          export PYTHONUNBUFFERED=1
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"

          # The business import has already completed. Never re-import just because
          # the asynchronous representative snapshot generation did not raise the
          # publication flag. Wait briefly if an import is still finishing.
          for poll in $(seq 1 60); do
            state=$(venv/bin/python - <<'PY'
          from app import create_app
          from app.models import IMSImportJob, IMSUpload
          from config import Config
          app=create_app(Config)
          with app.app_context():
              upload=(IMSUpload.query.filter_by(year=2026,month=8,week_number=32)
                      .order_by(IMSUpload.id.desc()).first())
              job=(IMSImportJob.query.filter_by(ims_upload_id=upload.id)
                   .order_by(IMSImportJob.id.desc()).first()) if upload else None
              print(job.status if job else 'MISSING')
          PY
          )
            echo "WEEK32_IMPORT_STATE|poll=$poll|state=$state"
            if [ "$state" = COMPLETED ]; then break; fi
            if [ "$state" = FAILED ] || [ "$state" = MISSING ]; then exit 1; fi
            if [ "$poll" = 60 ]; then exit 1; fi
            sleep 10
          done

          # No active business import may be interrupted. Once it is zero, stop the
          # old snapshot continuation and rebuild only the durable rep read model.
          active=$(venv/bin/python - <<'PY'
          from app import create_app
          from app.models import IMSImportJob
          from config import Config
          app=create_app(Config)
          with app.app_context():
              print(IMSImportJob.query.filter(
                  IMSImportJob.status.in_((IMSImportJob.STATUS_QUEUED, IMSImportJob.STATUS_PROCESSING))
              ).count())
          PY
          )
          echo "ACTIVE_IMPORTS|$active"
          test "$active" = 0
          sudo systemctl restart ims-import-worker.service
          test "$(sudo systemctl is-active ims-import-worker.service)" = active

          venv/bin/python -u - <<'PY'
          import sqlalchemy as sa
          from datetime import datetime
          from app import create_app
          from app.extensions import db
          from app.models import IMSUpload, Representative
          from app.services.persistent_representative_snapshot_service import (
              PersistentRepresentativeSnapshotService,
              representative_snapshot_sets,
          )
          from config import Config

          app=create_app(Config)
          with app.app_context():
              upload=(IMSUpload.query.filter_by(year=2026,month=8,week_number=32,status='COMPLETED')
                      .order_by(IMSUpload.id.desc()).first())
              assert upload
              ims_id, production_id = PersistentRepresentativeSnapshotService.source_identity(2026,8)
              assert ims_id == upload.id
              ids=PersistentRepresentativeSnapshotService.representative_ids(2026,8,ims_id)
              assert len(ids) == 113, len(ids)

              # Any BUILDING generation at this point belonged to the stopped
              # continuation above. Mark only that exact current-source generation
              # failed, then build one clean atomic ACTIVE generation.
              db.session.execute(
                  representative_snapshot_sets.update().where(
                      representative_snapshot_sets.c.year == 2026,
                      representative_snapshot_sets.c.month == 8,
                      representative_snapshot_sets.c.source_upload_id == ims_id,
                      representative_snapshot_sets.c.production_upload_id == production_id,
                      representative_snapshot_sets.c.status == PersistentRepresentativeSnapshotService.STATUS_BUILDING,
                  ).values(status=PersistentRepresentativeSnapshotService.STATUS_FAILED)
              )
              db.session.commit()

              result=PersistentRepresentativeSnapshotService.build_for_period(2026,8,force=True)
              assert result.get('status') == 'ACTIVE', result
              assert int(result.get('representatives') or 0) == 113, result

              murat=Representative.query.filter(db.func.upper(Representative.rep_name)=='MURAT ARSLAN').first()
              assert murat is not None
              snap=PersistentRepresentativeSnapshotService.get_active(murat.id,2026,8)
              assert isinstance(snap,dict) and snap
              print(f"REPRESENTATIVE_READ_MODEL|PASS|set={result.get('set_id')}|representatives=113|murat_snapshot=1")
          PY

          # Verify the dashboard/region read models already published by the prior
          # finalizer, and the exact single-source market controls, before exposing.
          venv/bin/python - <<'PY'
          import json
          from app import create_app
          from app.extensions import db
          from app.models import CompetitionData, IMSImportJob, IMSUpload, Representative
          from app.services.kpi_market_single_source import AUTHORITY_PREFIX
          from app.services.market_analysis_service import MarketAnalysisService
          from app.services.persistent_dashboard_snapshot_service import PersistentDashboardSnapshotService
          from app.services.persistent_region_snapshot_service import PersistentRegionSnapshotService
          from app.services.persistent_representative_snapshot_service import PersistentRepresentativeSnapshotService
          from app.services.representative_market_service import RepresentativeMarketService
          from config import Config

          def close(a,b,tol=0.01):
              return abs(float(a or 0)-float(b or 0)) <= tol

          app=create_app(Config)
          with app.app_context():
              upload=IMSUpload.query.filter_by(year=2026,month=8,week_number=32,status='COMPLETED').order_by(IMSUpload.id.desc()).first()
              assert upload

              dashboard=PersistentDashboardSnapshotService.get_active(2026,8) or {}
              executive=dashboard.get('executive_metrics') or {}
              assert float(executive.get('target_tl') or 0) > 0
              assert float(executive.get('actual_tl') or 0) > 0
              assert float(executive.get('unit_target') or 0) > 0
              assert float(executive.get('unit_actual') or 0) > 0
              assert len(executive.get('products') or []) == 7

              authority_count=CompetitionData.query.filter(
                  CompetitionData.upload_id==upload.id,
                  CompetitionData.sheet_name.like(f'{AUTHORITY_PREFIX}%'),
              ).count()
              assert authority_count==168, authority_count

              national=MarketAnalysisService(2026,8).build()
              assert national.get('metric_mode')=='UNIT'
              assert len(national.get('groups') or [])==7
              assert close(national.get('company_total_unit'),314214)
              assert close(national.get('market_total_unit'),927617)
              assert close(national.get('competitor_total_unit'),613403)
              for row in national['groups']:
                  assert close(row['company_sales_unit']+row['competitor_sales_unit'],row['market_sales_unit'])
                  assert 0 <= float(row.get('company_share_percent') or 0) <= 100

              regions=PersistentRegionSnapshotService.get_active_all(2026,8)
              assert len(regions)==11, len(regions)
              istanbul=None
              for region_key,snapshot in regions.items():
                  market=snapshot.get('market_analysis') or {}
                  rows=market.get('rows') or []
                  totals=market.get('totals') or {}
                  assert len(rows)==7, (region_key,len(rows))
                  for row in rows:
                      assert close(row['company_unit']+row['competitor_unit'],row['market_unit']), (region_key,row)
                  assert close(totals.get('company_unit')+totals.get('competitor_unit'),totals.get('market_unit')), (region_key,totals)
                  if str(region_key).startswith('101'):
                      istanbul=totals
              assert istanbul is not None
              assert close(istanbul.get('company_unit'),52024), istanbul
              assert close(istanbul.get('market_unit'),137771), istanbul
              assert close(istanbul.get('competitor_unit'),85747), istanbul

              murat=Representative.query.filter(db.func.upper(Representative.rep_name)=='MURAT ARSLAN').first()
              assert murat is not None
              rep=RepresentativeMarketService(murat,2026,8).build()
              assert len(rep.get('rows') or [])==7
              for row in rep['rows']:
                  assert close(row['actual_unit']+row['competitor_unit'],row['market_unit']), row
              totals=rep.get('totals') or {}
              assert close(totals.get('actual_unit')+totals.get('competitor_unit'),totals.get('market_unit')), totals

              job=(IMSImportJob.query.filter_by(ims_upload_id=upload.id)
                   .order_by(IMSImportJob.id.desc()).first())
              assert job and job.status == IMSImportJob.STATUS_COMPLETED
              try:
                  summary=json.loads(job.result_summary or '{}')
              except Exception:
                  summary={}
              summary['publication_ready']=True
              summary['publication_ready_source']='verified_single_source_snapshots'
              job.result_summary=json.dumps(summary,ensure_ascii=False)
              db.session.commit()

              print('KPI_SINGLE_SOURCE_ACCEPTANCE|PASS'
                    f"|authority_rows={authority_count}"
                    f"|national_company={national['company_total_unit']:.2f}"
                    f"|national_market={national['market_total_unit']:.2f}"
                    f"|national_competitor={national['competitor_total_unit']:.2f}"
                    f"|istanbul_company={float(istanbul['company_unit']):.2f}"
                    f"|istanbul_market={float(istanbul['market_unit']):.2f}"
                    f"|regions={len(regions)}|murat_rows={len(rep['rows'])}"
                    '|publication_ready=1')
          PY

          sudo systemctl restart ims-performance-manager.service
          test "$(sudo systemctl is-active ims-performance-manager.service)" = active
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 4 http://127.0.0.1:8000/login >/dev/null; then
              echo 'HTTP_HEALTH|PASS'
              break
            fi
            if [ "$attempt" = 20 ]; then exit 1; fi
            sleep 2
          done

          venv/bin/python verify_live_ims_gate.py
          echo 'WEEK32_FINAL_PUBLICATION|PASS'
          REMOTE
