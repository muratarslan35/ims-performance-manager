name: Release stale Week 32 maintenance lock

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-stale-week32-maintenance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Release completed orphan maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Release orphaned read-only maintenance process
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -i ~/.ssh/ims_deploy_key \
            -p "$IMS_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=6 \
            "$IMS_USER@$IMS_HOST" \
            "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          job_dir=/tmp/ims-maintenance-34694468499-1
          status=$(cat "$job_dir/status" 2>/dev/null || echo MISSING)
          echo "ORPHAN_STATUS|$status"

          # This is the detached maintenance left behind after Actions run
          # 34694468499 was cancelled. Only stop it after its mutating/retention
          # work has already completed successfully; the remaining long stage is
          # read-only verification and must not block the Week 32 import.
          if [ "$status" = RUNNING ]; then
            evidence="$job_dir/evidence.log"
            test -f "$evidence"
            grep -q '^DB_CAPACITY|' "$evidence"
            grep -q '"blocking": \[\]' "$evidence"
            grep -q '^BACKUP_RETENTION|' "$evidence"
            grep -q '"result": "PASS"' "$evidence"
            grep -q '^STORAGE_AFTER' "$evidence"

            pids=$(pgrep -f "scripts/run_production_maintenance.sh .*${job_dir}" || true)
            if [ -n "$pids" ]; then
              echo "ORPHAN_MAINTENANCE_TERMINATING|pids=$(echo "$pids" | tr '\n' ',')"
              for pid in $pids; do
                pkill -TERM -P "$pid" 2>/dev/null || true
                kill -TERM "$pid" 2>/dev/null || true
              done
              sleep 5
              for pid in $pids; do
                pkill -KILL -P "$pid" 2>/dev/null || true
                kill -KILL "$pid" 2>/dev/null || true
              done
            fi
          fi

          # Do not race the waiting importer for the lock. Once the orphan is
          # gone, the already-running Week 32 workflow will acquire it itself.
          sleep 2
          remaining=$(pgrep -f "scripts/run_production_maintenance.sh .*${job_dir}" || true)
          test -z "$remaining"
          echo 'ORPHAN_MAINTENANCE_RELEASED|PASS'
          REMOTE
