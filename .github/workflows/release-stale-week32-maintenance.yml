name: Week 32 UI publication fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-stale-week32-maintenance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Diagnose Week 32 final acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Read final Week 32 state
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          export PYTHONPATH="$IMS_PATH${PYTHONPATH:+:$PYTHONPATH}"
          export PYTHONUNBUFFERED=1
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"

          venv/bin/python -u - <<'PY'
          import json
          import sqlalchemy as sa
          from app import create_app
          from app.extensions import db
          from app.models import CompetitionData, IMSImportJob, IMSUpload, Representative
          from app.services.kpi_market_single_source import AUTHORITY_PREFIX
          from app.services.market_analysis_service import MarketAnalysisService
          from app.services.persistent_dashboard_snapshot_service import PersistentDashboardSnapshotService
          from app.services.persistent_region_snapshot_service import PersistentRegionSnapshotService
          from app.services.persistent_representative_snapshot_service import PersistentRepresentativeSnapshotService, representative_snapshot_sets, representative_snapshots
          from config import Config

          app=create_app(Config)
          with app.app_context():
              upload=IMSUpload.query.filter_by(year=2026,month=8,week_number=32).order_by(IMSUpload.id.desc()).first()
              print(f'UPLOAD|id={getattr(upload,"id",None)}|status={getattr(upload,"status",None)}')
              job=(IMSImportJob.query.filter_by(ims_upload_id=upload.id).order_by(IMSImportJob.id.desc()).first()) if upload else None
              print(f'JOB|id={getattr(job,"id",None)}|status={getattr(job,"status",None)}|summary={getattr(job,"result_summary",None)}')
              active=IMSImportJob.query.filter(IMSImportJob.status.in_((IMSImportJob.STATUS_QUEUED,IMSImportJob.STATUS_PROCESSING))).count()
              print(f'ACTIVE_IMPORTS|{active}')

              authority_count=CompetitionData.query.filter(CompetitionData.upload_id==upload.id,CompetitionData.sheet_name.like(f'{AUTHORITY_PREFIX}%')).count() if upload else -1
              print(f'AUTHORITY_ROWS|{authority_count}')

              dashboard=PersistentDashboardSnapshotService.get_active(2026,8) or {}
              executive=dashboard.get('executive_metrics') or {}
              print('DASHBOARD|target_tl=%s|actual_tl=%s|unit_target=%s|unit_actual=%s|products=%s' % (
                  executive.get('target_tl'),executive.get('actual_tl'),executive.get('unit_target'),executive.get('unit_actual'),len(executive.get('products') or [])))

              national=MarketAnalysisService(2026,8).build()
              print('NATIONAL|mode=%s|groups=%s|company=%s|competitor=%s|market=%s|share=%s' % (
                  national.get('metric_mode'),len(national.get('groups') or []),national.get('company_total_unit'),national.get('competitor_total_unit'),national.get('market_total_unit'),national.get('company_share_percent')))
              for row in national.get('groups') or []:
                  print('NATIONAL_ROW|%s|company=%s|competitor=%s|market=%s|ok=%s' % (
                      row.get('group_name') or row.get('product_name'),row.get('company_sales_unit'),row.get('competitor_sales_unit'),row.get('market_sales_unit'),
                      abs(float(row.get('company_sales_unit') or 0)+float(row.get('competitor_sales_unit') or 0)-float(row.get('market_sales_unit') or 0))<0.01))

              regions=PersistentRegionSnapshotService.get_active_all(2026,8)
              print(f'REGIONS|count={len(regions)}')
              for region_key,snapshot in regions.items():
                  market=snapshot.get('market_analysis') or {}
                  rr=market.get('rows') or []
                  tt=market.get('totals') or {}
                  ok_rows=all(abs(float(x.get('company_unit') or 0)+float(x.get('competitor_unit') or 0)-float(x.get('market_unit') or 0))<0.01 for x in rr)
                  ok_tot=abs(float(tt.get('company_unit') or 0)+float(tt.get('competitor_unit') or 0)-float(tt.get('market_unit') or 0))<0.01
                  print('REGION|%s|rows=%s|company=%s|competitor=%s|market=%s|rows_ok=%s|tot_ok=%s' % (region_key,len(rr),tt.get('company_unit'),tt.get('competitor_unit'),tt.get('market_unit'),ok_rows,ok_tot))

              ims_id,prod_id=PersistentRepresentativeSnapshotService.source_identity(2026,8)
              print(f'REP_SOURCE|ims={ims_id}|prod={prod_id}')
              sets=db.session.execute(sa.select(representative_snapshot_sets.c.id,representative_snapshot_sets.c.status,representative_snapshot_sets.c.representative_count).where(representative_snapshot_sets.c.year==2026,representative_snapshot_sets.c.month==8).order_by(representative_snapshot_sets.c.id.desc())).all()
              print('REP_SETS|'+json.dumps([list(x) for x in sets[:6]]))
              set_id=PersistentRepresentativeSnapshotService._visible_set_id(2026,8)
              cnt=db.session.execute(sa.select(sa.func.count()).select_from(representative_snapshots).where(representative_snapshots.c.set_id==set_id)).scalar() if set_id else 0
              print(f'REP_VISIBLE|set={set_id}|rows={cnt}')
              murat=Representative.query.filter(db.func.upper(Representative.rep_name)=='MURAT ARSLAN').first()
              snap=PersistentRepresentativeSnapshotService.get_active(murat.id,2026,8) if murat else None
              monthly=(((snap or {}).get('snapshots') or {}).get('monthly') or {})
              mkt=monthly.get('market_analysis') or {}
              mt=mkt.get('totals') or {}
              print('MURAT|id=%s|rows=%s|actual=%s|competitor=%s|market=%s|ok=%s' % (
                  getattr(murat,'id',None),len(mkt.get('rows') or []),mt.get('actual_unit'),mt.get('competitor_unit'),mt.get('market_unit'),
                  abs(float(mt.get('actual_unit') or 0)+float(mt.get('competitor_unit') or 0)-float(mt.get('market_unit') or 0))<0.01))
              for row in mkt.get('rows') or []:
                  print('MURAT_ROW|%s|actual=%s|competitor=%s|market=%s|ok=%s' % (
                      ((row.get('product') or {}).get('product_name') if isinstance(row.get('product'),dict) else ''),row.get('actual_unit'),row.get('competitor_unit'),row.get('market_unit'),
                      abs(float(row.get('actual_unit') or 0)+float(row.get('competitor_unit') or 0)-float(row.get('market_unit') or 0))<0.01))
          PY

          if curl --fail --silent --show-error --max-time 4 http://127.0.0.1:8000/login >/dev/null; then echo 'HTTP_HEALTH|PASS'; else echo 'HTTP_HEALTH|FAIL'; fi
          venv/bin/python verify_live_ims_gate.py || echo 'LIVE_GATE|FAIL'
          REMOTE
