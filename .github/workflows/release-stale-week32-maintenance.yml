name: Week 32 live import status

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-stale-week32-maintenance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Read live Week 32 import state
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Read live import state
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          export PYTHONPATH="$IMS_PATH${PYTHONPATH:+:$PYTHONPATH}"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          venv/bin/python - <<'PY'
from app import create_app
from app.models import IMSImportJob, IMSUpload, IMSFact, IMSSummary, Target, IMSCompetitionData
from config import Config
app=create_app(Config)
with app.app_context():
    job=IMSImportJob.query.order_by(IMSImportJob.id.desc()).first()
    upload=IMSUpload.query.get(job.ims_upload_id) if job and job.ims_upload_id else None
    print('LATEST_JOB|id=%s|status=%s|upload=%s|error=%r|result=%r' % (
        getattr(job,'id',None), getattr(job,'status',None), getattr(job,'ims_upload_id',None),
        getattr(job,'error_message',None), getattr(job,'result_summary',None)))
    print('LATEST_UPLOAD|id=%s|status=%s|period=%s-%s-w%s|source=%s|facts=%s|summary=%s|error=%r' % (
        getattr(upload,'id',None), getattr(upload,'status',None), getattr(upload,'year',None),
        getattr(upload,'month',None), getattr(upload,'week_number',None), getattr(upload,'source_record_count',None),
        getattr(upload,'fact_record_count',None), getattr(upload,'summary_record_count',None), getattr(upload,'error_message',None)))
    if upload:
        uid=upload.id
        print('LIVE_COUNTS|targets=%s|facts=%s|summary=%s|competition=%s' % (
            Target.query.filter_by(year=upload.year, month=upload.month).count(),
            IMSFact.query.filter_by(upload_id=uid).count(),
            IMSSummary.query.filter_by(year=upload.year, month=upload.month).count(),
            IMSCompetitionData.query.filter_by(upload_id=uid).count()))
    active=IMSImportJob.query.filter(IMSImportJob.status.in_((IMSImportJob.STATUS_QUEUED, IMSImportJob.STATUS_PROCESSING))).count()
    print('ACTIVE_IMPORTS|%s' % active)
PY
          REMOTE
