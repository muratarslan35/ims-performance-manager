name: Week 32 live import status

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-stale-week32-maintenance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Read live Week 32 import state
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Read live import state
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          export PYTHONPATH="$IMS_PATH${PYTHONPATH:+:$PYTHONPATH}"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          venv/bin/python - <<'PY'
          import sqlite3
          c=sqlite3.connect('instance/ipm.db',timeout=30)
          c.execute('PRAGMA busy_timeout=30000')
          job=c.execute("SELECT id,status,ims_upload_id,error_message,result_summary FROM ims_import_jobs ORDER BY id DESC LIMIT 1").fetchone()
          upload=c.execute("SELECT id,status,year,month,week_number,source_record_count,fact_record_count,summary_record_count,error_message FROM ims_uploads ORDER BY id DESC LIMIT 1").fetchone()
          active=c.execute("SELECT COUNT(*) FROM ims_import_jobs WHERE status IN ('QUEUED','PROCESSING')").fetchone()[0]
          print('LATEST_JOB|%r' % (job,))
          print('LATEST_UPLOAD|%r' % (upload,))
          print('ACTIVE_IMPORTS|%s' % active)
          if upload:
              uid,_,year,month,*_=upload
              targets=c.execute('SELECT COUNT(*) FROM targets WHERE year=? AND month=?',(year,month)).fetchone()[0]
              facts=c.execute('SELECT COUNT(*) FROM ims_facts WHERE upload_id=?',(uid,)).fetchone()[0]
              summary=c.execute('SELECT COUNT(*) FROM ims_summary WHERE year=? AND month=?',(year,month)).fetchone()[0]
              competition=c.execute('SELECT COUNT(*) FROM ims_competition_data WHERE upload_id=?',(uid,)).fetchone()[0]
              print('LIVE_COUNTS|targets=%s|facts=%s|summary=%s|competition=%s' % (targets,facts,summary,competition))
          c.close()
          PY
          latest_job=$(venv/bin/python - <<'PY'
          import sqlite3
          c=sqlite3.connect('instance/ipm.db',timeout=30)
          row=c.execute('SELECT id FROM ims_import_jobs ORDER BY id DESC LIMIT 1').fetchone()
          print(row[0] if row else '')
          c.close()
          PY
          )
          if [ -n "$latest_job" ] && [ -f "instance/ims_progress/job-${latest_job}.json" ]; then
            printf 'PROGRESS|'
            cat "instance/ims_progress/job-${latest_job}.json"
            printf '\n'
          else
            echo 'PROGRESS|MISSING'
          fi
          venv/bin/python verify_live_ims_gate.py
          REMOTE
# probe refresh with live gate 2026-09-12
