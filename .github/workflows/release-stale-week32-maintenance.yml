name: Week 32 UI publication fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-stale-week32-maintenance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Audit archived KPI controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Inspect source aggregate rows
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          export PYTHONPATH="$IMS_PATH${PYTHONPATH:+:$PYTHONPATH}"
          venv/bin/python - <<'PY'
          import pandas as pd
          from sqlalchemy import desc
          from app import create_app
          from app.models import IMSUpload
          from app.services.alias_service import AliasService
          from app.services.ims_upload_lifecycle_service import IMSUploadLifecycleService
          from app.services.kpi_workbook_compat import is_product_kpi_sheet
          from config import Config

          def norm(v):
              if v is None or (isinstance(v,float) and pd.isna(v)): return ''
              return AliasService.normalize(v)

          app=create_app(Config)
          with app.app_context():
              upload=(IMSUpload.query.filter_by(year=2026,month=8,status='COMPLETED')
                      .order_by(desc(IMSUpload.week_number),desc(IMSUpload.completed_at),desc(IMSUpload.id)).first())
              assert upload and int(upload.week_number)==32
              source=IMSUploadLifecycleService.archived_source_for_upload(upload.id)
              assert source and source.is_file()
              print(f'SOURCE_ARCHIVE|upload={upload.id}|path={source}')
              workbook=pd.read_excel(source,sheet_name=None,header=None)
              for sheet_name,frame in workbook.items():
                  if not is_product_kpi_sheet(sheet_name): continue
                  header=next((r for r in range(min(15,len(frame))) if any(norm(v)=='PAZAR' for v in frame.iloc[r].tolist())),None)
                  if header is None: continue
                  labels=[norm(v) for v in frame.iloc[header].tolist()]
                  product=norm(sheet_name).removeprefix('2 KUTU ').removesuffix(' KPI')
                  product_cols=[i for i,v in enumerate(labels) if v.startswith(product)]
                  pazar_cols=[i for i,v in enumerate(labels) if v=='PAZAR']
                  rivals=[(i,labels[i]) for i in range(5,len(labels)) if labels[i] and i not in product_cols+pazar_cols and labels[i] not in {'PP','RANK'}]
                  for r in range(header+1,len(frame)):
                      territory=norm(frame.iloc[r,0]) if frame.shape[1]>0 else ''
                      province=norm(frame.iloc[r,1]) if frame.shape[1]>1 else ''
                      brick=norm(frame.iloc[r,2]) if frame.shape[1]>2 else ''
                      if brick=='NATIONAL' or 'SUBTOTAL' in brick or 'SUBTOTAL' in province:
                          own=pd.to_numeric(pd.Series([frame.iloc[r,product_cols[0]] if product_cols else None]),errors='coerce').fillna(0).iloc[0]
                          pazar=pd.to_numeric(pd.Series([frame.iloc[r,pazar_cols[0]] if pazar_cols else None]),errors='coerce').fillna(0).iloc[0]
                          rival_sum=0.0
                          for col,_name in rivals:
                              rival_sum += float(pd.to_numeric(pd.Series([frame.iloc[r,col]]),errors='coerce').fillna(0).iloc[0])
                          print(f'KPI_CONTROL|sheet={sheet_name}|territory={territory}|province={province}|brick={brick}|own={float(own):.2f}|rivals={rival_sum:.2f}|pazar={float(pazar):.2f}|own_plus_rivals={float(own)+rival_sum:.2f}')
          PY
          REMOTE
