name: Week 32 UI publication fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-stale-week32-maintenance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Finalize Week 32 single-source publication
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Rebuild only region read models and prove final acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=30 \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          export PYTHONPATH="$IMS_PATH${PYTHONPATH:+:$PYTHONPATH}"
          export PYTHONUNBUFFERED=1
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"

          exec 9>instance/.production-maintenance.lock
          flock -w 300 9

          venv/bin/python -m py_compile app/services/kpi_region_authority_resolver.py app/services/dashboard_runtime_optimizer.py
          venv/bin/python -m pytest -q tests/test_kpi_market_single_source.py tests/test_market_analysis_week_fallback.py

          active=$(venv/bin/python - <<'PY'
          from app import create_app
          from app.models import IMSImportJob
          from config import Config
          app=create_app(Config)
          with app.app_context():
              print(IMSImportJob.query.filter(IMSImportJob.status.in_((IMSImportJob.STATUS_QUEUED,IMSImportJob.STATUS_PROCESSING))).count())
          PY
          )
          echo "ACTIVE_IMPORTS|$active"
          test "$active" = 0

          # This publication mutates only durable read-model tables.  The prior
          # failures were SQLite writer contention, not importer failures.  With
          # the Week 32 import already COMPLETED and no queued/processing import,
          # quiesce both production writers for this bounded transaction instead
          # of re-importing or touching Week 31/older business facts.
          sudo systemctl stop ims-performance-manager.service
          sudo systemctl stop ims-import-worker.service
          cleanup_services() {
            sudo systemctl start ims-import-worker.service || true
            sudo systemctl restart ims-performance-manager.service || true
          }
          trap cleanup_services EXIT
          sleep 2

          venv/bin/python -u - <<'PY'
          from app import create_app
          from scripts.refresh_live_read_models import _refresh_regions
          from config import Config
          app=create_app(Config)
          with app.app_context():
              _refresh_regions(2026,8)
          PY

          venv/bin/python -u - <<'PY'
          import json
          import sqlalchemy as sa
          from app import create_app
          from app.extensions import db
          from app.models import CompetitionData, IMSImportJob, IMSUpload, Representative
          from app.services.kpi_market_single_source import AUTHORITY_PREFIX
          from app.services.market_analysis_service import MarketAnalysisService
          from app.services.persistent_dashboard_snapshot_service import PersistentDashboardSnapshotService
          from app.services.persistent_region_snapshot_service import PersistentRegionSnapshotService
          from app.services.persistent_representative_snapshot_service import PersistentRepresentativeSnapshotService, representative_snapshots
          from config import Config

          def close(a,b,tol=0.01):
              return abs(float(a or 0)-float(b or 0)) <= tol

          app=create_app(Config)
          with app.app_context():
              upload=IMSUpload.query.filter_by(year=2026,month=8,week_number=32,status='COMPLETED').order_by(IMSUpload.id.desc()).first()
              assert upload
              job=IMSImportJob.query.filter_by(ims_upload_id=upload.id).order_by(IMSImportJob.id.desc()).first()
              assert job and job.status == IMSImportJob.STATUS_COMPLETED

              authority_count=CompetitionData.query.filter(CompetitionData.upload_id==upload.id,CompetitionData.sheet_name.like(f'{AUTHORITY_PREFIX}%')).count()
              assert authority_count==168, authority_count

              dashboard=PersistentDashboardSnapshotService.get_active(2026,8) or {}
              executive=dashboard.get('executive_metrics') or {}
              assert len(executive.get('products') or [])==7
              assert float(executive.get('target_tl') or 0)>0 and float(executive.get('actual_tl') or 0)>0

              national=MarketAnalysisService(2026,8).build()
              assert national.get('metric_mode')=='UNIT'
              assert len(national.get('groups') or [])==7
              assert close(national.get('company_total_unit'),314214)
              assert close(national.get('competitor_total_unit'),613403)
              assert close(national.get('market_total_unit'),927617)
              for row in national['groups']:
                  assert close(row['company_sales_unit']+row['competitor_sales_unit'],row['market_sales_unit']), row

              regions=PersistentRegionSnapshotService.get_active_all(2026,8)
              assert len(regions)==11, len(regions)
              istanbul=None
              for region_key,snapshot in regions.items():
                  market=snapshot.get('market_analysis') or {}
                  rows=market.get('rows') or []
                  totals=market.get('totals') or {}
                  assert len(rows)==7, (region_key,len(rows))
                  assert market.get('market_share_source')=='IMS_KPI_AGGREGATE_PAZAR', (region_key,market.get('market_share_source'))
                  for row in rows:
                      assert close(row['company_unit']+row['competitor_unit'],row['market_unit']), (region_key,row)
                  assert close(totals.get('company_unit')+totals.get('competitor_unit'),totals.get('market_unit')), (region_key,totals)
                  if str(region_key).startswith('101'):
                      istanbul=totals
              assert istanbul
              assert close(istanbul.get('company_unit'),52024), istanbul
              assert close(istanbul.get('competitor_unit'),85747), istanbul
              assert close(istanbul.get('market_unit'),137771), istanbul

              ims_id,prod_id=PersistentRepresentativeSnapshotService.source_identity(2026,8)
              assert ims_id==upload.id
              set_id=PersistentRepresentativeSnapshotService._visible_set_id(2026,8)
              assert set_id
              rep_rows=db.session.execute(sa.select(representative_snapshots.c.payload_json).where(representative_snapshots.c.set_id==set_id)).scalars().all()
              assert len(rep_rows)==113, len(rep_rows)
              for raw in rep_rows:
                  snap=json.loads(raw)
                  mkt=((((snap.get('snapshots') or {}).get('monthly') or {}).get('market_analysis')) or {})
                  rows=mkt.get('rows') or []
                  totals=mkt.get('totals') or {}
                  assert len(rows)==7
                  for row in rows:
                      assert close(row['actual_unit']+row['competitor_unit'],row['market_unit']), row
                  assert close(totals.get('actual_unit')+totals.get('competitor_unit'),totals.get('market_unit')), totals

              murat=Representative.query.filter(db.func.upper(Representative.rep_name)=='MURAT ARSLAN').first()
              assert murat
              snap=PersistentRepresentativeSnapshotService.get_active(murat.id,2026,8)
              mkt=((((snap.get('snapshots') or {}).get('monthly') or {}).get('market_analysis')) or {})
              assert len(mkt.get('rows') or [])==7
              for row in mkt['rows']:
                  assert close(row['actual_unit']+row['competitor_unit'],row['market_unit']), row
              mt=mkt.get('totals') or {}
              assert close(mt.get('actual_unit')+mt.get('competitor_unit'),mt.get('market_unit')), mt

              try:
                  summary=json.loads(job.result_summary or '{}')
              except Exception:
                  summary={}
              summary['publication_ready']=True
              summary['publication_ready_source']='verified_kpi_single_source_all_snapshots'
              job.result_summary=json.dumps(summary,ensure_ascii=False)
              db.session.commit()

              print('KPI_SINGLE_SOURCE_ACCEPTANCE|PASS'
                    f'|authority_rows={authority_count}'
                    f"|national_company={national['company_total_unit']:.2f}"
                    f"|national_competitor={national['competitor_total_unit']:.2f}"
                    f"|national_market={national['market_total_unit']:.2f}"
                    f"|istanbul_company={float(istanbul['company_unit']):.2f}"
                    f"|istanbul_competitor={float(istanbul['competitor_unit']):.2f}"
                    f"|istanbul_market={float(istanbul['market_unit']):.2f}"
                    '|regions=11|representatives=113|murat_rows=7|publication_ready=1')
          PY

          # Bring writers back only after all snapshot/read-model assertions pass.
          trap - EXIT
          sudo systemctl start ims-import-worker.service
          sudo systemctl restart ims-performance-manager.service
          test "$(sudo systemctl is-active ims-import-worker.service)" = active
          test "$(sudo systemctl is-active ims-performance-manager.service)" = active
          health=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 6 http://127.0.0.1:8000/login >/dev/null; then
              health=1
              break
            fi
            sleep 2
          done
          test "$health" = 1
          echo 'HTTP_HEALTH|PASS'
          venv/bin/python verify_live_ims_gate.py
          echo 'WEEK32_FINAL_PUBLICATION|PASS'
          REMOTE
