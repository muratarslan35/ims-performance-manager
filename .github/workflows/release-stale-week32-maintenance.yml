name: Week 32 UI read-path diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-stale-week32-maintenance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Inspect live dashboard and market read paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Inspect live UI sources
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          export PYTHONPATH="$IMS_PATH${PYTHONPATH:+:$PYTHONPATH}"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          from sqlalchemy import func
          from app import create_app
          from app.extensions import db
          from app.models import CompetitionData, IMSUpload
          from app.services.dashboard_service import DashboardService
          from app.services.market_analysis_service import MarketAnalysisService
          from app.services.persistent_dashboard_snapshot_service import PersistentDashboardSnapshotService

          app=create_app()
          with app.app_context():
              upload=IMSUpload.query.filter_by(year=2026, month=8, week_number=32, status='COMPLETED').order_by(IMSUpload.id.desc()).first()
              assert upload is not None
              print(f'UPLOAD|id={upload.id}|completed_at={upload.completed_at}|file={upload.file_name}')
              rows=(db.session.query(CompetitionData.metric_type, func.count(CompetitionData.id), func.count(func.distinct(CompetitionData.sheet_name)))
                    .filter(CompetitionData.upload_id==upload.id)
                    .group_by(CompetitionData.metric_type).order_by(CompetitionData.metric_type).all())
              for metric,count,sheets in rows:
                  print(f'COMP_METRIC|type={metric}|rows={count}|sheets={sheets}')
              sheet_rows=(db.session.query(CompetitionData.sheet_name, CompetitionData.metric_type, func.count(CompetitionData.id))
                          .filter(CompetitionData.upload_id==upload.id)
                          .group_by(CompetitionData.sheet_name, CompetitionData.metric_type)
                          .order_by(CompetitionData.sheet_name, CompetitionData.metric_type).all())
              for sheet,metric,count in sheet_rows:
                  print(f'COMP_SHEET|{sheet}|{metric}|rows={count}')

              direct=DashboardService(year=2026, month=8).run()
              snap=PersistentDashboardSnapshotService.get_active(2026,8)
              print('DIRECT_KEYS|' + ','.join(sorted(direct.keys())))
              print('SNAP_KEYS|' + ','.join(sorted((snap or {}).keys())))
              for label,payload in [('DIRECT',direct),('SNAP',snap or {})]:
                  nm=payload.get('national_metrics') or payload.get('national') or {}
                  prime=payload.get('prime_summary') or payload.get('prime') or {}
                  products=payload.get('product_performance') or payload.get('products') or []
                  print(f'{label}_READ|national={json.dumps(nm,ensure_ascii=False,default=str)[:1800]}')
                  print(f'{label}_PRIME|{json.dumps(prime,ensure_ascii=False,default=str)[:1200]}')
                  print(f'{label}_PRODUCTS|count={len(products) if isinstance(products,list) else -1}|sample={json.dumps(products[:2] if isinstance(products,list) else products,ensure_ascii=False,default=str)[:1200]}')

              market=MarketAnalysisService(2026,8).build()
              print('MARKET_STATE|' + json.dumps({k:market.get(k) for k in ('latest_week','source_week','source_state','is_current','is_fallback','has_competition','market_total_tl','company_total_tl','competitor_total_tl','company_share_percent','source_file','source_message')},ensure_ascii=False,default=str))
              print('MARKET_GROUPS|' + json.dumps(market.get('groups',[])[:7],ensure_ascii=False,default=str)[:5000])

              p=PersistentDashboardSnapshotService._path(2026,8)
              if p.exists():
                  env=json.loads(p.read_text(encoding='utf-8'))
                  print('SNAP_ENVELOPE|' + json.dumps({k:env.get(k) for k in ('version','year','month','ims_upload_id','production_upload_id','created_at')},ensure_ascii=False))
          PY
          REMOTE
