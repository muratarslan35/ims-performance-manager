name: Week 32 UI publication fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-stale-week32-maintenance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Audit current IMS market source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Audit Week 32 source identities
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          export PYTHONPATH="$IMS_PATH${PYTHONPATH:+:$PYTHONPATH}"
          venv/bin/python - <<'PY'
          from collections import defaultdict
          from sqlalchemy import desc
          from app import create_app
          from app.extensions import db
          from app.models import CompetitionData, IMSRawData, IMSUpload, Product
          from app.services.alias_service import AliasService
          from config import Config

          def key(v):
              return ''.join(ch for ch in AliasService.normalize(v) if ch.isalnum())

          app=create_app(Config)
          with app.app_context():
              upload=(IMSUpload.query.filter_by(year=2026,month=8,status='COMPLETED')
                      .order_by(desc(IMSUpload.week_number),desc(IMSUpload.completed_at),desc(IMSUpload.id)).first())
              assert upload and int(upload.week_number)==32
              products=Product.query.filter_by(is_active=True).order_by(Product.display_order,Product.product_name).all()
              company={int(pid):float(unit or 0) for pid,unit in db.session.query(
                  IMSRawData.product_id, db.func.sum(IMSRawData.unit)
              ).filter(
                  IMSRawData.upload_id==upload.id,
                  IMSRawData.sheet_type=='official_actual_aggregate',
                  IMSRawData.territory=='NATIONAL',
                  IMSRawData.product_id.isnot(None),
              ).group_by(IMSRawData.product_id).all()}
              rows=CompetitionData.query.filter(
                  CompetitionData.upload_id==upload.id,
                  CompetitionData.metric_type=='UNIT',
                  CompetitionData.is_grand_total.is_(False),
              ).all()
              print(f'MARKET_SOURCE_AUDIT|upload={upload.id}|week={upload.week_number}|competition_rows={len(rows)}')
              for product in products:
                  aliases={key(x) for x in (product.product_name,product.product_code,product.ims_name,getattr(product,'competitor_group',None)) if key(x)}
                  matched=[]
                  for row in rows:
                      g=key(row.product_group)
                      if any(a in g or g in a for a in aliases):
                          matched.append(row)
                  subtotal=sum(float(r.metric_value or 0) for r in matched if r.is_subtotal)
                  own=0.0; rival=0.0; detail=0.0; rivals=defaultdict(float)
                  own_names={key(x) for x in (product.product_name,product.product_code,product.ims_name) if key(x)}
                  for r in matched:
                      if r.is_subtotal: continue
                      value=float(r.metric_value or 0); detail+=value
                      name=key(r.product_name)
                      is_company=bool(r.is_company_product) or (not bool(r.is_competitor) and any(a in name or name in a for a in own_names))
                      if is_company: own+=value
                      else:
                          rival+=value; rivals[str(r.product_name)]+=value
                  c=company.get(int(product.id),0.0)
                  print('MARKET_PRODUCT|product=%s|company_main=%.2f|competition_company=%.2f|rival_detail=%.2f|detail_total=%.2f|subtotal=%.2f|company_plus_rival=%.2f|subtotal_minus_company=%.2f|rivals=%d' % (
                      product.product_name,c,own,rival,detail,subtotal,c+rival,subtotal-c,len(rivals)))
          PY
          REMOTE
