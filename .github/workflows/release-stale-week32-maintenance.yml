name: Week 32 UI publication fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-stale-week32-maintenance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Audit current IMS market source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Audit Week 32 source identities
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          export PYTHONPATH="$IMS_PATH${PYTHONPATH:+:$PYTHONPATH}"
          venv/bin/python - <<'PY'
          from collections import defaultdict
          from pathlib import Path
          from sqlalchemy import desc
          import pandas as pd
          from flask import current_app
          from app import create_app
          from app.extensions import db
          from app.models import CompetitionData, IMSRawData, IMSUpload, Product
          from app.services.alias_service import AliasService
          from app.services.kpi_workbook_compat import is_product_kpi_sheet
          from config import Config

          def key(v):
              return ''.join(ch for ch in AliasService.normalize(v) if ch.isalnum())
          def norm(v):
              return AliasService.normalize(v) if v is not None and not (isinstance(v,float) and pd.isna(v)) else ''

          app=create_app(Config)
          with app.app_context():
              upload=(IMSUpload.query.filter_by(year=2026,month=8,status='COMPLETED')
                      .order_by(desc(IMSUpload.week_number),desc(IMSUpload.completed_at),desc(IMSUpload.id)).first())
              assert upload and int(upload.week_number)==32
              products=Product.query.filter_by(is_active=True).order_by(Product.display_order,Product.product_name).all()
              company={int(pid):float(unit or 0) for pid,unit in db.session.query(
                  IMSRawData.product_id, db.func.sum(IMSRawData.unit)
              ).filter(
                  IMSRawData.upload_id==upload.id,
                  IMSRawData.sheet_type=='official_actual_aggregate',
                  IMSRawData.territory=='NATIONAL',
                  IMSRawData.product_id.isnot(None),
              ).group_by(IMSRawData.product_id).all()}
              rows=CompetitionData.query.filter(
                  CompetitionData.upload_id==upload.id,
                  CompetitionData.metric_type=='UNIT',
                  CompetitionData.is_grand_total.is_(False),
              ).all()
              print(f'MARKET_SOURCE_AUDIT|upload={upload.id}|week={upload.week_number}|competition_rows={len(rows)}')
              for product in products:
                  aliases={key(x) for x in (product.product_name,product.product_code,product.ims_name,getattr(product,'competitor_group',None)) if key(x)}
                  matched=[r for r in rows if any(a in key(r.product_group) or key(r.product_group) in a for a in aliases)]
                  subtotal=sum(float(r.metric_value or 0) for r in matched if r.is_subtotal)
                  by_name=defaultdict(float)
                  for r in matched:
                      if not r.is_subtotal: by_name[str(r.product_name)]+=float(r.metric_value or 0)
                  print('MARKET_PRODUCT|product=%s|company_main=%.2f|subtotal=%.2f|names=%s' % (
                      product.product_name,company.get(int(product.id),0.0),subtotal,
                      ';'.join('%s=%.2f' % item for item in sorted(by_name.items()))))

              candidates=[]
              for base in (Path(current_app.config['UPLOAD_FOLDER']), Path('instance/uploads'), Path('uploads')):
                  for name in (upload.file_name, getattr(upload,'stored_file_name',None)):
                      if name:
                          p=base/name
                          if p.is_file(): candidates.append(p)
              source=next(iter(candidates),None)
              print(f'SOURCE_PATH|{source}')
              if source:
                  workbook=pd.read_excel(source,sheet_name=None,header=None)
                  for sheet_name,frame in workbook.items():
                      if not is_product_kpi_sheet(sheet_name): continue
                      header=next((r for r in range(min(15,len(frame))) if any(norm(v)=='PAZAR' for v in frame.iloc[r].tolist())),None)
                      if header is None: continue
                      labels=[norm(v) for v in frame.iloc[header].tolist()]
                      product=norm(sheet_name).removeprefix('2 KUTU ').removesuffix(' KPI')
                      product_cols=[i for i,v in enumerate(labels) if v.startswith(product)]
                      pazar_cols=[i for i,v in enumerate(labels) if v=='PAZAR']
                      for r in range(header+1,len(frame)):
                          brick=norm(frame.iloc[r,2]) if frame.shape[1]>2 else ''
                          province=norm(frame.iloc[r,1]) if frame.shape[1]>1 else ''
                          territory=norm(frame.iloc[r,0]) if frame.shape[1]>0 else ''
                          if brick=='NATIONAL' or 'SUBTOTAL' in brick or 'SUBTOTAL' in province:
                              own=frame.iloc[r,product_cols[0]] if product_cols else None
                              pazar=frame.iloc[r,pazar_cols[0]] if pazar_cols else None
                              print(f'KPI_CONTROL|sheet={sheet_name}|territory={territory}|province={province}|brick={brick}|own={own}|pazar={pazar}')
          PY
          REMOTE
