name: Week 32 UI publication fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-stale-week32-maintenance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Refresh dashboard and competition read models
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Publish corrected Week 32 UI read models
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          exec 9>instance/.production-maintenance.lock
          if ! flock -w 300 9; then
            echo 'UI_PUBLICATION_REFUSED|reason=production_lock_timeout'
            exit 1
          fi

          test -z "$(git status --porcelain)"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          export PYTHONPATH="$IMS_PATH${PYTHONPATH:+:$PYTHONPATH}"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"

          active=$(venv/bin/python - <<'PY'
          from app import create_app
          from app.models import IMSImportJob
          from config import Config
          app=create_app(Config)
          with app.app_context():
              print(IMSImportJob.query.filter(IMSImportJob.status.in_((IMSImportJob.STATUS_QUEUED, IMSImportJob.STATUS_PROCESSING))).count())
          PY
          )
          echo "ACTIVE_IMPORTS|$active"
          test "$active" = "0"

          venv/bin/python -m py_compile \
            app/routes/__init__.py \
            app/services/market_analysis_service.py \
            scripts/refresh_live_read_models.py
          venv/bin/python -m pytest -q tests/test_market_analysis_week_fallback.py

          sudo systemctl restart ims-performance-manager.service
          test "$(sudo systemctl is-active ims-performance-manager.service)" = active

          venv/bin/python -m scripts.refresh_live_read_models --year 2026 --month 8 --week 32
          venv/bin/python verify_live_ims_gate.py

          health=$(curl -fsS --max-time 15 http://127.0.0.1:8000/health || true)
          printf 'HTTP_HEALTH|%s\n' "$health"
          test -n "$health"

          venv/bin/python - <<'PY'
          from app import create_app
          from app.services.market_analysis_service import MarketAnalysisService
          from app.services.persistent_dashboard_snapshot_service import PersistentDashboardSnapshotService
          from config import Config
          app=create_app(Config)
          with app.app_context():
              payload=PersistentDashboardSnapshotService.get_active(2026,8) or {}
              national=payload.get('executive_metrics') or {}
              products=national.get('products') or []
              assert float(national.get('target_tl') or 0)>0
              assert float(national.get('actual_tl') or 0)>0
              assert float(national.get('unit_target') or 0)>0
              assert float(national.get('unit_actual') or 0)>0
              assert len(products)==7
              market=MarketAnalysisService(2026,8).build()
              assert market.get('has_competition') is True
              assert market.get('source_state')=='CURRENT'
              assert market.get('metric_mode')=='UNIT'
              assert len([r for r in market.get('groups',[]) if r.get('market_available')])==7
              print('UI_FINAL_ACCEPTANCE|PASS'
                    f"|target_tl={float(national['target_tl']):.2f}"
                    f"|actual_tl={float(national['actual_tl']):.2f}"
                    f"|target_box={float(national['unit_target']):.2f}"
                    f"|actual_box={float(national['unit_actual']):.2f}"
                    f"|products={len(products)}"
                    f"|market_mode={market.get('metric_mode')}"
                    f"|market_products={len(market.get('groups') or [])}"
                    f"|market_total={float(market.get('market_total_value') or 0):.2f}"
                    f"|competitor_total={float(market.get('competitor_total_value') or 0):.2f}")
          PY
          REMOTE
