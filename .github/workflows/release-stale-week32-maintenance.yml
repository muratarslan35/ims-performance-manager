name: Week 32 live import status

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-stale-week32-maintenance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Final Week 32 source-to-live acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Validate Week 32 source against live production
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          export PYTHONPATH="$IMS_PATH${PYTHONPATH:+:$PYTHONPATH}"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          venv/bin/python verify_live_ims_gate.py
          venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          from sqlalchemy import func

          from app import create_app
          from app.extensions import db
          from app.models import (
              CompetitionData,
              IMSImportJob,
              IMSRawData,
              IMSSummary,
              IMSUpload,
              Target,
          )
          from app.services.adaptive_kpi_target_authority import _pair_views
          from app.services.alias_service import AliasService
          from app.services.ims_import_service import IMSImportService
          from app.services.ims_progress_store import IMSProgressStore
          from app.services.ims_publication_service import IMSPublicationService
          from app.services.ims_upload_lifecycle_service import IMSUploadLifecycleService
          from app.services.persistent_dashboard_snapshot_service import PersistentDashboardSnapshotService
          from app.services.persistent_region_snapshot_service import PersistentRegionSnapshotService
          from app.services.persistent_representative_snapshot_service import PersistentRepresentativeSnapshotService

          YEAR, MONTH, WEEK = 2026, 8, 32
          TOL = 0.01
          mismatches = []

          def close(a, b, tol=TOL):
              return abs(float(a or 0.0) - float(b or 0.0)) <= tol

          def check(label, source_value, live_value, tol=TOL):
              if not close(source_value, live_value, tol):
                  mismatches.append((label, float(source_value or 0.0), float(live_value or 0.0)))

          def totals(tl_values, unit_values):
              return {
                  "target_tl": sum(float(v["target"] or 0) for v in tl_values.values()),
                  "actual_tl": sum(float(v["actual"] or 0) for v in tl_values.values()),
                  "target_box": sum(float(v["target"] or 0) for v in unit_values.values()),
                  "actual_box": sum(float(v["actual"] or 0) for v in unit_values.values()),
              }

          app = create_app()
          with app.app_context():
              upload = (
                  IMSUpload.query.filter_by(status="COMPLETED", year=YEAR, month=MONTH, week_number=WEEK)
                  .order_by(IMSUpload.completed_at.desc(), IMSUpload.id.desc())
                  .first()
              )
              assert upload is not None, "Week 32 completed upload missing"
              assert int(upload.id) == 45, f"unexpected Week 32 upload id={upload.id}"

              visible = IMSPublicationService.latest_visible_upload()
              assert visible is not None and int(visible.id) == int(upload.id), (
                  f"Week 32 is not latest visible upload: visible={getattr(visible, 'id', None)}"
              )

              source_path = IMSUploadLifecycleService.archived_source_for_upload(upload.id)
              assert source_path is not None and Path(source_path).is_file(), "archived Week 32 source missing"

              importer = IMSImportService(source_path)
              importer.upload = upload
              importer.load_workbook()
              views = _pair_views(importer)
              assert views is not None, "paired TL/KUTU source matrices not detected"

              products = list(views["products"])
              assert len(products) == 7, f"expected 7 products, found {len(products)}"
              product_ids = {}
              for product_name in products:
                  match = importer.resolve_product_match(product_name)
                  assert match.get("matched"), f"product not resolved: {product_name}"
                  product_ids[product_name] = int(match["object"].id)

              source_rep_keys = sorted(views["tl_reps"].keys())
              assert set(source_rep_keys) == set(views["unit_reps"].keys()), "TL/KUTU rep coverage differs"
              rep_ids = {}
              for territory, rep_name in source_rep_keys:
                  match = importer.resolve_representative_match(rep_name)
                  assert match.get("matched"), f"representative not resolved: {rep_name}"
                  rep_ids[(territory, rep_name)] = int(match["object"].id)

              targets = {
                  (int(row.representative_id), int(row.product_id)): row
                  for row in Target.query.filter_by(year=YEAR, month=MONTH).all()
              }
              summaries = {
                  (int(row.representative_id), int(row.product_id)): row
                  for row in IMSSummary.query.filter_by(year=YEAR, month=MONTH).all()
              }
              expected_rep_rows = len(source_rep_keys) * len(products)
              assert len(targets) == expected_rep_rows, f"target coverage {len(targets)}/{expected_rep_rows}"
              assert len(summaries) == expected_rep_rows, f"summary coverage {len(summaries)}/{expected_rep_rows}"

              rep_metric_checks = 0
              for rep_key in source_rep_keys:
                  rid = rep_ids[rep_key]
                  tl_values = views["tl_reps"][rep_key]
                  unit_values = views["unit_reps"][rep_key]
                  for product_name in products:
                      pid = product_ids[product_name]
                      target = targets.get((rid, pid))
                      summary = summaries.get((rid, pid))
                      assert target is not None, f"target row missing rep={rep_key[1]} product={product_name}"
                      assert summary is not None, f"summary row missing rep={rep_key[1]} product={product_name}"
                      check(f"rep:{rep_key[1]}:{product_name}:target_tl", tl_values[product_name]["target"], target.tl_target)
                      check(f"rep:{rep_key[1]}:{product_name}:actual_tl", tl_values[product_name]["actual"], summary.tl)
                      check(f"rep:{rep_key[1]}:{product_name}:target_box", unit_values[product_name]["target"], target.unit_target)
                      check(f"rep:{rep_key[1]}:{product_name}:actual_box", unit_values[product_name]["actual"], summary.unit)
                      rep_metric_checks += 4

              tl_agg = {str(k[0]): v for k, v in views["tl_aggregates"].items()}
              unit_agg = {str(k[0]): v for k, v in views["unit_aggregates"].items()}
              assert set(tl_agg) == set(unit_agg), "TL/KUTU aggregate coverage differs"
              assert "NATIONAL" in tl_agg and "901" in tl_agg, "NATIONAL or 901 aggregate missing in source"
              assert len(tl_agg) == 12, f"expected NATIONAL + 11 regions, found {len(tl_agg)} aggregates"

              target_aggs = {
                  (str(row.territory), int(row.product_id)): row
                  for row in IMSRawData.query.filter_by(upload_id=upload.id, sheet_type="official_target_aggregate").all()
              }
              actual_aggs = {
                  (str(row.territory), int(row.product_id)): row
                  for row in IMSRawData.query.filter_by(upload_id=upload.id, sheet_type="official_actual_aggregate").all()
              }
              expected_agg_rows = len(tl_agg) * len(products)
              assert len(target_aggs) == expected_agg_rows, f"official target aggregate coverage {len(target_aggs)}/{expected_agg_rows}"
              assert len(actual_aggs) == expected_agg_rows, f"official actual aggregate coverage {len(actual_aggs)}/{expected_agg_rows}"

              aggregate_metric_checks = 0
              for territory in sorted(tl_agg):
                  for product_name in products:
                      pid = product_ids[product_name]
                      target_row = target_aggs.get((territory, pid))
                      actual_row = actual_aggs.get((territory, pid))
                      assert target_row is not None, f"official target aggregate missing territory={territory} product={product_name}"
                      assert actual_row is not None, f"official actual aggregate missing territory={territory} product={product_name}"
                      check(f"agg:{territory}:{product_name}:target_tl", tl_agg[territory][product_name]["target"], target_row.tl)
                      check(f"agg:{territory}:{product_name}:actual_tl", tl_agg[territory][product_name]["actual"], actual_row.tl)
                      check(f"agg:{territory}:{product_name}:target_box", unit_agg[territory][product_name]["target"], target_row.unit)
                      check(f"agg:{territory}:{product_name}:actual_box", unit_agg[territory][product_name]["actual"], actual_row.unit)
                      aggregate_metric_checks += 4

              murat_keys = [
                  key for key in source_rep_keys
                  if AliasService.normalize(key[1]) == "MURAT ARSLAN"
              ]
              assert len(murat_keys) == 1, f"Murat Arslan source rows ambiguous: {murat_keys}"
              murat_key = murat_keys[0]
              murat_id = rep_ids[murat_key]

              progress = IMSProgressStore.read(
                  IMSImportJob.query.filter_by(ims_upload_id=upload.id)
                  .order_by(IMSImportJob.id.desc()).first().id
              ) or {}
              assert progress.get("status") == "COMPLETED", f"snapshot progress status={progress}"
              assert progress.get("stage") == "completed" and int(progress.get("percent") or 0) == 100, f"snapshot progress incomplete={progress}"

              dashboard = PersistentDashboardSnapshotService.get_active(YEAR, MONTH)
              regions = PersistentRegionSnapshotService.get_active_all(YEAR, MONTH)
              murat_snapshot = PersistentRepresentativeSnapshotService.get_active(murat_id, YEAR, MONTH)
              assert isinstance(dashboard, dict) and dashboard, "dashboard snapshot unavailable"
              assert isinstance(regions, dict) and len(regions) == 11, f"region snapshot coverage={len(regions) if isinstance(regions, dict) else None}"
              assert isinstance(murat_snapshot, dict) and murat_snapshot, "Murat Arslan representative snapshot unavailable"

              job = (
                  IMSImportJob.query.filter_by(ims_upload_id=upload.id, status="COMPLETED")
                  .order_by(IMSImportJob.id.desc()).first()
              )
              stats = json.loads(job.result_summary or "{}")
              competition_db = CompetitionData.query.filter_by(upload_id=upload.id).count()
              competition_source = int(stats.get("competition_source_records") or 0)
              competition_invalid = int(stats.get("competition_invalid") or 0)
              kpi_validation_sheets = int(stats.get("kpi_validation_sheets") or 0)
              competition_products = (
                  db.session.query(func.count(func.distinct(CompetitionData.product_id)))
                  .filter(CompetitionData.upload_id == upload.id)
                  .scalar() or 0
              )
              assert competition_source > 0 and competition_db == competition_source, (
                  f"competition source/live mismatch {competition_source}/{competition_db}"
              )
              assert competition_invalid == 0, f"competition invalid={competition_invalid}"
              assert kpi_validation_sheets == len(products), (
                  f"KPI/PAZAR sheet coverage={kpi_validation_sheets}/{len(products)}"
              )
              assert int(competition_products) == len(products), (
                  f"competition product coverage={competition_products}/{len(products)}"
              )

              national = totals(tl_agg["NATIONAL"], unit_agg["NATIONAL"])
              region901 = totals(tl_agg["901"], unit_agg["901"])
              murat = totals(views["tl_reps"][murat_key], views["unit_reps"][murat_key])

              assert close(national["target_tl"], 152097283.40), f"NATIONAL target TL unexpected={national['target_tl']}"
              assert close(national["actual_tl"], 31620641.03), f"NATIONAL actual TL unexpected={national['actual_tl']}"
              assert close(national["actual_box"], 314214.0), f"NATIONAL actual box unexpected={national['actual_box']}"

              assert not mismatches, "source/live metric mismatches: " + repr(mismatches[:20])

              print(
                  "FINAL_ACCEPTANCE|PASS"
                  f"|upload={upload.id}|week={WEEK}|products={len(products)}|representatives={len(source_rep_keys)}"
                  f"|aggregates={len(tl_agg)}|rep_metric_checks={rep_metric_checks}"
                  f"|aggregate_metric_checks={aggregate_metric_checks}|mismatches={len(mismatches)}"
              )
              print(
                  "NATIONAL_TOTALS|"
                  + "|".join(f"{key}={value:.2f}" for key, value in national.items())
              )
              print(
                  "REGION_901_TOTALS|"
                  + "|".join(f"{key}={value:.2f}" for key, value in region901.items())
              )
              print(
                  "MURAT_ARSLAN_TOTALS|territory=" + str(murat_key[0]) + "|"
                  + "|".join(f"{key}={value:.2f}" for key, value in murat.items())
              )
              for product_name in products:
                  rv_tl = tl_agg["901"][product_name]
                  rv_unit = unit_agg["901"][product_name]
                  mv_tl = views["tl_reps"][murat_key][product_name]
                  mv_unit = views["unit_reps"][murat_key][product_name]
                  print(
                      f"REGION_901_PRODUCT|{product_name}"
                      f"|target_tl={rv_tl['target']:.2f}|actual_tl={rv_tl['actual']:.2f}"
                      f"|target_box={rv_unit['target']:.2f}|actual_box={rv_unit['actual']:.2f}"
                  )
                  print(
                      f"MURAT_ARSLAN_PRODUCT|{product_name}"
                      f"|target_tl={mv_tl['target']:.2f}|actual_tl={mv_tl['actual']:.2f}"
                      f"|target_box={mv_unit['target']:.2f}|actual_box={mv_unit['actual']:.2f}"
                  )
              print(
                  f"PAZAR_COMPETITION|PASS|source_records={competition_source}|live_records={competition_db}"
                  f"|products={competition_products}|kpi_sheets={kpi_validation_sheets}|invalid={competition_invalid}"
              )
              print(
                  f"SNAPSHOTS|PASS|dashboard=1|regions={len(regions)}|murat_rep=1"
                  f"|progress={progress.get('percent')}|stage={progress.get('stage')}"
              )
          PY
          REMOTE
# final Week 32 source-to-live acceptance 2026-09-12
