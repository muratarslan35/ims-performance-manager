name: Patch official region metrics
on:
  push:
    branches:
      - fix/direct-weekly-unit-actuals
    paths:
      - scripts/patch_official_region_metrics.py
      - .github/workflows/patch-official-region-metrics.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/direct-weekly-unit-actuals
      - name: Apply official region metric patch
        run: |
          python scripts/patch_official_region_metrics.py
          python -m py_compile app/services/ims_import_service.py app/query/dashboard_query.py app/services/region_performance_service.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/services/ims_import_service.py app/query/dashboard_query.py app/services/region_performance_service.py tests/test_auth_routes.py
          git commit -m 'fix: use official workbook region subtotals'
          git push origin HEAD:fix/direct-weekly-unit-actuals