name: IMS Week 8 Job Diagnostic

on:
  push:
    branches:
      - diag/week8-job-readonly

permissions:
  contents: read
  issues: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Read Week 8 jobs
        run: |
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" \
            "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE' | tee "$RUNNER_TEMP/week8.log"
          set -Eeuo pipefail
          cd "$IMS_PATH"
          venv/bin/python - <<'PY'
          import json, sqlite3
          from pathlib import Path

          db_path = Path('instance/ipm.db')
          uri = f'file:{db_path.resolve()}?mode=ro'
          conn = sqlite3.connect(uri, uri=True, timeout=5)
          conn.row_factory = sqlite3.Row
          try:
              conn.execute('PRAGMA query_only=ON')
              cols = {r['name'] for r in conn.execute('PRAGMA table_info(ims_import_jobs)')}
              wanted = ['id','status','file_name','year','month','ims_upload_id','queued_at','started_at','completed_at','error_message','result_summary']
              select_cols = [c for c in wanted if c in cols]
              rows = conn.execute(
                  f"SELECT {', '.join(select_cols)} FROM ims_import_jobs "
                  "WHERE file_name LIKE '%8.Hafta%' OR file_name LIKE '%8_Hafta%' "
                  "ORDER BY id DESC LIMIT 6"
              ).fetchall()
              print('WEEK8_JOB_DIAGNOSTIC|' + json.dumps([dict(r) for r in rows], ensure_ascii=False, default=str))
              print('WEEK8_DB_MODE|' + str(conn.execute('PRAGMA journal_mode').fetchone()[0]))
          finally:
              conn.close()
          PY
          REMOTE

      - name: Publish diagnostic evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          evidence=$(grep -E 'WEEK8_' "$RUNNER_TEMP/week8.log" || true)
          body=$(jq -n --arg evidence "$evidence" --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{title:"IMS Week 8 read-only diagnostic",body:("Workflow: "+$run+"\n\n```text\n"+$evidence+"\n```")}')
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues" -d "$body"
