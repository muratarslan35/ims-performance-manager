name: Repair Week 8 IMS Summary Once

on:
  push:
    branches: [ops/repair-week8-summary-once]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
      EXPECTED_SHA: 3297cc0b89c732c6346faa0ed778226904ade282
    steps:
      - name: Configure production SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_summary_repair_key
          chmod 600 ~/.ssh/ims_summary_repair_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Repair only active Week 8 ims_summary rows
        run: |
          ssh -i ~/.ssh/ims_summary_repair_key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" \
            "IMS_PATH='$IMS_PATH' EXPECTED_SHA='$EXPECTED_SHA' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"

          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "LIVE_SHA|$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

          venv/bin/python - <<'PY'
          import datetime
          import sqlite3
          import sys

          DB = 'instance/ipm.db'
          YEAR, MONTH, WEEK = 2026, 2, 8

          con = sqlite3.connect(DB, timeout=30)
          con.row_factory = sqlite3.Row
          try:
              processing = con.execute(
                  "select count(*) from ims_import_jobs where status='PROCESSING'"
              ).fetchone()[0]
              print(f"WORKER_GATE|processing={processing}")
              if processing:
                  raise SystemExit('FAIL: IMS import PROCESSING; summary repair aborted')

              latest = con.execute(
                  """
                  select id, week_number, status, file_name
                  from ims_uploads
                  where year=? and month=? and status='COMPLETED'
                  order by week_number desc, completed_at desc, id desc
                  limit 1
                  """,
                  (YEAR, MONTH),
              ).fetchone()
              if latest is None:
                  raise SystemExit('FAIL: completed 2026/02 IMS upload not found')
              print(
                  f"UPLOAD_GATE|id={latest['id']}|week={latest['week_number']}|"
                  f"status={latest['status']}|file={latest['file_name']}"
              )
              if int(latest['week_number'] or 0) != WEEK:
                  raise SystemExit('FAIL: active 2026/02 upload is not Week 8')
              upload_id = int(latest['id'])

              summary_count = con.execute(
                  "select count(*) from ims_summary where upload_id=? and year=? and month=?",
                  (upload_id, YEAR, MONTH),
              ).fetchone()[0]
              matched_count = con.execute(
                  """
                  select count(*)
                  from ims_summary s
                  join targets t
                    on t.year=s.year and t.month=s.month
                   and t.representative_id=s.representative_id
                   and t.product_id=s.product_id
                  where s.upload_id=? and s.year=? and s.month=?
                  """,
                  (upload_id, YEAR, MONTH),
              ).fetchone()[0]
              mismatch_before = con.execute(
                  """
                  select count(*)
                  from ims_summary s
                  join targets t
                    on t.year=s.year and t.month=s.month
                   and t.representative_id=s.representative_id
                   and t.product_id=s.product_id
                  where s.upload_id=? and s.year=? and s.month=?
                    and (
                      abs(coalesce(s.tl,0)-coalesce(t.tl_realization,0)) > 0.01
                      or abs(coalesce(s.unit,0)-coalesce(t.unit_realization,0)) > 0.01
                      or abs(coalesce(s.target_tl,0)-coalesce(t.tl_target,0)) > 0.01
                      or abs(coalesce(s.target_unit,0)-coalesce(t.unit_target,0)) > 0.01
                    )
                  """,
                  (upload_id, YEAR, MONTH),
              ).fetchone()[0]
              print(
                  f"PRECHECK|summary={summary_count}|matched_targets={matched_count}|"
                  f"mismatch={mismatch_before}"
              )
              if summary_count == 0 or matched_count != summary_count:
                  raise SystemExit('FAIL: Week 8 summary/target coverage is incomplete')

              murat_before = con.execute(
                  """
                  select p.product_name, s.tl summary_tl, s.unit summary_unit,
                         t.tl_realization target_tl_actual,
                         t.unit_realization target_unit_actual
                  from ims_summary s
                  join targets t
                    on t.year=s.year and t.month=s.month
                   and t.representative_id=s.representative_id
                   and t.product_id=s.product_id
                  join representatives r on r.id=s.representative_id
                  join products p on p.id=s.product_id
                  where s.upload_id=? and s.year=? and s.month=?
                    and upper(r.rep_name)='MURAT ARSLAN'
                  order by p.display_order, p.id
                  """,
                  (upload_id, YEAR, MONTH),
              ).fetchall()
              for row in murat_before:
                  print(
                      "MURAT_BEFORE|{}|summary_tl={}|summary_unit={}|target_tl={}|target_unit={}".format(
                          row['product_name'], row['summary_tl'], row['summary_unit'],
                          row['target_tl_actual'], row['target_unit_actual']
                      )
                  )

              # Online backup before the only live-data mutation.
              stamp = datetime.datetime.utcnow().strftime('%Y%m%dT%H%M%SZ')
              backup_path = f'/tmp/ipm-before-week8-summary-repair-{stamp}.db'
              backup = sqlite3.connect(backup_path)
              try:
                  con.backup(backup)
              finally:
                  backup.close()
              print(f"BACKUP|{backup_path}")

              con.execute('BEGIN IMMEDIATE')
              con.execute(
                  """
                  update ims_summary as s
                  set tl = (
                        select coalesce(t.tl_realization,0) from targets t
                        where t.year=s.year and t.month=s.month
                          and t.representative_id=s.representative_id
                          and t.product_id=s.product_id
                      ),
                      unit = (
                        select coalesce(t.unit_realization,0) from targets t
                        where t.year=s.year and t.month=s.month
                          and t.representative_id=s.representative_id
                          and t.product_id=s.product_id
                      ),
                      target_tl = (
                        select coalesce(t.tl_target,0) from targets t
                        where t.year=s.year and t.month=s.month
                          and t.representative_id=s.representative_id
                          and t.product_id=s.product_id
                      ),
                      target_unit = (
                        select coalesce(t.unit_target,0) from targets t
                        where t.year=s.year and t.month=s.month
                          and t.representative_id=s.representative_id
                          and t.product_id=s.product_id
                      ),
                      realization_percent = (
                        select case when coalesce(t.tl_target,0) != 0
                          then round(coalesce(t.tl_realization,0) * 100.0 / t.tl_target, 2)
                          else 0 end
                        from targets t
                        where t.year=s.year and t.month=s.month
                          and t.representative_id=s.representative_id
                          and t.product_id=s.product_id
                      )
                  where s.upload_id=? and s.year=? and s.month=?
                    and exists (
                      select 1 from targets t
                      where t.year=s.year and t.month=s.month
                        and t.representative_id=s.representative_id
                        and t.product_id=s.product_id
                    )
                  """,
                  (upload_id, YEAR, MONTH),
              )
              changed = con.execute('select changes()').fetchone()[0]

              mismatch_after = con.execute(
                  """
                  select count(*)
                  from ims_summary s
                  join targets t
                    on t.year=s.year and t.month=s.month
                   and t.representative_id=s.representative_id
                   and t.product_id=s.product_id
                  where s.upload_id=? and s.year=? and s.month=?
                    and (
                      abs(coalesce(s.tl,0)-coalesce(t.tl_realization,0)) > 0.01
                      or abs(coalesce(s.unit,0)-coalesce(t.unit_realization,0)) > 0.01
                      or abs(coalesce(s.target_tl,0)-coalesce(t.tl_target,0)) > 0.01
                      or abs(coalesce(s.target_unit,0)-coalesce(t.unit_target,0)) > 0.01
                    )
                  """,
                  (upload_id, YEAR, MONTH),
              ).fetchone()[0]
              if mismatch_after != 0:
                  con.rollback()
                  raise SystemExit(f'FAIL: post-repair mismatch={mismatch_after}; rolled back')
              con.commit()
              print(f"REPAIR|changed={changed}|mismatch_after={mismatch_after}|COMMIT=YES")

              murat_after = con.execute(
                  """
                  select p.product_name, s.tl, s.unit, s.realization_percent
                  from ims_summary s
                  join representatives r on r.id=s.representative_id
                  join products p on p.id=s.product_id
                  where s.upload_id=? and s.year=? and s.month=?
                    and upper(r.rep_name)='MURAT ARSLAN'
                  order by p.display_order, p.id
                  """,
                  (upload_id, YEAR, MONTH),
              ).fetchall()
              for row in murat_after:
                  print(
                      f"MURAT_AFTER|{row['product_name']}|tl={row['tl']}|"
                      f"unit={row['unit']}|realization={row['realization_percent']}"
                  )

              journal = con.execute('pragma journal_mode').fetchone()[0]
              integrity = con.execute('pragma quick_check').fetchone()[0]
              processing_after = con.execute(
                  "select count(*) from ims_import_jobs where status='PROCESSING'"
              ).fetchone()[0]
              print(
                  f"FINAL_GATE|journal_mode={journal}|quick_check={integrity}|"
                  f"processing={processing_after}|mismatch={mismatch_after}"
              )
              if str(journal).lower() != 'wal' or integrity != 'ok' or processing_after != 0:
                  raise SystemExit('FAIL: final SQLite/worker gate failed')
          finally:
              con.close()
          PY
          REMOTE
