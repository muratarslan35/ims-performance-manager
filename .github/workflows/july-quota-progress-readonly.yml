name: July Quota Progress Read-Only

on:
  push:
    branches:
      - diag/july-quota-progress-20260923
    paths:
      - '.github/workflows/july-quota-progress-readonly.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Read July repair progress
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_SHA|$(git rev-parse HEAD)"
          echo "WRITER_PROCESSES_BEGIN"
          ps -eo pid,etime,cmd | grep -E 'repair_july_quota_representatives|refresh_july_quota_read_models|ims_import_worker.py' | grep -v grep || true
          echo "WRITER_PROCESSES_END"
          echo "LOCK_HOLDERS_BEGIN"
          command -v fuser >/dev/null && fuser -v instance/representative_snapshot_warmup.lock 2>&1 || true
          echo "LOCK_HOLDERS_END"
          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          import sqlalchemy as sa
          from app import create_app
          from app.extensions import db
          from app.services.persistent_representative_snapshot_service import representative_snapshot_sets, representative_snapshots
          app=create_app()
          with app.app_context():
              rows=db.session.execute(
                  sa.select(
                      representative_snapshot_sets.c.id,
                      representative_snapshot_sets.c.status,
                      representative_snapshot_sets.c.representative_count,
                      representative_snapshot_sets.c.source_upload_id,
                      representative_snapshot_sets.c.production_upload_id,
                      representative_snapshot_sets.c.created_at,
                      representative_snapshot_sets.c.activated_at,
                  ).where(
                      representative_snapshot_sets.c.year==2026,
                      representative_snapshot_sets.c.month==7,
                      representative_snapshot_sets.c.source_upload_id==44,
                      representative_snapshot_sets.c.production_upload_id==9,
                  ).order_by(representative_snapshot_sets.c.id.desc()).limit(8)
              ).all()
              for row in rows:
                  count=int(db.session.execute(
                      sa.select(sa.func.count()).select_from(representative_snapshots).where(
                          representative_snapshots.c.set_id==int(row.id)
                      )
                  ).scalar() or 0)
                  print(
                      f"JULY_SET|id={row.id}|status={row.status}|rows={count}|"
                      f"declared={row.representative_count}|created={row.created_at}|activated={row.activated_at}"
                  )
          PY
          REMOTE
