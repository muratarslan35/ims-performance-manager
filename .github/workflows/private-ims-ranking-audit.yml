name: Private IMS Acnemix monthly reconciliation v4
on:
  push:
    branches:
      - audit/ims-ranking-source-20260929
    paths:
      - ".github/workflows/private-ims-ranking-audit.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure read-only IMS SSH
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_audit_key
          chmod 600 ~/.ssh/ims_audit_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Reconcile three representatives and monthly sources
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$RUNNER_TEMP/audit_public.b64" <<'PUBLIC_KEY'
          
          PUBLIC_KEY
          openssl base64 -d -A -in "$RUNNER_TEMP/audit_public.b64" -out "$RUNNER_TEMP/audit_public.der"
          openssl pkey -pubin -inform DER -in "$RUNNER_TEMP/audit_public.der" -out "$RUNNER_TEMP/audit_public.pem"
          set +e
          ssh -i ~/.ssh/ims_audit_key -p "$IMS_PORT" -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=60 "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" > "$RUNNER_TEMP/report.json" 2> "$RUNNER_TEMP/remote.err" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          export PYTHONPATH="$IMS_PATH${PYTHONPATH:+:$PYTHONPATH}"
          venv/bin/python - <<'PYTHON'
          import json
          from collections import defaultdict
          from decimal import Decimal
          from sqlalchemy import desc
          from app import create_app
          from app.extensions import db
          from app.models import IMSUpload,IMSSummary,Product,Representative,ProductionResultUpload,ProductionResult
          from app.services.persistent_dashboard_snapshot_service import PersistentDashboardSnapshotService
          from config import Config
          app=create_app(Config)
          def norm(v): return "".join(ch for ch in str(v or "").upper() if ch.isalnum())
          with app.app_context():
              output={"product":"ACNEMIX","year":2026,"months":[],"snapshots":[]}
              latest=PersistentDashboardSnapshotService.get_generation_for_upload(2026,9,52)
              products=(latest.get("ytd_product_rankings") or {}).get("products") or []
              acnemix=next((x for x in products if norm(x.get("product_key") or x.get("product_name"))=="ACNEMIX"),None)
              chosen={}
              for item in (acnemix or {}).get("rankings",[])[:3]:
                  rid=int(item["representative_id"])
                  rep=db.session.get(Representative,rid)
                  if rep is None: raise RuntimeError("snapshot_representative_missing:"+str(rid))
                  chosen[rid]=rep
              if len(chosen)!=3: raise RuntimeError("top_three_snapshot_missing")
              prod=next((p for p in Product.query.filter(Product.is_active.is_(True)).all() if norm(p.product_name)=="ACNEMIX"),None)
              if prod is None: raise RuntimeError("acnemix_product_mapping_failed")
              pid=int(prod.id)
              sums={rid:Decimal("0") for rid in chosen}
              for month in range(1,10):
                  uploads=ProductionResultUpload.query.filter_by(
                      year=2026,month=month,status=ProductionResultUpload.STATUS_APPLIED
                  ).order_by(ProductionResultUpload.production_stage.desc(),
                      ProductionResultUpload.applied_at.desc(),ProductionResultUpload.id.desc()).all()
                  chosen_upload=uploads[0] if uploads else None
                  month_item={"month":month,"source_by_person":{}}
                  for rid,rep in chosen.items():
                      value=None; source="IMS fallback"; file_name=None; upload_id=None
                      if chosen_upload is not None:
                          row=ProductionResult.query.filter_by(
                              upload_id=chosen_upload.id,representative_id=rid,product_id=pid
                          ).first()
                          if row is not None and row.actual_unit is not None:
                              value=Decimal(str(row.actual_unit))
                              source=f"Üretim {chosen_upload.production_stage}. aşama"
                              file_name=chosen_upload.file_name
                              upload_id=int(chosen_upload.id)
                      if value is None:
                          imsrow=IMSSummary.query.filter_by(
                              year=2026,month=month,representative_id=rid,product_id=pid
                          ).order_by(desc(IMSSummary.upload_id),desc(IMSSummary.id)).first()
                          value=Decimal(str((imsrow.unit if imsrow else 0) or 0))
                          source=("IMS #"+str(imsrow.upload_id) if imsrow else "IMS kaydı yok; 0")
                      sums[rid]+=value
                      month_item["source_by_person"][rep.rep_name]={
                          "boxes":round(float(value),2),"source":source,"file":file_name,"upload_id":upload_id
                      }
                  output["months"].append(month_item)
                  ims_id,production_id=PersistentDashboardSnapshotService.source_identity(2026,month)
                  snap=PersistentDashboardSnapshotService.get_generation_for_source(2026,month,ims_id,production_id)
                  if snap is None:
                      output["snapshots"].append({"month":month,"available":False})
                  else:
                      ranking_products=(snap.get("ytd_product_rankings") or {}).get("products") or []
                      p=next((x for x in ranking_products if norm(x.get("product_key") or x.get("product_name"))=="ACNEMIX"),None)
                      values={int(x.get("representative_id")):float(x.get("total_unit") or 0) for x in (p or {}).get("rankings",[]) if x.get("representative_id") is not None}
                      cumulative={rep.rep_name:round(float(sums[rid]),2) for rid,rep in chosen.items()}
                      in_snapshot={rep.rep_name:values.get(rid) for rid,rep in chosen.items()}
                      match={name:(None if in_snapshot[name] is None else abs(cumulative[name]-in_snapshot[name])<=0.01) for name in cumulative}
                      output["snapshots"].append({"month":month,"available":True,"cumulative":cumulative,"snapshot_ytd":in_snapshot,"matches":match})
              output["monthly_sum_ytd"]={rep.rep_name:round(float(sums[rid]),2) for rid,rep in chosen.items()}
              output["snapshot_top3"]=[{"rank":x.get("rank"),"representative":x.get("representative_name"),"boxes":x.get("total_unit")} for x in (acnemix or {}).get("rankings",[])[:3]]
              reconstructed=sorted([{"representative":rep.rep_name,"boxes":round(float(sums[rid]),2)} for rid,rep in chosen.items()],key=lambda x:x["boxes"],reverse=True)
              output["reconstructed_order"]=[x["representative"] for x in reconstructed]
              output["order_matches_snapshot"]=output["reconstructed_order"]==[x["representative"] for x in output["snapshot_top3"]]
          print(json.dumps(output,ensure_ascii=False,separators=(",",":")))
          PYTHON
          REMOTE
          SSH_STATUS=$?
          set -e
          if [ "$SSH_STATUS" -ne 0 ]; then
            python3 - "$RUNNER_TEMP/report.json" "$RUNNER_TEMP/remote.err" "$SSH_STATUS" <<'ERRPY'
          import base64,json,sys
          from pathlib import Path
          json.dump({"remote_exit":int(sys.argv[3]),"stdout_b64":base64.b64encode(Path(sys.argv[1]).read_bytes()).decode(),"stderr_b64":base64.b64encode(Path(sys.argv[2]).read_bytes()).decode()},open(sys.argv[1],"w"))
          ERRPY
          fi
          AES_KEY=$(openssl rand -hex 32)
          MAC_KEY=$(openssl rand -hex 32)
          IV=$(openssl rand -hex 16)
          openssl enc -aes-256-cbc -K "$AES_KEY" -iv "$IV" -in "$RUNNER_TEMP/report.json" -out "$RUNNER_TEMP/report.enc"
          printf '%s%s' "$AES_KEY" "$MAC_KEY" | xxd -r -p > "$RUNNER_TEMP/key.bin"
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/audit_public.pem" -in "$RUNNER_TEMP/key.bin" -out "$RUNNER_TEMP/key.enc" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          HMAC=$(openssl dgst -sha256 -mac HMAC -macopt hexkey:"$MAC_KEY" -binary "$RUNNER_TEMP/report.enc" | openssl base64 -A)
          WRAPPED_KEY=$(openssl base64 -A < "$RUNNER_TEMP/key.enc")
          CIPHERTEXT=$(openssl base64 -A < "$RUNNER_TEMP/report.enc")
          echo "AUDIT_CIPHER|iv=$IV|wrapped_key=$WRAPPED_KEY|hmac=$HMAC|ciphertext=$CIPHERTEXT"
