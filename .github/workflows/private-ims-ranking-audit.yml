name: Private IMS ranking query comparison with representative filter
on:
  push:
    branches:
      - audit/ims-ranking-source-20260929
    paths:
      - ".github/workflows/private-ims-ranking-audit.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure IMS read-only SSH
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_audit_key
          chmod 600 ~/.ssh/ims_audit_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Reconcile source workbooks and rankings
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$RUNNER_TEMP/audit_public.b64" <<'PUBLIC_KEY'
          
          PUBLIC_KEY
          openssl base64 -d -A -in "$RUNNER_TEMP/audit_public.b64" -out "$RUNNER_TEMP/audit_public.der"
          openssl pkey -pubin -inform DER -in "$RUNNER_TEMP/audit_public.der" -out "$RUNNER_TEMP/audit_public.pem"
          set +e
          ssh -i ~/.ssh/ims_audit_key -p "$IMS_PORT" -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=60 "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" > "$RUNNER_TEMP/ims-audit.json" 2> "$RUNNER_TEMP/ims-audit-remote.err" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          export PYTHONPATH="$IMS_PATH${PYTHONPATH:+:$PYTHONPATH}"
          venv/bin/python - <<'PYTHON'
          import json, math
          from collections import defaultdict
          from app import create_app
          from app.models import IMSUpload
          from app.services.persistent_dashboard_snapshot_service import PersistentDashboardSnapshotService
          from app.query.dashboard_query import DashboardQuery
          from config import Config
          app=create_app(Config)
          out={"products":[]}
          with app.app_context():
              u=IMSUpload.query.filter_by(id=52).one()
              payload=PersistentDashboardSnapshotService.get_generation_for_upload(2026,9,52)
              if payload is None: raise RuntimeError("snapshot_missing")
              snap=payload.get("ytd_product_rankings") or {}
              expected={}
              for item in snap.get("products") or []:
                  k="".join(ch for ch in str(item.get("product_key") or item.get("product_name") or "").upper() if ch.isalnum())
                  expected[k]=item.get("rankings") or []
              rows=DashboardQuery().load_ytd_product_rankings(2026,9)
              groups=defaultdict(list)
              def vacant(name):
                  text=str(name or "").upper().replace("Ş","S").replace("Ö","O")
                  tokens={token for token in text.replace("-"," ").split() if token}
                  return bool({"BOS","KADRO"} & tokens)
              for r in rows:
                  if vacant(r.representative_name): continue
                  k="".join(ch for ch in str(r.product_name or "").upper() if ch.isalnum())
                  groups[k].append(r)
              for key,screen_rows in expected.items():
                  calc=groups.get(key,[])
                  calculated=[{"rank":i+1,"representative_id":int(r.representative_id),"representative_name":r.representative_name,
                               "units":float(r.total_unit),"display_units":int(math.floor(float(r.total_unit)+0.5))}
                              for i,r in enumerate(calc[:10])]
                  screen=[{"rank":int(r.get("rank") or i+1),"representative_id":int(r.get("representative_id")),
                           "representative_name":r.get("representative_name"),"units":float(r.get("total_unit") or 0),
                           "display_units":int(math.floor(float(r.get("total_unit") or 0)+0.5))}
                          for i,r in enumerate(screen_rows[:10])]
                  matches=len(screen)==10 and len(calculated)==10 and all(
                      a["representative_id"]==b["representative_id"] and a["display_units"]==b["display_units"]
                      and abs(a["units"]-b["units"])<=0.01 for a,b in zip(calculated,screen))
                  out["products"].append({"product":key,"matches":matches,"checked":10,"calculated":calculated,"screen":screen})
              out["ims_upload"]={"id":u.id,"status":u.status,"week":u.week_number,"reconciliation":u.reconciliation_status}
          print(json.dumps(out,ensure_ascii=False,separators=(",",":")))
          PYTHON
          REMOTE
          SSH_STATUS=$?
          set -e
          if [ "$SSH_STATUS" -ne 0 ]; then
            python3 - "$RUNNER_TEMP/ims-audit.json" "$RUNNER_TEMP/ims-audit-remote.err" "$SSH_STATUS" <<'ERRPY'
          import base64,json,sys
          from pathlib import Path
          json.dump({"remote_exit":int(sys.argv[3]),"stdout_b64":base64.b64encode(Path(sys.argv[1]).read_bytes()).decode(),"stderr_b64":base64.b64encode(Path(sys.argv[2]).read_bytes()).decode()},open(sys.argv[1],"w"))
          ERRPY
          fi
          AES_KEY=$(openssl rand -hex 32)
          MAC_KEY=$(openssl rand -hex 32)
          IV=$(openssl rand -hex 16)
          openssl enc -aes-256-cbc -K "$AES_KEY" -iv "$IV" -in "$RUNNER_TEMP/ims-audit.json" -out "$RUNNER_TEMP/ims-audit.enc"
          printf '%s%s' "$AES_KEY" "$MAC_KEY" | xxd -r -p > "$RUNNER_TEMP/ims-audit-key.bin"
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/audit_public.pem" -in "$RUNNER_TEMP/ims-audit-key.bin" -out "$RUNNER_TEMP/ims-audit-key.enc" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          HMAC=$(openssl dgst -sha256 -mac HMAC -macopt hexkey:"$MAC_KEY" -binary "$RUNNER_TEMP/ims-audit.enc" | openssl base64 -A)
          WRAPPED_KEY=$(openssl base64 -A < "$RUNNER_TEMP/ims-audit-key.enc")
          CIPHERTEXT=$(openssl base64 -A < "$RUNNER_TEMP/ims-audit.enc")
          echo "AUDIT_CIPHER|iv=$IV|wrapped_key=$WRAPPED_KEY|hmac=$HMAC|ciphertext=$CIPHERTEXT"
