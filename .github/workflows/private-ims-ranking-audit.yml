name: Private IMS ranking source audit
on:
  push:
    branches:
      - audit/ims-ranking-source-20260929
    paths:
      - ".github/workflows/private-ims-ranking-audit.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure IMS read-only SSH
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_audit_key
          chmod 600 ~/.ssh/ims_audit_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Reconcile source workbooks and rankings
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$RUNNER_TEMP/audit_public.b64" <<'PUBLIC_KEY'
          
          PUBLIC_KEY
          openssl base64 -d -A -in "$RUNNER_TEMP/audit_public.b64" -out "$RUNNER_TEMP/audit_public.der"
          openssl pkey -pubin -inform DER -in "$RUNNER_TEMP/audit_public.der" -out "$RUNNER_TEMP/audit_public.pem"
          set +e
          ssh -i ~/.ssh/ims_audit_key -p "$IMS_PORT" -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=60 "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" > "$RUNNER_TEMP/ims-audit.json" 2> "$RUNNER_TEMP/ims-audit-remote.err" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          export PYTHONPATH="$IMS_PATH${PYTHONPATH:+:$PYTHONPATH}"
          venv/bin/python - <<'PYTHON'
          import hashlib, json, math
          from collections import defaultdict
          from decimal import Decimal
          from pathlib import Path
          from sqlalchemy import desc
          from app import create_app
          from app.extensions import db
          from app.models import (
              IMSUpload, IMSSummary, Product, Representative, Target,
              ProductionResultUpload, ProductionResult, ProductionRepresentativeTotal,
          )
          from app.services.persistent_dashboard_snapshot_service import PersistentDashboardSnapshotService
          from app.services.production_result_import_service import ProductionResultImportService
          from app.services.production_result_reconciliation_gate import _reconcile
          from app.services.production_result_service import ProductionResultService
          from app.query.dashboard_query import DashboardQuery
          from app.query.filters import DashboardFilterParams
          from app.formatters.dashboard_formatter import DashboardFormatter
          from config import Config

          app = create_app(Config)
          output = {"period":"2026-01..08 production + 2026-09 IMS upload 52","errors":[]}
          def norm(value):
              return "".join(ch for ch in str(value or "").upper() if ch.isalnum())
          def vacancy(name):
              text=str(name or "").upper().replace("Ş","S").replace("Ö","O")
              tokens={x for x in text.replace("-"," ").split() if x}
              return bool({"BOS","KADRO"} & tokens)
          def sha256(path):
              h=hashlib.sha256()
              with Path(path).open("rb") as f:
                  for chunk in iter(lambda:f.read(1024*1024),b""): h.update(chunk)
              return h.hexdigest()

          with app.app_context():
              upload=IMSUpload.query.filter_by(id=52).one_or_none()
              if upload is None:
                  raise RuntimeError("ims_upload_52_missing")
              output["ims_upload"]={
                  "id":upload.id,"year":upload.year,"month":upload.month,"week":upload.week_number,
                  "status":upload.status,"reconciliation":upload.reconciliation_status,
                  "raw_rows":upload.raw_record_count,"fact_rows":upload.fact_record_count,
                  "summary_rows":upload.summary_record_count,"file_name":upload.file_name
              }
              ims_id, production_id=PersistentDashboardSnapshotService.source_identity(2026,9)
              payload=PersistentDashboardSnapshotService.get_generation_for_upload(2026,9,52)
              output["snapshot_source"]={"ims_upload_id":ims_id,"production_upload_id":production_id}
              if payload is None: raise RuntimeError("dashboard_snapshot_missing")
              ytd=payload.get("ytd_product_rankings") or {}
              output["snapshot_period"]={"year":ytd.get("year"),"through_month":ytd.get("through_month")}
              output["product_count_in_snapshot"]=len(ytd.get("products") or [])

              products=Product.query.filter(Product.is_active.is_(True)).all()
              representatives=Representative.query.filter(Representative.active.is_(True)).all()
              product_by_id={int(x.id):x for x in products}
              rep_by_id={int(x.id):x for x in representatives}
              output["active_product_names"]=[x.product_name for x in sorted(products,key=lambda x:(x.display_order or 0,x.product_name))]
              output["active_representative_count"]=len(representatives)

              # Parse the protected source workbook for every APPLIED Jan-Aug file,
              # verify its stored hash, then reconcile parser rows against persisted result rows.
              prod_uploads=ProductionResultUpload.query.filter(
                  ProductionResultUpload.year==2026,
                  ProductionResultUpload.month>=1,
                  ProductionResultUpload.month<=8,
                  ProductionResultUpload.status==ProductionResultUpload.STATUS_APPLIED,
              ).order_by(
                  ProductionResultUpload.month.asc(),
                  ProductionResultUpload.production_stage.desc(),
                  ProductionResultUpload.applied_at.desc(),
                  ProductionResultUpload.id.desc(),
              ).all()
              upload_root=Path(app.config["UPLOAD_FOLDER"])/"production_results"
              parsed_by_upload={}
              audited=[]
              for pu in prod_uploads:
                  try:
                      path=upload_root/str(pu.stored_file_name or "")
                      if not path.is_file(): raise RuntimeError("source_missing")
                      if sha256(path)!=str(pu.source_hash or ""): raise RuntimeError("hash_mismatch")
                      report=ProductionResultImportService(path,pu.year,pu.month,production_stage=pu.production_stage).parse()
                      _reconcile(pu,report)
                      db.session.rollback()
                      parsed_by_upload[int(pu.id)]=report.product_results
                      audited.append({
                          "id":pu.id,"month":pu.month,"stage":pu.production_stage,
                          "file":pu.file_name,"rows":pu.row_count,"matched":pu.matched_row_count,
                          "source_hash":"PASS","excel_db_reconciliation":"PASS"
                      })
                  except Exception as exc:
                      db.session.rollback()
                      audited.append({
                          "id":pu.id,"month":pu.month,"stage":pu.production_stage,
                          "file":pu.file_name,"source_hash":"FAIL" if "hash" in str(exc) or "source" in str(exc) else "CHECK",
                          "excel_db_reconciliation":"FAIL","failure_type":type(exc).__name__
                      })
              output["production_source_audits"]=audited

              # The YTD query gives each month to its highest-priority applied
              # production file when a matching rep/product row exists, otherwise
              # it falls back to that month's IMS summary; Sep is the current IMS.
              by_month=defaultdict(list)
              for pu in prod_uploads: by_month[int(pu.month)].append(pu)
              winners={}
              for month in range(1,9):
                  if by_month.get(month): winners[month]=by_month[month][0]
              output["production_month_coverage"]=[
                  {"month":m,"selected_upload_id":getattr(winners.get(m),"id",None),
                   "stage":getattr(winners.get(m),"production_stage",None),
                   "file":getattr(winners.get(m),"file_name",None),
                   "applied_file_count":len(by_month.get(m,[]))}
                  for m in range(1,9)
              ]

              summary_rows=IMSSummary.query.filter(
                  IMSSummary.year==2026,IMSSummary.month<=9,
                  IMSSummary.representative_id.in_(rep_by_id),
                  IMSSummary.product_id.in_(product_by_id),
              ).all()
              summary_by_key={(int(x.month),int(x.representative_id),int(x.product_id)):x for x in summary_rows}
              output["september_ims_summary"]={
                  "rows":sum(1 for x in summary_rows if int(x.month)==9),
                  "upload_ids":sorted({int(x.upload_id or 0) for x in summary_rows if int(x.month)==9}),
                  "upload_52_rows":sum(1 for x in summary_rows if int(x.month)==9 and int(x.upload_id or 0)==52)
              }

              source_rows={}
              source_keys=set(summary_by_key)
              for month in range(1,9):
                  for pu in by_month.get(month,[]):
                      for row in parsed_by_upload.get(int(pu.id),[]):
                          if int(row["representative_id"]) in rep_by_id and int(row["product_id"]) in product_by_id:
                              key=(month,int(row["representative_id"]),int(row["product_id"]))
                              source_keys.add(key)
                              source_rows.setdefault(key, (pu,row))
              totals=defaultdict(Decimal)
              source_counts=defaultdict(int)
              for month,rid,pid in source_keys:
                  selected=source_rows.get((month,rid,pid))
                  if selected is not None and selected[1].get("actual_unit") is not None:
                      actual=Decimal(str(selected[1].get("actual_unit") or 0))
                      source_counts[f"{month}:production_stage_{selected[0].production_stage}"]+=1
                  else:
                      summary=summary_by_key.get((month,rid,pid))
                      actual=Decimal(str((summary.unit if summary else 0) or 0))
                      source_counts[f"{month}:IMS_fallback"]+=1
                  totals[(rid,pid)]+=actual
              ytd_source={}
              expected_products=("TRAVAZOL","MONUROL","MIXOVUL","ACNEMIX","STIDERM","BRIMODER","FENTIVAG")
              for key in expected_products:
                  pid_matches=[pid for pid,p in product_by_id.items() if norm(p.product_name)==key]
                  if len(pid_matches)!=1:
                      output["errors"].append(f"product_mapping_{key}_{len(pid_matches)}")
                      ytd_source[key]=[]
                      continue
                  pid=pid_matches[0]
                  rows=[]
                  for (rid,this_pid),value in totals.items():
                      rep=rep_by_id.get(rid)
                      if this_pid!=pid or rep is None or value<=0 or not rep.rep_name or vacancy(rep.rep_name): continue
                      rows.append({"representative_id":rid,"representative_name":rep.rep_name,
                                   "city":rep.city or "-","region":rep.region or "-",
                                   "source_units":round(float(value),2),
                                   "display_units":int(math.floor(float(value)+0.5))})
                  rows.sort(key=lambda r:(-r["source_units"],r["representative_name"]))
                  ytd_source[key]=[{ "rank":i+1,**r } for i,r in enumerate(rows[:10])]
              output["production_and_ims_source_counts"]=dict(source_counts)
              output["ytd_source_top10"]=ytd_source
              ytd_snap={}
              for item in ytd.get("products") or []:
                  k=norm(item.get("product_key") or item.get("product_name"))
                  ytd_snap[k]=[
                      {"rank":r.get("rank"),"representative_id":r.get("representative_id"),
                       "representative_name":r.get("representative_name"),
                       "source_units":r.get("total_unit"),"display_units":int(math.floor(float(r.get("total_unit") or 0)+0.5))}
                      for r in item.get("rankings") or []
                  ]
              output["ytd_snapshot_top10"]=ytd_snap
              output["ytd_source_matches_snapshot"]={
                  k:(ytd_source.get(k,[])==ytd_snap.get(k,[])) for k in expected_products
              }

              # Recompute the monthly Sep ranking from targets + current accepted
              # actual source, then compare it to the already-published dashboard.
              sep_targets=Target.query.join(Representative,Representative.id==Target.representative_id).filter(
                  Target.year==2026,Target.month==9,Representative.active.is_(True)
              ).all()
              quota_ids=DashboardQuery()._quota_ids(2026,9)
              sep_uploads=ProductionResultService.applied_uploads(2026,9)
              sep_prod={}
              if sep_uploads:
                  order={int(x.id):i for i,x in enumerate(sep_uploads)}
                  rows=ProductionResult.query.filter(
                      ProductionResult.upload_id.in_(list(order)),
                      ProductionResult.representative_id.in_(rep_by_id),
                  ).all()
                  for row in sorted(rows,key=lambda x:order[int(x.upload_id)]):
                      sep_prod.setdefault((int(row.representative_id),int(row.product_id)),row)
              sep_summaries=IMSSummary.query.filter(
                  IMSSummary.year==2026,IMSSummary.month==9,
                  IMSSummary.representative_id.in_(rep_by_id)
              ).order_by(desc(IMSSummary.upload_id),desc(IMSSummary.id)).all()
              sep_summary={}
              for row in sep_summaries: sep_summary.setdefault((int(row.representative_id),int(row.product_id)),row)
              by_rep=defaultdict(lambda:[Decimal("0"),Decimal("0")])
              for t in sep_targets:
                  rid,pid=int(t.representative_id),int(t.product_id)
                  target=Decimal(str(t.tl_target or 0))
                  pr=sep_prod.get((rid,pid))
                  sm=sep_summary.get((rid,pid))
                  actual=target if pid in quota_ids else Decimal(str((pr.actual_tl if pr else sm.tl if sm else 0) or 0))
                  by_rep[rid][0]+=actual
                  by_rep[rid][1]+=target
              final_upload=ProductionResultService.final_upload(2026,9)
              if final_upload is not None:
                  official={int(x.representative_id):x for x in ProductionRepresentativeTotal.query.filter(
                      ProductionRepresentativeTotal.upload_id==int(final_upload.id),
                      ProductionRepresentativeTotal.representative_id.in_(rep_by_id)
                  ).all()}
              else: official={}
              monthly=[]
              for rid,(actual,target) in by_rep.items():
                  rep=rep_by_id.get(rid)
                  if rep is None: continue
                  off=official.get(rid)
                  if off is not None:
                      actual=Decimal(str(off.actual_tl or 0))
                      target=Decimal(str(off.target_tl or 0))
                  pct=round(float(actual)*100/float(target),1) if target>0 else 0.0
                  shown_tl=int(round(float(actual)))
                  monthly.append({"representative_id":rid,"rep_name":rep.rep_name,"city":rep.city or "-",
                                  "actual_tl":round(float(actual),2),"target_tl":round(float(target),2),
                                  "display_tl":shown_tl,"realization_percent":pct})
              monthly.sort(key=lambda x:(-x["realization_percent"],-x["display_tl"],x["rep_name"]))
              monthly_source=monthly[:10]
              monthly_snap=payload.get("top_representatives") or []
              output["september_monthly_source_top10"]=monthly_source
              output["september_monthly_snapshot_top10"]=monthly_snap
              output["september_monthly_source_matches_snapshot"]=[
                  {
                      "rank":i+1,
                      "matches":(
                          (s.get("rep_name")==m.get("rep_name"))
                          and (abs(float(s.get("realization_percent") or 0)-float(m.get("realization_percent") or 0))<0.051)
                          and (int(s.get("display_tl") or 0)==int(m.get("total_tl") or 0))
                      )
                  }
                  for i,(s,m) in enumerate(zip(monthly_source,monthly_snap))
              ]
              output["monthly_target_row_count"]=len(sep_targets)
              output["monthly_snapshot_row_count"]=len(monthly_snap)
              output["monthly_production_uploads"]=[
                  {"id":x.id,"stage":x.production_stage,"file":x.file_name,"status":x.status}
                  for x in sep_uploads
              ]
              output["quota_product_names"]=[product_by_id[x].product_name for x in sorted(quota_ids) if x in product_by_id]

              output["production_file_audit_complete"]=(
                  len(audited)>0 and len(audited)==len(prod_uploads)
                  and all(x.get("source_hash")=="PASS" and x.get("excel_db_reconciliation")=="PASS" for x in audited)
              )
              output["required_months_present"]=all(m in winners for m in range(1,9))
              output["ims_current_source_ok"]=(
                  upload.status==IMSUpload.STATUS_COMPLETED and int(upload.week_number or 0)==39
                  and upload.reconciliation_status=="PASSED" and ims_id==52
                  and output["september_ims_summary"]["rows"]==output["september_ims_summary"]["upload_52_rows"]
              )
          print(json.dumps(output,ensure_ascii=False,separators=(",",":")))
          PYTHON
          REMOTE
          SSH_STATUS=$?
          set -e
          if [ "$SSH_STATUS" -ne 0 ]; then
            python3 - "$RUNNER_TEMP/ims-audit.json" "$RUNNER_TEMP/ims-audit-remote.err" "$SSH_STATUS" <<'ERRPY'
          import base64,json,sys
          from pathlib import Path
          json.dump({"remote_exit":int(sys.argv[3]),"stdout_b64":base64.b64encode(Path(sys.argv[1]).read_bytes()).decode(),"stderr_b64":base64.b64encode(Path(sys.argv[2]).read_bytes()).decode()},open(sys.argv[1],"w"))
          ERRPY
          fi
          AES_KEY=$(openssl rand -hex 32)
          MAC_KEY=$(openssl rand -hex 32)
          IV=$(openssl rand -hex 16)
          openssl enc -aes-256-cbc -K "$AES_KEY" -iv "$IV" -in "$RUNNER_TEMP/ims-audit.json" -out "$RUNNER_TEMP/ims-audit.enc"
          printf '%s%s' "$AES_KEY" "$MAC_KEY" | xxd -r -p > "$RUNNER_TEMP/ims-audit-key.bin"
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/audit_public.pem" -in "$RUNNER_TEMP/ims-audit-key.bin" -out "$RUNNER_TEMP/ims-audit-key.enc" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          HMAC=$(openssl dgst -sha256 -mac HMAC -macopt hexkey:"$MAC_KEY" -binary "$RUNNER_TEMP/ims-audit.enc" | openssl base64 -A)
          WRAPPED_KEY=$(openssl base64 -A < "$RUNNER_TEMP/ims-audit-key.enc")
          CIPHERTEXT=$(openssl base64 -A < "$RUNNER_TEMP/ims-audit.enc")
          echo "AUDIT_CIPHER|iv=$IV|wrapped_key=$WRAPPED_KEY|hmac=$HMAC|ciphertext=$CIPHERTEXT"
