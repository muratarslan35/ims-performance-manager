name: Region Snapshot Read-Only Health

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/region-snapshot-health.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/region-snapshot-health.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_snapshot_health_key
          chmod 600 ~/.ssh/ims_snapshot_health_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Inspect live region snapshot state
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_snapshot_health_key -p "$IMS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          echo "WORKER_SYSTEMD|$(sudo systemctl is-active ims-import-worker.service)"
          echo "WEB_SYSTEMD|$(sudo systemctl is-active ims-performance-manager.service)"
          echo "WORKER_PROCESSES_BEGIN"
          pgrep -af 'ims_import_worker.py' || true
          echo "WORKER_PROCESSES_END"

          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          import sqlalchemy as sa
          from sqlalchemy import desc
          from app import create_app
          from app.extensions import db
          from app.models import IMSImportJob, IMSUpload
          from app.services.period_service import PeriodService
          from app.services.persistent_region_snapshot_service import (
              PersistentRegionSnapshotService,
              region_snapshot_sets,
              region_snapshots,
          )

          app = create_app()
          with app.app_context():
              period = PeriodService.get_active_period()
              year, month = int(period["year"]), int(period["month"])
              upload_id = int(period.get("upload_id") or 0)
              ims_id, production_id = PersistentRegionSnapshotService.source_identity(year, month)
              keys = PersistentRegionSnapshotService.region_keys(year, month)
              visible = PersistentRegionSnapshotService.get_active_all(year, month)

              print(
                  f"ACTIVE_PERIOD|year={year}|month={month}|visible_upload={upload_id}|"
                  f"source_ims={ims_id}|production={production_id}|region_keys={len(keys)}|"
                  f"visible_regions={len(visible)}"
              )
              print("REGION_KEYS|" + ",".join(keys))
              print("VISIBLE_REGION_KEYS|" + ",".join(sorted(visible.keys())))

              rows = db.session.execute(
                  sa.select(
                      region_snapshot_sets.c.id,
                      region_snapshot_sets.c.status,
                      region_snapshot_sets.c.source_upload_id,
                      region_snapshot_sets.c.production_upload_id,
                      region_snapshot_sets.c.region_count,
                      region_snapshot_sets.c.created_at,
                      region_snapshot_sets.c.activated_at,
                  ).where(
                      region_snapshot_sets.c.year == year,
                      region_snapshot_sets.c.month == month,
                  ).order_by(desc(region_snapshot_sets.c.id))
              ).all()
              for row in rows:
                  actual_count = int(db.session.execute(
                      sa.select(sa.func.count()).select_from(region_snapshots).where(
                          region_snapshots.c.set_id == int(row.id)
                      )
                  ).scalar() or 0)
                  distinct_count = int(db.session.execute(
                      sa.select(sa.func.count(sa.distinct(region_snapshots.c.region_key))).where(
                          region_snapshots.c.set_id == int(row.id)
                      )
                  ).scalar() or 0)
                  print(
                      f"REGION_SET|id={row.id}|status={row.status}|source={row.source_upload_id}|"
                      f"production={row.production_upload_id}|declared={row.region_count}|"
                      f"rows={actual_count}|distinct={distinct_count}|created={row.created_at}|"
                      f"activated={row.activated_at}"
                  )

              recent_jobs = IMSImportJob.query.order_by(IMSImportJob.id.desc()).limit(5).all()
              for job in recent_jobs:
                  print(
                      f"IMPORT_JOB|id={job.id}|status={job.status}|year={job.year}|month={job.month}|"
                      f"upload={job.ims_upload_id}|error={job.error_message or ''}"
                  )

              failed = [row for row in rows if row.status == PersistentRegionSnapshotService.STATUS_FAILED]
              building = [row for row in rows if row.status == PersistentRegionSnapshotService.STATUS_BUILDING]
              active = [row for row in rows if row.status == PersistentRegionSnapshotService.STATUS_ACTIVE]
              print(
                  f"SNAPSHOT_HEALTH|active_sets={len(active)}|building_sets={len(building)}|"
                  f"failed_sets={len(failed)}|visible_regions={len(visible)}|expected_regions={len(keys)}"
              )
          PY

          echo "HISTORICAL_RESULT_AUDIT_BEGIN"
          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          import json
          import sqlalchemy as sa
          from collections import Counter
          from app import create_app
          from app.extensions import db
          from app.models import (
              Product,
              ProductionRegionProductResult,
              ProductionRepresentativeTotal,
              ProductionResultUpload,
              Representative,
          )
          from app.services.persistent_region_snapshot_service import (
              PersistentRegionSnapshotService,
              region_snapshot_sets,
          )
          from app.services.persistent_representative_snapshot_service import (
              PersistentRepresentativeSnapshotService,
              representative_snapshot_sets,
          )
          from app.services.production_result_service import ProductionResultService
          from app.services.region_performance_service import RegionPerformanceService

          def n(value):
              try:
                  return float(value or 0)
              except (TypeError, ValueError):
                  return 0.0

          def pct(actual, target):
              return actual * 100.0 / target if target else 0.0

          app = create_app()
          with app.app_context():
              murat = Representative.query.filter(
                  sa.func.upper(Representative.rep_name) == "MURAT ARSLAN"
              ).first()
              assert murat is not None
              print(f"AUDIT_MURAT|id={murat.id}|region={murat.region}|city={murat.city}")

              for month in range(1, 9):
                  uploads = ProductionResultService.applied_uploads(2026, month)
                  upload_text = ",".join(
                      f"{row.id}:P{row.production_stage}:{row.file_name}" for row in uploads
                  ) or "none"
                  final = uploads[0] if uploads else None
                  print(f"MONTH_SOURCE|2026-{month:02d}|production={upload_text}")

                  ims_id, production_id = PersistentRegionSnapshotService.source_identity(2026, month)
                  region_existing = PersistentRegionSnapshotService._existing_set(
                      2026, month, ims_id, production_id
                  ) if ims_id else None
                  region_payload = PersistentRegionSnapshotService.get_active("901", 2026, month) or {}
                  region_monthly = (((region_payload.get("report") or {}).get("periods") or {}).get("monthly") or {})
                  region_reps = region_monthly.get("representatives") or []
                  region_murat = next(
                      (row for row in region_reps if int(row.get("representative_id") or 0) == int(murat.id)),
                      {}
                  )
                  print(
                      f"REGION_SNAPSHOT|2026-{month:02d}|ims={ims_id}|production={production_id}|"
                      f"set={int(region_existing.id) if region_existing else 0}|"
                      f"set_status={region_existing.status if region_existing else 'NONE'}|"
                      f"version={int(region_payload.get('read_model_version') or 0)}|"
                      f"target={n(region_monthly.get('target_tl')):.2f}|actual={n(region_monthly.get('actual_tl')):.2f}|"
                      f"percent={n(region_monthly.get('percent')):.2f}|"
                      f"murat_target={n(region_murat.get('target_tl')):.2f}|"
                      f"murat_actual={n(region_murat.get('actual_tl')):.2f}|"
                      f"murat_percent={n(region_murat.get('percent')):.2f}"
                  )

                  rep_workspace = PersistentRepresentativeSnapshotService.get_active(
                      murat.id, 2026, month
                  ) or {}
                  rep_monthly = (((rep_workspace.get("snapshots") or {}).get("monthly")) or {})
                  rep_totals = rep_monthly.get("totals") or {}
                  print(
                      f"REP_SNAPSHOT|2026-{month:02d}|target={n(rep_totals.get('target_tl')):.2f}|"
                      f"actual={n(rep_totals.get('actual_tl')):.2f}|percent={n(rep_totals.get('percent')):.2f}|"
                      f"label={rep_monthly.get('result_source_label') or ''}"
                  )

                  effective = ProductionResultService.effective_products(2026, month, murat.id)
                  effective_target = sum(n(row.get("target_tl")) for row in effective.values())
                  effective_actual = sum(n(row.get("actual_tl")) for row in effective.values())
                  source_counts = Counter(str(row.get("source") or "") for row in effective.values())
                  print(
                      f"REP_EFFECTIVE|2026-{month:02d}|target={effective_target:.2f}|actual={effective_actual:.2f}|"
                      f"percent={pct(effective_actual,effective_target):.2f}|sources={dict(source_counts)}"
                  )

                  if final is not None:
                      rep_total = ProductionRepresentativeTotal.query.filter_by(
                          upload_id=final.id, representative_id=murat.id
                      ).first()
                      if rep_total is not None:
                          print(
                              f"PROD_REP_TOTAL|2026-{month:02d}|upload={final.id}|stage={final.production_stage}|"
                              f"target={n(rep_total.target_tl):.2f}|actual={n(rep_total.actual_tl):.2f}|"
                              f"percent={n(rep_total.realization_percent):.2f}|"
                              f"unit_percent={n(rep_total.unit_realization_percent):.2f}|"
                              f"sheet={rep_total.source_sheet}|row={rep_total.source_row}"
                          )
                      region_rows = ProductionRegionProductResult.query.filter_by(
                          upload_id=final.id, region_code="901"
                      ).all()
                      if region_rows:
                          rt = sum(n(row.target_tl) for row in region_rows)
                          ra = sum(n(row.actual_tl) for row in region_rows)
                          print(
                              f"PROD_REGION_901|2026-{month:02d}|upload={final.id}|stage={final.production_stage}|"
                              f"rows={len(region_rows)}|target={rt:.2f}|actual={ra:.2f}|percent={pct(ra,rt):.2f}"
                          )

                  if month == 8:
                      live_report = RegionPerformanceService("901", 2026, 8).report()
                      live_monthly = ((live_report.get("periods") or {}).get("monthly") or {})
                      live_murat = next(
                          (
                              row for row in live_monthly.get("representatives") or []
                              if int(row.get("representative_id") or 0) == int(murat.id)
                          ),
                          {}
                      )
                      print(
                          f"LIVE_RECALC_901|2026-08|target={n(live_monthly.get('target_tl')):.2f}|"
                          f"actual={n(live_monthly.get('actual_tl')):.2f}|percent={n(live_monthly.get('percent')):.2f}|"
                          f"murat_target={n(live_murat.get('target_tl')):.2f}|"
                          f"murat_actual={n(live_murat.get('actual_tl')):.2f}|"
                          f"murat_percent={n(live_murat.get('percent')):.2f}"
                      )

              print("HISTORICAL_SET_IDENTITY_BEGIN")
              for month in range(1, 9):
                  ims_id, production_id = PersistentRegionSnapshotService.source_identity(2026, month)
                  sets = db.session.execute(
                      sa.select(
                          region_snapshot_sets.c.id,
                          region_snapshot_sets.c.source_upload_id,
                          region_snapshot_sets.c.production_upload_id,
                          region_snapshot_sets.c.status,
                          region_snapshot_sets.c.region_count,
                          region_snapshot_sets.c.activated_at,
                      ).where(
                          region_snapshot_sets.c.year == 2026,
                          region_snapshot_sets.c.month == month,
                      ).order_by(region_snapshot_sets.c.id.asc())
                  ).all()
                  print(
                      f"SET_IDENTITY|2026-{month:02d}|current_ims={ims_id}|current_production={production_id}|"
                      + ";".join(
                          f"id={r.id},ims={r.source_upload_id},prod={r.production_upload_id},"
                          f"status={r.status},count={r.region_count},activated={r.activated_at}"
                          for r in sets
                      )
                  )
              print("HISTORICAL_SET_IDENTITY_END")
          PY
          echo "HISTORICAL_RESULT_AUDIT_END"
          echo "AUGUST_SOURCE_FORENSICS_BEGIN"
          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          import json
          import sqlalchemy as sa
          from pathlib import Path
          from app import create_app
          from app.extensions import db
          from app.models import ProductionResultUpload, Representative
          from app.services.persistent_region_snapshot_service import (
              region_snapshot_sets, region_snapshots,
          )
          from app.services.persistent_representative_snapshot_service import (
              representative_snapshot_sets, representative_snapshots,
          )

          def n(value):
              try:
                  return float(value or 0)
              except (TypeError, ValueError):
                  return 0.0

          app = create_app()
          with app.app_context():
              murat = Representative.query.filter(
                  sa.func.upper(Representative.rep_name) == "MURAT ARSLAN"
              ).first()
              assert murat is not None

              uploads = ProductionResultUpload.query.order_by(
                  ProductionResultUpload.year.asc(),
                  ProductionResultUpload.month.asc(),
                  ProductionResultUpload.production_stage.asc(),
                  ProductionResultUpload.id.asc(),
              ).all()
              for row in uploads:
                  print(
                      f"PRODUCTION_UPLOAD_ROW|id={row.id}|period={row.year}-{row.month:02d}|"
                      f"stage={row.production_stage}|status={row.status}|file={row.file_name}|"
                      f"stored={row.stored_file_name}|uploaded={row.uploaded_at}|applied={row.applied_at}|"
                      f"warning={row.warning_message or ''}|error={row.error_message or ''}"
                  )

              root = Path(app.config["UPLOAD_FOLDER"]) / "production_results"
              print(f"PRODUCTION_FOLDER|path={root}|exists={int(root.exists())}")
              if root.exists():
                  for path in sorted(root.iterdir(), key=lambda p: p.name.casefold()):
                      if path.is_file():
                          print(
                              f"PRODUCTION_FILE|name={path.name}|size={path.stat().st_size}|"
                              f"mtime={path.stat().st_mtime}"
                          )

              aug_sets = db.session.execute(
                  sa.select(
                      region_snapshot_sets.c.id,
                      region_snapshot_sets.c.source_upload_id,
                      region_snapshot_sets.c.production_upload_id,
                      region_snapshot_sets.c.status,
                      region_snapshot_sets.c.created_at,
                      region_snapshot_sets.c.activated_at,
                  ).where(
                      region_snapshot_sets.c.year == 2026,
                      region_snapshot_sets.c.month == 8,
                  ).order_by(region_snapshot_sets.c.id.asc())
              ).all()
              for row in aug_sets:
                  raw = db.session.execute(
                      sa.select(region_snapshots.c.payload_json).where(
                          region_snapshots.c.set_id == int(row.id),
                          region_snapshots.c.region_key == "901",
                      )
                  ).scalar()
                  payload = json.loads(raw) if raw else {}
                  monthly = (((payload.get("report") or {}).get("periods") or {}).get("monthly") or {})
                  rep = next(
                      (
                          item for item in monthly.get("representatives") or []
                          if int(item.get("representative_id") or 0) == int(murat.id)
                      ),
                      {},
                  )
                  print(
                      f"AUG_REGION_GENERATION|set={row.id}|ims={row.source_upload_id}|prod={row.production_upload_id}|"
                      f"status={row.status}|created={row.created_at}|activated={row.activated_at}|"
                      f"version={int(payload.get('read_model_version') or 0)}|"
                      f"target={n(monthly.get('target_tl')):.2f}|actual={n(monthly.get('actual_tl')):.2f}|"
                      f"murat_target={n(rep.get('target_tl')):.2f}|murat_actual={n(rep.get('actual_tl')):.2f}"
                  )

              rep_sets = db.session.execute(
                  sa.select(
                      representative_snapshot_sets.c.id,
                      representative_snapshot_sets.c.source_upload_id,
                      representative_snapshot_sets.c.production_upload_id,
                      representative_snapshot_sets.c.status,
                      representative_snapshot_sets.c.created_at,
                      representative_snapshot_sets.c.activated_at,
                  ).where(
                      representative_snapshot_sets.c.year == 2026,
                      representative_snapshot_sets.c.month == 8,
                  ).order_by(representative_snapshot_sets.c.id.asc())
              ).all()
              for row in rep_sets:
                  raw = db.session.execute(
                      sa.select(representative_snapshots.c.payload_json).where(
                          representative_snapshots.c.set_id == int(row.id),
                          representative_snapshots.c.representative_id == int(murat.id),
                      )
                  ).scalar()
                  payload = json.loads(raw) if raw else {}
                  monthly = ((payload.get("snapshots") or {}).get("monthly") or {})
                  totals = monthly.get("totals") or {}
                  print(
                      f"AUG_REP_GENERATION|set={row.id}|ims={row.source_upload_id}|prod={row.production_upload_id}|"
                      f"status={row.status}|created={row.created_at}|activated={row.activated_at}|"
                      f"target={n(totals.get('target_tl')):.2f}|actual={n(totals.get('actual_tl')):.2f}|"
                      f"percent={n(totals.get('percent')):.2f}|label={monthly.get('result_source_label') or ''}"
                  )
          PY
          echo "AUGUST_SOURCE_FORENSICS_END"
          echo "JULY_DIYARBAKIR_REP_AUDIT_BEGIN"
          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          import sqlalchemy as sa
          from app import create_app
          from app.extensions import db
          from app.models import ProductionRepresentativeTotal, ProductionResultUpload, Representative
          from app.services.persistent_representative_snapshot_service import PersistentRepresentativeSnapshotService

          def n(v):
              try: return float(v or 0)
              except Exception: return 0.0

          app=create_app()
          with app.app_context():
              upload=(ProductionResultUpload.query
                      .filter_by(year=2026,month=7,status=ProductionResultUpload.STATUS_APPLIED)
                      .order_by(ProductionResultUpload.production_stage.desc(),
                                ProductionResultUpload.applied_at.desc(),
                                ProductionResultUpload.id.desc())
                      .first())
              assert upload is not None
              reps=(Representative.query
                    .filter(Representative.region=="901", Representative.active.is_(True))
                    .order_by(Representative.rep_name.asc()).all())
              print(f"JULY_SOURCE|upload={upload.id}|stage={upload.production_stage}|file={upload.file_name}|rep_count={len(reps)}")
              mismatches=0
              for rep in reps:
                  prod=(ProductionRepresentativeTotal.query
                        .filter_by(upload_id=upload.id, representative_id=rep.id).first())
                  ws=PersistentRepresentativeSnapshotService.get_active(rep.id,2026,7) or {}
                  monthly=((ws.get("snapshots") or {}).get("monthly") or {})
                  totals=monthly.get("totals") or {}
                  st=n(totals.get("target_tl")); sa_=n(totals.get("actual_tl")); sp=n(totals.get("percent"))
                  pt=n(prod.target_tl) if prod else 0; pa=n(prod.actual_tl) if prod else 0; pp=n(prod.realization_percent) if prod else 0
                  target_diff=round(st-pt,2) if prod else None
                  actual_diff=round(sa_-pa,2) if prod else None
                  percent_diff=round(sp-pp,2) if prod else None
                  mismatch = bool(prod) and (abs(target_diff)>0.05 or abs(actual_diff)>0.05 or abs(percent_diff)>0.05)
                  if mismatch: mismatches += 1
                  print(
                    f"JULY_REP|id={rep.id}|name={rep.rep_name}|"
                    f"prod_target={pt:.2f}|snap_target={st:.2f}|target_diff={target_diff}|"
                    f"prod_actual={pa:.2f}|snap_actual={sa_:.2f}|actual_diff={actual_diff}|"
                    f"prod_percent={pp:.2f}|snap_percent={sp:.2f}|percent_diff={percent_diff}|"
                    f"mismatch={int(mismatch)}"
                  )
              print(f"JULY_DIYARBAKIR_SUMMARY|reps={len(reps)}|mismatches={mismatches}")
          PY
          echo "JULY_DIYARBAKIR_REP_AUDIT_END"



          echo "RECENT_REGION_SNAPSHOT_ERRORS_BEGIN"
          sudo journalctl -u ims-import-worker.service --since "2026-09-19 16:00:00" --no-pager \
            | grep -E 'region_snapshot|manager_region_snapshots|UNIQUE constraint|IntegrityError' \
            | tail -n 200 || true
          echo "RECENT_REGION_SNAPSHOT_ERRORS_END"
          REMOTE


      - name: Audit historical month routes and July P2 authority
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_snapshot_health_key -p "$IMS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "MONTH_ROUTE_AUDIT_BEGIN"
          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          import json
          import sqlalchemy as sa

          from app import create_app
          from app.extensions import db
          from app.models import (
              ProductionRegionProductResult,
              ProductionRepresentativeTotal,
              ProductionResultUpload,
              Representative,
              User,
          )
          from app.services.persistent_dashboard_snapshot_service import (
              PersistentDashboardSnapshotService,
          )
          from app.services.persistent_region_snapshot_service import (
              PersistentRegionSnapshotService,
              region_snapshot_sets,
          )
          from app.services.persistent_representative_snapshot_service import (
              PersistentRepresentativeSnapshotService,
              representative_snapshot_sets,
          )

          def n(value):
              try:
                  return float(value or 0)
              except (TypeError, ValueError):
                  return 0.0

          def login_as(client, user_id):
              client.application.login_manager.session_protection = None
              with client.session_transaction() as session:
                  session["_user_id"] = str(user_id)
                  session["_fresh"] = True
                  session["portal"] = "manager"

          app = create_app()
          with app.app_context():
              admin = User.query.filter(
                  db.func.lower(User.email) == "admin@ipm.local"
              ).one()
              client = app.test_client()
              login_as(client, admin.id)

              total_routes = 0
              non_200 = []
              for month in range(1, 10):
                  keys = PersistentRegionSnapshotService.region_keys(2026, month)
                  month_bad = []
                  month_ok = 0
                  for key in keys:
                      path = f"/regions/{key}?year=2026&month={month}"
                      response = client.get(path, follow_redirects=False)
                      total_routes += 1
                      location = response.headers.get("Location", "")
                      preparing = "Bölge görünümü hazırlanıyor" in response.get_data(as_text=True)
                      if response.status_code == 200:
                          month_ok += 1
                      else:
                          month_bad.append((key, response.status_code, location, int(preparing)))
                          non_200.append((month, key, response.status_code, location))
                  print(
                      f"MONTH_ROUTE_SUMMARY|2026-{month:02d}|regions={len(keys)}|"
                      f"ok={month_ok}|bad={len(month_bad)}"
                  )
                  for key, status, location, preparing in month_bad:
                      print(
                          f"MONTH_ROUTE_BAD|2026-{month:02d}|region={key}|"
                          f"status={status}|location={location}|preparing={preparing}"
                      )
              print(
                  f"MONTH_ROUTE_TOTAL|routes={total_routes}|non_200={len(non_200)}"
              )

              july = (
                  ProductionResultUpload.query
                  .filter_by(
                      year=2026,
                      month=7,
                      status=ProductionResultUpload.STATUS_APPLIED,
                  )
                  .order_by(
                      ProductionResultUpload.production_stage.desc(),
                      ProductionResultUpload.applied_at.desc(),
                      ProductionResultUpload.id.desc(),
                  )
                  .first()
              )
              assert july is not None
              print(
                  f"JULY_P2_SOURCE|upload={july.id}|stage={july.production_stage}|"
                  f"status={july.status}|file={july.file_name}|applied={july.applied_at}"
              )

              ims_id, production_id = PersistentRegionSnapshotService.source_identity(
                  2026, 7
              )
              exact_region = db.session.execute(
                  sa.select(
                      region_snapshot_sets.c.id,
                      region_snapshot_sets.c.status,
                      region_snapshot_sets.c.region_count,
                      region_snapshot_sets.c.activated_at,
                  ).where(
                      region_snapshot_sets.c.year == 2026,
                      region_snapshot_sets.c.month == 7,
                      region_snapshot_sets.c.source_upload_id == int(ims_id),
                      region_snapshot_sets.c.production_upload_id == int(production_id),
                  ).order_by(region_snapshot_sets.c.id.desc()).limit(1)
              ).first()
              print(
                  f"JULY_REGION_IDENTITY|ims={ims_id}|production={production_id}|"
                  f"exact_set={int(exact_region.id) if exact_region else 0}|"
                  f"exact_status={exact_region.status if exact_region else 'NONE'}|"
                  f"exact_count={int(exact_region.region_count or 0) if exact_region else 0}"
              )

              region_expected = {}
              rows = ProductionRegionProductResult.query.filter_by(
                  upload_id=int(july.id)
              ).all()
              for row in rows:
                  key = str(row.region_code or "").strip()
                  agg = region_expected.setdefault(key, [0.0, 0.0])
                  agg[0] += n(row.target_tl)
                  agg[1] += n(row.actual_tl)

              region_target_mismatch = 0
              region_actual_mismatch = 0
              for key in sorted(region_expected):
                  payload = PersistentRegionSnapshotService.get_active(
                      key, 2026, 7
                  ) or {}
                  monthly = (
                      ((payload.get("report") or {}).get("periods") or {})
                      .get("monthly") or {}
                  )
                  snap_target = n(monthly.get("target_tl"))
                  snap_actual = n(monthly.get("actual_tl"))
                  exp_target, exp_actual = region_expected[key]
                  target_diff = round(snap_target - exp_target, 2)
                  actual_diff = round(snap_actual - exp_actual, 2)
                  if abs(target_diff) > 0.05:
                      region_target_mismatch += 1
                  if abs(actual_diff) > 0.05:
                      region_actual_mismatch += 1
                  print(
                      f"JULY_REGION_COMPARE|region={key}|"
                      f"p2_target={exp_target:.2f}|snap_target={snap_target:.2f}|"
                      f"target_diff={target_diff:.2f}|"
                      f"p2_actual={exp_actual:.2f}|snap_actual={snap_actual:.2f}|"
                      f"actual_diff={actual_diff:.2f}|"
                      f"version={int(payload.get('read_model_version') or 0)}"
                  )
              print(
                  f"JULY_REGION_SUMMARY|regions={len(region_expected)}|"
                  f"target_mismatch={region_target_mismatch}|"
                  f"actual_mismatch={region_actual_mismatch}"
              )

              rep_ims, rep_prod = PersistentRepresentativeSnapshotService.source_identity(
                  2026, 7
              )
              exact_rep = db.session.execute(
                  sa.select(
                      representative_snapshot_sets.c.id,
                      representative_snapshot_sets.c.status,
                      representative_snapshot_sets.c.representative_count,
                      representative_snapshot_sets.c.activated_at,
                  ).where(
                      representative_snapshot_sets.c.year == 2026,
                      representative_snapshot_sets.c.month == 7,
                      representative_snapshot_sets.c.source_upload_id == int(rep_ims),
                      representative_snapshot_sets.c.production_upload_id == int(rep_prod),
                  ).order_by(representative_snapshot_sets.c.id.desc()).limit(1)
              ).first()
              print(
                  f"JULY_REP_IDENTITY|ims={rep_ims}|production={rep_prod}|"
                  f"exact_set={int(exact_rep.id) if exact_rep else 0}|"
                  f"exact_status={exact_rep.status if exact_rep else 'NONE'}|"
                  f"exact_count={int(exact_rep.representative_count or 0) if exact_rep else 0}"
              )

              rep_rows = ProductionRepresentativeTotal.query.filter_by(
                  upload_id=int(july.id)
              ).all()
              rep_actual_mismatch = 0
              rep_target_mismatch = 0
              rep_label_mismatch = 0
              checked = 0
              samples = []
              for prod in rep_rows:
                  rep = db.session.get(Representative, int(prod.representative_id))
                  if rep is None:
                      continue
                  ws = PersistentRepresentativeSnapshotService.get_active(
                      int(rep.id), 2026, 7
                  ) or {}
                  monthly = ((ws.get("snapshots") or {}).get("monthly") or {})
                  totals = monthly.get("totals") or {}
                  snap_target = n(totals.get("target_tl"))
                  snap_actual = n(totals.get("actual_tl"))
                  target_diff = round(snap_target - n(prod.target_tl), 2)
                  actual_diff = round(snap_actual - n(prod.actual_tl), 2)
                  label = str(monthly.get("result_source_label") or "")
                  checked += 1
                  if abs(target_diff) > 0.05:
                      rep_target_mismatch += 1
                  if abs(actual_diff) > 0.05:
                      rep_actual_mismatch += 1
                  if "2. üretim" not in label.lower():
                      rep_label_mismatch += 1
                  if len(samples) < 12 and (
                      abs(target_diff) > 0.05
                      or abs(actual_diff) > 0.05
                      or "2. üretim" not in label.lower()
                  ):
                      samples.append(
                          (
                              rep.id, rep.rep_name, target_diff, actual_diff, label,
                              n(prod.target_tl), snap_target,
                              n(prod.actual_tl), snap_actual,
                          )
                      )
              for sample in samples:
                  print(
                      f"JULY_REP_MISMATCH|id={sample[0]}|name={sample[1]}|"
                      f"target_diff={sample[2]:.2f}|actual_diff={sample[3]:.2f}|"
                      f"label={sample[4]}|p2_target={sample[5]:.2f}|"
                      f"snap_target={sample[6]:.2f}|p2_actual={sample[7]:.2f}|"
                      f"snap_actual={sample[8]:.2f}"
                  )
              print(
                  f"JULY_REP_SUMMARY|checked={checked}|"
                  f"target_mismatch={rep_target_mismatch}|"
                  f"actual_mismatch={rep_actual_mismatch}|"
                  f"label_mismatch={rep_label_mismatch}"
              )

              dash_ims, dash_prod = PersistentDashboardSnapshotService.source_identity(
                  2026, 7
              )
              dash_ready = PersistentDashboardSnapshotService.generation_ready(
                  2026, 7, dash_ims, dash_prod
              )
              print(
                  f"JULY_DASHBOARD_IDENTITY|ims={dash_ims}|production={dash_prod}|"
                  f"exact_generation_ready={int(bool(dash_ready))}"
              )
          PY
          echo "MONTH_ROUTE_AUDIT_END"
