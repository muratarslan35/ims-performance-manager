name: Region Snapshot Read-Only Health

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/region-snapshot-health.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_snapshot_health_key
          chmod 600 ~/.ssh/ims_snapshot_health_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Inspect live region snapshot state
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_snapshot_health_key -p "$IMS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          echo "WORKER_SYSTEMD|$(sudo systemctl is-active ims-import-worker.service)"
          echo "WEB_SYSTEMD|$(sudo systemctl is-active ims-performance-manager.service)"
          echo "WORKER_PROCESSES_BEGIN"
          pgrep -af 'ims_import_worker.py' || true
          echo "WORKER_PROCESSES_END"

          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          import sqlalchemy as sa
          from sqlalchemy import desc
          from app import create_app
          from app.extensions import db
          from app.models import IMSImportJob, IMSUpload
          from app.services.period_service import PeriodService
          from app.services.persistent_region_snapshot_service import (
              PersistentRegionSnapshotService,
              region_snapshot_sets,
              region_snapshots,
          )

          app = create_app()
          with app.app_context():
              period = PeriodService.get_active_period()
              year, month = int(period["year"]), int(period["month"])
              upload_id = int(period.get("upload_id") or 0)
              ims_id, production_id = PersistentRegionSnapshotService.source_identity(year, month)
              keys = PersistentRegionSnapshotService.region_keys(year, month)
              visible = PersistentRegionSnapshotService.get_active_all(year, month)

              print(
                  f"ACTIVE_PERIOD|year={year}|month={month}|visible_upload={upload_id}|"
                  f"source_ims={ims_id}|production={production_id}|region_keys={len(keys)}|"
                  f"visible_regions={len(visible)}"
              )
              print("REGION_KEYS|" + ",".join(keys))
              print("VISIBLE_REGION_KEYS|" + ",".join(sorted(visible.keys())))

              rows = db.session.execute(
                  sa.select(
                      region_snapshot_sets.c.id,
                      region_snapshot_sets.c.status,
                      region_snapshot_sets.c.source_upload_id,
                      region_snapshot_sets.c.production_upload_id,
                      region_snapshot_sets.c.region_count,
                      region_snapshot_sets.c.created_at,
                      region_snapshot_sets.c.activated_at,
                  ).where(
                      region_snapshot_sets.c.year == year,
                      region_snapshot_sets.c.month == month,
                  ).order_by(desc(region_snapshot_sets.c.id))
              ).all()
              for row in rows:
                  actual_count = int(db.session.execute(
                      sa.select(sa.func.count()).select_from(region_snapshots).where(
                          region_snapshots.c.set_id == int(row.id)
                      )
                  ).scalar() or 0)
                  distinct_count = int(db.session.execute(
                      sa.select(sa.func.count(sa.distinct(region_snapshots.c.region_key))).where(
                          region_snapshots.c.set_id == int(row.id)
                      )
                  ).scalar() or 0)
                  print(
                      f"REGION_SET|id={row.id}|status={row.status}|source={row.source_upload_id}|"
                      f"production={row.production_upload_id}|declared={row.region_count}|"
                      f"rows={actual_count}|distinct={distinct_count}|created={row.created_at}|"
                      f"activated={row.activated_at}"
                  )

              recent_jobs = IMSImportJob.query.order_by(IMSImportJob.id.desc()).limit(5).all()
              for job in recent_jobs:
                  print(
                      f"IMPORT_JOB|id={job.id}|status={job.status}|year={job.year}|month={job.month}|"
                      f"upload={job.ims_upload_id}|error={job.error_message or ''}"
                  )

              failed = [row for row in rows if row.status == PersistentRegionSnapshotService.STATUS_FAILED]
              building = [row for row in rows if row.status == PersistentRegionSnapshotService.STATUS_BUILDING]
              active = [row for row in rows if row.status == PersistentRegionSnapshotService.STATUS_ACTIVE]
              print(
                  f"SNAPSHOT_HEALTH|active_sets={len(active)}|building_sets={len(building)}|"
                  f"failed_sets={len(failed)}|visible_regions={len(visible)}|expected_regions={len(keys)}"
              )
          PY

          echo "RECENT_REGION_SNAPSHOT_ERRORS_BEGIN"
          sudo journalctl -u ims-import-worker.service --since "2026-09-19 16:00:00" --no-pager \
            | grep -E 'region_snapshot|manager_region_snapshots|UNIQUE constraint|IntegrityError' \
            | tail -n 200 || true
          echo "RECENT_REGION_SNAPSHOT_ERRORS_END"
          REMOTE
