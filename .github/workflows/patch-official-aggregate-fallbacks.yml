name: Patch official aggregate fallbacks

on:
  push:
    branches: [fix/official-aggregate-main-rebase]
    paths:
      - tools/patch_official_aggregate_fallbacks.py
      - .github/workflows/patch-official-aggregate-fallbacks.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/official-aggregate-main-rebase
      - name: Apply fallback compatibility patch
        run: |
          python tools/patch_official_aggregate_fallbacks.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/query/dashboard_query.py tests/test_official_aggregate_sources.py
          git commit -m "fix: preserve legacy dashboard fallbacks with official aggregates"
          git push origin HEAD:fix/official-aggregate-main-rebase
