name: Audit Week16 Source And Baseline

on:
  push:
    branches:
      - agent/shadow-production-copy-proof
    paths:
      - ".github/workflows/find-week17-source.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Audit week16 source and create persistent diagnostic baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=12 "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain)"

          LIVE_DB="$IMS_PATH/instance/ipm.db"
          BASE_DIR="$IMS_PATH/instance/test-baselines"
          BASE_DB="$BASE_DIR/week17-production-baseline.db"
          META="$BASE_DIR/week17-production-baseline.meta"
          mkdir -p "$BASE_DIR"
          find "$BASE_DIR" -maxdepth 1 -type f -name 'week17-production-baseline.db.tmp.*' -mmin +5 -delete || true

          ids=$(venv/bin/python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:instance/ipm.db?mode=ro',uri=True,timeout=30)
          try:
              rows=c.execute("SELECT id,week_number FROM ims_uploads WHERE year=2026 AND month=4 AND week_number IN (16,17) AND status='COMPLETED' ORDER BY id").fetchall()
              m={int(w):int(i) for i,w in rows}
              jobs=c.execute("SELECT COUNT(*) FROM ims_import_jobs WHERE status IN ('QUEUED','PROCESSING')").fetchone()[0]
              print(m.get(16,0),m.get(17,0),jobs)
          finally: c.close()
          PY
          )
          read -r WEEK16_ID WEEK17_ID ACTIVE_JOBS <<<"$ids"
          echo "WEEK16_AUDIT|UPLOAD_IDS|week16=$WEEK16_ID|week17=$WEEK17_ID|active_jobs=$ACTIVE_JOBS"
          test "$WEEK16_ID" -gt 0
          test "$WEEK17_ID" -gt 0
          test "$ACTIVE_JOBS" -eq 0

          for spec in "week16:$WEEK16_ID" "week17:$WEEK17_ID"; do
            label=${spec%%:*}; id=${spec##*:}
            src="uploads/ims_archive/upload-$id.xlsx"
            if [ ! -f "$src" ]; then src="uploads/ims_archive/upload-$id.xls"; fi
            if [ ! -f "$src" ]; then echo "WEEK16_AUDIT|SOURCE_MISSING|$label|upload_id=$id"; exit 21; fi
            echo "WEEK16_AUDIT|SOURCE|$label|upload_id=$id|path=$src|bytes=$(stat -c '%s' "$src")|sha256=$(sha256sum "$src" | awk '{print $1}')"
          done

          snap="uploads/ims_archive/snapshots/upload-$WEEK17_ID.json"
          test -f "$snap"
          echo "WEEK16_AUDIT|ROLLBACK_SNAPSHOT|path=$snap|bytes=$(stat -c '%s' "$snap")|sha256=$(sha256sum "$snap" | awk '{print $1}')"
          venv/bin/python - "$snap" <<'PY'
          import json,sys,hashlib
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          print(f"WEEK16_AUDIT|SNAPSHOT_META|version={d.get('version')}|year={d.get('year')}|month={d.get('month')}")
          for k in ('targets','summaries','brick_assignments'):
              rows=d.get(k) or []
              h=hashlib.sha256(json.dumps(rows,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest()
              print(f"WEEK16_AUDIT|SNAPSHOT_{k.upper()}|count={len(rows)}|sha256={h}")
          if int(d.get('year') or 0)!=2026 or int(d.get('month') or 0)!=4 or not d.get('summaries'):
              raise SystemExit('invalid rollback snapshot')
          PY

          if [ ! -f "$BASE_DB" ]; then
            size=$(stat -c '%s' "$LIVE_DB")
            free=$(df -B1 "$BASE_DIR" | awk 'NR==2{print $4}')
            required=$((size + 1073741824))
            echo "BASELINE|PREFLIGHT|live_bytes=$size|free_bytes=$free|required_bytes=$required"
            test "$free" -ge "$required"
            tmp="$BASE_DB.tmp.$$"
            rm -f "$tmp"
            venv/bin/python sqlite_online_backup.py "$LIVE_DB" "$tmp"
            mv "$tmp" "$BASE_DB"
            sha=$(sha256sum "$BASE_DB" | awk '{print $1}')
            bytes=$(stat -c '%s' "$BASE_DB")
            printf 'sha256=%s\nbytes=%s\nweek17_upload_id=%s\n' "$sha" "$bytes" "$WEEK17_ID" > "$META"
            chmod 444 "$BASE_DB" "$META"
            echo "BASELINE|CREATED|path=$BASE_DB|bytes=$bytes|sha256=$sha"
          else
            test -f "$META"
            expected=$(awk -F= '$1=="sha256"{print $2}' "$META")
            actual=$(sha256sum "$BASE_DB" | awk '{print $1}')
            test "$expected" = "$actual"
            echo "BASELINE|REUSED|path=$BASE_DB|bytes=$(stat -c '%s' "$BASE_DB")|sha256=$actual"
          fi

          venv/bin/python - "$BASE_DB" <<'PY'
          import sqlite3,sys
          c=sqlite3.connect(f'file:{sys.argv[1]}?mode=ro',uri=True,timeout=30)
          try:
              ok=c.execute('PRAGMA integrity_check').fetchone()[0]
              latest=c.execute("SELECT id,year,month,week_number,status FROM ims_uploads WHERE status='COMPLETED' ORDER BY year DESC,month DESC,week_number DESC,id DESC LIMIT 1").fetchone()
              jobs=c.execute("SELECT COUNT(*) FROM ims_import_jobs WHERE status IN ('QUEUED','PROCESSING')").fetchone()[0]
              print(f'BASELINE|VERIFY|integrity={ok}|latest={latest}|active_jobs={jobs}')
              if ok!='ok' or not latest or int(latest[3])!=17 or jobs!=0: raise SystemExit('baseline verify failed')
          finally: c.close()
          PY
          echo "WEEK16_BASELINE_AUDIT|PASS"
          REMOTE
