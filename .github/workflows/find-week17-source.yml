name: Find Week17 Source Read Only

on:
  push:
    branches:
      - agent/shadow-production-copy-proof
    paths:
      - ".github/workflows/find-week17-source.yml"

permissions:
  contents: read

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Search week17 source without writes
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" -o BatchMode=yes -o ConnectTimeout=20 "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "SOURCE_SEARCH|LIVE_COMMIT|$(git rev-parse HEAD)"
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain)"
          exact=""
          for p in uploads/ims_archive/upload-32.xlsx uploads/ims_archive/upload-32.xls; do
            if [ -f "$p" ]; then exact="$p"; break; fi
          done
          if [ -n "$exact" ]; then
            echo "SOURCE_SEARCH|ARCHIVE_EXACT|FOUND|$exact|bytes=$(stat -c '%s' "$exact")|sha256=$(sha256sum "$exact" | awk '{print $1}')"
            exit 0
          fi
          echo "SOURCE_SEARCH|ARCHIVE_EXACT|NOT_FOUND"
          find uploads instance backups temp -maxdepth 5 -type f \( -iname '*17*haft*.xlsx' -o -iname '*17*haft*.xls' -o -iname '*Tayfun*17*.xlsx' -o -iname '*Tayfun*17*.xls' -o -iname 'upload-32.xlsx' -o -iname 'upload-32.xls' \) -printf 'SOURCE_SEARCH|CANDIDATE|%p|bytes=%s\n' 2>/dev/null | head -n 50
          REMOTE
