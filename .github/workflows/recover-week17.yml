name: Recover Production to Week 17

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-week17.yml"
      - "scripts/recover_live_week17.py"

permissions:
  contents: read

concurrency:
  group: ims-week17-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Stop IMS work and restore week 17 view
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Recover production safely
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"

          echo 'RECOVERY_PHASE|stop_worker'
          sudo systemctl stop ims-import-worker.service || true
          worker_state=$(sudo systemctl is-active ims-import-worker.service || true)
          echo "WORKER_AFTER_STOP|$worker_state"
          test "$worker_state" != "active"

          git fetch origin main
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain)"
          git pull --ff-only origin main
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"

          mkdir -p instance/backups
          recent_backup=$(find instance/backups -maxdepth 1 -type f -name 'ipm-before-week17-recovery-*.db' -mmin -60 -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n1 | cut -d' ' -f2- || true)
          if [ -n "$recent_backup" ] && [ -s "$recent_backup" ]; then
            echo "RECOVERY_BACKUP_REUSED|$recent_backup"
          else
            stamp=$(date +%Y%m%d-%H%M%S)
            backup="instance/backups/ipm-before-week17-recovery-${stamp}.db"
            venv/bin/python sqlite_online_backup.py instance/ipm.db "$backup"
            echo "RECOVERY_BACKUP|$backup"
          fi

          echo 'RECOVERY_PHASE|week17_guard'
          if ! PYTHONPATH="$IMS_PATH" venv/bin/python scripts/recover_live_week17.py; then
            echo 'WEEK17_RECOVERY|FAIL'
            echo 'WORKER_RESTART|skipped_due_to_recovery_failure'
            exit 1
          fi

          echo 'RECOVERY_PHASE|restart_web'
          sudo systemctl restart ims-performance-manager.service
          health=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 4 http://127.0.0.1:8000/login >/dev/null; then
              health=1
              break
            fi
            sleep 1
          done
          test "$health" = "1"
          echo 'HTTP_HEALTH|PASS'

          echo 'RECOVERY_PHASE|restart_worker'
          sudo systemctl start ims-import-worker.service
          web_state=$(sudo systemctl is-active ims-performance-manager.service)
          worker_state=$(sudo systemctl is-active ims-import-worker.service)
          echo "WEB_ACTIVE|$web_state"
          echo "WORKER_ACTIVE|$worker_state"
          test "$web_state" = "active"
          test "$worker_state" = "active"

          venv/bin/python - <<'PY'
          import sqlite3
          con = sqlite3.connect('instance/ipm.db', timeout=30)
          try:
              con.execute('PRAGMA busy_timeout=30000')
              quick = con.execute('PRAGMA quick_check(1)').fetchone()[0]
              rows = con.execute("SELECT id, year, month, week_number FROM ims_uploads WHERE status='COMPLETED' ORDER BY year DESC, month DESC, week_number DESC, id DESC LIMIT 1").fetchall()
              active = con.execute("SELECT COUNT(*) FROM ims_import_jobs WHERE status IN ('QUEUED','PROCESSING')").fetchone()[0]
          finally:
              con.close()
          print(f'SQLITE_QUICK|{quick}')
          print(f'LATEST_COMPLETED_IMS|{rows}')
          print(f'ACTIVE_IMPORT_JOBS|{active}')
          if str(quick).lower() != 'ok' or not rows or int(rows[0][3] or 0) != 17 or int(active) != 0:
              raise SystemExit('Production week-17 acceptance failed')
          print('WEEK17_PRODUCTION_ACCEPTANCE|PASS')
          PY
          REMOTE
