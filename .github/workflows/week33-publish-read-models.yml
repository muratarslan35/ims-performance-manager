name: Inspect Week 33 Read Model Publication

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/week33-publish-read-models.yml

permissions:
  contents: read

concurrency:
  group: ims-production-recovery
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Inspect existing Week 33 publication
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" -o BatchMode=yes \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          git fetch origin main
          git pull --ff-only origin main
          export PYTHONPATH="$IMS_PATH${PYTHONPATH:+:$PYTHONPATH}"
          pgrep -af 'refresh_live_read_models.py|ims_import_worker.py' || true
          venv/bin/python - <<'PY'
          import json
          from app import create_app
          from app.extensions import db
          from app.models import IMSImportJob
          from app.services.ims_progress_store import IMSProgressStore
          from app.services.period_service import PeriodService
          from app.services.persistent_dashboard_snapshot_service import PersistentDashboardSnapshotService
          from app.services.persistent_region_snapshot_service import PersistentRegionSnapshotService
          from app.services.persistent_representative_snapshot_service import PersistentRepresentativeSnapshotService
          from config import Config
          app = create_app(Config)
          with app.app_context():
              period = PeriodService.get_active_period()
              job = db.session.get(IMSImportJob, 36)
              summary = json.loads(job.result_summary or '{}')
              progress = IMSProgressStore.read(job.id) or {}
              dashboard_source = PersistentDashboardSnapshotService.source_identity(2026, 8)
              region_source = PersistentRegionSnapshotService.source_identity(2026, 8)
              rep_source = PersistentRepresentativeSnapshotService.source_identity(2026, 8)
              print(f"ACTIVE_IMS|upload={period.get('upload_id')}|week={period.get('week_number')}")
              print(f"PUBLICATION|ready={summary.get('publication_ready')}|progress={progress}")
              print(f"SNAPSHOT_SOURCE|dashboard={dashboard_source}|region={region_source}|representative={rep_source}")
          PY
          code=$(curl --max-time 20 --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/login)
          test "$code" = 200
          echo "LOGIN_HEALTH|PASS|http=$code"
          REMOTE
