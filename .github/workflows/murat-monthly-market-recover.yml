name: Recover Monthly Comparison Snapshot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/murat-monthly-market-recover.yml"

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Install and launch snapshot-only recovery
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"

          busy="$(PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          from app import create_app
          from app.models import IMSImportJob
          app=create_app()
          with app.app_context():
              print(IMSImportJob.query.filter(
                  IMSImportJob.status.in_((IMSImportJob.STATUS_QUEUED, IMSImportJob.STATUS_PROCESSING))
              ).count())
          PY
          )"
          echo "IMS_BUSY|$busy"
          test "$busy" = "0"

          sudo systemctl stop ims-import-worker.service || true
          echo "WORKER_STOPPED|$(sudo systemctl is-active ims-import-worker.service || true)"

          cat > "$IMS_PATH/instance/monthly_comparison_recover.py" <<'PY'
          import json
          import fcntl
          from datetime import datetime
          from pathlib import Path
          import sqlalchemy as sa

          from app import create_app
          from app.extensions import db
          from app.models import Representative
          from app.services.period_service import PeriodService
          from app.services.persistent_representative_snapshot_service import (
              PersistentRepresentativeSnapshotService,
              representative_snapshot_sets,
              representative_snapshots,
          )
          from app.services.representative_snapshot_refresh_queue import RepresentativeSnapshotRefreshQueue

          VERSION=2

          def number(value):
              try:
                  return float(value or 0.0)
              except (TypeError, ValueError):
                  return 0.0

          def pid(row):
              row=row or {}
              product=row.get("product")
              value=(product.get("id") if isinstance(product,dict) else None) or row.get("product_id")
              try:
                  return int(value)
              except (TypeError, ValueError):
                  return None

          def rows_from_fragments(current, previous):
              current_products=current.get("products") or []
              previous_products=previous.get("products") or []
              current_market=current.get("market_rows") or []
              previous_market=previous.get("market_rows") or []
              cp={pid(r):r for r in current_products if pid(r) is not None}
              pp={pid(r):r for r in previous_products if pid(r) is not None}
              cm={pid(r):r for r in current_market if pid(r) is not None}
              pm={pid(r):r for r in previous_market if pid(r) is not None}
              previous_competitor_available=bool(
                  previous.get("has_competition")
                  or any(
                      number(r.get("market_unit")) != 0.0
                      or number(r.get("competitor_unit")) != 0.0
                      for r in pm.values()
                  )
              )
              result=[]
              for product_id,current_product in cp.items():
                  previous_product=pp.get(product_id)
                  current_market_row=cm.get(product_id) or {}
                  previous_market_row=pm.get(product_id) or {}
                  actual=number(current_product.get("actual_unit"))
                  previous_actual=number((previous_product or {}).get("actual_unit"))
                  competitor=number(current_market_row.get("competitor_unit"))
                  previous_competitor=number(previous_market_row.get("competitor_unit"))
                  delta=actual-previous_actual
                  competitor_delta=competitor-previous_competitor
                  percent=(delta*100.0/previous_actual) if previous_actual else None
                  result.append({
                      "product": current_product.get("product") or current_market_row.get("product"),
                      "product_id": product_id,
                      "source": current_product.get("source","IMS"),
                      "previous_source": (
                          previous_product.get("source","IMS")
                          if previous_product is not None else None
                      ),
                      "has_previous": previous_product is not None or bool(previous_market_row),
                      "previous_actual_unit": round(previous_actual,2),
                      "actual_unit": round(actual,2),
                      "actual_change_unit": round(delta,2),
                      "actual_change_percent": round(percent,1) if percent is not None else None,
                      "previous_competitor_unit": round(previous_competitor,2),
                      "competitor_unit": round(competitor,2),
                      "competitor_change_unit": round(competitor_delta,2),
                      "previous_competitor_available": previous_competitor_available,
                  })
              return result

          app=create_app()
          lock_path=Path(app.instance_path)/"representative_snapshot_warmup.lock"
          lock_path.parent.mkdir(parents=True,exist_ok=True)
          with lock_path.open("w") as lock_file:
              fcntl.flock(lock_file.fileno(), fcntl.LOCK_EX)
              with app.app_context():
                  period=PeriodService.get_active_period()
                  year,month=int(period["year"]),int(period["month"])
                  previous_year,previous_month=((year,month-1) if month>1 else (year-1,12))
                  current_set_id=PersistentRepresentativeSnapshotService._visible_set_id(year,month)
                  previous_set_id=PersistentRepresentativeSnapshotService._visible_set_id(previous_year,previous_month)
                  if not current_set_id or not previous_set_id:
                      raise RuntimeError("required active representative snapshot missing")

                  current_set=db.session.execute(
                      sa.select(representative_snapshot_sets).where(
                          representative_snapshot_sets.c.id==int(current_set_id)
                      )
                  ).mappings().one()
                  if current_set["status"] != PersistentRepresentativeSnapshotService.STATUS_ACTIVE:
                      raise RuntimeError("visible representative set is not ACTIVE")

                  # With the worker stopped and the shared warmup lock held, any
                  # remaining BUILDING generation is abandoned derived cache only.
                  stale_ids=db.session.execute(
                      sa.select(representative_snapshot_sets.c.id).where(
                          representative_snapshot_sets.c.year==year,
                          representative_snapshot_sets.c.month==month,
                          representative_snapshot_sets.c.status==PersistentRepresentativeSnapshotService.STATUS_BUILDING,
                      )
                  ).scalars().all()
                  for stale_id in stale_ids:
                      db.session.execute(
                          representative_snapshot_sets.update().where(
                              representative_snapshot_sets.c.id==int(stale_id)
                          ).values(status=PersistentRepresentativeSnapshotService.STATUS_FAILED)
                      )
                      print(f"STALE_BUILDING|id={stale_id}|status=FAILED",flush=True)

                  fragment_sql=sa.text("""
                      SELECT representative_id,
                             json_extract(payload_json, '$.snapshots.monthly.products') AS products_json,
                             json_extract(payload_json, '$.snapshots.monthly.market_analysis.rows') AS market_rows_json,
                             json_extract(payload_json, '$.snapshots.monthly.market_analysis.has_competition') AS has_competition
                      FROM representative_snapshots
                      WHERE set_id=:set_id
                      ORDER BY representative_id
                  """)
                  current_fragments={}
                  for row in db.session.execute(fragment_sql,{"set_id":int(current_set_id)}).mappings():
                      current_fragments[int(row["representative_id"])]={
                          "products":json.loads(row["products_json"] or "[]"),
                          "market_rows":json.loads(row["market_rows_json"] or "[]"),
                          "has_competition":bool(row["has_competition"]),
                      }
                  previous_fragments={}
                  for row in db.session.execute(fragment_sql,{"set_id":int(previous_set_id)}).mappings():
                      previous_fragments[int(row["representative_id"])]={
                          "products":json.loads(row["products_json"] or "[]"),
                          "market_rows":json.loads(row["market_rows_json"] or "[]"),
                          "has_competition":bool(row["has_competition"]),
                      }

                  update_sql=sa.text("""
                      UPDATE representative_snapshots
                         SET payload_json=json_set(
                             payload_json,
                             '$.read_model_version', :version,
                             '$.snapshots.monthly.market_analysis.comparison_rows',
                             json(:comparison_rows)
                         )
                       WHERE set_id=:set_id AND representative_id=:representative_id
                  """)

                  updated=0
                  for representative_id,current in current_fragments.items():
                      comparison=rows_from_fragments(
                          current,
                          previous_fragments.get(representative_id) or {},
                      )
                      db.session.execute(
                          update_sql,
                          {
                              "version":VERSION,
                              "comparison_rows":json.dumps(comparison,ensure_ascii=False,separators=(",",":")),
                              "set_id":int(current_set_id),
                              "representative_id":int(representative_id),
                          },
                      )
                      updated += 1

                  db.session.commit()

                  murat=Representative.query.filter(
                      sa.func.upper(Representative.rep_name)=="MURAT ARSLAN"
                  ).first()
                  if murat is None:
                      raise RuntimeError("Murat Arslan representative missing")
                  verified=PersistentRepresentativeSnapshotService.get_active(murat.id,year,month) or {}
                  version=int(verified.get("read_model_version") or 0)
                  rows=((((verified.get("snapshots") or {}).get("monthly") or {}).get("market_analysis") or {}).get("comparison_rows") or [])
                  if version < VERSION or len(rows) < 7:
                      raise RuntimeError(f"verification failed version={version} rows={len(rows)}")
                  for row in rows:
                      actual=number(row.get("actual_unit"))
                      previous_actual=number(row.get("previous_actual_unit"))
                      delta=number(row.get("actual_change_unit"))
                      competitor=number(row.get("competitor_unit"))
                      previous_competitor=number(row.get("previous_competitor_unit"))
                      competitor_delta=number(row.get("competitor_change_unit"))
                      if abs(delta-(actual-previous_actual))>0.05:
                          raise RuntimeError(f"company delta mismatch product={row.get('product_id')}")
                      if abs(competitor_delta-(competitor-previous_competitor))>0.05:
                          raise RuntimeError(f"competitor delta mismatch product={row.get('product_id')}")
                      product=row.get("product") or {}
                      name=product.get("product_name") if isinstance(product,dict) else row.get("product_id")
                      print(
                          f"ROW|{name}|prev={previous_actual:.0f}|cur={actual:.0f}|delta={delta:.0f}|"
                          f"pct={row.get('actual_change_percent')}|prev_comp={previous_competitor:.0f}|"
                          f"cur_comp={competitor:.0f}|comp_delta={competitor_delta:.0f}|"
                          f"source={row.get('source')}|previous_source={row.get('previous_source')}",
                          flush=True,
                      )

                  item=RepresentativeSnapshotRefreshQueue.next()
                  if item is not None:
                      if (
                          int(item.get("year") or 0)==year
                          and int(item.get("month") or 0)==month
                          and str(item.get("reason") or "").startswith("monthly_comparison_fix")
                      ):
                          RepresentativeSnapshotRefreshQueue.complete(item)
                          print(f"REFRESH_QUEUE|completed|reason={item.get('reason')}",flush=True)

                  print(
                      f"RECOVERY|PASS|year={year}|month={month}|set={current_set_id}|"
                      f"updated={updated}|version={VERSION}",
                      flush=True,
                  )
          PY

          rm -f "$IMS_PATH/instance/monthly_comparison_recover.log"
          sudo systemctl reset-failed ims-monthly-comparison-recover.service >/dev/null 2>&1 || true
          sudo systemd-run             --unit=ims-monthly-comparison-recover             --uid="$USER"             --gid="$(id -gn)"             --working-directory="$IMS_PATH"             --setenv="PYTHONPATH=$IMS_PATH"             --property=Nice=10             --property=StandardOutput=append:"$IMS_PATH/instance/monthly_comparison_recover.log"             --property=StandardError=append:"$IMS_PATH/instance/monthly_comparison_recover.log"             "$IMS_PATH/venv/bin/python" "$IMS_PATH/instance/monthly_comparison_recover.py"
          echo "RECOVERY_UNIT|launched"
          REMOTE

      - name: Wait for detached recovery
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 180); do
            state="$(ssh -i ~/.ssh/key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "sudo systemctl show ims-monthly-comparison-recover.service -p ActiveState -p SubState -p ExecMainStatus --value 2>/dev/null | tr '\n' '|' || true")"
            echo "RECOVERY_STATE|$state"
            if echo "$state" | grep -q '^inactive|dead|0|'; then
              exit 0
            fi
            if echo "$state" | grep -Eq '^(failed|inactive)\|'; then
              exit 1
            fi
            sleep 5
          done
          exit 1

      - name: Restore worker and verify
        if: always()
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "RECOVERY_LOG_BEGIN"
          cat instance/monthly_comparison_recover.log 2>/dev/null || true
          echo "RECOVERY_LOG_END"
          sudo systemctl start ims-import-worker.service
          test "$(sudo systemctl is-active ims-import-worker.service)" = "active"
          echo "WORKER|active"
          curl -fsS --max-time 20 http://127.0.0.1:8000/login >/dev/null
          echo "HTTP_HEALTH|PASS"

          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          import sqlalchemy as sa
          from app import create_app
          from app.models import Representative
          from app.services.period_service import PeriodService
          from app.services.persistent_representative_snapshot_service import PersistentRepresentativeSnapshotService

          app=create_app()
          with app.app_context():
              period=PeriodService.get_active_period()
              rep=Representative.query.filter(sa.func.upper(Representative.rep_name)=="MURAT ARSLAN").first()
              payload=PersistentRepresentativeSnapshotService.get_active(
                  rep.id,int(period["year"]),int(period["month"])
              ) or {}
              rows=((((payload.get("snapshots") or {}).get("monthly") or {}).get("market_analysis") or {}).get("comparison_rows") or [])
              version=int(payload.get("read_model_version") or 0)
              print(f"LIVE_VERIFY|version={version}|rows={len(rows)}")
              assert version >= 2 and len(rows) >= 7
          PY
          REMOTE
