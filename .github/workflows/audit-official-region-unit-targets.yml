name: Audit official region unit targets

on:
  push:
    branches:
      - audit/fentivag-monural-prod
    paths:
      - .github/workflows/audit-official-region-unit-targets.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Calculate authoritative aggregate unit targets
        run: |
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          venv/bin/python - <<'PY'
          from openpyxl import load_workbook
          import re, math
          from app.services.alias_service import AliasService
          P=['TRAVAZOL','MONUROL','MIXOVUL','FENTIVAG','STIDERM','ACNEMIX','BRIMODER']
          wb=load_workbook('uploads/Tayfun-1_3.Hafta_Ocak_Brick_Analizi_.xlsx',data_only=True,read_only=True)
          ws=wb['BAKİYE']; rows=list(ws.iter_rows(values_only=True)); h=rows[1]
          sections={}; current=''; cols={p:{} for p in P}
          for i,v in enumerate(h):
              n=AliasService.normalize(v)
              if 'HEDEF' in n and 'TL' in n: current='target_tl'; continue
              if 'CIKIS' in n and 'TL' in n: current='actual_tl'; continue
              if 'BAKIYE' in n and 'KUTU' in n: current='balance_unit'; continue
              if 'BAKIYE' in n and 'TL' in n: current='balance_tl'; continue
              if n in P: cols[n][current]=i
          def f(v): return float(v or 0)
          def ut(row,p):
              tt=f(row[cols[p]['target_tl']]); bt=f(row[cols[p]['balance_tl']]); bu=f(row[cols[p]['balance_unit']])
              if bt and bu:
                  price=bt/bu
                  return tt/price if price>0 else 0.0
              return 0.0
          nat=None; regions=[]
          for row in rows[2:]:
              loc=str(row[0] or '').strip(); rep=str(row[1] or '').strip(); rn=AliasService.normalize(rep); ln=AliasService.normalize(loc)
              vals={p:ut(row,p) for p in P}
              if rn=='NATIONAL': nat=vals
              elif rn and rn==ln and re.match(r'^\d{3}\b',rn): regions.append((rn.split()[0],vals))
          print('NATIONAL|'+'|'.join(f'{p}={nat[p]:.9f}' for p in P)+f'|TOTAL={sum(nat.values()):.9f}')
          sums={p:sum(v[p] for _,v in regions) for p in P}
          for code,v in regions: print('REGION|'+code+'|'+'|'.join(f'{p}={v[p]:.9f}' for p in P)+f'|TOTAL={sum(v.values()):.9f}')
          print('REGION_SUM|'+'|'.join(f'{p}={sums[p]:.9f}' for p in P)+f'|TOTAL={sum(sums.values()):.9f}')
          print('NAT_REGION_DELTA|'+'|'.join(f'{p}={nat[p]-sums[p]:.9f}' for p in P)+f'|TOTAL={sum(nat.values())-sum(sums.values()):.9f}')
          wb.close()
          PY
          REMOTE
