name: IMS Production Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 0"

permissions:
  contents: read

concurrency:
  group: ims-production-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    name: Weekly SQLite and backup maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Launch detached maintenance job
        id: launch
        shell: bash
        run: |
          set -Eeuo pipefail
          JOB_DIR="/tmp/ims-maintenance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "job_dir=$JOB_DIR" >> "$GITHUB_OUTPUT"

          SSH_OPTS=(
            -i ~/.ssh/ims_deploy_key
            -p "$IMS_PORT"
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o ConnectionAttempts=3
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=6
            -o TCPKeepAlive=yes
          )

          ssh "${SSH_OPTS[@]}" "$IMS_USER@$IMS_HOST" \
            "IMS_PATH='$IMS_PATH' JOB_DIR='$JOB_DIR' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain)"
          test -f scripts/run_production_maintenance.sh
          rm -rf "$JOB_DIR"
          mkdir -p "$JOB_DIR"
          nohup bash scripts/run_production_maintenance.sh "$IMS_PATH" "$JOB_DIR" \
            >"$JOB_DIR/nohup.log" 2>&1 </dev/null &
          pid=$!
          printf 'REMOTE_MAINTENANCE_PID|%s\n' "$pid"
          REMOTE

      - name: Poll detached maintenance job
        shell: bash
        env:
          JOB_DIR: ${{ steps.launch.outputs.job_dir }}
        run: |
          set -Eeuo pipefail
          SSH_OPTS=(
            -i ~/.ssh/ims_deploy_key
            -p "$IMS_PORT"
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o ConnectionAttempts=2
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=3
            -o TCPKeepAlive=yes
          )

          consecutive_ssh_failures=0
          for poll in $(seq 1 120); do
            set +e
            status=$(ssh "${SSH_OPTS[@]}" "$IMS_USER@$IMS_HOST" \
              "test -f '$JOB_DIR/status' && cat '$JOB_DIR/status' || echo RUNNING" 2>/dev/null)
            ssh_rc=$?
            set -e

            if [ "$ssh_rc" -ne 0 ]; then
              consecutive_ssh_failures=$((consecutive_ssh_failures + 1))
              echo "SSH_POLL_RETRY|poll=$poll|consecutive_failures=$consecutive_ssh_failures"
              if [ "$consecutive_ssh_failures" -ge 6 ]; then
                echo "Remote maintenance polling lost SSH connectivity repeatedly."
                exit 1
              fi
              sleep 10
              continue
            fi

            consecutive_ssh_failures=0
            echo "REMOTE_STATUS|poll=$poll|status=$status"
            case "$status" in
              PASS)
                exit 0
                ;;
              FAIL*)
                ssh "${SSH_OPTS[@]}" "$IMS_USER@$IMS_HOST" \
                  "cat '$JOB_DIR/evidence.log' '$JOB_DIR/nohup.log' 2>/dev/null || true"
                exit 1
                ;;
              RUNNING|'')
                sleep 10
                ;;
              *)
                echo "Unexpected remote maintenance status: $status"
                exit 1
                ;;
            esac
          done

          echo "Remote maintenance exceeded polling deadline."
          exit 1

      - name: Collect final maintenance evidence
        if: always()
        shell: bash
        env:
          JOB_DIR: ${{ steps.launch.outputs.job_dir }}
        run: |
          set -Eeuo pipefail
          [ -n "${JOB_DIR:-}" ] || exit 0
          SSH_OPTS=(
            -i ~/.ssh/ims_deploy_key
            -p "$IMS_PORT"
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o ConnectionAttempts=3
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=3
            -o TCPKeepAlive=yes
          )
          ssh "${SSH_OPTS[@]}" "$IMS_USER@$IMS_HOST" \
            "printf '%s\n' '--- MAINTENANCE EVIDENCE ---'; cat '$JOB_DIR/evidence.log' 2>/dev/null || true; printf '%s\n' '--- DETACHED LOG ---'; cat '$JOB_DIR/nohup.log' 2>/dev/null || true"

      - name: Cleanup remote job files
        if: always()
        shell: bash
        env:
          JOB_DIR: ${{ steps.launch.outputs.job_dir }}
        run: |
          set +e
          [ -n "${JOB_DIR:-}" ] || exit 0
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=2 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o TCPKeepAlive=yes \
            "$IMS_USER@$IMS_HOST" "rm -rf '$JOB_DIR'"
