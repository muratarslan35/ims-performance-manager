name: Find explicit box target source
on:
  push:
    branches: [ops/full-january-source-audit]
    paths: [.github/workflows/find-box-target-source.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Search workbook
        run: |
          ssh -i ~/.ssh/key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          venv/bin/python - <<'PY'
          from openpyxl import load_workbook
          import re, unicodedata
          p='uploads/Tayfun-1_3.Hafta_Ocak_Brick_Analizi_.xlsx'
          wb=load_workbook(p,data_only=True,read_only=True)
          def n(v):
              t=unicodedata.normalize('NFKD',str(v or '').upper())
              t=''.join(c for c in t if not unicodedata.combining(c))
              return re.sub(r'[^A-Z0-9]+',' ',t).strip()
          for ws in wb.worksheets:
              hits=[]
              for row in ws.iter_rows():
                  for cell in row:
                      s=n(cell.value)
                      if ('HEDEF' in s and any(x in s for x in ('KUTU','UNIT','ADET','BOX'))) or ('TARGET' in s and any(x in s for x in ('KUTU','UNIT','ADET','BOX'))):
                          hits.append((cell.coordinate,str(cell.value)))
              if hits:
                  print('HIT_SHEET|'+ws.title+'|'+repr(hits[:100]))
          ws=wb['TTS ÇIKIŞLARI']
          print('===TTS_CIKISLARI_TOP===')
          for i,row in enumerate(ws.iter_rows(values_only=True),1):
              if i>10: break
              print('ROW|%d|%s'%(i,' | '.join('' if v is None else str(v) for v in row)[:30000]))
          ws=wb['BRICK REA.']
          print('===BRICK_REA_SUBTOTALS===')
          for i,row in enumerate(ws.iter_rows(values_only=True),1):
              vals=list(row); a=str(vals[0] or '').strip(); b=str(vals[1] or '').strip()
              if i<=3 or b.upper()=='NATIONAL' or (a and a==b):
                  print('ROW|%d|%s'%(i,' | '.join('' if v is None else str(v) for v in vals)[:20000]))
          wb.close()
          PY
          REMOTE