name: Week 32 Final Normal Reimport

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/week32-final-normal-reimport.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: week32-final-normal-reimport
  cancel-in-progress: false

jobs:
  reimport:
    name: Normal import and snapshot publication
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Run normal Week 32 import and snapshots
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -i ~/.ssh/ims_deploy_key \
            -p "$IMS_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=3 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=12 \
            -o TCPKeepAlive=yes \
            "$IMS_USER@$IMS_HOST" \
            "cd '$IMS_PATH' && git fetch origin main && git pull --ff-only origin main && bash scripts/run_week32_direct_reimport.sh '$IMS_PATH'"

# Manual production replay marker: exact Week 32 archive through the normal importer.
