# One-time production trigger: 2026-09-12T13:11Z
name: Week 32 Final Normal Reimport

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/week32-final-normal-reimport.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: week32-final-normal-reimport
  cancel-in-progress: false

jobs:
  reimport:
    name: Normal import and snapshot publication
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Reimport Week 32 and wait for snapshots
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_OPTS=(
            -i ~/.ssh/ims_deploy_key
            -p "$IMS_PORT"
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o ConnectionAttempts=3
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=12
            -o TCPKeepAlive=yes
          )
          ssh "${SSH_OPTS[@]}" "$IMS_USER@$IMS_HOST" \
            "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          export PYTHONPATH="$IMS_PATH${PYTHONPATH:+:$PYTHONPATH}"

          exec 9>instance/.production-maintenance.lock
          if ! flock -w 1800 9; then
            echo 'WEEK32_DIRECT_REIMPORT_REFUSED|reason=maintenance_lock_timeout'
            exit 1
          fi

          test "$(git branch --show-current)" = main
          test -z "$(git status --porcelain)"
          git fetch origin main
          git pull --ff-only origin main
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"

          active=$(venv/bin/python - <<'PY'
from app import create_app
from app.models import IMSImportJob
from config import Config
app=create_app(Config)
with app.app_context():
    print(IMSImportJob.query.filter(IMSImportJob.status.in_((IMSImportJob.STATUS_QUEUED, IMSImportJob.STATUS_PROCESSING))).count())
PY
          )
          echo "IMS_PROCESSING|$active"
          test "$active" = 0

          sudo systemctl restart ims-import-worker.service
          test "$(sudo systemctl is-active ims-import-worker.service)" = active
          echo "IMS_WORKER_RELOADED|commit=$(git rev-parse HEAD)"

          venv/bin/python -m scripts.requeue_latest_empty_ims \
            --year 2026 --month 8 --week 32 --allow-existing-targets

          for poll in $(seq 1 180); do
            state=$(venv/bin/python - <<'PY'
import json
from app import create_app
from app.models import IMSImportJob
from config import Config
app=create_app(Config)
with app.app_context():
    job=IMSImportJob.query.order_by(IMSImportJob.id.desc()).first()
    if job is None:
        print('MISSING|0')
    else:
        try:
            summary=json.loads(job.result_summary or '{}')
        except Exception:
            summary={}
        print(f"{job.status}|{int(bool(summary.get('publication_ready')))}")
PY
            )
            status=${state%%|*}
            ready=${state##*|}
            echo "WEEK32_DIRECT_REIMPORT_STATUS|poll=$poll|state=$status|publication_ready=$ready"
            if [ "$status" = FAILED ] || [ "$status" = MISSING ]; then
              venv/bin/python - <<'PY'
from app import create_app
from app.models import IMSImportJob,IMSUpload
from config import Config
app=create_app(Config)
with app.app_context():
    job=IMSImportJob.query.order_by(IMSImportJob.id.desc()).first()
    upload=IMSUpload.query.get(job.ims_upload_id) if job and job.ims_upload_id else None
    print('FAILED_JOB|id=%s|error=%r|result=%r' % (getattr(job,'id',None),getattr(job,'error_message',None),getattr(job,'result_summary',None)))
    print('FAILED_UPLOAD|id=%s|status=%s|error=%r|warning=%r' % (getattr(upload,'id',None),getattr(upload,'status',None),getattr(upload,'error_message',None),getattr(upload,'warning_message',None)))
PY
              exit 1
            fi
            if [ "$status" = COMPLETED ] && [ "$ready" = 1 ]; then
              break
            fi
            if [ "$poll" = 180 ]; then
              echo 'WEEK32_DIRECT_REIMPORT_TIMEOUT'
              exit 1
            fi
            sleep 10
          done

          venv/bin/python verify_live_ims_gate.py
          echo 'WEEK32_DIRECT_REIMPORT_RESULT|PASS'
          REMOTE
