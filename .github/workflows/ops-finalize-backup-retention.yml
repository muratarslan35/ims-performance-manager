name: Finalize backup retention safely

on:
  push:
    branches: ["ops/finalize-backup-retention"]

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Finalize retention and verify health
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "fa67cd532d0487a3a815b607fd775120fed14481"

          processing=$(venv/bin/python - <<'PY'
          import sqlite3
          con=sqlite3.connect('instance/ipm.db', timeout=30)
          try:
              exists=con.execute("SELECT 1 FROM sqlite_master WHERE type='table' AND name='ims_import_jobs'").fetchone()
              print(0 if not exists else int(con.execute("SELECT COUNT(*) FROM ims_import_jobs WHERE status='PROCESSING'").fetchone()[0]))
          finally:
              con.close()
          PY
          )
          echo "IMS_PROCESSING|$processing"
          test "$processing" = "0"

          venv/bin/python cleanup_old_backups.py --backup-dir instance/backups --keep-latest 2 --purge-unmanaged-db

          echo 'KEPT_BACKUPS'
          find instance/backups -maxdepth 1 -type f -printf '%12s %f\n' | sort -nr
          echo 'STORAGE'
          du -sh instance instance/backups uploads/ims_archive 2>/dev/null || true
          df -h /
          free -h

          venv/bin/python - <<'PY'
          from app import create_app
          from app.extensions import db
          app=create_app()
          with app.app_context():
              c=db.session.connection()
              mode=str(c.exec_driver_sql('PRAGMA journal_mode').scalar())
              timeout=int(c.exec_driver_sql('PRAGMA busy_timeout').scalar())
              quick=str(c.exec_driver_sql('PRAGMA quick_check(1)').scalar())
              print('SQLITE_JOURNAL_MODE|' + mode)
              print('SQLITE_BUSY_TIMEOUT|' + str(timeout))
              print('SQLITE_QUICK_CHECK|' + quick)
              assert mode.lower() == 'wal'
              assert timeout == 30000
              assert quick.lower() == 'ok'
          PY

          echo "WEB_ACTIVE|$(sudo systemctl is-active ims-performance-manager.service)"
          echo "WORKER_ACTIVE|$(sudo systemctl is-active ims-import-worker.service)"
          test "$(sudo systemctl is-active ims-performance-manager.service)" = "active"
          test "$(sudo systemctl is-active ims-import-worker.service)" = "active"
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8000/login >/dev/null
          echo 'HTTP_HEALTH|PASS'
          echo 'FINALIZE_RESULT|PASS'
          REMOTE
