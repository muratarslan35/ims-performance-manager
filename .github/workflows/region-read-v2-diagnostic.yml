name: Region Read V2 Diagnostic

on:
  push:
    branches: [fix/region-representative-read-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_diag_key
          chmod 600 ~/.ssh/ims_diag_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Read-only diagnostics
        run: |
          ssh -i ~/.ssh/ims_diag_key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo '=== REGION 500 TRACE ==='
          sudo journalctl -u ims-performance-manager.service --since '40 minutes ago' --no-pager | grep -E -A30 -B8 '/regions/901|Traceback|ERROR' | tail -n 260 || true
          echo '=== REGION DIRECT SERVICES ==='
          timeout 60s venv/bin/python - <<'PY' || true
          import time, traceback
          from app import create_app
          from app.services.region_performance_service import RegionPerformanceService
          from app.services.region_market_service import RegionMarketService
          from app.services.scoped_ai_insight_service import ScopedAIInsightService
          app=create_app()
          with app.app_context():
              try:
                  t=time.perf_counter(); svc=RegionPerformanceService('901',2026,2); report=svc.report(); print('PERF',round(time.perf_counter()-t,3), report['region_name'])
                  for k,v in report['periods'].items(): print('PERIOD',k,v['target_tl'],v['actual_tl'],v['realization_percent'],v['complete'],v.get('source_by_month'))
                  t=time.perf_counter(); ai=ScopedAIInsightService.build(scope_type='region',scope_name=report['region_name'],periods=report['periods']); print('AI_OK',round(time.perf_counter()-t,3),type(ai).__name__)
                  t=time.perf_counter(); market=RegionMarketService(report['region_key'],svc.rep_ids,2026,2).build(); print('MARKET_OK',round(time.perf_counter()-t,3), market.get('totals'), market.get('upload_id'))
              except Exception:
                  traceback.print_exc()
          PY
          echo '=== LIVE SOURCE TOTALS ==='
          venv/bin/python - <<'PY'
          import sqlite3
          con=sqlite3.connect('file:instance/ipm.db?mode=ro',uri=True,timeout=30); con.row_factory=sqlite3.Row
          uid=con.execute("select id from ims_uploads where year=2026 and month=2 and status='COMPLETED' order by week_number desc,completed_at desc,id desc limit 1").fetchone()[0]
          repids=[r[0] for r in con.execute("select id from representatives where region='901' or city='901' or territory='901'").fetchall()]
          ph=','.join('?'*len(repids))
          print('REGION_REP_COUNT',len(repids))
          print('TARGET_SUMS',dict(con.execute(f"select sum(tl_target) target_tl,sum(tl_realization) actual_tl,sum(unit_realization) actual_unit from targets where year=2026 and month=2 and representative_id in ({ph})",repids).fetchone()))
          print('OFFICIAL_BALANCE',[dict(r) for r in con.execute("select product_id,territory,unit,tl from ims_raw_data where upload_id=? and sheet_type='dashboard_balance_region' and territory like '901%' order by product_id",(uid,)).fetchall()])
          print('OFFICIAL_WEEKLY',[dict(r) for r in con.execute("select product_id,territory,unit,tl from ims_raw_data where upload_id=? and sheet_type='dashboard_weekly_region' and territory like '901%' order by product_id",(uid,)).fetchall()])
          rep=con.execute("select id,rep_name from representatives where upper(rep_name)='MURAT ARSLAN' limit 1").fetchone(); print('REP',dict(rep) if rep else None)
          if rep:
              rows=con.execute("select p.product_name,t.tl_target,t.unit_target,t.tl_realization,t.unit_realization,s.tl summary_tl,s.unit summary_unit from targets t join products p on p.id=t.product_id left join ims_summary s on s.representative_id=t.representative_id and s.product_id=t.product_id and s.year=t.year and s.month=t.month where t.representative_id=? and t.year=2026 and t.month=2 order by p.display_order,p.id",(rep['id'],)).fetchall()
              for r in rows: print(dict(r))
          con.close()
          PY
          REMOTE