name: Patch passive user and region unit gap

on:
  push:
    branches: ["fix/passive-user-and-region-unit-gap"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/passive-user-and-region-unit-gap
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply scoped fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          service_path = Path('app/services/region_performance_service.py')
          source = service_path.read_text()
          replacement = '''    def _official_region_unit_month(self, year, month):
        """Return DB-backed region/product box targets and actuals.

        P2/P1 region-product unit rows remain authoritative when present. For
        IMS periods the box target comes from the same representative Target
        rows used by the rest of the application, while the actual box count
        comes from the workbook-authoritative region ACTUAL aggregate. TL is
        never converted to boxes and balance values are never treated as box
        targets.
        """
        production_upload = ProductionResultService.final_upload(year, month)
        if production_upload is not None:
            rows = ProductionRegionProductResult.query.filter_by(
                upload_id=production_upload.id, region_code=self.region_key
            ).all()
            if rows:
                return {
                    row.product_id: [
                        Decimal(str(row.target_unit or 0)),
                        Decimal(str(row.actual_unit or 0)),
                        True,
                    ]
                    for row in rows
                }

        target_units = {
            product_id: Decimal(str(value or 0))
            for product_id, value in db.session.query(
                Target.product_id, func.coalesce(func.sum(Target.unit_target), 0.0)
            ).filter(
                Target.year == year,
                Target.month == month,
                Target.representative_id.in_(self.rep_ids),
            ).group_by(Target.product_id).all()
        }
        if not target_units:
            return {}

        actual_rows = {
            row.product_id: row
            for row in OfficialAggregateService.rows(year, month, self.region_key, ACTUAL_TYPE)
        }
        if not actual_rows:
            # No official regional box actual exists: aggregate() will fall back
            # to representative DB actuals rather than manufacture a unit value.
            return {}

        return {
            product_id: [
                target_unit,
                Decimal(str(actual_rows[product_id].unit or 0)),
                True,
            ]
            if product_id in actual_rows
            else [target_unit, Decimal("0"), False]
            for product_id, target_unit in target_units.items()
        }

    def aggregate'''
          updated, count = re.subn(
              r'    def _official_region_unit_month\(self, year, month\):.*?\n    def aggregate',
              replacement,
              source,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'unit helper replacement count={count}')
          service_path.write_text(updated)

          template_path = Path('app/templates/representative_detail.html')
          template = template_path.read_text()
          needle = '  <div class="representative-switcher">\n    {% if manager_access %}'
          repl = '  <div class="representative-switcher">\n    {% if not representative.active %}<div class="text-end text-danger fw-bold mb-2">PASİF KULLANICI</div>{% endif %}\n    {% if manager_access %}'
          if needle not in template:
              raise SystemExit('representative switcher anchor missing')
          template_path.write_text(template.replace(needle, repl, 1))

          Path('tests/test_passive_user_and_region_unit_gap_contract.py').write_text('''from pathlib import Path\n\n\ndef test_passive_representative_has_red_status_label():\n    html = Path("app/templates/representative_detail.html").read_text()\n    assert "{% if not representative.active %}" in html\n    assert "text-danger fw-bold" in html\n    assert "PASİF KULLANICI" in html\n\n\ndef test_ims_region_unit_gap_uses_db_target_units_and_official_actual_units():\n    source = Path("app/services/region_performance_service.py").read_text()\n    segment = source.split("def _official_region_unit_month", 1)[1].split("def aggregate", 1)[0]\n    assert "func.sum(Target.unit_target)" in segment\n    assert "ACTUAL_TYPE" in segment\n    assert "actual_rows[product_id].unit" in segment\n    assert "target.unit" not in segment\n    assert "dashboard_balance_region" not in segment\n''')

          Path('.github/workflows/patch-passive-user-unit-gap.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/services/region_performance_service.py app/templates/representative_detail.html tests/test_passive_user_and_region_unit_gap_contract.py .github/workflows/patch-passive-user-unit-gap.yml
          git commit -m "Fix passive user label and DB-backed region unit gap [patched]"
          git push origin HEAD:fix/passive-user-and-region-unit-gap
