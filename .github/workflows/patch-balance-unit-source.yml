name: Patch balance unit source

on:
  push:
    branches:
      - fix/balance-unit-actual-source

permissions:
  contents: write

jobs:
  patch_test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/balance-unit-actual-source
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply narrow patch
        run: python .github/scripts/patch_balance_unit_source.py
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Targeted tests
        run: pytest -q tests/test_direct_weekly_unit_source.py tests/test_balance_unit_actual_source_contract.py
      - name: Full suite
        run: pytest -q
      - name: Commit tested patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-balance-unit-source.yml .github/scripts/patch_balance_unit_source.py
          git add app/services/ims_import_service.py tests/test_balance_unit_actual_source_contract.py
          git commit -m "Use remaining balance for IMS unit actuals"
          git push origin HEAD:fix/balance-unit-actual-source
