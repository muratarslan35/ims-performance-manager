name: Find Week16 DB Backup

on:
  push:
    branches: [agent/shadow-production-copy-proof]
    paths: [".github/workflows/find-week16-db-backup.yml"]

permissions:
  contents: read

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure SSH
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: List Week16 database backups
        shell: bash
        run: |
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" -o BatchMode=yes -o ConnectTimeout=20 "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          cd "$IMS_PATH"
          live=$(sha256sum instance/ipm.db | awk '{print $1}')
          echo "W16_DB_FIND|LIVE_SHA|$live"
          find instance/backups instance -maxdepth 4 -type f \( -name '*.db' -o -name '*.sqlite' \) -size +100M -print0 2>/dev/null | while IFS= read -r -d '' f; do
            size=$(stat -c '%s' "$f" 2>/dev/null || echo 0)
            sha=$(sha256sum "$f" 2>/dev/null | awk '{print $1}')
            echo "W16_DB_FIND|FILE|$f|$size|$sha"
          done
          REMOTE
