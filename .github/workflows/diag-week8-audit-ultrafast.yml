name: Temporary Week 8 Ultra Fast Audit
on:
  push:
    branches: [diag/week8-representative-audit]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh; printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/k; chmod 600 ~/.ssh/k; ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Audit
        run: |
          ssh -i ~/.ssh/k -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail; cd "$IMS_PATH"
          venv/bin/python - <<'PY'
          import sqlite3,json
          c=sqlite3.connect('file:instance/ipm.db?mode=ro',uri=True,timeout=2); c.row_factory=sqlite3.Row
          def rr(q,a=()): return [dict(x) for x in c.execute(q,a).fetchall()]
          def em(k,v): print(k+'|'+json.dumps(v,ensure_ascii=False,default=str))
          em('PROCESSING',c.execute("select count(*) from ims_import_jobs where status='PROCESSING'").fetchone()[0])
          job=dict(c.execute("select id,status,file_name,source_hash,ims_upload_id,completed_at,error_message,result_summary from ims_import_jobs order by id desc limit 1").fetchone()); em('JOB',job)
          up=dict(c.execute("select id,file_name,week_number,sheet_count,raw_record_count,fact_record_count,summary_record_count,source_record_count,stored_source_record_count,zero_metric_count,invalid_metric_count,reconciliation_status,status,completed_at from ims_uploads where id=?",(job['ims_upload_id'],)).fetchone()) if job['ims_upload_id'] else None; em('UPLOAD',up)
          rep=dict(c.execute("select id,rep_name,region,city,territory,team,active from representatives where upper(rep_name)='MURAT ARSLAN' limit 1").fetchone()); em('REP',rep); rid=rep['id']
          em('TARGETS',rr("select p.product_name,t.unit_target,t.tl_target,t.unit_realization,t.tl_realization,t.realization_percent from targets t join products p on p.id=t.product_id where t.year=2026 and t.month=2 and t.representative_id=? order by p.display_order,p.product_name",(rid,)))
          em('SUMMARY',rr("select s.*,p.product_name from ims_summary s join products p on p.id=s.product_id where s.year=2026 and s.month=2 and s.representative_id=? limit 20",(rid,)))
          em('COMP',rr("select sheet_name,period_type,product_group,product_name,is_company_product,is_competitor,metric_type,metric_value,is_subtotal,is_grand_total,source_row from ims_competition_data indexed by ix_competition_territory where upper(subterritory)=upper(?) and year=2026 and month=2 and week_number=8 limit 120",('MURAT ARSLAN',)))
          em('BRICKS',rr("select brick,source,active from representative_brick_assignments where year=2026 and month=2 and representative_id=? order by brick",(rid,)))
          c.close()
          PY
          REMOTE
