name: Audit box target source

on:
  push:
    branches:
      - audit/fentivag-monural-prod
    paths:
      - .github/workflows/audit-box-target-source.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Find authoritative box target fields
        run: |
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          venv/bin/python - <<'PY'
          from openpyxl import load_workbook
          from app.services.alias_service import AliasService
          p='uploads/Tayfun-1_3.Hafta_Ocak_Brick_Analizi_.xlsx'
          wbv=load_workbook(p,data_only=True,read_only=True)
          wbf=load_workbook(p,data_only=False,read_only=True)
          def n(v): return AliasService.normalize(v)
          print('SHEETS|'+' || '.join(wbv.sheetnames))
          for s in wbv.sheetnames:
              ws=wbv[s]; fs=wbf[s]
              hits=[]
              for ridx,row in enumerate(ws.iter_rows(values_only=True),start=1):
                  if ridx>20: break
                  for cidx,val in enumerate(row,start=1):
                      nv=n(val)
                      if ('HEDEF' in nv and ('KUTU' in nv or 'UNIT' in nv or 'ADET' in nv)) or nv in {'KUTU HEDEF','KUTU HEDEFI','UNIT TARGET'}:
                          hits.append((ridx,cidx,str(val)))
              if hits:
                  print('BOX_TARGET_HEADER|'+s+'|'+str(hits))
                  for r in range(1,min(ws.max_row,8)+1):
                      print('HEAD|'+s+'|'+str(r)+'|'+' | '.join('' if x is None else str(x) for x in next(ws.iter_rows(min_row=r,max_row=r,values_only=True))[:80]))
          # Search formula/value relationship for BAKIYE and explicit target sheets
          for s in [x for x in wbv.sheetnames if 'HEDEF' in n(x) or 'BAKIYE' in n(x)]:
              ws=wbv[s]; fs=wbf[s]
              print('TARGET_SHEET|'+s)
              for r in range(1,min(ws.max_row,15)+1):
                  vals=list(next(ws.iter_rows(min_row=r,max_row=r,values_only=True)))
                  print('ROW|'+str(r)+'|'+' | '.join('' if x is None else str(x) for x in vals[:100]))
          wbv.close(); wbf.close()
          PY
          REMOTE
