name: Full January source audit

on:
  push:
    branches:
      - ops/full-january-source-audit
    paths:
      - .github/workflows/full-january-source-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Repair Fentivag and audit source to production
        run: |
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain)"
          echo "PROD_COMMIT|$(git rev-parse HEAD)"

          mkdir -p instance/backups
          stamp=$(date +%Y%m%d-%H%M%S)
          cp instance/ipm.db "instance/backups/ipm-pre-full-source-audit-${stamp}.db"
          sha256sum instance/ipm.db "instance/backups/ipm-pre-full-source-audit-${stamp}.db"

          echo '=== FENTIVAG_REPAIR ==='
          venv/bin/python repair_fentivag_targets.py

          echo '=== FULL_SOURCE_AUDIT ==='
          venv/bin/python - <<'PY'
          import json, math, re
          from collections import defaultdict
          from pathlib import Path
          from openpyxl import load_workbook

          from app import create_app
          from app.extensions import db
          from app.models import CompetitionData, IMSUpload, IMSSummary, Product, Representative, Target
          from app.services.alias_service import AliasService
          from app.services.competition_import_service import CompetitionImportService, DefaultGroup

          YEAR=2026; MONTH=1
          PRODUCTS=['TRAVAZOL','MONUROL','MIXOVUL','FENTIVAG','STIDERM','ACNEMIX','BRIMODER']
          TOL=0.05
          def norm(v): return AliasService.normalize(v)
          def f(v):
              try: return float(v or 0)
              except Exception: return 0.0
          def close(a,b,t=TOL): return math.isclose(float(a or 0), float(b or 0), rel_tol=0, abs_tol=t)
          def code(v):
              m=re.search(r'\b(\d{3})\b', norm(v))
              return m.group(1) if m else ''
          def is_person(loc,rep):
              rn=norm(rep); ln=norm(loc)
              return bool(rn and rn not in {'NATIONAL','TOPLAM','TOTAL','GRAND TOTAL','GENEL TOPLAM'} and rn!=ln and rn not in {'TTS ISMI','1 TTS ISMI','2 TTS ISMI'})

          app=create_app()
          with app.app_context():
              upload=(IMSUpload.query.filter_by(year=YEAR,month=MONTH,status='COMPLETED').order_by(IMSUpload.completed_at.desc(),IMSUpload.id.desc()).first())
              if not upload: raise SystemExit('AUDIT_FAIL|no completed January upload')
              source=Path('uploads')/upload.file_name
              if not source.is_file():
                  fallback=Path('uploads/Tayfun-1_3.Hafta_Ocak_Brick_Analizi_.xlsx')
                  source=fallback if fallback.is_file() else source
              if not source.is_file(): raise SystemExit(f'AUDIT_FAIL|source missing|{source}')
              print(f'SOURCE|{source}|UPLOAD_ID={upload.id}')

              wb=load_workbook(source,data_only=True,read_only=True)
              try:
                  # BAKIYE target TL + remaining units
                  ws=wb['BAKİYE']
                  rows=list(ws.iter_rows(values_only=True))
                  hi=next(i for i,row in enumerate(rows[:12]) if 'HEDEF' in norm(' '.join(str(x or '') for x in row)) and 'BAKIYE' in norm(' '.join(str(x or '') for x in row)) and 'FENTIVAG' in norm(' '.join(str(x or '') for x in row)))
                  section=''; tcols={}; bcols={}
                  for i,v in enumerate(rows[hi]):
                      n=norm(v)
                      if 'HEDEF' in n and 'TL' in n: section='target'; continue
                      if 'BAKIYE' in n and ('KUTU' in n or 'UNIT' in n): section='balance'; continue
                      if 'BAKIYE' in n and 'TL' in n: section='other'; continue
                      if 'CIKIS' in n and 'TL' in n: section='other'; continue
                      if n in PRODUCTS:
                          if section=='target' and n not in tcols: tcols[n]=i
                          if section=='balance' and n not in bcols: bcols[n]=i
                  if set(tcols)!=set(PRODUCTS) or set(bcols)!=set(PRODUCTS):
                      raise SystemExit(f'AUDIT_FAIL|BAKIYE columns|target={tcols}|balance={bcols}')

                  src_targets={}; bakiye_region={}; bakiye_nat={}
                  for row in rows[hi+1:]:
                      loc=row[0] if len(row)>0 else None; rep=row[1] if len(row)>1 else None
                      rn=norm(rep); ln=norm(loc)
                      vals={p:{'tl':f(row[tcols[p]]),'bal_unit':f(row[bcols[p]])} for p in PRODUCTS}
                      if rn=='NATIONAL': bakiye_nat=vals
                      elif rn and rn==ln: bakiye_region[code(loc)]=vals
                      elif is_person(loc,rep): src_targets[rn]={'name':str(rep).strip(),'loc':str(loc).strip(),'region':code(loc),'vals':vals}

                  # Weekly canonical cumulative TL/unit actuals.
                  wsw=wb['TTS HAFTALIK ÇIKIŞLARI']; wr=list(wsw.iter_rows(values_only=True))
                  phi=next(i for i,row in enumerate(wr[:12]) if sum(1 for x in row if norm(x) in PRODUCTS)>=5)
                  secrow=wr[phi-1]; prodrow=wr[phi]
                  current=''; seen={'tl':False,'unit':False}; sections={}
                  for i,v in enumerate(secrow):
                      n=norm(v)
                      if n:
                          if 'CIKIS' in n and 'TL' in n:
                              if not seen['tl']: current='tl'; seen['tl']=True
                              else: current=''
                          elif 'CIKIS' in n and ('KUTU' in n or 'UNIT' in n):
                              if not seen['unit']: current='unit'; seen['unit']=True
                              else: current=''
                          elif 'HAFTA' in n: current=''
                      sections[i]=current
                  acols={'tl':{},'unit':{}}
                  for i,v in enumerate(prodrow):
                      p=norm(v); metric=sections.get(i)
                      if p in PRODUCTS and metric in acols and p not in acols[metric]: acols[metric][p]=i
                  if set(acols['tl'])!=set(PRODUCTS) or set(acols['unit'])!=set(PRODUCTS):
                      raise SystemExit(f'AUDIT_FAIL|weekly columns|{acols}')
                  src_actual={}; weekly_region={}; weekly_nat={}
                  for row in wr[phi+1:]:
                      loc=row[0] if len(row)>0 else None; rep=row[1] if len(row)>1 else None
                      rn=norm(rep); ln=norm(loc)
                      vals={p:{'tl':f(row[acols['tl'][p]]),'unit':f(row[acols['unit'][p]])} for p in PRODUCTS}
                      if rn=='NATIONAL': weekly_nat=vals
                      elif rn and rn==ln: weekly_region[code(loc)]=vals
                      elif is_person(loc,rep): src_actual[rn]={'name':str(rep).strip(),'loc':str(loc).strip(),'region':code(loc),'vals':vals}
              finally:
                  wb.close()

              # Period master mapping, including vacant positions.
              period_ids={x[0] for x in db.session.query(Target.representative_id).filter(Target.year==YEAR,Target.month==MONTH).distinct().all()}
              reps=Representative.query.filter(Representative.id.in_(period_ids)).all()
              exact={norm(r.rep_name):r for r in reps}
              def resolve(src_name,region):
                  if src_name in exact: return exact[src_name]
                  cand=[]
                  for r in reps:
                      rr=norm(r.rep_name)
                      rc=code(r.region) or code(r.territory)
                      if region and rc and rc!=region: continue
                      if src_name in rr or rr in src_name: cand.append(r)
                  return cand[0] if len(cand)==1 else None

              products={norm(p.product_code or p.product_name):p for p in Product.query.all()}
              missing_products=[p for p in PRODUCTS if p not in products]
              if missing_products: raise SystemExit(f'AUDIT_FAIL|missing products|{missing_products}')

              # Coverage and exact person-level source->DB checks.
              target_rows=Target.query.filter_by(year=YEAR,month=MONTH).all()
              summary_rows=IMSSummary.query.filter_by(year=YEAR,month=MONTH).all()
              print(f'COVERAGE|TARGET_ROWS={len(target_rows)}|SUMMARY_ROWS={len(summary_rows)}|SOURCE_REPS={len(src_targets)}')
              by_rep_count=defaultdict(int)
              for t in target_rows: by_rep_count[t.representative_id]+=1
              seven=sum(1 for n in by_rep_count.values() if n==7)
              print(f'COVERAGE|REPS_WITH_7={seven}|DISTINCT_TARGET_REPS={len(by_rep_count)}')

              mism=[]; mapping_mism=[]
              region_db_tl=defaultdict(lambda:defaultdict(float)); region_db_unit=defaultdict(lambda:defaultdict(float))
              region_db_atl=defaultdict(lambda:defaultdict(float)); region_db_aunit=defaultdict(lambda:defaultdict(float))
              region_src_tl=defaultdict(lambda:defaultdict(float)); region_src_unit=defaultdict(lambda:defaultdict(float))
              region_src_atl=defaultdict(lambda:defaultdict(float)); region_src_aunit=defaultdict(lambda:defaultdict(float))
              national_person={'tl':defaultdict(float),'unit':defaultdict(float),'atl':defaultdict(float),'aunit':defaultdict(float)}
              resolved_ids=set()
              for sn,rec in src_targets.items():
                  r=resolve(sn,rec['region'])
                  if not r:
                      mapping_mism.append(('UNMATCHED',rec['name'],rec['region'])); continue
                  if r.id in resolved_ids: mapping_mism.append(('DUP_REP',rec['name'],r.id)); continue
                  resolved_ids.add(r.id)
                  rc=code(r.region) or code(r.territory)
                  if rc and rec['region'] and rc!=rec['region']: mapping_mism.append(('REGION',rec['name'],rec['region'],r.rep_name,rc))
                  act=src_actual.get(sn,{'vals':{p:{'tl':0.0,'unit':0.0} for p in PRODUCTS}})['vals']
                  for p in PRODUCTS:
                      prod=products[p]
                      t=Target.query.filter_by(year=YEAR,month=MONTH,representative_id=r.id,product_id=prod.id).first()
                      s=IMSSummary.query.filter_by(year=YEAR,month=MONTH,representative_id=r.id,product_id=prod.id).first()
                      stl=rec['vals'][p]['tl']; satl=act[p]['tl']; saunit=act[p]['unit']; sunit=rec['vals'][p]['bal_unit']+saunit
                      if not t: mism.append(('TARGET_MISSING',rec['name'],p)); continue
                      if not close(t.tl_target,stl): mism.append(('TARGET_TL',rec['name'],p,t.tl_target,stl))
                      if not close(t.unit_target,sunit): mism.append(('TARGET_UNIT',rec['name'],p,t.unit_target,sunit))
                      if not s: mism.append(('SUMMARY_MISSING',rec['name'],p)); continue
                      if not close(s.tl,satl): mism.append(('ACTUAL_TL',rec['name'],p,s.tl,satl))
                      if not close(s.unit,saunit): mism.append(('ACTUAL_UNIT',rec['name'],p,s.unit,saunit))
                      rg=rec['region']
                      region_src_tl[rg][p]+=stl; region_src_unit[rg][p]+=sunit; region_src_atl[rg][p]+=satl; region_src_aunit[rg][p]+=saunit
                      region_db_tl[rg][p]+=t.tl_target; region_db_unit[rg][p]+=t.unit_target; region_db_atl[rg][p]+=s.tl; region_db_aunit[rg][p]+=s.unit
                      national_person['tl'][p]+=stl; national_person['unit'][p]+=sunit; national_person['atl'][p]+=satl; national_person['aunit'][p]+=saunit

              print(f'PERSON_LEVEL|MISMATCHES={len(mism)}|MAPPING_MISMATCHES={len(mapping_mism)}')
              for x in (mism+mapping_mism)[:30]: print('MISMATCH|'+json.dumps(x,ensure_ascii=False))

              # Region subtotal and NATIONAL reconciliation: target and actual, TL and unit.
              recon_fail=[]
              regions=sorted(region_src_tl)
              for rg in regions:
                  for p in PRODUCTS:
                      # DB must equal person source aggregation exactly.
                      for metric,dbv,srcv in [
                          ('TARGET_TL_DB',region_db_tl[rg][p],region_src_tl[rg][p]),('TARGET_UNIT_DB',region_db_unit[rg][p],region_src_unit[rg][p]),
                          ('ACTUAL_TL_DB',region_db_atl[rg][p],region_src_atl[rg][p]),('ACTUAL_UNIT_DB',region_db_aunit[rg][p],region_src_aunit[rg][p])]:
                          if not close(dbv,srcv): recon_fail.append((rg,p,metric,dbv,srcv))
                      # Workbook regional subtotal must equal the people assigned to that region.
                      if rg in bakiye_region:
                          rtl=bakiye_region[rg][p]['tl']
                          runit=bakiye_region[rg][p]['bal_unit'] + weekly_region.get(rg,{}).get(p,{}).get('unit',0.0)
                          if not close(rtl,region_src_tl[rg][p]): recon_fail.append((rg,p,'REGION_SUBTOTAL_TARGET_TL',rtl,region_src_tl[rg][p]))
                          if not close(runit,region_src_unit[rg][p]): recon_fail.append((rg,p,'REGION_SUBTOTAL_TARGET_UNIT',runit,region_src_unit[rg][p]))
                      if rg in weekly_region:
                          if not close(weekly_region[rg][p]['tl'],region_src_atl[rg][p]): recon_fail.append((rg,p,'REGION_SUBTOTAL_ACTUAL_TL',weekly_region[rg][p]['tl'],region_src_atl[rg][p]))
                          if not close(weekly_region[rg][p]['unit'],region_src_aunit[rg][p]): recon_fail.append((rg,p,'REGION_SUBTOTAL_ACTUAL_UNIT',weekly_region[rg][p]['unit'],region_src_aunit[rg][p]))

              region_sub_sum={'tl':defaultdict(float),'unit':defaultdict(float),'atl':defaultdict(float),'aunit':defaultdict(float)}
              for rg in regions:
                  for p in PRODUCTS:
                      if rg in bakiye_region:
                          region_sub_sum['tl'][p]+=bakiye_region[rg][p]['tl']
                          region_sub_sum['unit'][p]+=bakiye_region[rg][p]['bal_unit']+weekly_region.get(rg,{}).get(p,{}).get('unit',0.0)
                      if rg in weekly_region:
                          region_sub_sum['atl'][p]+=weekly_region[rg][p]['tl']; region_sub_sum['aunit'][p]+=weekly_region[rg][p]['unit']

              for p in PRODUCTS:
                  nat_tl=bakiye_nat[p]['tl']; nat_unit=bakiye_nat[p]['bal_unit']+weekly_nat[p]['unit']; nat_atl=weekly_nat[p]['tl']; nat_aunit=weekly_nat[p]['unit']
                  print('NATIONAL|'+p+f'|PERSON_TL={national_person["tl"][p]:.6f}|REGION_SUB_TL={region_sub_sum["tl"][p]:.6f}|NATIONAL_TL={nat_tl:.6f}|PERSON_UNIT={national_person["unit"][p]:.6f}|REGION_SUB_UNIT={region_sub_sum["unit"][p]:.6f}|NATIONAL_UNIT={nat_unit:.6f}|PERSON_ACTUAL_TL={national_person["atl"][p]:.6f}|REGION_SUB_ACTUAL_TL={region_sub_sum["atl"][p]:.6f}|NATIONAL_ACTUAL_TL={nat_atl:.6f}|PERSON_ACTUAL_UNIT={national_person["aunit"][p]:.6f}|REGION_SUB_ACTUAL_UNIT={region_sub_sum["aunit"][p]:.6f}|NATIONAL_ACTUAL_UNIT={nat_aunit:.6f}')
                  for metric,a,b in [
                      ('NATIONAL_vs_REGION_TARGET_TL',nat_tl,region_sub_sum['tl'][p]),('NATIONAL_vs_REGION_TARGET_UNIT',nat_unit,region_sub_sum['unit'][p]),
                      ('NATIONAL_vs_REGION_ACTUAL_TL',nat_atl,region_sub_sum['atl'][p]),('NATIONAL_vs_REGION_ACTUAL_UNIT',nat_aunit,region_sub_sum['aunit'][p])]:
                      if not close(a,b): recon_fail.append(('NATIONAL',p,metric,a,b))

              print(f'RECONCILIATION|FAILURES={len(recon_fail)}')
              for x in recon_fail[:60]: print('RECON_FAIL|'+json.dumps(x,ensure_ascii=False))

              # Full competition parse -> DB key/value reconciliation using the same parser as import.
              svc=CompetitionImportService(file_path=str(source),upload_id=upload.id,year=upload.year,month=upload.month,week_number=upload.week_number)
              svc.load_workbook(str(source)); svc.validate_workbook()
              src_comp={}; comp_conflicts=[]; supported=svc.get_supported_sheets()
              try:
                  for sh in supported:
                      st=svc._parse_sheet_structure(sh)
                      for rec in svc._parse_sheet_records(st):
                          nr=svc.normalize_record(rec)
                          key=(svc._normalize_turkish_text(sh),nr.get('year'),nr.get('month'),nr.get('week_number'),nr.get('territory'),nr.get('subterritory',''),nr.get('product_group',DefaultGroup.GENEL.value),nr.get('product_name'),nr.get('metric_type'))
                          val=float(nr.get('metric_value') or 0)
                          if key in src_comp and not close(src_comp[key],val,1e-9): comp_conflicts.append((key,src_comp[key],val))
                          src_comp[key]=val
              finally:
                  if svc._workbook: svc._workbook.close()
              db_comp={}
              for r in CompetitionData.query.filter_by(upload_id=upload.id).all():
                  key=(svc._normalize_turkish_text(r.sheet_name),r.year,r.month,r.week_number,svc._normalize_turkish_text(r.territory),svc._normalize_turkish_text(r.subterritory or ''),svc._normalize_turkish_text(r.product_group or DefaultGroup.GENEL.value),svc._normalize_turkish_text(r.product_name),r.metric_type)
                  db_comp[key]=float(r.metric_value or 0)
              missing=set(src_comp)-set(db_comp); extra=set(db_comp)-set(src_comp); value_m=[(k,src_comp[k],db_comp[k]) for k in src_comp.keys() & db_comp.keys() if not close(src_comp[k],db_comp[k],1e-9)]
              company={norm(p.product_name) for p in Product.query.filter_by(is_active=True).all()}|{norm(p.product_code) for p in Product.query.filter_by(is_active=True).all()}
              rival_keys=[k for k in src_comp if norm(k[7]) not in company and not any(x in norm(k[7]) for x in ('TOPLAM','TOTAL','SUBTOTAL','GRAND TOTAL'))]
              rival_missing=sum(1 for k in rival_keys if k not in db_comp)
              print(f'COMPETITION|SHEETS={len(supported)}|SOURCE_UNIQUE={len(src_comp)}|DB_ROWS={len(db_comp)}|CONFLICTS={len(comp_conflicts)}|MISSING={len(missing)}|EXTRA={len(extra)}|VALUE_MISMATCH={len(value_m)}|RIVAL_SOURCE={len(rival_keys)}|RIVAL_MISSING={rival_missing}')
              for k in list(missing)[:10]: print('COMP_MISSING|'+json.dumps(k,ensure_ascii=False,default=str))
              for x in value_m[:10]: print('COMP_VALUE_MISMATCH|'+json.dumps(x,ensure_ascii=False,default=str))

              fatal=[]
              if len(target_rows)!=791 or len(by_rep_count)!=113 or seven!=113: fatal.append('target_coverage')
              if len(summary_rows)!=791: fatal.append('summary_coverage')
              if len(src_targets)!=113 or len(resolved_ids)!=113: fatal.append('source_rep_mapping')
              if mism or mapping_mism: fatal.append('person_level_source_db')
              if comp_conflicts or missing or extra or value_m or rival_missing: fatal.append('competition_source_db')
              # NATIONAL/region discrepancies are a business-integrity blocker until explained.
              if recon_fail: fatal.append('regional_national_reconciliation')
              print('AUDIT_RESULT|'+json.dumps({'fatal':fatal,'target_rows':len(target_rows),'summary_rows':len(summary_rows),'source_reps':len(src_targets),'competition_rows':len(db_comp),'reconciliation_failures':len(recon_fail)},ensure_ascii=False))
              if fatal: raise SystemExit(2)
          PY
          REMOTE