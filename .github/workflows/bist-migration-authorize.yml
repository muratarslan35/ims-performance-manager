name: Authorize Temporary BIST Migration Bridge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bist-migration-authorize.yml"

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
    steps:
      - name: Configure IMS SSH
        env:
          KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/ims_key
          chmod 600 ~/.ssh/ims_key

      - name: Authorize dedicated BIST VM temporarily
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_key -p "$IMS_PORT" -o BatchMode=yes -o IdentitiesOnly=yes             -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null             "$IMS_USER@$IMS_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          install -d -m 700 /home/ubuntu/.ssh
          touch /home/ubuntu/.ssh/authorized_keys
          chmod 600 /home/ubuntu/.ssh/authorized_keys
          tmp=$(mktemp)
          grep -v 'bist-migration-bridge-20260925' /home/ubuntu/.ssh/authorized_keys > "$tmp" || true
          cat "$tmp" > /home/ubuntu/.ssh/authorized_keys
          rm -f "$tmp"
          printf '%s\n' 'from="89.168.99.141",no-agent-forwarding,no-port-forwarding,no-X11-forwarding,no-pty ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILy6SL18o5oSdVYbMRBT35R2uRGNwrd2RmYpcGeHxezf bist-migration-bridge-20260925' >> /home/ubuntu/.ssh/authorized_keys
          chmod 600 /home/ubuntu/.ssh/authorized_keys
          echo "BIST_MIGRATION_BRIDGE_AUTHORIZED=PASS"
          REMOTE
