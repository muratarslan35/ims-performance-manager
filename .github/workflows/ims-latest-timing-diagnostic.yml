name: Latest IMS Timing Diagnostic

on:
  push:
    branches:
      - diag/publication-notice-live

permissions:
  contents: read

jobs:
  timing_check:
    runs-on: ubuntu-latest
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Read latest IMS timing from production
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 \
            "$IMS_USER@$IMS_HOST" \
            "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          venv/bin/python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          import sqlalchemy as sa
          from sqlalchemy import desc
          from app import create_app
          from app.extensions import db
          from app.models import IMSUpload, IMSImportJob
          from app.services.ims_progress_store import IMSProgressStore
          from app.services.persistent_dashboard_snapshot_service import PersistentDashboardSnapshotService
          from app.services.persistent_region_snapshot_service import region_snapshot_sets, region_snapshots
          from app.services.persistent_representative_snapshot_service import representative_snapshot_sets, representative_snapshots
          from app.services.production_result_service import ProductionResultService

          def secs(a, b):
              if a is None or b is None:
                  return None
              return round((b - a).total_seconds(), 3)

          def parse_iso(value):
              if not value:
                  return None
              try:
                  return datetime.fromisoformat(str(value).replace('Z', '+00:00')).replace(tzinfo=None)
              except Exception:
                  return None

          def fmt(value):
              return "none" if value is None else str(value)

          app = create_app()
          with app.app_context():
              upload = IMSUpload.query.filter_by(status=IMSUpload.STATUS_COMPLETED).order_by(
                  desc(IMSUpload.year), desc(IMSUpload.month), desc(IMSUpload.week_number),
                  desc(IMSUpload.completed_at), desc(IMSUpload.id),
              ).first()
              if upload is None:
                  raise SystemExit("No completed IMS upload")
              job = IMSImportJob.query.filter_by(ims_upload_id=upload.id).order_by(
                  desc(IMSImportJob.started_at), desc(IMSImportJob.id)
              ).first()
              if job is None:
                  raise SystemExit(f"No import job for upload {upload.id}")
              progress = IMSProgressStore.read(job.id) or {}
              progress_at = parse_iso(progress.get("updated_at"))
              summary = {}
              try:
                  summary = json.loads(job.result_summary or "{}")
              except Exception:
                  pass

              queue_wait = secs(job.queued_at, job.started_at)
              import_seconds = secs(job.started_at, job.completed_at)
              snapshot_seconds = secs(job.completed_at, progress_at)
              total_started_to_100 = secs(job.started_at, progress_at)
              total_queued_to_100 = secs(job.queued_at, progress_at)

              print(
                  "LATEST_IMS_TIMING|"
                  f"upload_id={upload.id}|job_id={job.id}|year={upload.year}|month={upload.month}|"
                  f"week={upload.week_number or 0}|file={upload.file_name}|status={job.status}|"
                  f"queued_at={fmt(job.queued_at)}|started_at={fmt(job.started_at)}|"
                  f"job_completed_at={fmt(job.completed_at)}|upload_completed_at={fmt(upload.completed_at)}|"
                  f"progress_percent={progress.get('percent')}|progress_stage={progress.get('stage')}|"
                  f"progress_status={progress.get('status')}|progress_updated_at={fmt(progress_at)}|"
                  f"queue_wait_seconds={fmt(queue_wait)}|import_seconds={fmt(import_seconds)}|"
                  f"snapshot_seconds={fmt(snapshot_seconds)}|started_to_100_seconds={fmt(total_started_to_100)}|"
                  f"queued_to_100_seconds={fmt(total_queued_to_100)}|"
                  f"upload_processing_time={fmt(upload.processing_time)}|"
                  f"background_job_seconds={fmt(summary.get('background_job_seconds'))}|"
                  f"publication_ready={fmt(summary.get('publication_ready'))}"
              )

              production = ProductionResultService.final_upload(upload.year, upload.month)
              production_id = int(production.id if production is not None else 0)

              dash_path = PersistentDashboardSnapshotService._generation_path(
                  upload.year, upload.month, upload.id, production_id
              )
              dash_created_at = None
              dash_ready = False
              if dash_path.exists():
                  try:
                      dash_env = json.loads(dash_path.read_text(encoding='utf-8'))
                      dash_created_at = parse_iso(dash_env.get('created_at'))
                      dash_ready = int(dash_env.get('ims_upload_id') or 0) == int(upload.id)
                  except Exception:
                      pass
              print(
                  "DASHBOARD_SNAPSHOT|"
                  f"source_upload_id={upload.id}|production_upload_id={production_id}|"
                  f"ready={int(dash_ready)}|created_at={fmt(dash_created_at)}|"
                  f"from_job_start_seconds={fmt(secs(job.started_at, dash_created_at))}|"
                  f"from_import_complete_seconds={fmt(secs(job.completed_at, dash_created_at))}"
              )

              region_rows = db.session.execute(
                  sa.select(
                      region_snapshot_sets.c.id,
                      region_snapshot_sets.c.status,
                      region_snapshot_sets.c.region_count,
                      region_snapshot_sets.c.created_at,
                      region_snapshot_sets.c.activated_at,
                  ).where(
                      region_snapshot_sets.c.year == int(upload.year),
                      region_snapshot_sets.c.month == int(upload.month),
                      region_snapshot_sets.c.source_upload_id == int(upload.id),
                      region_snapshot_sets.c.production_upload_id == production_id,
                  ).order_by(desc(region_snapshot_sets.c.id))
              ).all()
              for row in region_rows[:5]:
                  member_count = db.session.execute(
                      sa.select(sa.func.count()).select_from(region_snapshots).where(region_snapshots.c.set_id == int(row.id))
                  ).scalar()
                  print(
                      "REGION_SNAPSHOT_SET|"
                      f"set_id={row.id}|status={row.status}|expected={row.region_count}|members={member_count}|"
                      f"created_at={fmt(row.created_at)}|activated_at={fmt(row.activated_at)}|"
                      f"from_job_start_seconds={fmt(secs(job.started_at, row.activated_at))}|"
                      f"from_import_complete_seconds={fmt(secs(job.completed_at, row.activated_at))}"
                  )

              rep_rows = db.session.execute(
                  sa.select(
                      representative_snapshot_sets.c.id,
                      representative_snapshot_sets.c.status,
                      representative_snapshot_sets.c.representative_count,
                      representative_snapshot_sets.c.created_at,
                      representative_snapshot_sets.c.activated_at,
                  ).where(
                      representative_snapshot_sets.c.year == int(upload.year),
                      representative_snapshot_sets.c.month == int(upload.month),
                      representative_snapshot_sets.c.source_upload_id == int(upload.id),
                      representative_snapshot_sets.c.production_upload_id == production_id,
                  ).order_by(desc(representative_snapshot_sets.c.id))
              ).all()
              for row in rep_rows[:5]:
                  member_count = db.session.execute(
                      sa.select(sa.func.count()).select_from(representative_snapshots).where(representative_snapshots.c.set_id == int(row.id))
                  ).scalar()
                  print(
                      "REPRESENTATIVE_SNAPSHOT_SET|"
                      f"set_id={row.id}|status={row.status}|expected={row.representative_count}|members={member_count}|"
                      f"created_at={fmt(row.created_at)}|activated_at={fmt(row.activated_at)}|"
                      f"from_job_start_seconds={fmt(secs(job.started_at, row.activated_at))}|"
                      f"from_import_complete_seconds={fmt(secs(job.completed_at, row.activated_at))}"
                  )
          PY

          echo '--- SNAPSHOT JOURNAL ---'
          sudo journalctl -u ims-import-worker.service --since '2026-09-16 17:30:00' --no-pager -o short-iso 2>/dev/null \
            | grep -E 'dashboard_snapshot_warm|dashboard_snapshot_acceptance|region_snapshot_warm|region_snapshot_acceptance|representative_snapshot_warm status=|representative_snapshot_warm_progress|ims_rollback_master_journal_ready' \
            | tail -n 240 || true
          REMOTE
