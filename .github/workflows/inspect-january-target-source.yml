name: Inspect January target source
on:
  push:
    branches: [ops/full-january-source-audit]
    paths: [.github/workflows/inspect-january-target-source.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Inspect workbook target headers and sample raw provenance
        run: |
          ssh -i ~/.ssh/key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          venv/bin/python - <<'PY'
          from openpyxl import load_workbook
          from pathlib import Path
          import sqlite3
          p=Path('uploads/Tayfun-1_3.Hafta_Ocak_Brick_Analizi_.xlsx')
          wbv=load_workbook(p,data_only=True,read_only=True)
          print('SHEETS|'+'||'.join(wbv.sheetnames))
          for sn in wbv.sheetnames:
              u=sn.upper()
              if any(k in u for k in ('HEDEF','BAK','TTS','REA')):
                  ws=wbv[sn]
                  print('===SHEET|'+sn+'===')
                  for i,row in enumerate(ws.iter_rows(values_only=True),start=1):
                      if i>7: break
                      print('ROW|%d|%s'%(i,' | '.join('' if v is None else str(v) for v in row)[:12000]))
          wbv.close()
          con=sqlite3.connect('instance/ipm.db'); con.row_factory=sqlite3.Row
          q='''SELECT d.sheet_name,d.sheet_type,d.source_row,d.representative,d.product,d.unit,d.tl,d.raw_json
               FROM ims_raw_data d JOIN representatives r ON r.id=d.representative_id JOIN products p ON p.id=d.product_id
               WHERE d.year=2026 AND d.month=1 AND UPPER(r.rep_name)='ENGIN YAPAK' AND UPPER(p.product_code)='TRAVAZOL'
               ORDER BY d.sheet_name,d.source_row'''
          for r in con.execute(q): print('RAW_PROVENANCE|'+str(dict(r))[:12000])
          con.close()
          PY
          REMOTE