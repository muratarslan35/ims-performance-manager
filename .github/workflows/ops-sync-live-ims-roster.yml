name: One-time live IMS roster sync

on:
  push:
    branches: ["ops/sync-live-ims-roster"]

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Sync and verify latest IMS roster
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          test "$(git branch --show-current)" = "main"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          venv/bin/python - <<'PY'
          import json
          import sqlite3
          from app import create_app
          from app.extensions import db
          from app.models import IMSImportJob, IMSRawData, Representative
          from app.services.import_roster_sync import IMSRosterSyncService

          connection = sqlite3.connect("instance/ipm.db", timeout=30)
          try:
              connection.execute("PRAGMA busy_timeout=30000")
              processing = int(connection.execute(
                  "SELECT COUNT(*) FROM ims_import_jobs WHERE status='PROCESSING'"
              ).fetchone()[0])
          finally:
              connection.close()
          print(f"IMS_WORKER_IDLE|processing={processing}")
          if processing:
              raise SystemExit("Active IMS import detected; roster sync refused")

          app = create_app()
          with app.app_context():
              result = IMSRosterSyncService.sync_latest()
              upload = IMSRosterSyncService.latest_completed_upload()
              roster_ids = {
                  int(row[0]) for row in db.session.query(IMSRawData.representative_id)
                  .filter(
                      IMSRawData.upload_id == upload.id,
                      IMSRawData.representative_id.isnot(None),
                  ).distinct().all()
              }
              active_ids = {
                  int(row[0]) for row in db.session.query(Representative.id)
                  .filter(Representative.active.is_(True)).all()
              }
              extra = sorted(active_ids - roster_ids)
              missing = sorted(roster_ids - active_ids)
              print("ROSTER_SYNC_RESULT|" + json.dumps(result, ensure_ascii=False, sort_keys=True))
              print(f"ROSTER_VERIFY|upload_id={upload.id}|year={upload.year}|month={upload.month}|week={upload.week_number}|ims_roster={len(roster_ids)}|active={len(active_ids)}|extra={len(extra)}|missing={len(missing)}")
              if extra or missing:
                  print("ROSTER_EXTRA_IDS|" + ",".join(map(str, extra)))
                  print("ROSTER_MISSING_IDS|" + ",".join(map(str, missing)))
                  raise SystemExit("Representative active roster does not equal latest IMS roster")
          PY
          REMOTE
