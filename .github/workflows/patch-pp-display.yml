name: Patch Excel PP display semantics
on:
  push:
    branches:
      - fix/excel-pp-display-rounding
    paths:
      - .github/workflows/patch-pp-display.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/excel-pp-display-rounding
      - name: Patch service and tests
        run: |
          echo '' | base64 -d | python
          rm .github/workflows/patch-pp-display.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Match regional PP display to Excel cells'
          git push origin HEAD:fix/excel-pp-display-rounding
