name: Week7 import diagnostic
on:
  push:
    branches: [diag/week7-import-failure]
permissions:
  contents: write
jobs:
  diagnose:
    if: github.event.head_commit.message == 'Persist Week 7 diagnostic output'
    runs-on: ubuntu-latest
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/week7-import-failure
      - name: Configure SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Read-only production diagnosis
        run: |
          mkdir -p diagnostics
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" > diagnostics/week7_import.txt <<'REMOTE'
          set -euo pipefail
          cd "$IMS_PATH"
          venv/bin/python - <<'PY'
          import sqlite3, json
          con = sqlite3.connect('instance/ipm.db', timeout=30)
          con.row_factory = sqlite3.Row
          try:
              rows=con.execute('select * from ims_import_jobs order by id desc limit 5').fetchall()
              for r in rows:
                  print('JOB|'+json.dumps({k:r[k] for k in r.keys()}, ensure_ascii=False, default=str))
              print('PROCESSING_COUNT|'+str(con.execute("select count(*) from ims_import_jobs where status='PROCESSING'").fetchone()[0]))
              rows=con.execute('select * from ims_uploads order by id desc limit 5').fetchall()
              for r in rows:
                  print('UPLOAD|'+json.dumps({k:r[k] for k in r.keys()}, ensure_ascii=False, default=str))
          finally:
              con.close()
          PY
          echo '--- WORKER JOURNAL ---'
          sudo journalctl -u ims-import-worker.service -n 220 --no-pager | tail -n 220
          REMOTE
      - name: Commit diagnostic
        run: |
          git config user.name 'Murat arslan'
          git config user.email '102037882+muratarslan35@users.noreply.github.com'
          git add diagnostics/week7_import.txt
          git commit -m 'Record Week 7 import diagnostic'
          git push origin HEAD:diag/week7-import-failure
