name: One-off dashboard unit product order patch

on:
  push:
    branches:
      - fix/dashboard-unit-product-order
    paths:
      - .github/workflows/oneoff-dashboard-unit-order.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dashboard-unit-product-order
          fetch-depth: 0
      - name: Sanity
        run: echo ready
