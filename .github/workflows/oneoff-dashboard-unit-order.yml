name: One-off dashboard unit product order patch

on:
  push:
    branches:
      - fix/dashboard-unit-product-order
    paths:
      - .github/workflows/oneoff-dashboard-unit-order.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dashboard-unit-product-order
          fetch-depth: 0
      - name: Apply UI-only dashboard product order
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/templates/dashboard.html')
          text = path.read_text(encoding='utf-8')
          old = '''    <div class="ims-unit-exit-list">{% for product in national.products | default([], true) %}<div class="ims-unit-exit-row"><span>{{ product.product_name }}</span><small>{{ "{:,.0f}".format(product.unit_target | default(0, true)) }} hedef</small><b>{{ "{:,.0f}".format(product.unit_actual | default(0, true)) }} kutu</b><em class="{% if product.unit_realization_percent >= 100 %}good{% elif product.unit_realization_percent >= 70 %}watch{% else %}risk{% endif %}">%{{ product.unit_realization_percent | default(0, true) }}</em></div>{% else %}<div class="ims-unit-exit-empty">Kutu verisi sonraki importta burada listelenir.</div>{% endfor %}</div>'''
          new = '''    {% set unit_product_order = ['Travazol', 'Monurol', 'Mixovul', 'Acnemix', 'Stiderm', 'Brimoder', 'Fentivag'] %}
    {% set unit_product_order_lower = ['travazol', 'monurol', 'mixovul', 'acnemix', 'stiderm', 'brimoder', 'fentivag'] %}
    {% set unit_products = national.products | default([], true) %}
    <div class="ims-unit-exit-list">{% if unit_products %}{% for ordered_name in unit_product_order %}{% for product in unit_products %}{% if product.product_name | lower == ordered_name | lower %}<div class="ims-unit-exit-row"><span>{{ product.product_name }}</span><small>{{ "{:,.0f}".format(product.unit_target | default(0, true)) }} hedef</small><b>{{ "{:,.0f}".format(product.unit_actual | default(0, true)) }} kutu</b><em class="{% if product.unit_realization_percent >= 100 %}good{% elif product.unit_realization_percent >= 70 %}watch{% else %}risk{% endif %}">%{{ product.unit_realization_percent | default(0, true) }}</em></div>{% endif %}{% endfor %}{% endfor %}{% for product in unit_products %}{% if product.product_name | lower not in unit_product_order_lower %}<div class="ims-unit-exit-row"><span>{{ product.product_name }}</span><small>{{ "{:,.0f}".format(product.unit_target | default(0, true)) }} hedef</small><b>{{ "{:,.0f}".format(product.unit_actual | default(0, true)) }} kutu</b><em class="{% if product.unit_realization_percent >= 100 %}good{% elif product.unit_realization_percent >= 70 %}watch{% else %}risk{% endif %}">%{{ product.unit_realization_percent | default(0, true) }}</em></div>{% endif %}{% endfor %}{% else %}<div class="ims-unit-exit-empty">Kutu verisi sonraki importta burada listelenir.</div>{% endif %}</div>'''
          if old not in text:
              raise SystemExit('Expected dashboard unit list block was not found; refusing broad edit.')
          updated = text.replace(old, new, 1)
          if updated.count('unit_product_order =') != 1:
              raise SystemExit('Unexpected replacement count.')
          path.write_text(updated, encoding='utf-8')
          PY

          rm .github/workflows/oneoff-dashboard-unit-order.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/templates/dashboard.html .github/workflows/oneoff-dashboard-unit-order.yml
          git commit -m "Fix dashboard box product display order"
          git push origin HEAD:fix/dashboard-unit-product-order
