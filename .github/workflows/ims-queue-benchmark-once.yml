name: One-shot IMS Queue Benchmark

on:
  push:
    branches:
      - test/ims-queue-benchmark-once

permissions:
  contents: read

concurrency:
  group: ims-queue-benchmark-once
  cancel-in-progress: true

jobs:
  benchmark:
    name: Production-host isolated background queue benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_queue_benchmark_key
          chmod 600 ~/.ssh/ims_queue_benchmark_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Copy benchmark harness
        shell: bash
        run: |
          scp -i ~/.ssh/ims_queue_benchmark_key -P "$IMS_PORT" \
            scripts/benchmark_background_queue_once.py \
            "$IMS_USER@$IMS_HOST:/tmp/ims-queue-benchmark-once.py"
          scp -i ~/.ssh/ims_queue_benchmark_key -P "$IMS_PORT" \
            scripts/benchmark_queue_stack_probe.py \
            "$IMS_USER@$IMS_HOST:/tmp/ims-queue-stack-probe.py"

      - name: Run isolated queue benchmark
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_queue_benchmark_key -p "$IMS_PORT" \
            -o ServerAliveInterval=20 -o ServerAliveCountMax=45 \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          git fetch origin main
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain)"
          git pull --ff-only origin main

          venv/bin/python - <<'PY'
          import sqlite3
          connection = sqlite3.connect('instance/ipm.db', timeout=30)
          try:
              exists = connection.execute(
                  "SELECT 1 FROM sqlite_master WHERE type='table' AND name='ims_import_jobs'"
              ).fetchone()
              processing = 0 if not exists else int(connection.execute(
                  "SELECT COUNT(*) FROM ims_import_jobs WHERE status='PROCESSING'"
              ).fetchone()[0])
          finally:
              connection.close()
          print(f'IMS_QUEUE_BENCHMARK_WORKER_IDLE|processing={processing}', flush=True)
          if processing:
              raise SystemExit('Active IMS import detected; isolated benchmark refused.')
          PY

          stamp=$(date +%Y%m%d-%H%M%S)
          benchmark_db="/tmp/ims-queue-benchmark-${stamp}.db"
          cleanup() {
            rm -f -- "$benchmark_db" "$benchmark_db-wal" "$benchmark_db-shm" \
              /tmp/ims-queue-benchmark-once.py /tmp/ims-queue-stack-probe.py
            find uploads/ims_queue -maxdepth 1 -type f -name 'queue-benchmark-*' -delete 2>/dev/null || true
          }
          trap cleanup EXIT HUP INT TERM

          echo '--- ISOLATED LIVE DB COPY (NO FULL SCAN) ---'
          BENCHMARK_DB="$benchmark_db" venv/bin/python - <<'PY'
          import os
          import sqlite3
          import time
          from pathlib import Path

          source = Path('instance/ipm.db')
          destination = Path(os.environ['BENCHMARK_DB'])
          started = time.monotonic()
          source_connection = sqlite3.connect(f'file:{source}?mode=ro', uri=True, timeout=30)
          destination_connection = sqlite3.connect(destination, timeout=30)
          try:
              source_connection.execute('PRAGMA busy_timeout=30000')
              destination_connection.execute('PRAGMA busy_timeout=30000')
              source_connection.backup(destination_connection, pages=8192, sleep=0.002)
              destination_connection.commit()
              required = {'ims_uploads', 'ims_raw_data', 'ims_facts', 'ims_competition_data', 'ims_import_jobs'}
              present = {
                  row[0] for row in destination_connection.execute(
                      "SELECT name FROM sqlite_master WHERE type='table'"
                  )
              }
              if not required.issubset(present):
                  raise SystemExit(f'Isolated DB copy missing tables: {sorted(required - present)}')
              latest_upload = destination_connection.execute('SELECT MAX(id) FROM ims_uploads').fetchone()[0]
          finally:
              destination_connection.close()
              source_connection.close()
          print(
              f'IMS_QUEUE_BENCHMARK_COPY|seconds={time.monotonic()-started:.3f}|bytes={destination.stat().st_size}|latest_upload={latest_upload}',
              flush=True,
          )
          PY
          chmod 600 "$benchmark_db"

          echo '--- REAL BACKGROUND QUEUE PATH ON ISOLATED DB + STACK PROBE ---'
          /usr/bin/time -f 'IMS_QUEUE_BENCHMARK_RESOURCE|elapsed_seconds=%e|max_rss_kb=%M|cpu_percent=%P' \
            env DATABASE_URL="sqlite:///$benchmark_db" PYTHONPATH="$IMS_PATH" \
            venv/bin/python /tmp/ims-queue-stack-probe.py

          echo '--- LIVE DB READ-ONLY POST-CHECK ---'
          venv/bin/python - <<'PY'
          import sqlite3
          connection = sqlite3.connect('instance/ipm.db', timeout=30)
          try:
              connection.execute('PRAGMA busy_timeout=30000')
              mode = connection.execute('PRAGMA journal_mode').fetchone()[0]
              latest_upload = connection.execute('SELECT MAX(id) FROM ims_uploads').fetchone()[0]
              processing = connection.execute("SELECT COUNT(*) FROM ims_import_jobs WHERE status='PROCESSING'").fetchone()[0]
          finally:
              connection.close()
          print(
              f'IMS_QUEUE_BENCHMARK_LIVE_DB|journal_mode={mode}|latest_upload={latest_upload}|processing={processing}',
              flush=True,
          )
          if str(mode).lower() != 'wal':
              raise SystemExit('Live DB WAL verification failed')
          PY
          REMOTE
