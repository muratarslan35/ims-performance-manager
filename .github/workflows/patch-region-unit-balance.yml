name: Patch region unit balance authority

on:
  push:
    branches:
      - fix/region-unit-balance-authority

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/region-unit-balance-authority
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply patch
        run: python scripts/patch_region_unit_balance.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/services/region_performance_service.py tests/test_passive_user_and_region_unit_gap_contract.py
          git commit -m "Use MF siz kutu bakiye for region box actuals [patched]"
          git push origin HEAD:fix/region-unit-balance-authority
