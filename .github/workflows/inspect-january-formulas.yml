name: Inspect January formulas
on:
  push:
    branches: [ops/full-january-source-audit]
    paths: [.github/workflows/inspect-january-formulas.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Inspect formulas and box-target sheets
        run: |
          ssh -i ~/.ssh/key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          venv/bin/python - <<'PY'
          from openpyxl import load_workbook
          p='uploads/Tayfun-1_3.Hafta_Ocak_Brick_Analizi_.xlsx'
          wbf=load_workbook(p,data_only=False,read_only=False)
          wbv=load_workbook(p,data_only=True,read_only=True)
          for sn in ['OCAK','OCAK KUTU','OCAK TL','KUTU','TL']:
              if sn not in wbv.sheetnames: continue
              print('===TARGET_SHEET|'+sn+'===')
              ws=wbv[sn]
              for i,row in enumerate(ws.iter_rows(values_only=True),start=1):
                  if i>12: break
                  print('ROW|%d|%s'%(i,' | '.join('' if v is None else str(v) for v in row)[:16000]))
          print('===BAKIYE_FORMULAS===')
          ws=wbf['BAKİYE']
          for r in range(1,min(ws.max_row,140)+1):
              loc=ws.cell(r,1).value; rep=ws.cell(r,2).value
              if rep and (str(rep).strip().upper()=='NATIONAL' or str(rep).strip()==str(loc).strip()):
                  vals=[]
                  for c in [3,4,5,6,7,8,9,36,37,38,39,40,41,42]:
                      vals.append(f'{ws.cell(r,c).coordinate}={ws.cell(r,c).value}')
                  print(f'FORMULA_ROW|{r}|LOC={loc}|REP={rep}|'+ '|'.join(vals))
          print('===TTS_WEEKLY_FORMULAS===')
          ws=wbf['TTS HAFTALIK ÇIKIŞLARI']
          for r in range(1,min(ws.max_row,140)+1):
              loc=ws.cell(r,1).value; rep=ws.cell(r,2).value
              if rep and (str(rep).strip().upper()=='NATIONAL' or str(rep).strip()==str(loc).strip()):
                  vals=[]
                  for c in list(range(3,10))+list(range(12,19)):
                      vals.append(f'{ws.cell(r,c).coordinate}={ws.cell(r,c).value}')
                  print(f'FORMULA_ROW|{r}|LOC={loc}|REP={rep}|'+ '|'.join(vals))
          wbf.close(); wbv.close()
          PY
          REMOTE