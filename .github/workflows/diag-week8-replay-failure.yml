name: Week8 replay failure diagnostic
on:
  push:
    branches: [diag/week8-replay-failure]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Read latest import state
        run: |
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo '=== GIT ==='
          git rev-parse HEAD
          echo '=== IMPORT DB STATE ==='
          venv/bin/python - <<'PY'
          import sqlite3, json
          con=sqlite3.connect('instance/ipm.db', timeout=30)
          con.row_factory=sqlite3.Row
          def rows(sql):
              return [dict(r) for r in con.execute(sql).fetchall()]
          for table in ('ims_import_jobs','ims_uploads'):
              print(table+'_COLUMNS', [r['name'] for r in rows(f'PRAGMA table_info({table})')])
              print(table+'_LATEST', json.dumps(rows(f'SELECT * FROM {table} ORDER BY id DESC LIMIT 16'), ensure_ascii=False, default=str))
          print('UPLOAD_WEEK_COUNTS', json.dumps(rows("SELECT year,month,week_number,status,COUNT(*) AS n,GROUP_CONCAT(id) AS ids FROM ims_uploads WHERE year=2026 AND month=2 GROUP BY year,month,week_number,status ORDER BY week_number,status"), ensure_ascii=False))
          con.close()
          PY
          echo '=== WORKER JOURNAL RECENT ==='
          sudo journalctl -u ims-import-worker.service --since '2026-08-28 20:20:00 UTC' --no-pager | tail -n 700
          REMOTE
