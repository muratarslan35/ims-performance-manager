name: Week8 replay failure diagnostic
on:
  push:
    branches: [diag/week8-replay-failure]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Capture failure stack
        run: |
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "HEAD=$(git rev-parse HEAD)"
          venv/bin/python - <<'PY'
          import sqlite3, json
          con=sqlite3.connect('instance/ipm.db', timeout=30); con.row_factory=sqlite3.Row
          print('LATEST_JOB='+json.dumps(dict(con.execute("SELECT id,status,file_name,year,month,clear_before_import,queued_at,started_at,completed_at,error_message FROM ims_import_jobs ORDER BY id DESC LIMIT 1").fetchone()),ensure_ascii=False,default=str))
          print('PROCESSING='+str(con.execute("SELECT COUNT(*) FROM ims_import_jobs WHERE status='PROCESSING'").fetchone()[0]))
          con.close()
          PY
          echo 'STACK_BEGIN'
          sudo journalctl -u ims-import-worker.service --since '2026-08-28 20:40:20 UTC' --until '2026-08-28 20:41:20 UTC' --no-pager -o cat | tail -n 260
          echo 'STACK_END'
          REMOTE
