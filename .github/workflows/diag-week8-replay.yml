name: Temporary Week 8 Replay Diagnostic

on:
  push:
    branches:
      - diag/week8-replay-failure

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Read latest failed IMS replay evidence
        shell: bash
        run: |
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "DIAG_BRANCH|$(git branch --show-current)|$(git rev-parse HEAD)"
          venv/bin/python - <<'PY'
          import sqlite3, json
          con = sqlite3.connect('instance/ipm.db', timeout=30)
          con.row_factory = sqlite3.Row
          try:
              processing = con.execute("SELECT COUNT(*) c FROM ims_import_jobs WHERE status='PROCESSING'").fetchone()['c']
              print(f"PROCESSING|{processing}")
              rows = con.execute("""
                  SELECT id, file_name, stored_file_name, year, month, status,
                         clear_before_import, ims_upload_id, queued_at, started_at,
                         completed_at, error_message, result_summary
                  FROM ims_import_jobs
                  ORDER BY id DESC LIMIT 8
              """).fetchall()
              for row in rows:
                  d = dict(row)
                  print('JOB|' + json.dumps(d, ensure_ascii=False, default=str))
              uploads = con.execute("""
                  SELECT id, file_name, year, month, week_number, status,
                         created_at, completed_at
                  FROM ims_uploads
                  WHERE year=2026 AND month=2
                  ORDER BY id DESC LIMIT 12
              """).fetchall()
              for row in uploads:
                  print('UPLOAD|' + json.dumps(dict(row), ensure_ascii=False, default=str))
          finally:
              con.close()
          PY
          echo '--- RECENT WORKER ERRORS ---'
          journalctl -u ims-import-worker.service --since '2026-08-28 20:00:00' --no-pager \
            | grep -E -A18 -B6 'ims_background_import_failed|IntegrityError|UNIQUE constraint|Traceback' \
            | tail -220 || true
          REMOTE
