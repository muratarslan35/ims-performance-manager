name: Fast production storage audit

on:
  push:
    branches: ["ops/server-storage-fast-audit"]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Verify cleanup and health
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          echo "WEB_ACTIVE|$(sudo systemctl is-active ims-performance-manager.service)"
          echo "WORKER_ACTIVE|$(sudo systemctl is-active ims-import-worker.service)"
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8000/login >/dev/null
          echo 'HTTP_HEALTH|PASS'
          echo 'KEPT_BACKUPS'
          find instance/backups -maxdepth 1 -type f -printf '%12s %f\n' | sort -nr
          echo 'STORAGE'
          du -sh instance instance/backups uploads/ims_archive 2>/dev/null || true
          df -h /
          free -h
          venv/bin/python - <<'PY'
          from app import create_app
          from app.extensions import db
          from app.models import IMSImportJob
          app=create_app()
          with app.app_context():
              print('IMS_PROCESSING|' + str(IMSImportJob.query.filter_by(status='PROCESSING').count()))
              c=db.session.connection()
              print('SQLITE_JOURNAL_MODE|' + str(c.exec_driver_sql('PRAGMA journal_mode').scalar()))
              print('SQLITE_BUSY_TIMEOUT|' + str(c.exec_driver_sql('PRAGMA busy_timeout').scalar()))
          PY
          REMOTE
