name: Fast production storage audit

on:
  push:
    branches: ["ops/server-storage-fast-audit"]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Fast read-only audit
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo 'COMMIT'; git rev-parse HEAD
          echo 'MEMORY'; free -h
          echo 'DISK'; df -h /
          echo 'DIRS'
          for p in backups backup uploads logs instance reports temp .git; do [ -e "$p" ] && du -sh "$p"; done
          echo 'DB'
          find . -maxdepth 2 -type f \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' -o -name '*-wal' -o -name '*-shm' \) -printf '%TY-%Tm-%Td %TH:%TM %12s %p\n' | sort
          echo 'BACKUPS'
          for d in backups backup; do
            if [ -d "$d" ]; then
              find "$d" -maxdepth 2 -type f -printf '%T@ %12s %p\n' | sort -nr | awk '{ts=$1; size=$2; $1=""; $2=""; sub(/^  */,""); cmd="date -d @" ts " +%Y-%m-%dT%H:%M:%S"; cmd | getline dt; close(cmd); print dt, size, $0}'
            fi
          done
          echo 'IMS_ARCHIVE'; [ -d uploads/ims_archive ] && { du -sh uploads/ims_archive; find uploads/ims_archive -maxdepth 1 -type f | wc -l; }
          echo 'PROCESSING'
          venv/bin/python - <<'PY'
          from app import create_app
          from app.models import IMSImportJob
          app=create_app()
          with app.app_context():
              print(IMSImportJob.query.filter_by(status='PROCESSING').count())
          PY
          REMOTE
