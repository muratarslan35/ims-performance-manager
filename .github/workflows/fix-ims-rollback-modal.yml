name: Fix IMS Rollback Confirmation Interaction

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-ims-rollback-modal.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch first-period rollback confirmation UI
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/services/ims_upload_lifecycle_ui.py')
          text = path.read_text(encoding='utf-8')

          class_line = "        panel.className = 'alert alert-warning py-2 px-2 mb-0 w-100 ims-first-period-confirm';"
          style_line = "        panel.style.cssText = 'position:fixed;z-index:2200;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100vw - 28px));max-width:none;max-height:calc(100vh - 40px);overflow:auto;box-shadow:0 24px 70px rgba(15,23,42,.30);';"
          if class_line not in text:
              raise SystemExit('Expected confirmation panel class line not found')
          text = text.replace(class_line, class_line + '\n' + style_line, 1)

          old_mount = "        disabledRollback.insertAdjacentElement('afterend', panel);"
          new_mount = "        document.body.appendChild(panel);"
          if old_mount not in text:
              raise SystemExit('Expected inline panel mount not found')
          text = text.replace(old_mount, new_mount, 1)

          path.write_text(text, encoding='utf-8')
          PY

          python -m py_compile app/services/ims_upload_lifecycle_ui.py
          git diff --check
          git diff -- app/services/ims_upload_lifecycle_ui.py

      - name: Commit narrow IMS lifecycle fix
        run: |
          if git diff --quiet -- app/services/ims_upload_lifecycle_ui.py; then
            echo 'No change produced'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/services/ims_upload_lifecycle_ui.py
          git commit -m 'Fix IMS rollback confirmation popup'
          git push origin HEAD:main
