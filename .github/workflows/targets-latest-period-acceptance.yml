name: March Production Scope Difference Diagnostic

on:
  push:
    paths:
      - '.github/workflows/targets-latest-period-acceptance.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_diag_key
          chmod 600 ~/.ssh/ims_diag_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Compare parsed representative scopes read only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_diag_key -p "$IMS_PORT" -o BatchMode=yes "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          test "$(git rev-parse HEAD)" = "9f410f1f361d16d3b4e624eb47b4cfc691b09ba5"
          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          import hashlib
          from pathlib import Path
          from openpyxl import load_workbook
          from app import create_app
          from app.extensions import db
          from app.models import ProductionResultUpload, Representative, Target
          from app.services.production_result_import_service import ProductionResultImportService

          app=create_app()
          with app.app_context():
              processing=int(db.session.execute(db.text("SELECT COUNT(*) FROM ims_import_jobs WHERE status='PROCESSING'")).scalar() or 0)
              queued=int(db.session.execute(db.text("SELECT COUNT(*) FROM ims_import_jobs WHERE status='QUEUED'")).scalar() or 0)
              print(f"IMS_JOB_GATE|processing={processing}|queued={queued}")
              assert processing == 0 and queued == 0
              item=db.session.get(ProductionResultUpload,3)
              path=Path(app.config['UPLOAD_FOLDER'])/'production_results'/item.stored_file_name
              digest=hashlib.sha256(path.read_bytes()).hexdigest()
              assert digest == item.source_hash

              service=ProductionResultImportService(path,2026,3,production_stage=2)
              service._load_master_maps()
              wb=load_workbook(path,read_only=False,data_only=True)
              tl_sheet=service._find_sheet(wb,'TL')
              unit_sheet=service._find_sheet(wb,'KUTU')
              tl_rows=service._read_sheet(tl_sheet,'TL')
              unit_rows=service._read_sheet(unit_sheet,'KUTU')
              tl_ids=set(tl_rows)
              unit_ids=set(unit_rows)
              print(f"SCOPES|tl={len(tl_ids)}|kutu={len(unit_ids)}|intersection={len(tl_ids & unit_ids)}")

              for label, ids in [('TL_ONLY',sorted(tl_ids-unit_ids)),('KUTU_ONLY',sorted(unit_ids-tl_ids))]:
                  print(f"{label}_COUNT|{len(ids)}")
                  for rid in ids:
                      rep=db.session.get(Representative,rid)
                      target_count=Target.query.filter_by(year=2026,month=3,representative_id=rid).count()
                      row=(tl_rows if label=='TL_ONLY' else unit_rows)[rid]
                      print(f"{label}|id={rid}|name={rep.rep_name if rep else None}|active={rep.active if rep else None}|region={rep.region if rep else None}|targets={target_count}|actual_total={row['total_actual']}|actuals={row['values']}|target_total={row['total_target']}")

              # Also enumerate workbook roster rows that do not resolve to a current representative map.
              for metric, sheet in [('TL',tl_sheet),('KUTU',unit_sheet)]:
                  layout=service._layout(sheet,metric)
                  for row_number in range(layout['header_row']+1,sheet.max_row+1):
                      raw_name=sheet.cell(row_number,layout['name_column']).value
                      raw_region=sheet.cell(row_number,layout['region_column']).value
                      label=service._normalize(raw_name)
                      if not label or label=='NATIONAL' or service._is_region(label):
                          continue
                      rep=service._match_representative(raw_name,raw_region)
                      if rep is None:
                          vals=service._read_metric_values(sheet,row_number,layout,'diagnostic')
                          print(f"UNRESOLVED_RAW|metric={metric}|row={row_number}|name={raw_name!r}|region={raw_region!r}|actual_total={vals['total_actual']}|actuals={vals['values']}|target_total={vals['total_target']}")

              print(f"SQLITE|journal={db.session.execute(db.text('PRAGMA journal_mode')).scalar()}|busy_timeout={db.session.execute(db.text('PRAGMA busy_timeout')).scalar()}")
          PY
          REMOTE
