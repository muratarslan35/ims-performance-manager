name: March Production Merge Gate

on:
  push:
    paths:
      - '.github/workflows/targets-latest-period-acceptance.yml'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_diag_key
          chmod 600 ~/.ssh/ims_diag_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Read-only production gate
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_diag_key -p "$IMS_PORT" -o BatchMode=yes "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "396b048f114b97e93790bc7c0993f9dc3cd0d29b"
          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          import hashlib
          from pathlib import Path
          from app import create_app
          from app.extensions import db
          from app.models import ProductionResultUpload

          app=create_app()
          with app.app_context():
              processing=int(db.session.execute(db.text("SELECT COUNT(*) FROM ims_import_jobs WHERE status='PROCESSING'")).scalar() or 0)
              queued=int(db.session.execute(db.text("SELECT COUNT(*) FROM ims_import_jobs WHERE status='QUEUED'")).scalar() or 0)
              print(f"IMS_JOB_GATE|processing={processing}|queued={queued}")
              assert processing == 0 and queued == 0

              item=ProductionResultUpload.query.get(3)
              assert item is not None
              path=Path(app.config['UPLOAD_FOLDER'])/'production_results'/item.stored_file_name
              digest=hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None
              print(f"PROD_UPLOAD|id={item.id}|status={item.status}|stored_sha={item.source_hash}|actual_sha={digest}|exists={path.exists()}|stage={item.production_stage}")
              assert item.status == 'FAILED'
              assert path.exists()
              assert item.source_hash and digest == item.source_hash
              assert item.year == 2026 and item.month == 3 and item.production_stage == 2

              journal=db.session.execute(db.text('PRAGMA journal_mode')).scalar()
              busy=db.session.execute(db.text('PRAGMA busy_timeout')).scalar()
              print(f"SQLITE|journal={journal}|busy_timeout={busy}")
              assert str(journal).lower() == 'wal' and int(busy) == 30000
              print('MARCH_PRODUCTION_PREMERGE_GATE|PASS')
          PY
          REMOTE
