name: March Production Post Disconnect State

on:
  push:
    paths:
      - '.github/workflows/targets-latest-period-acceptance.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_diag_key
          chmod 600 ~/.ssh/ims_diag_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Inspect production state read only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -i ~/.ssh/ims_diag_key -p "$IMS_PORT" -o BatchMode=yes "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          from pathlib import Path
          from app import create_app
          from app.extensions import db
          from app.models import (
              IMSUpload, IMSFact, IMSSummary, Target,
              ProductionResultUpload, ProductionResult, ProductionRepresentativeTotal,
              ProductionNationalProductResult, ProductionNationalTotal,
              ProductionRegionProductResult, ProductionRegionTotal,
          )
          from app.services.production_result_service import ProductionResultService

          app=create_app()
          with app.app_context():
              active=int(db.session.execute(db.text("SELECT COUNT(*) FROM ims_import_jobs WHERE status IN ('PROCESSING','QUEUED')")).scalar() or 0)
              upload=db.session.get(ProductionResultUpload,3)
              counts={
                  'results': ProductionResult.query.filter_by(upload_id=3).count(),
                  'rep_totals': ProductionRepresentativeTotal.query.filter_by(upload_id=3).count(),
                  'national_products': ProductionNationalProductResult.query.filter_by(upload_id=3).count(),
                  'national_totals': ProductionNationalTotal.query.filter_by(upload_id=3).count(),
                  'region_products': ProductionRegionProductResult.query.filter_by(upload_id=3).count(),
                  'region_totals': ProductionRegionTotal.query.filter_by(upload_id=3).count(),
              }
              final=ProductionResultService.final_upload(2026,3)
              vacancy=ProductionResult.query.filter_by(upload_id=3,representative_id=112).count()
              departed=ProductionResult.query.filter_by(upload_id=3,representative_id=115).count()
              latest=IMSUpload.query.filter_by(status='COMPLETED').order_by(IMSUpload.id.desc()).first()
              invariant={
                  'targets': Target.query.filter_by(year=2026,month=3).count(),
                  'facts': IMSFact.query.filter_by(upload_id=29).count(),
                  'summary': IMSSummary.query.filter_by(upload_id=29).count(),
              }
              backups=sorted(Path(app.config['BACKUP_FOLDER']).glob('pre_march_stage2_apply_*.sqlite'), key=lambda p:p.stat().st_mtime)
              last_backup=backups[-1] if backups else None
              print(f"STATE|ims_jobs={active}|upload_status={getattr(upload,'status',None)}|counts={counts}|final={getattr(final,'id',None)}|final_stage={getattr(final,'production_stage',None)}|vacancy112={vacancy}|departed115={departed}")
              print(f"INVARIANT|{invariant}|latest_ims={getattr(latest,'id',None)}|week={getattr(latest,'week_number',None)}")
              print(f"BACKUP|count={len(backups)}|last={last_backup}|bytes={last_backup.stat().st_size if last_backup else 0}")
              journal=db.session.execute(db.text('PRAGMA journal_mode')).scalar()
              busy=db.session.execute(db.text('PRAGMA busy_timeout')).scalar()
              print(f"SQLITE|journal={journal}|busy_timeout={busy}")
              assert active==0
              assert invariant=={'targets':791,'facts':791,'summary':791}
              assert latest is not None and latest.id==29 and latest.week_number==14
              assert str(journal).lower()=='wal' and int(busy)==30000
          PY
          REMOTE
