name: March Production Vacancy Identity Diagnostic

on:
  push:
    paths:
      - '.github/workflows/targets-latest-period-acceptance.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_diag_key
          chmod 600 ~/.ssh/ims_diag_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Compare stale person to current vacancy read only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_diag_key -p "$IMS_PORT" -o BatchMode=yes "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          test "$(git rev-parse HEAD)" = "9f410f1f361d16d3b4e624eb47b4cfc691b09ba5"
          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          import hashlib
          from pathlib import Path
          from openpyxl import load_workbook
          from app import create_app
          from app.extensions import db
          from app.models import ProductionResultUpload, Representative, Target
          from app.services.alias_service import AliasService
          from app.services.production_result_import_service import ProductionResultImportService

          app=create_app()
          with app.app_context():
              processing=int(db.session.execute(db.text("SELECT COUNT(*) FROM ims_import_jobs WHERE status='PROCESSING'")).scalar() or 0)
              queued=int(db.session.execute(db.text("SELECT COUNT(*) FROM ims_import_jobs WHERE status='QUEUED'")).scalar() or 0)
              print(f"IMS_JOB_GATE|processing={processing}|queued={queued}")
              assert processing==0 and queued==0

              item=db.session.get(ProductionResultUpload,3)
              path=Path(app.config['UPLOAD_FOLDER'])/'production_results'/item.stored_file_name
              assert hashlib.sha256(path.read_bytes()).hexdigest()==item.source_hash
              service=ProductionResultImportService(path,2026,3,production_stage=2)
              service._load_master_maps()
              wb=load_workbook(path,read_only=False,data_only=True)
              unit_sheet=service._find_sheet(wb,'KUTU')
              layout=service._layout(unit_sheet,'KUTU')

              stale=None
              for row_number in range(layout['header_row']+1,unit_sheet.max_row+1):
                  raw_name=unit_sheet.cell(row_number,layout['name_column']).value
                  if AliasService.normalize(raw_name)=='ILAYDA NUR VARSAK':
                      raw_region=unit_sheet.cell(row_number,layout['region_column']).value
                      vals=service._read_metric_values(unit_sheet,row_number,layout,'diagnostic')
                      stale=(row_number,raw_name,raw_region,vals)
                      break
              assert stale is not None
              row_number,raw_name,raw_region,vals=stale
              print(f"STALE|row={row_number}|name={raw_name}|region={raw_region}|pids={vals['product_ids']}|targets={vals['targets']}|target_total={vals['total_target']}|actuals={vals['values']}|actual_total={vals['total_actual']}")

              vacancy=db.session.get(Representative,112)
              print(f"VACANCY|id={vacancy.id}|name={vacancy.rep_name}|code={vacancy.rep_code}|active={vacancy.active}|region={vacancy.region}|city={vacancy.city}")
              target_rows=Target.query.filter_by(year=2026,month=3,representative_id=112).all()
              by_pid={int(t.product_id):t for t in target_rows}
              ordered=[]
              for pid in vals['product_ids']:
                  t=by_pid[int(pid)]
                  ordered.append((int(pid),float(t.unit_target or 0),float(t.tl_target or 0)))
              print(f"VACANCY_TARGETS_ORDERED|{ordered}")
              vacancy_units=[x[1] for x in ordered]
              print(f"COMPARE|source_unit_targets={vals['targets']}|vacancy_unit_targets={vacancy_units}|source_total={vals['total_target']}|vacancy_total={sum(vacancy_units)}|diffs={[round(float(a)-float(b),6) for a,b in zip(vals['targets'],vacancy_units)]}")

              # All same-region current vacancies: determine if target signature identifies exactly one slot.
              candidates=[]
              for rep in Representative.query.filter_by(active=True,region='501').all():
                  code=str(rep.rep_code or '').upper()
                  name=AliasService.normalize(rep.rep_name)
                  if not (code.startswith('UNASSIGNED') or 'BOS' in name or 'BOŞ' in name or 'KADRO' in name):
                      continue
                  rows=Target.query.filter_by(year=2026,month=3,representative_id=rep.id).all()
                  m={int(t.product_id):float(t.unit_target or 0) for t in rows}
                  if not all(int(pid) in m for pid in vals['product_ids']):
                      continue
                  vector=[m[int(pid)] for pid in vals['product_ids']]
                  diff=sum(abs(float(a)-float(b)) for a,b in zip(vals['targets'],vector))
                  candidates.append((diff,rep.id,rep.rep_name,rep.rep_code,vector))
              candidates.sort()
              for c in candidates:
                  print(f"VACANCY_CANDIDATE|diff={c[0]}|id={c[1]}|name={c[2]}|code={c[3]}|vector={c[4]}")

              old=db.session.get(Representative,115)
              print(f"OLD_PERSON|id={old.id}|name={old.rep_name}|active={old.active}|region={old.region}|city={old.city}|code={old.rep_code}")
              print(f"SQLITE|journal={db.session.execute(db.text('PRAGMA journal_mode')).scalar()}|busy_timeout={db.session.execute(db.text('PRAGMA busy_timeout')).scalar()}")
          PY
          REMOTE
