name: March Production Ankara Succession Diagnostic

on:
  push:
    paths:
      - '.github/workflows/targets-latest-period-acceptance.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_diag_key
          chmod 600 ~/.ssh/ims_diag_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Trace historical identity read only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_diag_key -p "$IMS_PORT" -o BatchMode=yes "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          test "$(git rev-parse HEAD)" = "9f410f1f361d16d3b4e624eb47b4cfc691b09ba5"
          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          from app import create_app
          from app.extensions import db
          from app.models import Representative, RepresentativeAlias, Target, ProductionResultUpload, ProductionResult

          app=create_app()
          with app.app_context():
              processing=int(db.session.execute(db.text("SELECT COUNT(*) FROM ims_import_jobs WHERE status IN ('PROCESSING','QUEUED')")).scalar() or 0)
              print(f"IMS_JOB_GATE|active={processing}")
              assert processing == 0

              for rid in (105,112,115):
                  r=db.session.get(Representative,rid)
                  print(f"REP|id={rid}|name={getattr(r,'rep_name',None)}|code={getattr(r,'rep_code',None)}|ims={getattr(r,'ims_code',None)}|active={getattr(r,'active',None)}|region={getattr(r,'region',None)}|city={getattr(r,'city',None)}")
                  aliases=RepresentativeAlias.query.filter_by(representative_id=rid).all()
                  print(f"ALIASES|id={rid}|{[(a.id,a.alias_name) for a in aliases]}")
                  for month in (1,2,3):
                      rows=Target.query.filter_by(year=2026,month=month,representative_id=rid).order_by(Target.product_id).all()
                      print(f"TARGET|id={rid}|month={month}|count={len(rows)}|tl={[(t.product_id,float(t.tl_target or 0)) for t in rows]}|unit={[(t.product_id,float(t.unit_target or 0)) for t in rows]}")

              uploads=ProductionResultUpload.query.filter_by(year=2026,month=3).order_by(ProductionResultUpload.id).all()
              for u in uploads:
                  print(f"PROD_UPLOAD|id={u.id}|stage={u.production_stage}|status={u.status}|rows={u.row_count}|matched={u.matched_row_count}|file={u.file_name}")
                  for rid in (105,112,115):
                      rows=ProductionResult.query.filter_by(upload_id=u.id,representative_id=rid).order_by(ProductionResult.product_id).all()
                      if rows:
                          print(f"PROD_ROWS|upload={u.id}|rid={rid}|{[(x.product_id,float(x.target_tl or 0),float(x.target_unit or 0),float(x.actual_tl or 0),float(x.actual_unit or 0)) for x in rows]}")

              # Raw DB history for these ids across IMS summary/facts, schema-safe via sqlite metadata.
              tables={r[0] for r in db.session.execute(db.text("SELECT name FROM sqlite_master WHERE type='table'"))}
              for table in ('ims_summary','ims_summaries','ims_facts'):
                  if table not in tables:
                      continue
                  cols=[r[1] for r in db.session.execute(db.text(f"PRAGMA table_info({table})"))]
                  print(f"TABLE|{table}|cols={cols}")
                  if 'representative_id' in cols:
                      selected=[c for c in ('id','ims_upload_id','year','month','week_number','representative_id','product_id','tl','unit','metric_type','metric_value') if c in cols]
                      if selected:
                          sql=f"SELECT {','.join(selected)} FROM {table} WHERE representative_id IN (105,112,115) ORDER BY " + ("ims_upload_id," if 'ims_upload_id' in cols else "") + "representative_id" 
                          rows=list(db.session.execute(db.text(sql)))
                          print(f"HISTORY|{table}|rows={len(rows)}")
                          for row in rows[-120:]: print(tuple(row))

              journal=db.session.execute(db.text('PRAGMA journal_mode')).scalar()
              busy=db.session.execute(db.text('PRAGMA busy_timeout')).scalar()
              print(f"SQLITE|journal={journal}|busy_timeout={busy}")
              assert str(journal).lower()=='wal' and int(busy)==30000
          PY
          REMOTE
