name: Production Backup Cleanup

on:
  push:
    paths:
      - '.github/workflows/targets-latest-period-acceptance.yml'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_diag_key
          chmod 600 ~/.ssh/ims_diag_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Remove only obsolete DB backups
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -i ~/.ssh/ims_diag_key -p "$IMS_PORT" -o BatchMode=yes "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          from pathlib import Path
          from app import create_app
          from app.extensions import db

          DELETE={
              'pre_week12_partial_repair_20260831_104353.sqlite',
              'pre_week12_overlay_repair_20260831_132940.sqlite',
          }
          KEEP={
              'pre_week14_compact_tts_actual_repair_20260831_212357.sqlite',
              'pre_march_stage2_apply_20260901_082416.sqlite',
          }

          app=create_app()
          with app.app_context():
              active=int(db.session.execute(db.text("SELECT COUNT(*) FROM ims_import_jobs WHERE status IN ('PROCESSING','QUEUED')")).scalar() or 0)
              print(f"IMS_JOB_GATE|active={active}")
              assert active == 0
              backup_dir=Path(app.config['BACKUP_FOLDER'])
              files={p.name:p for p in backup_dir.iterdir() if p.is_file()}
              print(f"BEFORE|files={sorted(files)}|bytes={sum(p.stat().st_size for p in files.values())}")
              assert set(files)==DELETE|KEEP, (set(files), DELETE|KEEP)
              for name in KEEP:
                  assert files[name].stat().st_size > 2_000_000_000
              removed=0
              for name in sorted(DELETE):
                  p=files[name]
                  size=p.stat().st_size
                  p.unlink()
                  removed += size
                  print(f"REMOVED|name={name}|bytes={size}")
              remaining={p.name:p for p in backup_dir.iterdir() if p.is_file()}
              print(f"AFTER|files={sorted(remaining)}|bytes={sum(p.stat().st_size for p in remaining.values())}|freed={removed}")
              assert set(remaining)==KEEP
              assert all(remaining[name].stat().st_size > 2_000_000_000 for name in KEEP)
              journal=db.session.execute(db.text('PRAGMA journal_mode')).scalar()
              busy=db.session.execute(db.text('PRAGMA busy_timeout')).scalar()
              quick=db.session.execute(db.text('PRAGMA quick_check')).scalar()
              print(f"SQLITE|journal={journal}|busy_timeout={busy}|quick_check={quick}")
              assert str(journal).lower()=='wal' and int(busy)==30000 and quick=='ok'
              print('BACKUP_CLEANUP|PASS')
          PY
          df -h "$IMS_PATH" | tail -n 1 | sed 's/^/DISK|/'
          REMOTE
