name: March Production Representative Diagnostic

on:
  push:
    paths:
      - '.github/workflows/targets-latest-period-acceptance.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_diag_key
          chmod 600 ~/.ssh/ims_diag_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Locate rejected row read only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_diag_key -p "$IMS_PORT" -o BatchMode=yes "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          from pathlib import Path
          from openpyxl import load_workbook
          from app import create_app
          from app.extensions import db
          from app.models import ProductionResultUpload, Representative, Target
          from app.services.alias_service import AliasService
          from app.services.production_result_import_service import ProductionResultImportService

          app=create_app()
          with app.app_context():
              processing=int(db.session.execute(db.text("SELECT COUNT(*) FROM ims_import_jobs WHERE status='PROCESSING'")).scalar() or 0)
              print(f"PROCESSING_COUNT|{processing}")
              item=ProductionResultUpload.query.get(3)
              path=Path(app.config['UPLOAD_FOLDER'])/'production_results'/item.stored_file_name
              print(f"FAILED_UPLOAD|{item.id}|{item.status}|{item.error_message}|exists={path.exists()}")
              wb=load_workbook(path, read_only=False, data_only=True)
              needle='ILAYDA'
              hits=[]
              for sh in wb.worksheets:
                  for row in sh.iter_rows():
                      for cell in row:
                          n=AliasService.normalize(cell.value)
                          if needle in n or 'VARSAK' in n:
                              hits.append((sh.title,cell.row,cell.column,cell.value,n))
              print(f"CELL_HITS|{len(hits)}")
              for hit in hits:
                  print(f"CELL_HIT|sheet={hit[0]}|row={hit[1]}|col={hit[2]}|value={hit[3]!r}|norm={hit[4]}")

              service=ProductionResultImportService(path,2026,3,production_stage=2)
              service._load_master_maps()
              for metric in ('TL','KUTU'):
                  sh=service._find_sheet(wb,metric)
                  layout=service._layout(sh,metric)
                  print(f"LAYOUT|metric={metric}|sheet={sh.title}|{layout}")
                  for r in range(layout['header_row']+1,sh.max_row+1):
                      raw=sh.cell(r,layout['name_column']).value
                      n=AliasService.normalize(raw)
                      if 'ILAYDA' in n or 'VARSAK' in n:
                          region=sh.cell(r,layout['region_column']).value
                          vals=service._read_metric_values(sh,r,layout,'diagnostic')
                          print(f"MATCHING_ROW|metric={metric}|sheet={sh.title}|row={r}|raw={raw!r}|norm={n}|region={region!r}|target_total={vals['total_target']}|actual_total={vals['total_actual']}|pids={vals['product_ids']}|targets={vals['targets']}|actuals={vals['values']}")

              # Print all current active Region 501 representatives and March TL targets.
              for rep in Representative.query.filter_by(active=True,region='501').order_by(Representative.id).all():
                  rows=Target.query.filter_by(year=2026,month=3,representative_id=rep.id).order_by(Target.product_id).all()
                  print(f"REGION501_ACTIVE|id={rep.id}|name={rep.rep_name}|code={rep.rep_code}|targets={[(t.product_id,float(t.tl_target or 0),float(t.unit_target or 0)) for t in rows]}|tl_total={sum(float(t.tl_target or 0) for t in rows)}|unit_total={sum(float(t.unit_target or 0) for t in rows)}")
              old=Representative.query.get(115)
              print(f"OLD_REP|id={old.id}|name={old.rep_name}|active={old.active}|region={old.region}|code={old.rep_code}")
              print(f"SQLITE|journal={db.session.execute(db.text('PRAGMA journal_mode')).scalar()}|busy_timeout={db.session.execute(db.text('PRAGMA busy_timeout')).scalar()}")
          PY
          REMOTE
