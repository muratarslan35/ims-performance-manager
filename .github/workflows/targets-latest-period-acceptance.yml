name: March Production Representative Diagnostic

on:
  push:
    paths:
      - '.github/workflows/targets-latest-period-acceptance.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_diag_key
          chmod 600 ~/.ssh/ims_diag_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Inspect rejected March row and current target identity
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_diag_key -p "$IMS_PORT" -o BatchMode=yes "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          from pathlib import Path
          from math import isclose
          from openpyxl import load_workbook
          from app import create_app
          from app.extensions import db
          from app.models import ProductionResultUpload, Representative, Target
          from app.services.alias_service import AliasService
          from app.services.production_result_import_service import ProductionResultImportService

          app=create_app()
          with app.app_context():
              print(f"LIVE_COMMIT|{__import__('subprocess').check_output(['git','rev-parse','HEAD'],text=True).strip()}")
              processing=int(db.session.execute(db.text("SELECT COUNT(*) FROM ims_import_jobs WHERE status='PROCESSING'")).scalar() or 0)
              print(f"PROCESSING_COUNT|{processing}")
              item=(ProductionResultUpload.query.filter_by(id=3).first())
              assert item is not None and item.status=='FAILED'
              path=Path(app.config['UPLOAD_FOLDER'])/'production_results'/item.stored_file_name
              print(f"FAILED_UPLOAD|id={item.id}|file={item.file_name}|stored={item.stored_file_name}|exists={path.exists()}|error={item.error_message}")
              assert path.exists()

              wb=load_workbook(path, read_only=False, data_only=True)
              service=ProductionResultImportService(path,2026,3,production_stage=2)
              service._load_master_maps()
              sh=service._find_sheet(wb,'TL')
              layout=service._layout(sh,'TL')
              print(f"TL_SHEET|{sh.title}|layout={layout}")
              needle=AliasService.normalize('İLAYDA NUR VARSAK')
              found=[]
              for r in range(layout['header_row']+1, sh.max_row+1):
                  raw_name=sh.cell(r,layout['name_column']).value
                  if AliasService.normalize(raw_name)==needle:
                      raw_region=sh.cell(r,layout['region_column']).value
                      vals=service._read_metric_values(sh,r,layout,'diagnostic')
                      found.append((r,raw_name,raw_region,vals))
              print(f"REJECTED_ROWS|count={len(found)}")
              assert len(found)==1
              r,raw_name,raw_region,vals=found[0]
              print(f"REJECTED_ROW|row={r}|name={raw_name}|region={raw_region}|target_total={vals['total_target']}|actual_total={vals['total_actual']}|product_ids={vals['product_ids']}|targets={vals['targets']}")

              region_code=AliasService.normalize(raw_region).split(' ',1)[0]
              candidates=[]
              reps=Representative.query.filter_by(active=True).all()
              for rep in reps:
                  if AliasService.normalize(rep.region).split(' ',1)[0] != region_code:
                      continue
                  targets=(Target.query.filter_by(year=2026,month=3,representative_id=rep.id).order_by(Target.product_id).all())
                  by_pid={t.product_id:float(t.tl_target or 0) for t in targets}
                  vec=[by_pid.get(pid) for pid in vals['product_ids']]
                  if any(v is None for v in vec):
                      continue
                  total=sum(vec)
                  diffs=[abs(float(a)-float(b)) for a,b in zip(vec,vals['targets'])]
                  exact=all(isclose(float(a),float(b),rel_tol=0,abs_tol=0.02) for a,b in zip(vec,vals['targets']))
                  candidates.append((sum(diffs),abs(total-vals['total_target']),exact,rep,vec,total))
              candidates.sort(key=lambda x:(not x[2],x[0],x[1],x[3].id))
              for diff,total_diff,exact,rep,vec,total in candidates[:12]:
                  print(f"CURRENT_CANDIDATE|exact={exact}|diff={diff:.4f}|total_diff={total_diff:.4f}|id={rep.id}|name={rep.rep_name}|code={rep.rep_code}|region={rep.region}|target_total={total}|targets={vec}")

              old=Representative.query.get(115)
              for m in (1,2,3):
                  rows=Target.query.filter_by(year=2026,month=m,representative_id=115).order_by(Target.product_id).all()
                  print(f"OLD_REP_TARGETS|month={m}|count={len(rows)}|total={sum(float(x.tl_target or 0) for x in rows)}|values={[float(x.tl_target or 0) for x in rows]}")
              print(f"OLD_REP|id={old.id}|name={old.rep_name}|active={old.active}|region={old.region}|code={old.rep_code}")

              exacts=[c for c in candidates if c[2]]
              print(f"EXACT_CURRENT_MATCH_COUNT|{len(exacts)}")
              if exacts:
                  for c in exacts:
                      rep=c[3]
                      print(f"EXACT_CURRENT_MATCH|id={rep.id}|name={rep.rep_name}|code={rep.rep_code}|region={rep.region}")

              print(f"SQLITE|journal={db.session.execute(db.text('PRAGMA journal_mode')).scalar()}|busy_timeout={db.session.execute(db.text('PRAGMA busy_timeout')).scalar()}")
          PY
          REMOTE
