name: March Production Representative Diagnostic

on:
  push:
    paths:
      - '.github/workflows/targets-latest-period-acceptance.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_diag_key
          chmod 600 ~/.ssh/ims_diag_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Diagnose representative mismatch read only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_diag_key -p "$IMS_PORT" -o BatchMode=yes "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          from app import create_app
          from app.extensions import db
          from app.models import Representative, RepresentativeAlias, Target
          from app.services.alias_service import AliasService
          from app.services.production_result_import_service import ProductionResultImportService

          app=create_app()
          with app.app_context():
              processing=int(db.session.execute(db.text("SELECT COUNT(*) FROM ims_import_jobs WHERE status='PROCESSING'")).scalar() or 0)
              print(f"PROCESSING_COUNT|{processing}")

              needle=AliasService.normalize('İLAYDA NUR VARSAK')
              print(f"NORMALIZED_NEEDLE|{needle}")
              reps=Representative.query.order_by(Representative.id).all()
              for r in reps:
                  labels=[r.rep_name, r.rep_code, r.ims_code]
                  norms=[AliasService.normalize(x) for x in labels if x]
                  if any(('ILAYDA' in n or 'VARS' in n or n==needle) for n in norms):
                      print(f"REP_MATCH|id={r.id}|name={r.rep_name}|code={r.rep_code}|ims={r.ims_code}|active={r.active}|region={r.region}|city={r.city}")

              aliases=RepresentativeAlias.query.order_by(RepresentativeAlias.id).all()
              for a in aliases:
                  n=AliasService.normalize(a.alias_name)
                  if 'ILAYDA' in n or 'VARS' in n or n==needle:
                      rr=a.representative
                      print(f"ALIAS_MATCH|id={a.id}|alias={a.alias_name}|rep_id={a.representative_id}|rep_name={rr.rep_name if rr else None}|active={rr.active if rr else None}|region={rr.region if rr else None}")

              # Show March target reps and nearest token/name candidates.
              march_ids={row[0] for row in db.session.query(Target.representative_id).filter_by(year=2026,month=3).distinct().all()}
              print(f"MARCH_TARGET_REP_COUNT|{len(march_ids)}")
              for r in reps:
                  n=AliasService.normalize(r.rep_name)
                  score=sum(tok in n for tok in needle.split())
                  if score>=1:
                      print(f"TOKEN_CANDIDATE|score={score}|id={r.id}|name={r.rep_name}|active={r.active}|region={r.region}|march_target={r.id in march_ids}|code={r.rep_code}")

              service=ProductionResultImportService('/tmp/unused.xlsx',2026,3,production_stage=1)
              service._load_master_maps()
              direct=service._representatives.get(needle)
              print(f"SERVICE_DIRECT_MATCH|{getattr(direct,'id',None)}|{getattr(direct,'rep_name',None)}")

              # Production-related tables and latest rows, schema-safe.
              table_names=[row[0] for row in db.session.execute(db.text("SELECT name FROM sqlite_master WHERE type='table' AND lower(name) LIKE '%production%' ORDER BY name")).all()]
              print(f"PRODUCTION_TABLES|{table_names}")
              for table in table_names:
                  cols=[row[1] for row in db.session.execute(db.text(f"PRAGMA table_info('{table}')")).all()]
                  print(f"TABLE_SCHEMA|{table}|{cols}")
                  if 'id' in cols:
                      selected=[c for c in cols if c in {'id','year','month','production_stage','stage','status','file_name','filename','source_file','source_path','error_message','message','created_at','updated_at','representative_id'}]
                      if selected:
                          sql=f"SELECT {','.join(selected)} FROM '{table}' ORDER BY id DESC LIMIT 5"
                          rows=db.session.execute(db.text(sql)).mappings().all()
                          for row in rows:
                              print(f"TABLE_ROW|{table}|{dict(row)}")

              journal=db.session.execute(db.text('PRAGMA journal_mode')).scalar()
              busy=db.session.execute(db.text('PRAGMA busy_timeout')).scalar()
              print(f"SQLITE|journal={journal}|busy_timeout={busy}")
          PY
          REMOTE
