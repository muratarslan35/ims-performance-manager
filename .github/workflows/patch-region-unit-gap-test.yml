name: Patch region unit gap regression

on:
  push:
    branches:
      - fix/region-unit-balance-authority

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/region-unit-balance-authority
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply test patch
        run: python scripts/patch_region_unit_gap_test.py
      - name: Commit test patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_region_read_v2.py
          git commit -m "Align region unit gap test with balance authority [patched]"
          git push origin HEAD:fix/region-unit-balance-authority
