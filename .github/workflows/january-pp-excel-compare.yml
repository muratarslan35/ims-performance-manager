name: January PP Excel compare

on:
  push:
    branches: [audit/january-pp-readonly]
    paths: [.github/workflows/january-pp-excel-compare.yml]

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Compare Excel row with DB
        run: |
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          venv/bin/python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          from openpyxl import load_workbook
          p=Path('uploads/ims_archive/upload-21.xlsx')
          wbv=load_workbook(p,read_only=True,data_only=True)
          try:
            print('SHEETS|'+json.dumps(wbv.sheetnames,ensure_ascii=False))
            candidates=[]
            for ws in wbv.worksheets:
              sample=[]
              for row in ws.iter_rows(min_row=1,max_row=min(ws.max_row,8),values_only=True):
                sample.extend([str(v).upper() for v in row if v is not None])
              text=' '.join(sample)
              if 'PP' in ws.title.upper() or ('REKABET' in text and '%' in text):
                candidates.append(ws.title)
            print('CANDIDATES|'+json.dumps(candidates,ensure_ascii=False))
            for title in candidates:
              ws=wbv[title]
              hits=[]
              for r in range(1,ws.max_row+1):
                vals=[ws.cell(r,c).value for c in range(1,ws.max_column+1)]
                txt=' | '.join(str(v) for v in vals if v is not None).upper()
                if '901 DIYARBAKIR' in txt:
                  hits.append({'row':r,'values':vals})
              if hits:
                print('EXCEL_HITS|'+json.dumps({'sheet':title,'rows':hits[:8]},ensure_ascii=False,default=str))
          finally: wbv.close()
          db=sqlite3.connect('instance/ipm.db'); db.row_factory=sqlite3.Row
          try:
            rows=[dict(r) for r in db.execute("SELECT product_group,product_name,metric_value,source_row,is_subtotal FROM ims_competition_data WHERE upload_id=21 AND metric_type='MARKET_SHARE' AND territory='901 DIYARBAKIR' AND subterritory='901 DIYARBAKIR' ORDER BY product_group,product_name")]
            print('DB_ROWS|'+json.dumps(rows,ensure_ascii=False))
          finally: db.close()
          PY
          REMOTE
