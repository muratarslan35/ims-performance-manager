name: Temporary Week 8 Representative Audit Lite

on:
  push:
    branches: [diag/week8-representative-audit]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Read-only audit
        run: |
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          venv/bin/python - <<'PY'
          import sqlite3, json
          con=sqlite3.connect('file:instance/ipm.db?mode=ro',uri=True,timeout=10); con.row_factory=sqlite3.Row
          def drow(sql,a=()):
            r=con.execute(sql,a).fetchone(); return dict(r) if r else None
          def allr(sql,a=()): return [dict(x) for x in con.execute(sql,a).fetchall()]
          tables={r[0] for r in con.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          print('HEAD_DB|wal='+str(con.execute('PRAGMA journal_mode').fetchone()[0])+'|quick='+str(con.execute('PRAGMA quick_check').fetchone()[0]))
          print('PROCESSING|'+str(con.execute("SELECT COUNT(*) FROM ims_import_jobs WHERE status='PROCESSING'").fetchone()[0]))
          print('JOB|'+json.dumps(drow("SELECT id,status,file_name,source_hash,ims_upload_id,completed_at,error_message,result_summary FROM ims_import_jobs ORDER BY id DESC LIMIT 1"),ensure_ascii=False,default=str))
          print('UPLOAD|'+json.dumps(drow("SELECT id,file_name,year,month,week_number,sheet_count,raw_record_count,fact_record_count,summary_record_count,source_record_count,stored_source_record_count,zero_metric_count,invalid_metric_count,reconciliation_status,status,completed_at FROM ims_uploads WHERE status='COMPLETED' ORDER BY id DESC LIMIT 1"),ensure_ascii=False,default=str))
          rep=drow("SELECT id,rep_name,rep_code,region,city,territory,team,active FROM representatives WHERE upper(rep_name)='MURAT ARSLAN' LIMIT 1"); print('REP|'+json.dumps(rep,ensure_ascii=False))
          rid=rep['id']
          print('TARGETS|'+json.dumps(allr("SELECT p.id product_id,p.product_name,t.unit_target,t.tl_target,t.unit_realization,t.tl_realization,t.realization_percent FROM targets t JOIN products p ON p.id=t.product_id WHERE t.year=2026 AND t.month=2 AND t.representative_id=? ORDER BY p.display_order,p.product_name",(rid,)),ensure_ascii=False))
          print('BRICKS|'+json.dumps(allr("SELECT brick,source,active FROM representative_brick_assignments WHERE year=2026 AND month=2 AND representative_id=? ORDER BY brick",(rid,)),ensure_ascii=False))
          for t in sorted(tables):
            if not (t.startswith('ims_') or 'competition' in t): continue
            cs=[x[1] for x in con.execute(f'PRAGMA table_info({t})')]
            if 'representative_id' not in cs: continue
            wh=['representative_id=?']; args=[rid]
            if 'year' in cs: wh.append('year=2026')
            if 'month' in cs: wh.append('month=2')
            if 'week_number' in cs: wh.append('week_number=8')
            q=f"SELECT * FROM {t} WHERE {' AND '.join(wh)} LIMIT 40"
            try:
              sample=allr(q,args)
              count=con.execute(f"SELECT COUNT(*) FROM {t} WHERE {' AND '.join(wh)}",args).fetchone()[0]
              print('TBL|'+t+'|COUNT='+str(count)+'|COLS='+','.join(cs))
              print('SAMPLE|'+t+'|'+json.dumps(sample,ensure_ascii=False,default=str))
            except Exception as e: print('ERR|'+t+'|'+repr(e))
          con.close()
          PY
          REMOTE
