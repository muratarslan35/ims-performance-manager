name: Production Storage Cleanup

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/cleanup_obsolete_production_artifacts.sh"
      - ".github/workflows/production-storage-cleanup.yml"

permissions:
  contents: read

concurrency:
  group: ims-production-storage-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Remove allowlisted obsolete production artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Run guarded obsolete-file cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=6 \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain)"
          git fetch origin main
          git pull --ff-only origin main
          test -f scripts/cleanup_obsolete_production_artifacts.sh
          bash scripts/cleanup_obsolete_production_artifacts.sh "$IMS_PATH"
          REMOTE
