name: Week7 assignment dedupe patch
on:
  push:
    branches: [fix/week7-brick-assignment-dedupe]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Add Week 7 assignment dedupe patch workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/week7-brick-assignment-dedupe
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply patch
        run: python scripts/apply_week7_assignment_dedupe.py
      - name: Install dependencies
        run: python -m pip install -q -r requirements.txt pytest
      - name: Targeted tests
        env:
          APP_ENV: testing
          SECRET_KEY: patch-test-secret
          DATABASE_URL: sqlite:////tmp/ims-week7-dedupe.db
        run: python -m pytest -q tests/test_week7_assignment_dedupe_contract.py tests/test_weekly_snapshot_replace_contract.py tests/test_ims_import_service.py
      - name: Full test suite
        env:
          APP_ENV: testing
          SECRET_KEY: patch-test-secret
          DATABASE_URL: sqlite:////tmp/ims-week7-dedupe-full.db
        run: python -m pytest -q tests/
      - name: Commit patch
        run: |
          git config user.name 'Murat arslan'
          git config user.email '102037882+muratarslan35@users.noreply.github.com'
          git add app/services/ims_import_service.py tests/test_week7_assignment_dedupe_contract.py
          git commit -m 'Deduplicate brick assignments within IMS import'
          git push origin HEAD:fix/week7-brick-assignment-dedupe
