name: Temporary Production IMS Read-Only Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    if: github.head_ref == 'ops/verify-ims-concurrency-production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_audit_key
          chmod 600 ~/.ssh/ims_audit_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Read-only production audit
        shell: bash
        run: |
          ssh -i ~/.ssh/ims_audit_key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" \
            "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "AUDIT_GIT_BRANCH|$(git branch --show-current)"
          echo "AUDIT_GIT_COMMIT|$(git rev-parse HEAD)"
          echo "AUDIT_GIT_DIRTY|$(git status --porcelain | wc -l)"
          echo "AUDIT_PORT_8000|$(ss -ltn | grep -c ':8000 ' || true)"

          venv/bin/python - <<'PY'
          import json, sqlite3
          from pathlib import Path

          db_path = Path('instance/ipm.db').resolve()
          con = sqlite3.connect(f'file:{db_path}?mode=ro', uri=True, timeout=30)
          con.row_factory = sqlite3.Row
          try:
              mode = con.execute('PRAGMA journal_mode').fetchone()[0]
              integrity = con.execute('PRAGMA integrity_check').fetchone()[0]
              print(f'AUDIT_DB|journal_mode={mode}|integrity={integrity}')

              tables = {row[0] for row in con.execute("SELECT name FROM sqlite_master WHERE type='table'")}
              upload_cols = [r[1] for r in con.execute('PRAGMA table_info(ims_uploads)')]
              full_cols = [c for c in (
                  'id','file_name','year','month','quarter','week_number','status','uploaded_by',
                  'uploaded_at','completed_at','sheet_count','raw_record_count','fact_record_count',
                  'summary_record_count','source_record_count','stored_source_record_count',
                  'zero_metric_count','blank_metric_count','invalid_metric_count',
                  'excluded_aggregate_count','reconciliation_status','warning_message','error_message',
                  'processing_time'
              ) if c in upload_cols]
              latest = con.execute(
                  f"SELECT {','.join(full_cols)} FROM ims_uploads ORDER BY uploaded_at DESC LIMIT 1"
              ).fetchone()
              print('AUDIT_LATEST_UPLOAD|' + json.dumps(dict(latest), ensure_ascii=False, default=str))
              latest_id = latest['id']

              for table in ('ims_raw_data','ims_facts','ims_summary'):
                  cols = [r[1] for r in con.execute(f'PRAGMA table_info({table})')]
                  print(f'AUDIT_SCHEMA|{table}|' + ','.join(cols))
                  if 'upload_id' in cols:
                      count = con.execute(f'SELECT COUNT(*) FROM {table} WHERE upload_id=?', (latest_id,)).fetchone()[0]
                      print(f'AUDIT_LATEST_COUNT|{table}|{count}')
                  if 'representative_id' in cols:
                      for rep_id in (111,114):
                          params = [rep_id]
                          predicate = 'representative_id=?'
                          if 'upload_id' in cols:
                              predicate += ' AND upload_id=?'
                              params.append(latest_id)
                          count = con.execute(f'SELECT COUNT(*) FROM {table} WHERE {predicate}', params).fetchone()[0]
                          print(f'AUDIT_REP_COUNT|{table}|rep_id={rep_id}|count={count}')

              raw_cols = [r[1] for r in con.execute('PRAGMA table_info(ims_raw_data)')]
              for candidate in ('representative_name','representative','rep_name','representative_raw'):
                  if candidate in raw_cols:
                      rows = con.execute(
                          f"SELECT COUNT(*) FROM ims_raw_data WHERE upload_id=? AND upper(COALESCE({candidate},'')) LIKE '%DIYARBAKIR%BOS%'",
                          (latest_id,),
                      ).fetchone()[0]
                      print(f'AUDIT_RAW_DIYARBAKIR_BOS|column={candidate}|count={rows}')

              rep_cols = [r[1] for r in con.execute('PRAGMA table_info(representatives)')]
              wanted = [c for c in ('id','rep_code','rep_name','region','territory','city','active') if c in rep_cols]
              rows = con.execute(
                  f"SELECT {','.join(wanted)} FROM representatives "
                  "WHERE id IN (111,114) ORDER BY id"
              ).fetchall()
              for row in rows:
                  print('AUDIT_DIYARBAKIR_VACANCY|' + json.dumps(dict(row), ensure_ascii=False, default=str))
          finally:
              con.close()
          PY

          echo 'AUDIT_RECENT_LOCK_ERRORS_BEGIN'
          grep -n -E 'database is locked|database table is locked|auth_primary_db_locked|ims_upload_rejected_busy' /tmp/ims-performance-manager.log 2>/dev/null | tail -n 50 || true
          echo 'AUDIT_RECENT_LOCK_ERRORS_END'
          REMOTE
