name: Temporary Production IMS Read-Only Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    if: github.head_ref == 'ops/verify-ims-concurrency-production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_audit_key
          chmod 600 ~/.ssh/ims_audit_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Fast classify skipped sheets
        shell: bash
        run: |
          ssh -i ~/.ssh/ims_audit_key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          venv/bin/python - <<'PY'
          import json,re,sqlite3
          from pathlib import Path
          import openpyxl
          con=sqlite3.connect('file:instance/ipm.db?mode=ro',uri=True,timeout=30); con.row_factory=sqlite3.Row
          latest=con.execute("SELECT * FROM ims_uploads WHERE year=2026 AND month=1 AND status='COMPLETED' ORDER BY week_number DESC,uploaded_at DESC LIMIT 1").fetchone()
          parsed={r[0] for r in con.execute('SELECT DISTINCT sheet_name FROM ims_raw_data WHERE upload_id=?',(latest['id'],))}
          path=Path('uploads')/latest['file_name']
          wbf=openpyxl.load_workbook(path,read_only=True,data_only=False)
          wbv=openpyxl.load_workbook(path,read_only=True,data_only=True)
          unparsed=[s for s in wbf.sheetnames if s not in parsed]
          print('CTX|'+json.dumps({'parsed':sorted(parsed),'unparsed':unparsed},ensure_ascii=False))
          for name in unparsed:
              wsf=wbf[name]; wsv=wbv[name]
              total=formulas=constants=0; refs={}; examples=[]
              for ridx,row in enumerate(wsf.iter_rows(),start=1):
                  if ridx>120: break
                  for c in row:
                      v=c.value
                      if v is None: continue
                      total+=1
                      if isinstance(v,str) and v.startswith('='):
                          formulas+=1
                          if len(examples)<8: examples.append(v[:220])
                          for m in re.findall(r"'([^']+)'!|([A-Za-z0-9_ .ÇĞİÖŞÜçğıöşü-]+)!",v):
                              ref=(m[0] or m[1]).strip(); refs[ref]=refs.get(ref,0)+1
                      else: constants+=1
              samples=[]
              for ridx,row in enumerate(wsv.iter_rows(min_row=1,max_row=min(wsv.max_row,12),max_col=min(wsv.max_column,25),values_only=True),start=1):
                  vals=[None if v is None else str(v)[:120] for v in row]
                  if any(v is not None for v in vals): samples.append({'row':ridx,'values':vals})
              text=' '.join(' '.join(x['values'][i] or '' for i in range(len(x['values']))) for x in samples).upper()
              markers=[k for k in ['TEMSİLCİ','TEMSILCI','HEDEF','TARGET','KUTU','TL','PAZAR','BRICK','BÖLGE','BOLGE','ÇIKIŞ','CIKIS','SUBTOTAL','GRAND TOTAL'] if k in text]
              print('CLASS|'+json.dumps({'name':name,'max_row':wsf.max_row,'max_column':wsf.max_column,'sample_nonempty':total,'sample_formulas':formulas,'sample_constants':constants,'sample_formula_ratio':round(formulas/total,3) if total else 0,'refs':refs,'formula_examples':examples,'markers':markers,'sample_rows':samples},ensure_ascii=False))
          wbf.close(); wbv.close(); con.close()
          PY
          REMOTE
