name: Temporary Production IMS Read-Only Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    if: github.head_ref == 'ops/verify-ims-concurrency-production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_audit_key
          chmod 600 ~/.ssh/ims_audit_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Verify competition and source coverage
        shell: bash
        run: |
          ssh -i ~/.ssh/ims_audit_key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          venv/bin/python - <<'PY'
          import json,sqlite3
          con=sqlite3.connect('file:instance/ipm.db?mode=ro',uri=True,timeout=30); con.row_factory=sqlite3.Row
          latest=con.execute("SELECT * FROM ims_uploads WHERE year=2026 AND month=1 AND status='COMPLETED' ORDER BY week_number DESC,uploaded_at DESC LIMIT 1").fetchone(); uid=latest['id']
          tables={r[0] for r in con.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          def emit(tag,obj): print(tag+'|'+json.dumps(obj,ensure_ascii=False,default=str,sort_keys=True))
          def cols(t): return [r[1] for r in con.execute(f'PRAGMA table_info({t})')]
          if 'ims_competition_data' in tables:
              c=cols('ims_competition_data'); emit('COMP_SCHEMA',c)
              where=[]; p=[]
              if 'upload_id' in c: where.append('upload_id=?'); p.append(uid)
              elif 'year' in c and 'month' in c: where.extend(['year=?','month=?']); p.extend([2026,1])
              pred=(' WHERE '+' AND '.join(where)) if where else ''
              emit('COMP_COUNT',{'count':con.execute('SELECT COUNT(*) FROM ims_competition_data'+pred,p).fetchone()[0]})
              groupcols=[x for x in ('source_sheet','sheet_name','metric_type','period_type','representative_id','product_name','competitor_name','territory','subterritory') if x in c]
              for gc in groupcols[:5]:
                  q=f'SELECT {gc},COUNT(*) n FROM ims_competition_data'+pred+f' GROUP BY {gc} ORDER BY n DESC LIMIT 30'
                  emit('COMP_GROUP_'+gc.upper(),[dict(r) for r in con.execute(q,p)])
          # Sample parsed rows for one known brick to compare against OCAK/KUTU/TL master sheets.
          for sheet in ('1001 BRICK SATIS','AYLIK REKABET KUTU','AYLIK REKABET TL','BRICK REA.'):
              rs=con.execute("SELECT sheet_name,sheet_type,brick,territory,representative,product,competitor,unit,tl,market_share,value_share,growth,raw_json FROM ims_raw_data WHERE upload_id=? AND sheet_name=? AND (upper(COALESCE(brick,'')) LIKE '%EDIRNE SARICAPASA%' OR upper(COALESCE(territory,'')) LIKE '%EDIRNE SARICAPASA%') LIMIT 30",(uid,sheet)).fetchall()
              emit('BRICK_SAMPLE_'+sheet.replace(' ','_'),[dict(r) for r in rs])
          # show rows currently classified as competition sources in raw
          emit('RAW_COMP_TYPES',[dict(r) for r in con.execute("SELECT sheet_name,sheet_type,COUNT(*) n,COUNT(DISTINCT representative_id) reps,COUNT(DISTINCT product_id) products FROM ims_raw_data WHERE upload_id=? AND (lower(sheet_type) LIKE '%compet%' OR upper(sheet_name) LIKE '%REKABET%') GROUP BY sheet_name,sheet_type",(uid,))])
          con.close()
          PY
          REMOTE
