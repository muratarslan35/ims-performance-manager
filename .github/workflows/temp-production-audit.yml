name: Temporary Production IMS Master Backfill Verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    if: github.head_ref == 'ops/verify-ims-concurrency-production'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
      EXPECTED_COMMIT: d17c6c70d22e047e2893bed7b469aa206c4f06c7
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_audit_key
          chmod 600 ~/.ssh/ims_audit_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Backfill and verify master source
        shell: bash
        run: |
          ssh -i ~/.ssh/ims_audit_key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" \
            "IMS_PATH='$IMS_PATH' EXPECTED_COMMIT='$EXPECTED_COMMIT' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"

          for attempt in $(seq 1 30); do
            current=$(git rev-parse HEAD)
            if [ "$current" = "$EXPECTED_COMMIT" ]; then break; fi
            echo "WAIT_DEPLOY|attempt=$attempt|current=$current|expected=$EXPECTED_COMMIT"
            sleep 10
          done
          current=$(git rev-parse HEAD)
          echo "PRODUCTION_COMMIT|$current"
          test "$current" = "$EXPECTED_COMMIT"
          test -f app/services/official_brick_spread_service.py

          mkdir -p instance/backups
          stamp=$(date +%Y%m%d-%H%M%S)
          venv/bin/python sqlite_online_backup.py \
            instance/ipm.db "instance/backups/ipm-pre-brick-spread-backfill-${stamp}.db"

          venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          from app import create_app
          from app.extensions import db
          from app.models import IMSRawData, IMSSummary, IMSFact, IMSUpload
          from app.services.alias_service import AliasService
          from app.services.import_coordinator import ImportCoordinator
          from app.services.official_brick_spread_service import OfficialBrickSpreadService

          app = create_app()
          with app.app_context():
              upload = IMSUpload.query.filter_by(
                  year=2026, month=1, week_number=4, status='COMPLETED'
              ).order_by(IMSUpload.uploaded_at.desc(), IMSUpload.id.desc()).first()
              if upload is None:
                  raise SystemExit('Week-4 completed upload not found')

              upload_id = upload.id
              source_path = Path(app.config['UPLOAD_FOLDER']) / upload.file_name
              if not source_path.is_file():
                  raise SystemExit(f'Source workbook missing: {source_path}')

              def snapshot():
                  facts = IMSFact.query.filter_by(upload_id=upload_id).all()
                  summaries = IMSSummary.query.filter_by(upload_id=upload_id).all()
                  return {
                      'fact_count': len(facts),
                      'fact_unit': round(sum(float(x.unit or 0) for x in facts), 6),
                      'fact_tl': round(sum(float(x.tl or 0) for x in facts), 6),
                      'summary_count': len(summaries),
                      'summary_unit': round(sum(float(x.unit or 0) for x in summaries), 6),
                      'summary_tl': round(sum(float(x.tl or 0) for x in summaries), 6),
                      'summary_target_unit': round(sum(float(x.target_unit or 0) for x in summaries), 6),
                      'summary_target_tl': round(sum(float(x.target_tl or 0) for x in summaries), 6),
                  }

              before = snapshot()
              print('BEFORE|' + json.dumps(before, sort_keys=True))

              with ImportCoordinator.acquire(
                  uploaded_by='SYSTEM MASTER BACKFILL',
                  file_name=upload.file_name,
                  wait_seconds=2,
              ):
                  AliasService.clear_cache()
                  result = OfficialBrickSpreadService.persist(
                      file_path=source_path,
                      upload_id=upload_id,
                      year=upload.year,
                      month=upload.month,
                      week_number=upload.week_number,
                  )
                  warnings = (upload.warning_message or '').splitlines()
                  warnings = [
                      line for line in warnings
                      if 'SATIS BRICK YAYILIMI' not in OfficialBrickSpreadService._normalize(line)
                  ]
                  upload.warning_message = '\n'.join(warnings) or None
                  db.session.commit()

              db.session.remove()
              after = snapshot()
              print('BACKFILL_RESULT|' + json.dumps(result, ensure_ascii=False, sort_keys=True))
              print('AFTER|' + json.dumps(after, sort_keys=True))
              if before != after:
                  raise SystemExit(f'Sales/summary snapshot changed: before={before} after={after}')

              official = IMSRawData.query.filter_by(
                  upload_id=upload_id,
                  sheet_type=OfficialBrickSpreadService.SHEET_TYPE,
              ).all()
              rep_ids = {row.representative_id for row in official}
              null_product_ids = sum(1 for row in official if row.product_id is None)
              expected_records = result['representatives'] * (result['product_columns'] + 1)
              duplicate_keys = db.session.execute(db.text('''
                  SELECT representative_id, product, COUNT(*) AS n
                  FROM ims_raw_data
                  WHERE upload_id=:upload_id AND sheet_type=:sheet_type
                  GROUP BY representative_id, product
                  HAVING COUNT(*) > 1
              '''), {'upload_id': upload_id, 'sheet_type': OfficialBrickSpreadService.SHEET_TYPE}).fetchall()
              integrity = {
                  'upload_id': upload_id,
                  'official_records': len(official),
                  'expected_records': expected_records,
                  'representatives': len(rep_ids),
                  'parser_representatives': result['representatives'],
                  'product_columns': result['product_columns'],
                  'all_product_ids_null': null_product_ids == len(official),
                  'duplicate_keys': len(duplicate_keys),
                  'reconciliation_status': upload.reconciliation_status,
              }
              print('OFFICIAL_INTEGRITY|' + json.dumps(integrity, ensure_ascii=False, sort_keys=True))
              if len(official) != expected_records:
                  raise SystemExit('Official spread record count mismatch')
              if len(rep_ids) != result['representatives']:
                  raise SystemExit('Official spread representative count mismatch')
              if null_product_ids != len(official):
                  raise SystemExit('Official spread leaked into product fact domain')
              if duplicate_keys:
                  raise SystemExit(f'Duplicate official spread keys: {duplicate_keys[:10]}')
              if result['product_columns'] != 7:
                  raise SystemExit(f'Expected 7 product columns, got {result["product_columns"]}')

              # Core production invariants must remain exactly as audited.
              if after['fact_count'] != 3164 or after['summary_count'] != 791:
                  raise SystemExit(f'Core row counts changed: {after}')
              if abs(after['summary_unit'] - 1497003.0) > 0.000001:
                  raise SystemExit(f'Week-4 summary unit changed: {after["summary_unit"]}')
              if abs(after['summary_tl'] - 125767119.32) > 0.01:
                  raise SystemExit(f'Week-4 summary TL changed: {after["summary_tl"]}')

              print('MASTER_BACKFILL_VERIFIED|PASS')
          PY
          REMOTE
