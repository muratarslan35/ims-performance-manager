name: Temporary Production IMS Read-Only Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    if: github.head_ref == 'ops/verify-ims-concurrency-production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_audit_key
          chmod 600 ~/.ssh/ims_audit_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Reconcile dashboard and brick spread
        shell: bash
        run: |
          ssh -i ~/.ssh/ims_audit_key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          venv/bin/python - <<'PY'
          import json,re,sqlite3,openpyxl
          from pathlib import Path
          def norm(s):
              s=str(s or '').upper().replace('İ','I').replace('Ş','S').replace('Ğ','G').replace('Ü','U').replace('Ö','O').replace('Ç','C')
              return re.sub(r'[^A-Z0-9]+',' ',s).strip()
          con=sqlite3.connect('file:instance/ipm.db?mode=ro',uri=True,timeout=30); con.row_factory=sqlite3.Row
          u=con.execute("SELECT * FROM ims_uploads WHERE year=2026 AND month=1 AND status='COMPLETED' ORDER BY week_number DESC,uploaded_at DESC LIMIT 1").fetchone(); uid=u['id']
          wb=openpyxl.load_workbook(Path('uploads')/u['file_name'],read_only=True,data_only=True)
          reps={norm(r['rep_name']):dict(r) for r in con.execute('SELECT id,rep_name,region,active FROM representatives')}
          products=[dict(r) for r in con.execute('SELECT id,product_name FROM products WHERE is_active=1 ORDER BY id')]
          # TTS ÇIKIŞLARI: rep-level target TL columns C:I and actual TL columns N:T.
          ws=wb['TTS ÇIKIŞLARI']; checked=0; mism=[]; unmatched=[]
          for row in ws.iter_rows(min_row=5,max_row=ws.max_row,values_only=True):
              name=row[1] if len(row)>1 else None
              key=norm(name)
              if not key or key not in reps: continue
              rep=reps[key]; rid=rep['id']
              excel_target=sum(float(row[i] or 0) for i in range(2,9) if i<len(row))
              excel_actual=sum(float(row[i] or 0) for i in range(13,20) if i<len(row))
              db_target=con.execute('SELECT COALESCE(SUM(tl_target),0) FROM targets WHERE year=2026 AND month=1 AND representative_id=?',(rid,)).fetchone()[0]
              db_actual=con.execute('SELECT COALESCE(SUM(tl),0) FROM ims_summary WHERE upload_id=? AND representative_id=?',(uid,rid)).fetchone()[0]
              checked+=1
              if abs(excel_target-db_target)>0.05 or abs(excel_actual-db_actual)>0.05:
                  mism.append({'rep':name,'excel_target':excel_target,'db_target':db_target,'excel_actual':excel_actual,'db_actual':db_actual})
          print('TTS_RECON|'+json.dumps({'checked_reps':checked,'mismatch_count':len(mism),'sample':mism[:20]},ensure_ascii=False,default=str))

          # Satış Brick Yayılımı: total distinct bricks and product-specific positive-exit brick counts.
          ws=wb['Satış Brick Yayılımı']; spread_checked=0; spread_mism=[]
          prod_by_norm={norm(p['product_name']):p for p in products}
          headers=[norm(v) for v in next(ws.iter_rows(min_row=2,max_row=2,values_only=True))]
          for row in ws.iter_rows(min_row=5,max_row=ws.max_row,values_only=True):
              name=row[1] if len(row)>1 else None; key=norm(name)
              if not key or key not in reps: continue
              rid=reps[key]['id']; spread_checked+=1
              excel_total=int(float(row[2] or 0))
              db_total=con.execute("SELECT COUNT(DISTINCT COALESCE(NULLIF(brick,''),territory)) FROM ims_raw_data WHERE upload_id=? AND sheet_name='1001 BRICK SATIS' AND representative_id=?",(uid,rid)).fetchone()[0]
              detail=[]
              for idx in range(3,min(10,len(row))):
                  h=headers[idx] if idx<len(headers) else ''
                  # Match displayed product header to DB product.
                  pid=None
                  for pn,p in prod_by_norm.items():
                      if pn and (pn in h or h in pn): pid=p['id']; break
                  if pid is None: continue
                  excel_n=int(float(row[idx] or 0))
                  db_n=con.execute("SELECT COUNT(DISTINCT COALESCE(NULLIF(brick,''),territory)) FROM ims_raw_data WHERE upload_id=? AND sheet_name='1001 BRICK SATIS' AND representative_id=? AND product_id=? AND COALESCE(unit,0)>0",(uid,rid,pid)).fetchone()[0]
                  if excel_n!=db_n: detail.append({'header':h,'excel':excel_n,'db':db_n})
              if excel_total!=db_total or detail:
                  spread_mism.append({'rep':name,'excel_total':excel_total,'db_total':db_total,'detail':detail})
          print('SPREAD_RECON|'+json.dumps({'checked_reps':spread_checked,'mismatch_count':len(spread_mism),'sample':spread_mism[:20]},ensure_ascii=False,default=str))
          wb.close(); con.close()
          PY
          REMOTE
