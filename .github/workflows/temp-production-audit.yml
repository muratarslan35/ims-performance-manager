name: Temporary Production IMS Read-Only Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    if: github.head_ref == 'ops/verify-ims-concurrency-production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_audit_key
          chmod 600 ~/.ssh/ims_audit_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Read-only production audit
        shell: bash
        run: |
          ssh -i ~/.ssh/ims_audit_key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" \
            "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "AUDIT_GIT_BRANCH|$(git branch --show-current)"
          echo "AUDIT_GIT_COMMIT|$(git rev-parse HEAD)"
          echo "AUDIT_GIT_DIRTY|$(git status --porcelain | wc -l)"
          echo "AUDIT_PORT_8000|$(ss -ltn | grep -c ':8000 ' || true)"

          venv/bin/python - <<'PY'
          import json
          import sqlite3
          from pathlib import Path

          db_path = Path('instance/ipm.db').resolve()
          con = sqlite3.connect(f'file:{db_path}?mode=ro', uri=True, timeout=30)
          con.row_factory = sqlite3.Row
          try:
              mode = con.execute('PRAGMA journal_mode').fetchone()[0]
              integrity = con.execute('PRAGMA integrity_check').fetchone()[0]
              print(f'AUDIT_DB|journal_mode={mode}|integrity={integrity}')

              tables = {row[0] for row in con.execute("SELECT name FROM sqlite_master WHERE type='table'")}
              for table in ('ims_uploads','ims_raw_data','ims_facts','ims_summary','representatives'):
                  if table in tables:
                      count = con.execute(f'SELECT COUNT(*) FROM {table}').fetchone()[0]
                      print(f'AUDIT_TABLE_COUNT|{table}|{count}')

              if 'ims_uploads' in tables:
                  cols = [r[1] for r in con.execute('PRAGMA table_info(ims_uploads)')]
                  print('AUDIT_UPLOAD_COLUMNS|' + ','.join(cols))
                  select_cols = [c for c in (
                      'id','file_name','year','month','week_number','status','uploaded_by',
                      'uploaded_at','completed_at','source_metric_records','stored_source_records',
                      'invalid_metric_records','raw_count','fact_count','summary_count'
                  ) if c in cols]
                  ordering = 'uploaded_at DESC' if 'uploaded_at' in cols else 'id DESC'
                  rows = con.execute(
                      f"SELECT {','.join(select_cols)} FROM ims_uploads ORDER BY {ordering} LIMIT 5"
                  ).fetchall()
                  for row in rows:
                      print('AUDIT_UPLOAD|' + json.dumps(dict(row), ensure_ascii=False, default=str))

                  if rows and 'id' in select_cols:
                      latest_id = rows[0]['id']
                      for table in ('ims_raw_data','ims_facts','ims_summary'):
                          if table not in tables:
                              continue
                          table_cols = [r[1] for r in con.execute(f'PRAGMA table_info({table})')]
                          if 'upload_id' in table_cols:
                              count = con.execute(f'SELECT COUNT(*) FROM {table} WHERE upload_id=?', (latest_id,)).fetchone()[0]
                              print(f'AUDIT_LATEST_UPLOAD_COUNT|{table}|upload_id={latest_id}|count={count}')

              if 'representatives' in tables:
                  rep_cols = [r[1] for r in con.execute('PRAGMA table_info(representatives)')]
                  wanted = [c for c in ('id','rep_code','rep_name','region','territory','city','active') if c in rep_cols]
                  rows = con.execute(
                      f"SELECT {','.join(wanted)} FROM representatives "
                      "WHERE upper(rep_name) LIKE '%DIYARBAKIR%BOS%' OR upper(COALESCE(territory,'')) LIKE '%DIYARBAKIR%BOS%' "
                      "ORDER BY id"
                  ).fetchall()
                  for row in rows:
                      print('AUDIT_DIYARBAKIR_VACANCY|' + json.dumps(dict(row), ensure_ascii=False, default=str))
          finally:
              con.close()
          PY

          echo 'AUDIT_RECENT_LOCK_ERRORS_BEGIN'
          if [ -f /tmp/ims-performance-manager.log ]; then
            grep -n -E 'database is locked|database table is locked|auth_primary_db_locked|ims_upload_rejected_busy' /tmp/ims-performance-manager.log | tail -n 50 || true
          fi
          echo 'AUDIT_RECENT_LOCK_ERRORS_END'
          REMOTE
