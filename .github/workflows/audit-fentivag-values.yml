name: Audit Fentivag source values

on:
  push:
    branches:
      - audit/fentivag-monural-prod
    paths:
      - .github/workflows/audit-fentivag-values.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Read-only all-product reconciliation
        run: |
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          venv/bin/python - <<'PY'
          import re, sqlite3, unicodedata
          from openpyxl import load_workbook

          PRODUCTS = ['TRAVAZOL','MONUROL','MIXOVUL','FENTIVAG','STIDERM','ACNEMIX','BRIMODER']
          def norm(v):
              t = unicodedata.normalize('NFKD', str(v or '').strip().upper())
              t = ''.join(c for c in t if not unicodedata.combining(c))
              t = t.translate(str.maketrans({'İ':'I','Ş':'S','Ğ':'G','Ü':'U','Ö':'O','Ç':'C'}))
              return re.sub(r'[^A-Z0-9]+', ' ', t).strip()

          wb = load_workbook('uploads/Tayfun-1_3.Hafta_Ocak_Brick_Analizi_.xlsx', data_only=True, read_only=True)
          ws = wb['BAKİYE']
          rows = list(ws.iter_rows(values_only=True))
          header = rows[1]
          target_cols = {}
          balance_cols = {}
          section = ''
          for i,v in enumerate(header):
              n = norm(v)
              if 'HEDEF' in n and 'TL' in n: section='target'; continue
              if 'BAKIYE' in n and 'KUTU' in n: section='balance_unit'; continue
              if 'BAKIYE' in n and 'TL' in n: section='balance_tl'; continue
              if 'CIKIS' in n and 'TL' in n: section='actual_tl'; continue
              if n in PRODUCTS:
                  if section=='target' and n not in target_cols: target_cols[n]=i
                  if section=='balance_unit' and n not in balance_cols: balance_cols[n]=i

          rep_rows=[]
          for row in rows[2:]:
              loc=row[0] if len(row)>0 else None
              rep=row[1] if len(row)>1 else None
              rn=norm(rep)
              if not rn or rn=='NATIONAL' or rn==norm(loc): continue
              rep_rows.append(row)
          print(f'REP_ROWS|{len(rep_rows)}')

          con=sqlite3.connect('instance/ipm.db')
          con.row_factory=sqlite3.Row
          for product in PRODUCTS:
              col=target_cols[product]
              rep_sum=sum(float(row[col] or 0) for row in rep_rows)
              national=float(rows[2][col] or 0)
              dbrow=con.execute("""
                  SELECT COUNT(*) c,SUM(t.tl_target) tl,SUM(t.unit_target) units
                  FROM targets t JOIN products p ON p.id=t.product_id
                  WHERE t.year=2026 AND t.month=1 AND UPPER(p.product_code)=?
              """,(product,)).fetchone()
              print(f'TARGET|{product}|REP_SUM={rep_sum}|NATIONAL={national}|DELTA={rep_sum-national}|DB_ROWS={dbrow["c"]}|DB_TL={dbrow["tl"]}|DB_UNITS={dbrow["units"]}')
              if product in balance_cols:
                  bcol=balance_cols[product]
                  brep=sum(float(row[bcol] or 0) for row in rep_rows)
                  bnat=float(rows[2][bcol] or 0)
                  print(f'BALANCE_UNIT|{product}|REP_SUM={brep}|NATIONAL={bnat}|DELTA={brep-bnat}')
          con.close(); wb.close()
          PY
          REMOTE
