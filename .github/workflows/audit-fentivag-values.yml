name: Audit Fentivag source values

on:
  push:
    branches:
      - audit/fentivag-monural-prod
    paths:
      - .github/workflows/audit-fentivag-values.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Read-only hidden row audit
        run: |
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          venv/bin/python - <<'PY'
          import re, unicodedata
          from openpyxl import load_workbook

          def norm(v):
              t = unicodedata.normalize('NFKD', str(v or '').strip().upper())
              t = ''.join(c for c in t if not unicodedata.combining(c))
              t = t.translate(str.maketrans({'İ':'I','Ş':'S','Ğ':'G','Ü':'U','Ö':'O','Ç':'C'}))
              return re.sub(r'[^A-Z0-9]+', ' ', t).strip()

          wb = load_workbook('uploads/Tayfun-1_3.Hafta_Ocak_Brick_Analizi_.xlsx', data_only=True, read_only=False)
          ws = wb['BAKİYE']
          fent_col = 6
          all_sum = visible_sum = hidden_sum = 0.0
          all_count = visible_count = hidden_count = 0
          for ridx in range(4, ws.max_row + 1):
              loc = ws.cell(ridx, 1).value
              rep = ws.cell(ridx, 2).value
              rn = norm(rep)
              if not rn or rn == 'NATIONAL' or rn == norm(loc):
                  continue
              value = float(ws.cell(ridx, fent_col).value or 0)
              hidden = bool(ws.row_dimensions[ridx].hidden)
              all_count += 1; all_sum += value
              if hidden:
                  hidden_count += 1; hidden_sum += value
                  print(f'HIDDEN|ROW={ridx}|LOC={loc}|REP={rep}|FENT_TL={value}')
              else:
                  visible_count += 1; visible_sum += value
          national = float(ws.cell(3, fent_col).value or 0)
          print(f'ALL|{all_count}|{all_sum}')
          print(f'VISIBLE|{visible_count}|{visible_sum}')
          print(f'HIDDEN|{hidden_count}|{hidden_sum}')
          print(f'NATIONAL|{national}')
          print(f'ALL_MINUS_NATIONAL|{all_sum-national}')
          print(f'VISIBLE_MINUS_NATIONAL|{visible_sum-national}')
          wb.close()
          PY
          REMOTE
