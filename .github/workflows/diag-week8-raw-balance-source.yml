name: Inspect Week 8 Raw Balance Source
on:
  push:
    branches: [diag/week8-raw-balance-source]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Inspect raw balance rows
        run: |
          ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=20 -i ~/.ssh/k -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          venv/bin/python -u - <<'PY'
          import sqlite3,json
          c=sqlite3.connect('file:instance/ipm.db?mode=ro',uri=True,timeout=10); c.row_factory=sqlite3.Row
          processing=c.execute("select count(*) from ims_import_jobs where status='PROCESSING'").fetchone()[0]
          up=c.execute("select id,file_name,year,month,week_number,status from ims_uploads where year=2026 and month=2 and status='COMPLETED' order by week_number desc,completed_at desc,id desc limit 1").fetchone()
          print('STATE|processing='+str(processing),flush=True)
          print('UPLOAD|'+json.dumps(dict(up),ensure_ascii=False),flush=True)
          cols=[r[1] for r in c.execute('pragma table_info(ims_raw_data)')]
          print('COLS|'+','.join(cols),flush=True)
          uid=int(up['id'])
          count=c.execute("select count(*) from ims_raw_data where upload_id=? and upper(sheet_name) like '%BAKIYE%'",(uid,)).fetchone()[0]
          print('BALANCE_COUNT|'+str(count),flush=True)
          reps=c.execute("select id from representatives where upper(rep_name)='MURAT ARSLAN' limit 1").fetchone(); rid=int(reps[0])
          select_cols=[x for x in ['id','upload_id','sheet_name','sheet_type','source_row','representative_id','product_id','representative','product','unit','tl','metrics_json','raw_json'] if x in cols]
          rows=[dict(r) for r in c.execute('select '+','.join(select_cols)+" from ims_raw_data where upload_id=? and upper(sheet_name) like '%BAKIYE%' and (representative_id=? or upper(representative)='MURAT ARSLAN') order by source_row,id limit 50",(uid,rid)).fetchall()]
          print('MURAT_ROWS|'+json.dumps(rows,ensure_ascii=False,default=str),flush=True)
          sample=[dict(r) for r in c.execute('select '+','.join(select_cols)+" from ims_raw_data where upload_id=? and upper(sheet_name) like '%BAKIYE%' order by source_row,id limit 5",(uid,)).fetchall()]
          print('SAMPLE|'+json.dumps(sample,ensure_ascii=False,default=str),flush=True)
          c.close()
          PY
          REMOTE
