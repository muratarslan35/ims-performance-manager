name: Audit server storage and backups

on:
  push:
    branches: ["ops/server-storage-audit-cleanup"]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Read-only server audit
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo '=== COMMIT ==='
          git rev-parse HEAD
          echo '=== MEMORY ==='
          free -h
          echo '=== DISK ==='
          df -h /
          echo '=== TOP LEVEL ==='
          du -sh ./* ./.??* 2>/dev/null | sort -h | tail -n 40 || true
          echo '=== DATABASE FILES ==='
          find . -maxdepth 3 -type f \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.db-wal' -o -name '*.db-shm' \) -printf '%TY-%Tm-%Td %TH:%TM %12s %p\n' 2>/dev/null | sort || true
          echo '=== BACKUP DIRS ==='
          find . -maxdepth 4 -type d \( -iname '*backup*' -o -iname '*yedek*' \) -print 2>/dev/null | sort || true
          echo '=== BACKUP FILES ==='
          find . -maxdepth 5 -type f \( -path '*backup*' -o -path '*yedek*' \) -printf '%TY-%Tm-%Td %TH:%TM %12s %p\n' 2>/dev/null | sort || true
          echo '=== ARCHIVE SIZE ==='
          du -sh uploads/ims_archive 2>/dev/null || true
          echo '=== LOG SIZE ==='
          du -sh logs 2>/dev/null || true
          echo '=== ACTIVE IMS JOBS ==='
          venv/bin/python - <<'PY'
          from app import create_app
          from app.models import IMSImportJob
          app=create_app()
          with app.app_context():
              print('PROCESSING', IMSImportJob.query.filter_by(status='PROCESSING').count())
          PY
          echo '=== SQLITE PRAGMA ==='
          venv/bin/python - <<'PY'
          from app import create_app
          from app.extensions import db
          app=create_app()
          with app.app_context():
              c=db.session.connection()
              print('journal_mode', c.exec_driver_sql('PRAGMA journal_mode').scalar())
              print('busy_timeout', c.exec_driver_sql('PRAGMA busy_timeout').scalar())
              print('quick_check', c.exec_driver_sql('PRAGMA quick_check').scalar())
          PY
          REMOTE
