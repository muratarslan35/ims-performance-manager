name: Weekly snapshot replace patch
on:
  push:
    branches: [fix/weekly-snapshot-replace]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Simplify weekly snapshot patch workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/weekly-snapshot-replace
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply patch
        run: python scripts/apply_weekly_snapshot_patch.py
      - name: Install dependencies
        run: python -m pip install -q -r requirements.txt pytest
      - name: Targeted tests
        env:
          APP_ENV: testing
          SECRET_KEY: patch-test-secret
          DATABASE_URL: sqlite:////tmp/ims-weekly-replace.db
        run: python -m pytest -q tests/test_weekly_snapshot_replace_contract.py tests/test_ims_replace_flag_contract.py tests/test_region_read_v2.py
      - name: Full test suite
        env:
          APP_ENV: testing
          SECRET_KEY: patch-test-secret
          DATABASE_URL: sqlite:////tmp/ims-weekly-replace-full.db
        run: python -m pytest -q tests/
      - name: Commit patch
        run: |
          git config user.name 'Murat arslan'
          git config user.email '102037882+muratarslan35@users.noreply.github.com'
          git add app/services/ims_import_service.py app/services/region_performance_service.py tests/test_weekly_snapshot_replace_contract.py
          git commit -m 'Fix weekly IMS snapshot replacement scope'
          git push origin HEAD:fix/weekly-snapshot-replace
