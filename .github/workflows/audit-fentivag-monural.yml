name: Audit production Fentivag and Monurol

on:
  push:
    branches:
      - audit/fentivag-monural-prod
    paths:
      - .github/workflows/audit-fentivag-monural.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Read-only production source audit
        run: |
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          venv/bin/python - <<'PY'
          from pathlib import Path
          from openpyxl import load_workbook
          import re, unicodedata

          def norm(value):
              text = unicodedata.normalize('NFKD', str(value or '').strip().upper())
              text = ''.join(c for c in text if not unicodedata.combining(c))
              text = text.translate(str.maketrans({'İ':'I','Ş':'S','Ğ':'G','Ü':'U','Ö':'O','Ç':'C'}))
              return re.sub(r'[^A-Z0-9]+', ' ', text).strip()

          p = Path('uploads/Tayfun-1_3.Hafta_Ocak_Brick_Analizi_.xlsx')
          wb = load_workbook(p, data_only=True, read_only=True)
          wanted = {'MURAT ARSLAN', 'DIYARBAKIR BOS', 'DIYARBAKIR BOS KADRO'}
          for sheet_name in ['BAKİYE', 'TTS HAFTALIK ÇIKIŞLARI', 'TTS ÇIKIŞLARI', 'BRICK REA.']:
              ws = wb[sheet_name]
              print(f'=== {sheet_name} ===')
              for ridx, row in enumerate(ws.iter_rows(values_only=True), start=1):
                  vals = list(row)
                  joined = ' | '.join('' if v is None else str(v) for v in vals)
                  n = norm(joined)
                  if ridx <= 4 or any(name in n for name in wanted):
                      print(f'ROW {ridx}: {joined[:6000]}')
          wb.close()
          PY
          REMOTE
