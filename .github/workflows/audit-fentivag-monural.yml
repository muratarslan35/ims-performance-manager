name: Audit production Fentivag and Monurol

on:
  push:
    branches:
      - audit/fentivag-monural-prod
    paths:
      - .github/workflows/audit-fentivag-monural.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Read-only production source audit
        run: |
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          venv/bin/python - <<'PY'
          from pathlib import Path
          from openpyxl import load_workbook

          roots = [Path('instance/uploads'), Path('uploads'), Path('instance')]
          seen = set()
          files = []
          for root in roots:
              if not root.exists():
                  continue
              for p in root.rglob('*.xlsx'):
                  rp = str(p.resolve())
                  if rp not in seen:
                      seen.add(rp)
                      files.append(p)
          print('=== XLSX_FILES ===')
          for p in files:
              print(p)

          for p in files:
              try:
                  wb = load_workbook(p, data_only=True, read_only=True)
              except Exception as exc:
                  print('OPEN_ERROR', p, exc)
                  continue
              try:
                  for ws in wb.worksheets:
                      matches = []
                      for row_idx, row in enumerate(ws.iter_rows(values_only=True), start=1):
                          vals = ['' if v is None else str(v) for v in row]
                          joined = ' | '.join(vals)
                          up = joined.upper()
                          if 'FENTIVAG' in up or 'MONUROL' in up or ('HEDEF' in up and row_idx <= 15):
                              matches.append((row_idx, joined[:2000]))
                          if row_idx > 150 and matches:
                              break
                      if matches:
                          print(f'=== FILE {p} SHEET {ws.title} ===')
                          for row_idx, text in matches[:40]:
                              print(f'ROW {row_idx}: {text}')
              finally:
                  wb.close()
          PY
          REMOTE
