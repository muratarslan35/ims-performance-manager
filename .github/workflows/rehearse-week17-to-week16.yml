name: Rehearse Week17 To Week16 Rollback

on:
  push:
    branches:
      - agent/shadow-production-copy-proof
    paths:
      - ".github/workflows/rehearse-week17-to-week16.yml"

permissions:
  contents: read

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/shadow-production-copy-proof
      - name: Configure SSH
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Copy diagnostic rehearsal script only
        shell: bash
        run: |
          set -Eeuo pipefail
          scp -i ~/.ssh/ims_deploy_key -P "$IMS_PORT" -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=12 \
            scripts/rehearse_week17_to_week16.py \
            "$IMS_USER@$IMS_HOST:/tmp/rehearse_week17_to_week16.py"
      - name: Rehearse rollback on isolated baseline copy
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=12 "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain)"
          BASE="$IMS_PATH/instance/test-baselines/week17-production-baseline.db"
          META="$IMS_PATH/instance/test-baselines/week17-production-baseline.meta"
          SCRIPT=/tmp/rehearse_week17_to_week16.py
          test -f "$BASE"
          test -f "$META"
          test -f "$SCRIPT"
          expected=$(awk -F= '$1=="sha256"{print $2}' "$META")
          actual=$(sha256sum "$BASE" | awk '{print $1}')
          test "$expected" = "$actual"
          ROOT=$(mktemp -d "$IMS_PATH/instance/test-baselines/rollback-17-to-16.XXXXXX")
          trap 'rm -rf "$ROOT" "$SCRIPT"' EXIT
          cp --reflink=auto "$BASE" "$ROOT/candidate.db"
          mkdir -p "$ROOT/uploads/ims_archive/snapshots"
          cp "$IMS_PATH/uploads/ims_archive/upload-32.xlsx" "$ROOT/uploads/ims_archive/upload-32.xlsx"
          cp "$IMS_PATH/uploads/ims_archive/snapshots/upload-32.json" "$ROOT/uploads/ims_archive/snapshots/upload-32.json"
          PYTHONPATH="$IMS_PATH" "$IMS_PATH/venv/bin/python" "$SCRIPT" \
            --database "$ROOT/candidate.db" \
            --upload-root "$ROOT/uploads" \
            --delete-upload-id 32 \
            --expected-previous-upload-id 31 \
            --expected-previous-week 16
          test "$(sha256sum "$BASE" | awk '{print $1}')" = "$expected"
          echo "ROLLBACK_REHEARSAL|BASELINE_UNCHANGED|sha256=$expected"
          echo "ROLLBACK_REHEARSAL|PASS"
          REMOTE
