name: Rehearse Week17 Snapshot Cleanup

on:
  push:
    branches:
      - agent/shadow-production-copy-proof
    paths:
      - ".github/workflows/rehearse-week17-snapshot-cleanup.yml"
      - "scripts/rehearse_week17_snapshot_cleanup.py"

permissions:
  contents: read

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/shadow-production-copy-proof
      - name: Configure SSH
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Copy diagnostic scripts only
        shell: bash
        run: |
          set -Eeuo pipefail
          scp -i ~/.ssh/ims_deploy_key -P "$IMS_PORT" -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=12 \
            scripts/rehearse_week17_to_week16.py scripts/rehearse_week17_snapshot_cleanup.py \
            "$IMS_USER@$IMS_HOST:/tmp/"
      - name: Roll back isolated candidate and rebuild clean week16 snapshots
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=30 "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain)"
          BASE="$IMS_PATH/instance/test-baselines/week17-production-baseline.db"
          META="$IMS_PATH/instance/test-baselines/week17-production-baseline.meta"
          ROLLBACK=/tmp/rehearse_week17_to_week16.py
          CLEANUP=/tmp/rehearse_week17_snapshot_cleanup.py
          test -f "$BASE" && test -f "$META" && test -f "$ROLLBACK" && test -f "$CLEANUP"
          expected=$(awk -F= '$1=="sha256"{print $2}' "$META")
          test "$(sha256sum "$BASE" | awk '{print $1}')" = "$expected"
          ROOT=$(mktemp -d "$IMS_PATH/instance/test-baselines/snapshot-cleanup-17-to-16.XXXXXX")
          trap 'rm -rf "$ROOT" "$ROLLBACK" "$CLEANUP"' EXIT
          chmod 700 "$ROOT"
          cp --reflink=auto "$BASE" "$ROOT/candidate.db"
          chmod 600 "$ROOT/candidate.db"
          mkdir -p "$ROOT/uploads/ims_archive/snapshots" "$ROOT/instance"
          cp "$IMS_PATH/uploads/ims_archive/upload-32.xlsx" "$ROOT/uploads/ims_archive/upload-32.xlsx"
          cp "$IMS_PATH/uploads/ims_archive/snapshots/upload-32.json" "$ROOT/uploads/ims_archive/snapshots/upload-32.json"
          PYTHONPATH="$IMS_PATH" "$IMS_PATH/venv/bin/python" "$ROLLBACK" \
            --database "$ROOT/candidate.db" \
            --upload-root "$ROOT/uploads" \
            --delete-upload-id 32 \
            --expected-previous-upload-id 31 \
            --expected-previous-week 16
          PYTHONPATH="$IMS_PATH" "$IMS_PATH/venv/bin/python" "$CLEANUP" \
            --database "$ROOT/candidate.db" \
            --instance-root "$ROOT/instance" \
            --year 2026 --month 4 \
            --deleted-upload-id 32 \
            --expected-upload-id 31
          test "$(sha256sum "$BASE" | awk '{print $1}')" = "$expected"
          echo "SNAPSHOT_CLEANUP|BASELINE_UNCHANGED|sha256=$expected"
          echo "SNAPSHOT_CLEANUP_REHEARSAL|PASS"
          REMOTE
