name: Build Verified Week16 Production Candidate

on:
  push:
    branches:
      - agent/shadow-production-copy-proof
    paths:
      - ".github/workflows/rehearse-week17-snapshot-cleanup.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/shadow-production-copy-proof
      - name: Configure SSH
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Copy candidate scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          scp -i ~/.ssh/ims_deploy_key -P "$IMS_PORT" -o BatchMode=yes -o ConnectTimeout=20 scripts/rehearse_week17_to_week16.py scripts/rehearse_week17_snapshot_cleanup.py "$IMS_USER@$IMS_HOST:/tmp/"
      - name: Build and persist verified candidate without stopping production
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=90 "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          test "$(git branch --show-current)" = main
          test -z "$(git status --porcelain)"
          ROOT=instance/test-baselines/week16-production-candidate
          TMP="$ROOT.tmp.db"
          FINAL="$ROOT.db"
          META="$ROOT.meta"
          BASE=instance/test-baselines/week17-production-baseline.db
          BASEMETA=instance/test-baselines/week17-production-baseline.meta
          test -s "$BASE" && test -s "$BASEMETA"
          expected=$(awk -F= '$1=="sha256"{print $2}' "$BASEMETA")
          test "$(sha256sum "$BASE"|awk '{print $1}')" = "$expected"
          rm -f "$TMP" "$META.tmp"
          cp --reflink=auto "$BASE" "$TMP"\n          chmod 600 "$TMP"
          work=$(mktemp -d instance/test-baselines/week16-candidate-files.XXXXXX)
          trap 'rm -rf "$work" /tmp/rehearse_week17_to_week16.py /tmp/rehearse_week17_snapshot_cleanup.py' EXIT
          mkdir -p "$work/uploads/ims_archive/snapshots" "$work/instance"
          cp uploads/ims_archive/upload-32.xlsx "$work/uploads/ims_archive/upload-32.xlsx"
          cp uploads/ims_archive/snapshots/upload-32.json "$work/uploads/ims_archive/snapshots/upload-32.json"
          PYTHONPATH="$IMS_PATH" venv/bin/python /tmp/rehearse_week17_to_week16.py --database "$IMS_PATH/$TMP" --upload-root "$IMS_PATH/$work/uploads" --delete-upload-id 32 --expected-previous-upload-id 31 --expected-previous-week 16
          PYTHONPATH="$IMS_PATH" venv/bin/python /tmp/rehearse_week17_snapshot_cleanup.py --database "$IMS_PATH/$TMP" --instance-root "$IMS_PATH/$work" --year 2026 --month 4 --deleted-upload-id 32 --expected-upload-id 31
          venv/bin/python - "$BASE" "$TMP" <<'PY'
          import hashlib,json,sqlite3,sys
          old=sqlite3.connect(f'file:{sys.argv[1]}?mode=ro',uri=True,timeout=30)
          new=sqlite3.connect(f'file:{sys.argv[2]}?mode=ro',uri=True,timeout=30)
          def dig(c,q):
              h=hashlib.sha256();n=0
              for r in c.execute(q):h.update(json.dumps(r,ensure_ascii=False,default=str,separators=(',',':')).encode()+b'\n');n+=1
              return n,h.hexdigest()
          checked=0
          try:
              for t, in old.execute("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name"):
                  cols=[r[1] for r in old.execute(f'PRAGMA table_info("{t}")')]
                  if 'year' in cols and 'month' in cols:
                      order=','.join(f'"{c}"' for c in cols);q=f'SELECT * FROM "{t}" WHERE NOT (year=2026 AND month=4) ORDER BY {order}'
                      if dig(old,q)!=dig(new,q):raise SystemExit(f'historical drift {t}')
                      checked+=1
              for t in ('products','representatives'):
                  cols=[r[1] for r in old.execute(f'PRAGMA table_info("{t}")'];order=','.join(f'"{c}"' for c in cols)
                  if dig(old,f'SELECT * FROM "{t}" ORDER BY {order}')!=dig(new,f'SELECT * FROM "{t}" ORDER BY {order}'):raise SystemExit(f'master drift {t}')
                  checked+=1
              integrity=new.execute('PRAGMA integrity_check').fetchone()[0]
              latest=new.execute("SELECT id,year,month,week_number,status FROM ims_uploads WHERE status='COMPLETED' ORDER BY year DESC,month DESC,week_number DESC,id DESC LIMIT 1").fetchone()
              print(f'CANDIDATE|VERIFY|historical_tables={checked}|integrity={integrity}|latest={latest}')
              if integrity!='ok' or latest!=(31,2026,4,16,'COMPLETED'):raise SystemExit('candidate final verification failed')
          finally:old.close();new.close()
          PY
          sha=$(sha256sum "$TMP"|awk '{print $1}')
          bytes=$(stat -c '%s' "$TMP")
          printf 'sha256=%s\nbytes=%s\nsource_week17_sha256=%s\nweek16_upload_id=31\n' "$sha" "$bytes" "$expected" > "$META.tmp"
          mv -f "$TMP" "$FINAL"
          mv -f "$META.tmp" "$META"
          chmod 444 "$FINAL" "$META"
          test "$(sha256sum "$FINAL"|awk '{print $1}')" = "$sha"
          test "$(sha256sum "$BASE"|awk '{print $1}')" = "$expected"
          echo "WEEK16_CANDIDATE|READY|path=$FINAL|bytes=$bytes|sha256=$sha|source_sha256=$expected"
          echo 'WEEK16_CANDIDATE_BUILD|PASS'
          REMOTE
