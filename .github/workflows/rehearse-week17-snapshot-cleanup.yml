name: Recover Services After Disk Full

on:
  push:
    branches:
      - agent/shadow-production-copy-proof
    paths:
      - ".github/workflows/rehearse-week17-snapshot-cleanup.yml"

permissions:
  contents: read

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure SSH
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Remove only partial cutover files and start services
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" -o BatchMode=yes -o ConnectTimeout=20 "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          for partial in instance/ipm.db.next instance/ipm.db.restore; do
            if [ -e "$partial" ]; then
              echo "RESCUE|REMOVE_PARTIAL|$partial|bytes=$(stat -c '%s' "$partial")"
              rm -f "$partial"
            fi
          done
          sudo systemctl start ims-performance-manager.service
          sudo systemctl start ims-import-worker.service
          health=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 4 http://127.0.0.1:8000/login >/dev/null; then health=1;break;fi
            sleep 1
          done
          test "$health" = 1
          venv/bin/python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:instance/ipm.db?mode=ro',uri=True,timeout=30)
          try:
              latest=c.execute("SELECT id,year,month,week_number,status FROM ims_uploads WHERE status='COMPLETED' ORDER BY year DESC,month DESC,week_number DESC,id DESC LIMIT 1").fetchone()
              jobs=c.execute("SELECT COUNT(*) FROM ims_import_jobs WHERE status IN ('QUEUED','PROCESSING')").fetchone()[0]
          finally:c.close()
          print(f'RESCUE|LIVE|latest={latest}|jobs={jobs}')
          if latest!=(32,2026,4,17,'COMPLETED') or jobs:raise SystemExit('live DB changed unexpectedly')
          print('RESCUE|LIVE_WEEK17|PASS')
          PY
          echo "RESCUE|WEB|$(sudo systemctl is-active ims-performance-manager.service)"
          echo "RESCUE|WORKER|$(sudo systemctl is-active ims-import-worker.service)"
          df -h "$IMS_PATH"
          du -sh instance/test-baselines instance/backups 2>/dev/null || true
          test "$(sudo systemctl is-active ims-performance-manager.service)" = active
          test "$(sudo systemctl is-active ims-import-worker.service)" = active
          echo 'DISK_FULL_RECOVERY|PASS'
          REMOTE
