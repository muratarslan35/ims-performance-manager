name: Temporary active IMS rollback diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/diag-active-rollback.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_diag_key
          chmod 600 ~/.ssh/ims_diag_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Inspect active rollback eligibility read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_diag_key -p "$IMS_PORT" -o BatchMode=yes "$IMS_USER@$IMS_HOST" \
            "cd '$IMS_PATH' && venv/bin/python -" <<'PY'
          import json
          from pathlib import Path
          from app import create_app
          from app.models import IMSUpload
          from app.services.ims_upload_lifecycle_service import IMSUploadLifecycleService
          from app.services.ims_upload_lifecycle_ui import _first_period_rollback_permission

          app = create_app()
          with app.app_context():
              rows = IMSUpload.query.order_by(
                  IMSUpload.year.desc(), IMSUpload.month.desc(), IMSUpload.week_number.desc(),
                  IMSUpload.completed_at.desc(), IMSUpload.id.desc()
              ).limit(12).all()
              print('ROLLBACK_DIAGNOSTIC_BEGIN')
              for row in rows:
                  standard = IMSUploadLifecycleService.can_rollback(row)
                  first = _first_period_rollback_permission(row)
                  previous = IMSUploadLifecycleService._previous_completed_for_period(row)
                  snapshot = IMSUploadLifecycleService.upload_snapshot_path(row.id)
                  archive = IMSUploadLifecycleService.archived_source_for_upload(row.id)
                  print(json.dumps({
                      'id': row.id,
                      'year': row.year,
                      'month': row.month,
                      'week': row.week_number,
                      'status': row.status,
                      'file': row.file_name,
                      'previous_same_period_id': previous.id if previous else None,
                      'snapshot_exists': snapshot.is_file(),
                      'archive_exists': bool(archive and Path(archive).is_file()),
                      'standard_allowed': bool(standard[0]),
                      'standard_reason': standard[1],
                      'first_allowed': bool(first[0]),
                      'first_reason': first[1],
                  }, ensure_ascii=False))
              print('ROLLBACK_DIAGNOSTIC_END')
          PY
