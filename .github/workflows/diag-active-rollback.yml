name: One-shot PR 755 scoped repair

on:
  push:
    branches:
      - fix/ims-rollback-auth-theme
    paths:
      - .github/workflows/diag-active-rollback.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ims-rollback-auth-theme
          fetch-depth: 0

      - name: Apply only rollback continuity and auth theme changes
        run: python scripts/apply_pr755_patch.py

      - name: Validate scoped changes
        run: |
          python -m py_compile \
            app/services/ims_upload_lifecycle_service.py \
            app/services/ims_upload_lifecycle_ui.py \
            ims_import_worker.py
          git diff --check
          python -m pip install -q pytest
          python -m pytest -q \
            tests/test_ims_rollback_continuity_contract.py \
            tests/test_auth_theme_toggle_contract.py \
            tests/test_ims_rollback_button_visibility_contract.py \
            tests/test_ims_rollback_interaction_contract.py \
            tests/test_ims_publication_contract.py

      - name: Commit verified scoped repair and remove temporary helpers
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/services/ims_upload_lifecycle_service.py \
            app/services/ims_upload_lifecycle_ui.py \
            ims_import_worker.py \
            app/templates/login.html \
            app/templates/register.html \
            app/templates/partials/auth_theme_toggle.html \
            app/static/js/layout.js \
            app/static/css/auth-branding.css \
            tests/test_ims_rollback_continuity_contract.py \
            tests/test_auth_theme_toggle_contract.py
          git rm .github/workflows/diag-active-rollback.yml scripts/apply_pr755_patch.py
          git diff --cached --check
          git commit -m 'Fix sequential IMS rollback and pre-login theme toggle'
          git push origin HEAD:fix/ims-rollback-auth-theme
