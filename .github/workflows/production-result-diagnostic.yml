name: July Quota Live Read-Only Diagnostic

on:
  push:
    paths:
      - '.github/workflows/production-result-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Inspect July quota snapshot state
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          echo "REFRESH_PROCESS_BEGIN"
          pgrep -af 'refresh_july_quota_read_models' || true
          echo "REFRESH_PROCESS_END"
          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          import json
          from sqlalchemy import func
          from app import create_app
          from app.extensions import db
          from app.models import IMSImportJob, Product, Target
          from app.services.persistent_representative_snapshot_service import (
              PersistentRepresentativeSnapshotService,
              representative_snapshot_sets,
              representative_snapshots,
          )
          from app.services.ims_publication_service import IMSPublicationService
          from app.services.persistent_region_snapshot_service import PersistentRegionSnapshotService

          app=create_app()
          with app.app_context():
              year,month=2026,7
              history=db.session.execute(
                  representative_snapshot_sets.select().where(
                      representative_snapshot_sets.c.year==year,
                      representative_snapshot_sets.c.month==month,
                  ).order_by(representative_snapshot_sets.c.id.asc())
              ).all()
              for hist in history:
                  hist_count=int(db.session.execute(
                      db.select(func.count()).select_from(representative_snapshots).where(
                          representative_snapshots.c.set_id==int(hist.id)
                      )
                  ).scalar() or 0)
                  print(f"JULY_SET_HISTORY|id={hist.id}|status={hist.status}|count={hist_count}|ims={hist.source_upload_id}|production={hist.production_upload_id}|activated={hist.activated_at}")
              product=Product.query.filter(func.upper(Product.product_name)=="FENTIVAG").first()
              product_id=int(product.id)
              ims_id,production_id=PersistentRepresentativeSnapshotService.source_identity(year,month)
              row=db.session.execute(
                  representative_snapshot_sets.select().where(
                      representative_snapshot_sets.c.year==year,
                      representative_snapshot_sets.c.month==month,
                      representative_snapshot_sets.c.source_upload_id==ims_id,
                      representative_snapshot_sets.c.production_upload_id==production_id,
                  ).order_by(representative_snapshot_sets.c.id.desc()).limit(1)
              ).first()
              set_id=int(row.id) if row else 0
              count=int(db.session.execute(
                  db.select(func.count()).select_from(representative_snapshots).where(
                      representative_snapshots.c.set_id==set_id
                  )
              ).scalar() or 0) if set_id else 0
              ids=PersistentRepresentativeSnapshotService.representative_ids(year,month,ims_id)
              raw=PersistentRepresentativeSnapshotService._payloads_from_set(set_id,ids) if set_id else {}
              mismatches=[]
              for representative_id,snapshot in raw.items():
                  target=Target.query.filter_by(
                      year=year,month=month,representative_id=representative_id,product_id=product_id
                  ).first()
                  if target is None or not target.tl_target:
                      continue
                  monthly=((snapshot.get("snapshots") or {}).get("monthly") or {})
                  item=next((item for item in monthly.get("products",[])
                      if (item.get("product_id") or (item.get("product") or {}).get("id"))==product_id),None)
                  actual=float((item or {}).get("actual_tl") or 0)
                  expected=float(target.tl_target or 0)
                  if item is None or round(actual,2)!=round(expected,2):
                      mismatches.append((int(representative_id),round(actual,2),round(expected,2)))
              pending=IMSPublicationService.pending_job(year,month)
              summary={}
              if pending:
                  try: summary=json.loads(pending.result_summary or "{}")
                  except Exception: summary={}
              regions=PersistentRegionSnapshotService.get_active_all(year,month)
              print(f"JULY_SET|id={set_id}|status={row.status if row else None}|stored={count}|expected={len(ids)}|ims={ims_id}|production={production_id}")
              print(f"JULY_FENTIVAG_MISMATCH|count={len(mismatches)}|rows={mismatches}")
              print(f"JULY_PUBLICATION|pending_job={pending.id if pending else None}|ready={summary.get('publication_ready') if pending else None}|visible_regions={len(regions)}")
              from app.services.representative_period_workspace import _aggregate_sales
              quota=__import__("app.services.production_result_service",fromlist=["ProductionResultService"]).ProductionResultService.quota_product_months([(year,month)])
              rows,totals,_assignments,_sources=_aggregate_sales(1,[(year,month)])
              fen=next((item for item in rows if int(getattr(item.get("product"),"id",0) or 0)==product_id),None)
              print(f"DIRECT_QUOTA|product_id={product_id}|quota={quota}")
              print(f"DIRECT_AGGREGATE_REP1|target={float((fen or {}).get('target_tl') or 0):.2f}|actual={float((fen or {}).get('actual_tl') or 0):.2f}|source={(fen or {}).get('source')}|percent={(fen or {}).get('percent')}")
          PY
          REMOTE
