name: Production Result Failure Diagnostic

on:
  push:
    paths:
      - '.github/workflows/production-result-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_diag_key
          chmod 600 ~/.ssh/ims_diag_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Audit repaired representative coverage
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_diag_key -p "$IMS_PORT" -o BatchMode=yes "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          from app import create_app
          from app.extensions import db
          app=create_app()
          with app.app_context():
              processing=int(db.session.execute(db.text("SELECT COUNT(*) FROM ims_import_jobs WHERE status='PROCESSING'")).scalar() or 0)
              print(f'PROCESSING_COUNT|{processing}')
              cov=db.session.execute(db.text("""
                SELECT COUNT(*) rows,
                       COUNT(DISTINCT representative_id) reps,
                       COUNT(DISTINCT product_id) products,
                       SUM(CASE WHEN unit>0 THEN 1 ELSE 0 END) unit_positive_rows,
                       SUM(CASE WHEN tl>0 THEN 1 ELSE 0 END) tl_positive_rows,
                       SUM(CASE WHEN target_unit>0 THEN 1 ELSE 0 END) target_unit_rows,
                       SUM(CASE WHEN target_tl>0 THEN 1 ELSE 0 END) target_tl_rows,
                       SUM(CASE WHEN realization_percent>0 THEN 1 ELSE 0 END) realization_rows,
                       COALESCE(SUM(unit),0) unit_sum,
                       COALESCE(SUM(tl),0) tl_sum
                FROM ims_summary WHERE upload_id=27
              """)).mappings().one()
              print('SUMMARY_COVERAGE|'+'|'.join(f'{k}={cov[k]}' for k in cov.keys()))
              prev=db.session.execute(db.text("""
                SELECT COUNT(*) rows,COUNT(DISTINCT representative_id) reps,COUNT(DISTINCT product_id) products,
                       SUM(CASE WHEN unit>0 THEN 1 ELSE 0 END) unit_positive_rows,
                       SUM(CASE WHEN tl>0 THEN 1 ELSE 0 END) tl_positive_rows,
                       COALESCE(SUM(unit),0) unit_sum,COALESCE(SUM(tl),0) tl_sum
                FROM ims_facts WHERE upload_id=23 AND report_type='brick_sales'
              """)).mappings().one()
              print('W11_BRICK_SALES|'+'|'.join(f'{k}={prev[k]}' for k in prev.keys()))
              targets=db.session.execute(db.text("""
                SELECT COUNT(*) rows,COUNT(DISTINCT representative_id) reps,COUNT(DISTINCT product_id) products,
                       SUM(CASE WHEN unit_target>0 THEN 1 ELSE 0 END) unit_target_rows,
                       SUM(CASE WHEN tl_target>0 THEN 1 ELSE 0 END) tl_target_rows,
                       SUM(CASE WHEN unit_realization>0 THEN 1 ELSE 0 END) unit_real_rows,
                       SUM(CASE WHEN tl_realization>0 THEN 1 ELSE 0 END) tl_real_rows,
                       COALESCE(SUM(unit_realization),0) unit_real_sum,
                       COALESCE(SUM(tl_realization),0) tl_real_sum
                FROM targets WHERE year=2026 AND month=3
              """)).mappings().one()
              print('TARGET_COVERAGE|'+'|'.join(f'{k}={targets[k]}' for k in targets.keys()))
              matched=db.session.execute(db.text("""
                SELECT COUNT(*) FROM ims_summary s JOIN targets t
                  ON t.year=s.year AND t.month=s.month AND t.representative_id=s.representative_id AND t.product_id=s.product_id
                WHERE s.upload_id=27
              """)).scalar() or 0
              print(f'SUMMARY_TARGET_MATCHED|{int(matched)}')
              zero_units=db.session.execute(db.text("""
                SELECT r.rep_name,p.product_name,s.unit,s.tl,s.target_unit,s.target_tl
                FROM ims_summary s JOIN representatives r ON r.id=s.representative_id JOIN products p ON p.id=s.product_id
                WHERE s.upload_id=27 AND s.tl>0 AND s.unit=0 ORDER BY s.tl DESC
              """)).mappings().all()
              print(f'POSITIVE_TL_ZERO_UNIT_COUNT|{len(zero_units)}')
              for r in zero_units[:20]:
                  print(f'ZERO_UNIT|rep={r["rep_name"]}|product={r["product_name"]}|tl={r["tl"]}|target_unit={r["target_unit"]}|target_tl={r["target_tl"]}')
              top=db.session.execute(db.text("""
                SELECT r.rep_name,p.product_name,s.unit,s.tl,s.target_unit,s.target_tl,s.realization_percent
                FROM ims_summary s JOIN representatives r ON r.id=s.representative_id JOIN products p ON p.id=s.product_id
                WHERE s.upload_id=27 ORDER BY s.tl DESC LIMIT 15
              """)).mappings().all()
              for r in top:
                  print(f'TOP|rep={r["rep_name"]}|product={r["product_name"]}|unit={r["unit"]}|tl={r["tl"]}|target_unit={r["target_unit"]}|target_tl={r["target_tl"]}|realization={r["realization_percent"]}')
              latest=db.session.execute(db.text("""
                SELECT id,week_number,status,reconciliation_status
                FROM ims_uploads WHERE status='COMPLETED'
                ORDER BY year DESC,month DESC,week_number DESC,id DESC LIMIT 1
              """)).mappings().first()
              print(f'DASHBOARD_UPLOAD|id={latest["id"]}|week={latest["week_number"]}|status={latest["status"]}|reconciliation={latest["reconciliation_status"]}')
              jm=db.session.execute(db.text('PRAGMA journal_mode')).scalar(); bt=db.session.execute(db.text('PRAGMA busy_timeout')).scalar()
              print(f'SQLITE|journal_mode={jm}|busy_timeout={bt}')
          PY
          REMOTE
