name: Production Result Failure Diagnostic

on:
  push:
    paths:
      - '.github/workflows/production-result-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_diag_key
          chmod 600 ~/.ssh/ims_diag_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Audit rendered week13 dashboard paths
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_diag_key -p "$IMS_PORT" -o BatchMode=yes "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          from app import create_app
          from app.extensions import db
          from app.models import IMSUpload, IMSSummary
          from app.query.dashboard_query import DashboardQuery
          from app.query.filters import DashboardFilterParams
          from app.services.dashboard_service import DashboardService
          from app.services.region_performance_service import RegionPerformanceService
          from app.services.official_aggregate_service import OfficialAggregateService, ACTUAL_TYPE
          from app.cache.dashboard_cache import DashboardCache

          app=create_app()
          with app.app_context():
              print(f'PROCESSING_COUNT|{int(db.session.execute(db.text("SELECT COUNT(*) FROM ims_import_jobs WHERE status=\'PROCESSING\'")).scalar() or 0)}')
              latest=IMSUpload.query.filter_by(year=2026,month=3,status='COMPLETED').order_by(IMSUpload.week_number.desc(),IMSUpload.completed_at.desc(),IMSUpload.id.desc()).first()
              print(f'LATEST_IMS|id={latest.id}|week={latest.week_number}|recon={latest.reconciliation_status}')
              print(f'LATEST_SUMMARY|tl={db.session.query(db.func.coalesce(db.func.sum(IMSSummary.tl),0)).filter(IMSSummary.upload_id==latest.id).scalar()}|unit={db.session.query(db.func.coalesce(db.func.sum(IMSSummary.unit),0)).filter(IMSSummary.upload_id==latest.id).scalar()}')

              dq=DashboardQuery()
              filters=DashboardFilterParams(year=2026,month=3)
              period=dq.load_period_performance(filters)
              national=dq.load_national_dashboard_metrics(filters)
              products=dq.load_product_performance(filters)
              print(f'QUERY_PERIOD|target={period.target_tl}|actual={period.realization_tl}')
              print(f'QUERY_NATIONAL|source={national.get("source")}|target={national.get("target_tl")}|actual={national.get("actual_tl")}|unit_target={national.get("unit_target")}|unit_actual={national.get("unit_actual")}|products={len(national.get("products") or [])}')
              print(f'QUERY_PRODUCTS|total={sum(float(getattr(r,"realization_tl",0) or 0) for r in products)}|rows={len(products)}')

              oa=OfficialAggregateService.product_totals(2026,3,'NATIONAL')
              oar=OfficialAggregateService.rows(2026,3,'NATIONAL',ACTUAL_TYPE)
              print(f'OFFICIAL_NATIONAL|product_totals={len(oa or [])}|actual_rows={len(oar or [])}|actual_tl={sum(float(r.get("actual_tl",0) or 0) for r in (oa or []))}')

              region=RegionPerformanceService('901',2026,3).report()
              monthly=(region.get('periods') or {}).get('monthly') or {}
              print(f'REGION_901|rep_count={region.get("representative_count")}|target={monthly.get("target_tl")}|actual={monthly.get("actual_tl")}|percent={monthly.get("realization_percent")}')

              cache=DashboardCache()
              print(f'CACHE|enabled={cache.enabled}|entries={len(cache._store)}|keys={list(cache._store.keys())[:10]}')
              service=DashboardService(year=2026,month=3)
              payload=service.run()
              perf=payload.get('performance') or {}
              national_payload=payload.get('national_metrics') or payload.get('national') or {}
              print(f'SERVICE_PERFORMANCE|{perf}')
              print(f'SERVICE_NATIONAL|{national_payload}')
              print(f'CACHE_AFTER|entries={len(cache._store)}|keys={list(cache._store.keys())[:10]}')
              print(f'SQLITE|journal_mode={db.session.execute(db.text("PRAGMA journal_mode")).scalar()}|busy_timeout={db.session.execute(db.text("PRAGMA busy_timeout")).scalar()}')
          PY
          REMOTE
