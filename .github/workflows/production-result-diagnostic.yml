name: Production Result Failure Diagnostic

on:
  push:
    paths:
      - '.github/workflows/production-result-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_diag_key
          chmod 600 ~/.ssh/ims_diag_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Audit latest week-12 re-upload
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_diag_key -p "$IMS_PORT" -o BatchMode=yes "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          from app import create_app
          from app.extensions import db
          from app.repository.dashboard_repository import DashboardRepository
          app=create_app()
          with app.app_context():
              jobs=db.session.execute(db.text("SELECT * FROM ims_import_jobs ORDER BY id DESC LIMIT 5")).mappings().all()
              for r in jobs:
                  print('JOB|'+'|'.join(f'{k}={r[k]}' for k in r.keys()))
              processing=db.session.execute(db.text("SELECT COUNT(*) FROM ims_import_jobs WHERE status='PROCESSING'")).scalar()
              print(f'PROCESSING_COUNT|{processing}')
              uploads=db.session.execute(db.text("SELECT id,file_name,status,year,month,week_number,reconciliation_status,raw_record_count,fact_record_count,summary_record_count FROM ims_uploads WHERE year=2026 AND month=3 AND week_number=12 ORDER BY id DESC LIMIT 5")).mappings().all()
              for u in uploads:
                  print('W12UPLOAD|'+'|'.join(f'{k}={u[k]}' for k in u.keys()))
              latest=uploads[0] if uploads else None
              if latest:
                  uid=latest['id']
                  for t in ('ims_raw_data','ims_facts','ims_summary'):
                      r=db.session.execute(db.text(f"SELECT COUNT(*) rows,SUM(COALESCE(unit,0)) unit_sum,SUM(COALESCE(tl,0)) tl_sum FROM {t} WHERE upload_id=:uid"), {'uid': uid}).mappings().one()
                      print(f'SNAPSHOT|upload_id={uid}|table={t}|rows={r["rows"]}|unit_sum={r["unit_sum"]}|tl_sum={r["tl_sum"]}')
                  dup=db.session.execute(db.text("SELECT COUNT(*) FROM (SELECT representative_id,brick_id,product_id,COUNT(*) c FROM ims_facts WHERE upload_id=:uid GROUP BY representative_id,brick_id,product_id HAVING COUNT(*)>1)"), {'uid':uid}).scalar()
                  print(f'FACT_DUPLICATE_GROUPS|upload_id={uid}|count={dup}')
                  zeros=db.session.execute(db.text("SELECT SUM(CASE WHEN COALESCE(unit,0)=0 THEN 1 ELSE 0 END) unit_zero_rows,SUM(CASE WHEN COALESCE(tl,0)=0 THEN 1 ELSE 0 END) tl_zero_rows FROM ims_raw_data WHERE upload_id=:uid"), {'uid':uid}).mappings().one()
                  print(f'ZEROS|upload_id={uid}|unit_zero_rows={zeros["unit_zero_rows"]}|tl_zero_rows={zeros["tl_zero_rows"]}')
                  prod=db.session.execute(db.text("SELECT p.name product,SUM(COALESCE(f.unit,0)) unit_sum,SUM(COALESCE(f.tl,0)) tl_sum FROM ims_facts f LEFT JOIN products p ON p.id=f.product_id WHERE f.upload_id=:uid GROUP BY p.name ORDER BY p.name"), {'uid':uid}).mappings().all()
                  for r in prod:
                      print(f'PRODUCT|upload_id={uid}|product={r["product"]}|unit_sum={r["unit_sum"]}|tl_sum={r["tl_sum"]}')
              repo=DashboardRepository(db.session)
              x=repo.load_latest_successful_summary()
              print(f'DASHBOARD|id={x.id if x else None}|week={x.week_number if x else None}|status={x.status if x else None}|reconciliation={x.reconciliation_status if x else None}')
          PY
          REMOTE
