name: Production Result Failure Diagnostic

on:
  push:
    paths:
      - '.github/workflows/production-result-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_diag_key
          chmod 600 ~/.ssh/ims_diag_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Audit TL per box stability
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_diag_key -p "$IMS_PORT" -o BatchMode=yes "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          from collections import defaultdict
          from statistics import median
          from app import create_app
          from app.extensions import db
          app=create_app()
          with app.app_context():
              uploads={10:22,11:23}
              by_week={}
              for week,uid in uploads.items():
                  rows=db.session.execute(db.text("""
                    SELECT f.product_id,p.name product_name,f.representative_id,f.unit,f.tl
                    FROM ims_facts f JOIN products p ON p.id=f.product_id
                    WHERE f.upload_id=:u AND f.report_type='brick_sales' AND f.unit>0 AND f.tl>0
                  """),{'u':uid}).mappings().all()
                  groups=defaultdict(list)
                  for r in rows:
                      groups[(int(r['product_id']),r['product_name'])].append(float(r['tl'])/float(r['unit']))
                  by_week[week]=groups
                  for (pid,name),vals in sorted(groups.items()):
                      lo=min(vals); hi=max(vals); med=median(vals); avg=sum(vals)/len(vals)
                      spread=(hi-lo)/med*100 if med else 0
                      print(f'PRICE|week={week}|product_id={pid}|product={name}|n={len(vals)}|avg={avg:.6f}|median={med:.6f}|min={lo:.6f}|max={hi:.6f}|spread_pct={spread:.4f}')
              for key in sorted(set(by_week[10]) & set(by_week[11])):
                  a=median(by_week[10][key]); b=median(by_week[11][key]); diff=(b-a)/a*100 if a else 0
                  print(f'PRICE_WEEK_DELTA|product_id={key[0]}|product={key[1]}|w10_median={a:.6f}|w11_median={b:.6f}|delta_pct={diff:.4f}')
          PY
          REMOTE
