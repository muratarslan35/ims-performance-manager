name: Production Result Failure Diagnostic

on:
  push:
    paths:
      - '.github/workflows/production-result-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_diag_key
          chmod 600 ~/.ssh/ims_diag_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Compare source workbook totals to DB
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_diag_key -p "$IMS_PORT" -o BatchMode=yes "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          from decimal import Decimal
          from openpyxl import load_workbook
          from app import create_app
          from app.models import IMSUpload, Representative, Target, IMSSummary
          from app.services.alias_service import AliasService
          from app.services.ims_upload_lifecycle_service import IMSUploadLifecycleService

          app=create_app()
          with app.app_context():
              upload=IMSUpload.query.get(29)
              path=IMSUploadLifecycleService.archived_source_for_upload(29)
              wb=load_workbook(path, data_only=True, read_only=True)
              ws=wb['TTS ÇIKIŞLARI']
              # Header is row 2 in this compact layout. Discover the right-most TOPLAM,
              # which is the workbook's displayed total realization column.
              headers=[AliasService.normalize(ws.cell(2,c).value) for c in range(1,ws.max_column+1)]
              total_cols=[i+1 for i,v in enumerate(headers) if v=='TOPLAM']
              total_col=max(total_cols)
              print(f'LAYOUT|rows={ws.max_row}|cols={ws.max_column}|total_cols={total_cols}|selected_total={total_col}')
              reps={AliasService.normalize(r.rep_name):r for r in Representative.query.all()}
              aliases={}
              for r in Representative.query.all():
                  for label in (r.rep_name,r.rep_code,r.ims_code):
                      if label: aliases[AliasService.normalize(label)]=r
              mismatches=[]; checked=0; source_missing=[]
              for row in range(3,ws.max_row+1):
                  raw=ws.cell(row,2).value
                  name=AliasService.normalize(raw)
                  if not name or name=='NATIONAL' or (len(name)>4 and name[:3].isdigit() and name[3]==' '):
                      continue
                  rep=aliases.get(name)
                  if rep is None:
                      continue
                  source_pct=ws.cell(row,total_col).value
                  if source_pct is None:
                      source_missing.append((row,raw)); continue
                  try: source_pct=Decimal(str(source_pct))
                  except Exception: continue
                  targets=Target.query.filter_by(year=2026,month=3,representative_id=rep.id).all()
                  summaries=IMSSummary.query.filter_by(upload_id=29,year=2026,month=3,representative_id=rep.id).all()
                  t=sum((Decimal(str(x.tl_target or 0)) for x in targets),Decimal('0'))
                  a=sum((Decimal(str(x.tl or 0)) for x in summaries),Decimal('0'))
                  db_pct=(a*Decimal('100')/t) if t else Decimal('0')
                  checked+=1
                  diff=abs(db_pct-source_pct)
                  if diff>Decimal('0.55'):
                      mismatches.append((row,rep.id,rep.rep_name,rep.region,source_pct,db_pct,t,a,diff))
              print(f'WORKBOOK_PERCENT_AUDIT|checked={checked}|mismatches={len(mismatches)}|source_missing={len(source_missing)}')
              for x in mismatches:
                  print('MISMATCH|row=%s|id=%s|name=%s|region=%s|source_pct=%s|db_pct=%s|target=%s|actual=%s|diff=%s'%x)
              # Dump source cells and DB product rows for every mismatch.
              for row,rep_id,name,region,sp,dp,t,a,diff in mismatches:
                  vals=[]
                  for c in range(1,ws.max_column+1):
                      v=ws.cell(row,c).value
                      if v is not None: vals.append(f'{c}={v}')
                  print(f'SOURCE_ROW|row={row}|name={name}|'+';'.join(vals))
                  ss=IMSSummary.query.filter_by(upload_id=29,year=2026,month=3,representative_id=rep_id).all()
                  ts={x.product_id:x for x in Target.query.filter_by(year=2026,month=3,representative_id=rep_id).all()}
                  for s in ss:
                      tt=ts.get(s.product_id)
                      pct=(Decimal(str(s.tl or 0))*100/Decimal(str(tt.tl_target or 0))) if tt and tt.tl_target else Decimal('0')
                      print(f'DB_PRODUCT|rep={name}|pid={s.product_id}|target={getattr(tt,"tl_target",None)}|actual={s.tl}|pct={pct}')
          PY
          REMOTE
