name: Production Result Failure Diagnostic

on:
  push:
    paths:
      - '.github/workflows/production-result-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_diag_key
          chmod 600 ~/.ssh/ims_diag_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Audit historical brick-sales header contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_diag_key -p "$IMS_PORT" -o BatchMode=yes "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          import json,re
          from collections import Counter,defaultdict
          from app import create_app
          from app.extensions import db
          app=create_app()
          metric=re.compile(r'(^|\s)(TL|CIRO|VALUE|KUTU|BOX|UNIT|ADET)(\s|$)',re.I)
          with app.app_context():
              uploads=db.session.execute(db.text("SELECT id,year,month,week_number,file_name,status FROM ims_uploads WHERE status='COMPLETED' ORDER BY year,month,week_number,id")).mappings().all()
              for u in uploads:
                  raws=db.session.execute(db.text("SELECT raw_json,unit,tl FROM ims_raw_data WHERE upload_id=:u AND sheet_type='brick_sales'"),{'u':u['id']}).mappings().all()
                  if not raws: continue
                  keys=Counter(); bare=Counter(); unit=0.0; tl=0.0
                  for r in raws:
                      unit+=float(r['unit'] or 0); tl+=float(r['tl'] or 0)
                      try: sv=(json.loads(r['raw_json'] or '{}').get('source_values') or {})
                      except Exception: sv={}
                      for k in sv:
                          keys[k]+=1
                          if not metric.search(str(k)): bare[k]+=1
                  print('HISTORY|id=%s|period=%s-%02d-w%s|file=%s|rows=%s|unit_sum=%s|tl_sum=%s|bare_headers=%s' % (u['id'],u['year'],u['month'],u['week_number'],u['file_name'],len(raws),unit,tl,json.dumps(bare,ensure_ascii=False,sort_keys=True)))
          PY
          REMOTE
