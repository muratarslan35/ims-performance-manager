name: Production Result Failure Diagnostic

on:
  push:
    paths:
      - '.github/workflows/production-result-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_diag_key
          chmod 600 ~/.ssh/ims_diag_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Audit week14 target authority
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_diag_key -p "$IMS_PORT" -o BatchMode=yes "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          from collections import defaultdict
          from decimal import Decimal
          from app import create_app
          from app.extensions import db
          from app.models import IMSRawData, IMSUpload, IMSSummary, Target
          from app.query.dashboard_query import DashboardQuery
          from app.query.filters import DashboardFilterParams
          from app.services.region_performance_service import RegionPerformanceService
          from app.services.official_aggregate_service import OfficialAggregateService, TARGET_TYPE, ACTUAL_TYPE

          app=create_app()
          with app.app_context():
              y,m=2026,3
              processing=int(db.session.execute(db.text("SELECT COUNT(*) FROM ims_import_jobs WHERE status='PROCESSING'")).scalar() or 0)
              latest=IMSUpload.query.filter_by(year=y,month=m,status='COMPLETED').order_by(IMSUpload.week_number.desc(),IMSUpload.completed_at.desc(),IMSUpload.id.desc()).first()
              print(f'PROCESSING|{processing}')
              print(f'LATEST|id={latest.id}|week={latest.week_number}|file={latest.file_name}|recon={latest.reconciliation_status}|sheets={latest.sheet_count}|processed={latest.processed_sheets}')
              print('RAW_TYPES|' + str(dict(db.session.query(IMSRawData.sheet_type,db.func.count(IMSRawData.id)).filter(IMSRawData.upload_id==latest.id).group_by(IMSRawData.sheet_type).all())))
              print(f'SUMMARY|rows={IMSSummary.query.filter_by(upload_id=latest.id).count()}|tl={db.session.query(db.func.coalesce(db.func.sum(IMSSummary.tl),0)).filter(IMSSummary.upload_id==latest.id).scalar()}')
              print(f'OFFICIAL_IDS|target={OfficialAggregateService.latest_upload_id(y,m,TARGET_TYPE)}|actual={OfficialAggregateService.latest_upload_id(y,m,ACTUAL_TYPE)}|latest={OfficialAggregateService.latest_upload_id(y,m)}')

              # Inspect latest workbook rows that can carry target semantics for region 901.
              rows=IMSRawData.query.filter(IMSRawData.upload_id==latest.id).filter(
                  db.or_(IMSRawData.territory.like('901%'), IMSRawData.representative.like('901%'))
              ).all()
              by_type=defaultdict(lambda: [Decimal('0'),Decimal('0'),0])
              for r in rows:
                  b=by_type[str(r.sheet_type)]
                  b[0]+=Decimal(str(r.unit or 0)); b[1]+=Decimal(str(r.tl or 0)); b[2]+=1
              for k,v in sorted(by_type.items()):
                  print(f'RAW901|type={k}|rows={v[2]}|unit={v[0]}|tl={v[1]}')

              # Current Target table region 901 values.
              rps=RegionPerformanceService('901',y,m)
              target_rows=Target.query.filter(Target.year==y,Target.month==m,Target.representative_id.in_(rps.rep_ids)).all()
              print(f'TARGET901|reps={len(rps.rep_ids)}|rows={len(target_rows)}|tl={sum(Decimal(str(x.tl_target or 0)) for x in target_rows)}|unit={sum(Decimal(str(x.unit_target or 0)) for x in target_rows)}')

              dq=DashboardQuery(); f=DashboardFilterParams(year=y,month=m)
              maps=dq.load_region_performance(f)
              rr=next((x for x in maps if str(getattr(x,'region',''))=='901'),None)
              report=rps.report(); monthly=(report.get('periods') or {}).get('monthly') or {}
              print(f'MAP901|target={getattr(rr,"tl_target",None)}|actual={getattr(rr,"tl_actual",None)}|reps={getattr(rr,"representative_count",None)}')
              print(f'DETAIL901|target={monthly.get("target_tl")}|actual={monthly.get("actual_tl")}|real={monthly.get("realization_percent")}|reps={report.get("representative_count")}')

              # Print candidate rows with exact 901 subtotal-like labels.
              cand=IMSRawData.query.filter(IMSRawData.upload_id==latest.id).filter(
                  db.or_(IMSRawData.territory.in_(['901','901 DIYARBAKIR']), IMSRawData.representative.in_(['901','901 DIYARBAKIR']))
              ).order_by(IMSRawData.sheet_type,IMSRawData.source_row).all()
              for r in cand[:100]:
                  print(f'CAND901|sheet={r.sheet_name}|type={r.sheet_type}|row={r.source_row}|rep={r.representative}|terr={r.territory}|product={r.product_id}|unit={r.unit}|tl={r.tl}')

              print(f'SQLITE|journal={db.session.execute(db.text("PRAGMA journal_mode")).scalar()}|busy={db.session.execute(db.text("PRAGMA busy_timeout")).scalar()}')
          PY
          REMOTE
