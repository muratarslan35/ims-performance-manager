name: Production Result Failure Diagnostic

on:
  push:
    paths:
      - '.github/workflows/production-result-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_diag_key
          chmod 600 ~/.ssh/ims_diag_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Refresh IMS worker after verified idle state
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_diag_key -p "$IMS_PORT" -o BatchMode=yes "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          processing=$(venv/bin/python - <<'PY'
          import sqlite3
          c=sqlite3.connect('instance/ipm.db', timeout=30)
          try:
              c.execute('PRAGMA busy_timeout=30000')
              print(c.execute("SELECT COUNT(*) FROM ims_import_jobs WHERE status='PROCESSING'").fetchone()[0])
          finally:
              c.close()
          PY
          )
          echo "PROCESSING_COUNT|$processing"
          test "$processing" = "0"
          echo "WORKER_BEFORE|$(sudo systemctl show ims-import-worker.service -p ActiveState -p MainPID --value | tr '\n' '|')"
          sudo systemctl restart ims-import-worker.service
          sleep 2
          state=$(sudo systemctl is-active ims-import-worker.service)
          echo "WORKER_AFTER|state=$state|pid=$(sudo systemctl show ims-import-worker.service -p MainPID --value)"
          test "$state" = "active"
          venv/bin/python - <<'PY'
          import sqlite3
          c=sqlite3.connect('instance/ipm.db', timeout=30)
          try:
              c.execute('PRAGMA busy_timeout=30000')
              mode=c.execute('PRAGMA journal_mode').fetchone()[0]
              timeout=c.execute('PRAGMA busy_timeout').fetchone()[0]
              p=c.execute("SELECT COUNT(*) FROM ims_import_jobs WHERE status='PROCESSING'").fetchone()[0]
              row=c.execute("SELECT id,stored_file_name,source_hash,status,ims_upload_id FROM ims_import_jobs ORDER BY id DESC LIMIT 1").fetchone()
          finally:
              c.close()
          print(f'SQLITE|journal_mode={mode}|busy_timeout={timeout}|processing={p}')
          print(f'LATEST_JOB|id={row[0]}|stored={row[1]}|hash={row[2]}|status={row[3]}|upload_id={row[4]}')
          PY
          latest=$(venv/bin/python - <<'PY'
          import sqlite3
          c=sqlite3.connect('instance/ipm.db')
          try: print(c.execute("SELECT stored_file_name FROM ims_import_jobs ORDER BY id DESC LIMIT 1").fetchone()[0])
          finally: c.close()
          PY
          )
          found='no'
          for p in "$latest" "uploads/$latest" "instance/$latest" "instance/uploads/$latest"; do
            if [ -f "$p" ]; then echo "SOURCE_FILE|found=$p"; found='yes'; fi
          done
          [ "$found" = 'yes' ] || echo 'SOURCE_FILE|found=no'
          REMOTE
