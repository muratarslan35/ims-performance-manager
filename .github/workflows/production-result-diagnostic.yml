name: Production Result Failure Diagnostic

on:
  push:
    paths:
      - '.github/workflows/production-result-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_diag_key
          chmod 600 ~/.ssh/ims_diag_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Inspect compact target parser
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_diag_key -p "$IMS_PORT" -o BatchMode=yes "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          import os
          import pandas as pd
          from app import create_app
          from app.extensions import db
          from app.models import IMSImportJob, IMSUpload
          from app.services.target_import_service import TargetImportService
          from app.services.alias_service import AliasService

          app=create_app()
          with app.app_context():
              latest=IMSUpload.query.filter_by(year=2026,month=3,status='COMPLETED').order_by(IMSUpload.week_number.desc(),IMSUpload.id.desc()).first()
              job=IMSImportJob.query.filter_by(ims_upload_id=latest.id).order_by(IMSImportJob.id.desc()).first()
              path=None
              if job:
                  candidates=[
                      os.path.join(app.config.get('UPLOAD_FOLDER',''), job.stored_file_name),
                      os.path.join(app.config.get('UPLOAD_FOLDER',''), job.file_name),
                      os.path.join('/home/ubuntu/ims_system/uploads', job.stored_file_name),
                  ]
                  path=next((p for p in candidates if p and os.path.exists(p)),None)
              print(f'LATEST|id={latest.id}|week={latest.week_number}|file={latest.file_name}')
              print(f'JOB|id={getattr(job,"id",None)}|stored={getattr(job,"stored_file_name",None)}|path={path}')
              if not path:
                  raise SystemExit('source workbook not found')
              wb=pd.read_excel(path,sheet_name=None,header=None)
              svc=TargetImportService(path, latest.id, workbook=wb)
              svc.load_workbook()
              for name,df in wb.items():
                  title=' | '.join(str(v) for v in df.iloc[0].tolist() if str(v)!='nan') if len(df) else ''
                  row2=' | '.join(str(v) for v in df.iloc[1].tolist() if str(v)!='nan') if len(df)>1 else ''
                  print(f'SHEET|{name}|shape={df.shape}|compact={int(svc._is_compact_target_layout(df))}|target_sheet={int(svc._is_target_sheet(name,df))}')
                  print(f'ROW1|{name}|{title[:1200]}')
                  print(f'ROW2|{name}|{row2[:1200]}')
                  if len(df)>2:
                      print(f'ROW3|{name}|'+' | '.join(str(v) for v in df.iloc[2].tolist() if str(v)!='nan')[:1200])
              print('PARSER_DECISIONS|' + str(svc.parser_decisions))
          PY
          REMOTE
