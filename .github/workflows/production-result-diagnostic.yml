name: Production Result Failure Diagnostic

on:
  push:
    paths:
      - '.github/workflows/production-result-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_diag_key
          chmod 600 ~/.ssh/ims_diag_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Verify overlay state
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_diag_key -p "$IMS_PORT" -o BatchMode=yes "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          from app import create_app
          from app.extensions import db
          app=create_app()
          reps={'YAKUP CAGIR':94,'VEYSI OZDAMAR':96,'GOKHAN DUMAN':93,'MURAT ARSLAN':97,'MUSTAFA ALMAZ':98,'OZGECAN GULACAR':117,'DIYARBAKIR BOS':111,'GULBAHAR KARA':95,'YASIN TINI':99}
          with app.app_context():
              processing=int(db.session.execute(db.text("SELECT COUNT(*) FROM ims_import_jobs WHERE status='PROCESSING'")).scalar() or 0)
              print(f'PROCESSING_COUNT|{processing}')
              facts=db.session.execute(db.text("SELECT COUNT(*) rows,COALESCE(SUM(unit),0) unit,COALESCE(SUM(tl),0) tl FROM ims_facts WHERE upload_id=27")).mappings().one()
              summary=db.session.execute(db.text("SELECT COUNT(*) rows,COALESCE(SUM(unit),0) unit,COALESCE(SUM(tl),0) tl FROM ims_summary WHERE upload_id=27")).mappings().one()
              print(f'FACTS|rows={facts["rows"]}|unit={facts["unit"]}|tl={facts["tl"]}')
              print(f'SUMMARY|rows={summary["rows"]}|unit={summary["unit"]}|tl={summary["tl"]}')
              assert int(facts['rows'])==791 and int(summary['rows'])==791
              assert abs(float(summary['tl'])-float(facts['tl']))<0.05
              group_source=group_summary=group_target=0.0
              for name,rid in reps.items():
                  src=float(db.session.execute(db.text("SELECT COALESCE(SUM(tl),0) FROM ims_facts WHERE upload_id=27 AND report_type='brick_sales' AND representative_id=:r"),{'r':rid}).scalar() or 0)
                  sm=db.session.execute(db.text("SELECT COALESCE(SUM(unit),0) unit,COALESCE(SUM(tl),0) tl FROM ims_summary WHERE upload_id=27 AND representative_id=:r"),{'r':rid}).mappings().one()
                  tr=float(db.session.execute(db.text("SELECT COALESCE(SUM(tl_realization),0) FROM targets WHERE year=2026 AND month=3 AND representative_id=:r"),{'r':rid}).scalar() or 0)
                  print(f'REP|name={name}|source={src:.6f}|summary={float(sm["tl"]):.6f}|target_real={tr:.6f}|unit={float(sm["unit"]):.3f}')
                  assert abs(float(sm['tl'])-src)<0.05
                  assert abs(tr-src)<0.05
                  group_source+=src; group_summary+=float(sm['tl']); group_target+=tr
              print(f'DIYARBAKIR_9|source={group_source:.6f}|summary={group_summary:.6f}|target_real={group_target:.6f}')
              assert abs(group_source-group_summary)<0.05 and abs(group_source-group_target)<0.05
              comp=int(db.session.execute(db.text("SELECT COUNT(*) FROM ims_competition_data")).scalar() or 0)
              print(f'COMPETITION_COUNT|{comp}')
              latest=db.session.execute(db.text("SELECT id,week_number,status,reconciliation_status FROM ims_uploads WHERE status='COMPLETED' ORDER BY year DESC,month DESC,week_number DESC,id DESC LIMIT 1")).mappings().first()
              print(f'DASHBOARD_UPLOAD|id={latest["id"]}|week={latest["week_number"]}|status={latest["status"]}|reconciliation={latest["reconciliation_status"]}')
              jm=db.session.execute(db.text('PRAGMA journal_mode')).scalar(); bt=db.session.execute(db.text('PRAGMA busy_timeout')).scalar()
              print(f'SQLITE|journal_mode={jm}|busy_timeout={bt}')
          PY
          REMOTE
