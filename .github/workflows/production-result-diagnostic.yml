name: Production Result Failure Diagnostic

on:
  push:
    paths:
      - '.github/workflows/production-result-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_diag_key
          chmod 600 ~/.ssh/ims_diag_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Audit week13 accepted read sources
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_diag_key -p "$IMS_PORT" -o BatchMode=yes "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          from decimal import Decimal
          from app import create_app
          from app.extensions import db
          from app.models import IMSUpload, IMSSummary, ProductionResultUpload, ProductionResult, Target
          from app.query.dashboard_query import DashboardQuery
          from app.query.filters import DashboardFilterParams
          from app.services.production_result_service import ProductionResultService

          app=create_app()
          with app.app_context():
              processing=int(db.session.execute(db.text("SELECT COUNT(*) FROM ims_import_jobs WHERE status='PROCESSING'")).scalar() or 0)
              print(f'PROCESSING_COUNT|{processing}')

              latest=IMSUpload.query.filter_by(year=2026,month=3,status='COMPLETED').order_by(IMSUpload.week_number.desc(),IMSUpload.completed_at.desc(),IMSUpload.id.desc()).first()
              print(f'LATEST_IMS|id={latest.id}|week={latest.week_number}|recon={latest.reconciliation_status}|summary_count={latest.summary_record_count}')
              for row in db.session.query(IMSSummary.upload_id,db.func.count(IMSSummary.id),db.func.coalesce(db.func.sum(IMSSummary.tl),0),db.func.coalesce(db.func.sum(IMSSummary.unit),0)).filter(IMSSummary.year==2026,IMSSummary.month==3).group_by(IMSSummary.upload_id).order_by(IMSSummary.upload_id).all():
                  print(f'SUMMARY_BY_UPLOAD|upload={row[0]}|rows={row[1]}|tl={row[2]}|unit={row[3]}')

              uploads=ProductionResultUpload.query.filter_by(year=2026,month=3,status=ProductionResultUpload.STATUS_APPLIED).order_by(ProductionResultUpload.production_stage.desc(),ProductionResultUpload.applied_at.desc(),ProductionResultUpload.id.desc()).all()
              print(f'APPLIED_PRODUCTION_UPLOADS|count={len(uploads)}')
              for up in uploads:
                  agg=db.session.query(db.func.count(ProductionResult.id),db.func.coalesce(db.func.sum(ProductionResult.actual_tl),0),db.func.coalesce(db.func.sum(ProductionResult.actual_unit),0)).filter(ProductionResult.upload_id==up.id).one()
                  print(f'PRODUCTION_UPLOAD|id={up.id}|stage={up.production_stage}|status={up.status}|rows={agg[0]}|tl={agg[1]}|unit={agg[2]}')

              targets=Target.query.filter_by(year=2026,month=3).all()
              print(f'TARGET_ROWS|{len(targets)}|target_tl={sum(Decimal(str(t.tl_target or 0)) for t in targets)}|stored_real_tl={sum(Decimal(str(t.tl_realization or 0)) for t in targets)}')
              dq=DashboardQuery()
              period=dq.load_period_performance(DashboardFilterParams(year=2026,month=3))
              print(f'DASHBOARD_PERIOD|target={period.target_tl}|actual={period.realization_tl}')

              latest_summary_tl=Decimal(str(db.session.query(db.func.coalesce(db.func.sum(IMSSummary.tl),0)).filter(IMSSummary.upload_id==latest.id).scalar() or 0))
              effective_total=Decimal('0')
              source_counts={}
              for target in targets:
                  row=ProductionResultService.effective_product(2026,3,target.representative_id,target.product_id)
                  effective_total += Decimal(str(row.get('actual_tl') or 0))
                  source_counts[row.get('source')]=source_counts.get(row.get('source'),0)+1
              print(f'EFFECTIVE_SERVICE|actual={effective_total}|sources={source_counts}|latest_ims_summary={latest_summary_tl}')
              print(f'SQLITE|journal_mode={db.session.execute(db.text("PRAGMA journal_mode")).scalar()}|busy_timeout={db.session.execute(db.text("PRAGMA busy_timeout")).scalar()}')
          PY
          REMOTE
