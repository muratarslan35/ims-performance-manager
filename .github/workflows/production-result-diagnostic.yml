name: Production Result Failure Diagnostic

on:
  push:
    paths:
      - '.github/workflows/production-result-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_diag_key
          chmod 600 ~/.ssh/ims_diag_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Read March week-12 IMS import failure evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_diag_key -p "$IMS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          echo "WEB_ACTIVE|$(sudo systemctl is-active ims-performance-manager.service)"
          echo "WORKER_ACTIVE|$(sudo systemctl is-active ims-import-worker.service)"
          echo '--- IMS IMPORT LOGS LAST 90 MIN ---'
          sudo journalctl -u ims-import-worker.service --since '90 minutes ago' --no-pager | grep -Ei '12\.Hafta|week.?12|Tayfun-1_12|error|exception|fail|semantic|sheet|brick|representative|temsilci|alias|validation|rollback' | tail -n 350 || true
          echo '--- WEB IMS LOGS LAST 90 MIN ---'
          sudo journalctl -u ims-performance-manager.service --since '90 minutes ago' --no-pager | grep -Ei '12\.Hafta|Tayfun-1_12|IMS yük|ims import|error|exception|fail|semantic|sheet|brick|representative|temsilci|alias|validation|rollback' | tail -n 250 || true
          echo '--- RECENT UPLOAD RECORDS ---'
          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          from app import create_app
          from app.extensions import db
          app=create_app()
          with app.app_context():
              names=db.inspect(db.engine).get_table_names()
              for t in names:
                  if 'upload' not in t.lower() and 'import' not in t.lower():
                      continue
                  cols=[c['name'] for c in db.inspect(db.engine).get_columns(t)]
                  if not any(c in cols for c in ('filename','file_name','original_filename')):
                      continue
                  print('TABLE|'+t+'|'+','.join(cols))
                  try:
                      rows=db.session.execute(db.text(f'SELECT * FROM "{t}" ORDER BY id DESC LIMIT 8')).mappings().all()
                      for r in rows:
                          s=' | '.join(f'{k}={v}' for k,v in r.items() if k in ('id','filename','file_name','original_filename','status','error','error_message','warning_message','year','month','week','created_at','uploaded_at','completed_at'))
                          print('ROW|'+s)
                  except Exception as e:
                      print('TABLE_READ_ERROR|'+t+'|'+str(e))
          PY
          echo '--- DIAGNOSTIC_COMPLETE ---'
          REMOTE
