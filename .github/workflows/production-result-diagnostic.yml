name: Production Result Failure Diagnostic

on:
  push:
    paths:
      - '.github/workflows/production-result-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_diag_key
          chmod 600 ~/.ssh/ims_diag_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Inspect compact target parser
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_diag_key -p "$IMS_PORT" -o BatchMode=yes "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          import pandas as pd
          from app import create_app
          from app.models import IMSUpload
          from app.services.target_import_service import TargetImportService
          from app.services.ims_upload_lifecycle_service import IMSUploadLifecycleService

          app=create_app()
          with app.app_context():
              latest=IMSUpload.query.filter_by(year=2026,month=3,status='COMPLETED').order_by(IMSUpload.week_number.desc(),IMSUpload.id.desc()).first()
              path=IMSUploadLifecycleService.archived_source_for_upload(latest.id)
              print(f'LATEST|id={latest.id}|week={latest.week_number}|file={latest.file_name}|archive={path}')
              if not path:
                  raise SystemExit('archived source workbook not found')
              wb=pd.read_excel(path,sheet_name=None,header=None)
              svc=TargetImportService(str(path), latest.id, workbook=wb)
              svc.load_workbook()
              for name,df in wb.items():
                  title=' | '.join(str(v) for v in df.iloc[0].tolist() if str(v)!='nan') if len(df) else ''
                  row2=' | '.join(str(v) for v in df.iloc[1].tolist() if str(v)!='nan') if len(df)>1 else ''
                  print(f'SHEET|{name}|shape={df.shape}|compact={int(svc._is_compact_target_layout(df))}|target_sheet={int(svc._is_target_sheet(name,df))}')
                  print(f'ROW1|{name}|{title[:1800]}')
                  print(f'ROW2|{name}|{row2[:1800]}')
                  if len(df)>2:
                      print(f'ROW3|{name}|'+' | '.join(str(v) for v in df.iloc[2].tolist() if str(v)!='nan')[:1800])
          PY
          REMOTE
