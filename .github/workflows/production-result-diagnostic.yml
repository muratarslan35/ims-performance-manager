name: Production Result Failure Diagnostic

on:
  push:
    paths:
      - '.github/workflows/production-result-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_diag_key
          chmod 600 ~/.ssh/ims_diag_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Inspect week11 fact streams
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_diag_key -p "$IMS_PORT" -o BatchMode=yes "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          from app import create_app
          from app.extensions import db
          app=create_app()
          with app.app_context():
              print('FACT_COLS|'+'|'.join(r[1] for r in db.session.execute(db.text('PRAGMA table_info(ims_facts)')).all()))
              rows=db.session.execute(db.text("SELECT report_type,COUNT(*) rows,SUM(COALESCE(unit,0)) unit_sum,SUM(COALESCE(tl,0)) tl_sum FROM ims_facts WHERE upload_id=23 GROUP BY report_type ORDER BY report_type")).mappings().all()
              for r in rows: print(f'FACT_STREAM|report_type={r["report_type"]}|rows={r["rows"]}|unit_sum={r["unit_sum"]}|tl_sum={r["tl_sum"]}')
              raw=db.session.execute(db.text("SELECT sheet_type,source_sheet,COUNT(*) rows,SUM(COALESCE(unit,0)) unit_sum,SUM(COALESCE(tl,0)) tl_sum FROM ims_raw_data WHERE upload_id=23 GROUP BY sheet_type,source_sheet ORDER BY source_sheet,sheet_type")).mappings().all()
              for r in raw: print(f'RAW_STREAM|sheet_type={r["sheet_type"]}|source_sheet={r["source_sheet"]}|rows={r["rows"]}|unit_sum={r["unit_sum"]}|tl_sum={r["tl_sum"]}')
              samples=db.session.execute(db.text("SELECT representative_id,product_id,report_type,unit,tl FROM ims_facts WHERE upload_id=23 AND tl>0 ORDER BY tl DESC LIMIT 20")).mappings().all()
              for r in samples: print('SAMPLE|'+'|'.join(f'{k}={r[k]}' for k in r.keys()))
          PY
          REMOTE
