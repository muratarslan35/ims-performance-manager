name: Production Result Failure Diagnostic

on:
  push:
    paths:
      - '.github/workflows/production-result-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_diag_key
          chmod 600 ~/.ssh/ims_diag_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Audit week13 schema-safe
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_diag_key -p "$IMS_PORT" -o BatchMode=yes "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          from app import create_app
          from app.extensions import db
          app=create_app()
          with app.app_context():
              processing=int(db.session.execute(db.text("SELECT COUNT(*) FROM ims_import_jobs WHERE status='PROCESSING'")).scalar() or 0)
              print(f'PROCESSING_COUNT|{processing}')
              job_cols=[r[1] for r in db.session.execute(db.text('PRAGMA table_info(ims_import_jobs)')).all()]
              print('JOB_COLS|' + ','.join(job_cols))
              wanted=['id','file_name','stored_file_name','status','year','month','week_number','ims_upload_id','queued_at','started_at','completed_at','result_summary']
              sel=[c for c in wanted if c in job_cols]
              latest_job=db.session.execute(db.text('SELECT '+','.join(sel)+' FROM ims_import_jobs ORDER BY id DESC LIMIT 1')).mappings().first()
              print('LATEST_JOB|'+'|'.join(f'{k}={latest_job[k]}' for k in latest_job.keys()))
              uid=int(latest_job.get('ims_upload_id') or 0)
              upload=db.session.execute(db.text('SELECT * FROM ims_uploads WHERE id=:u'),{'u':uid}).mappings().first() if uid else None
              if upload:
                  keep=['id','year','month','week_number','status','reconciliation_status','raw_record_count','fact_record_count','summary_record_count']
                  print('UPLOAD|'+'|'.join(f'{k}={upload.get(k)}' for k in keep if k in upload))
                  raw=db.session.execute(db.text('SELECT COUNT(*) rows,COALESCE(SUM(unit),0) unit,COALESCE(SUM(tl),0) tl FROM ims_raw_data WHERE upload_id=:u'),{'u':uid}).mappings().one()
                  facts=db.session.execute(db.text('SELECT COUNT(*) rows,COALESCE(SUM(unit),0) unit,COALESCE(SUM(tl),0) tl FROM ims_facts WHERE upload_id=:u'),{'u':uid}).mappings().one()
                  summary=db.session.execute(db.text('SELECT COUNT(*) rows,COALESCE(SUM(unit),0) unit,COALESCE(SUM(tl),0) tl FROM ims_summary WHERE upload_id=:u'),{'u':uid}).mappings().one()
                  print(f'RAW|rows={raw["rows"]}|unit={raw["unit"]}|tl={raw["tl"]}')
                  print(f'FACTS|rows={facts["rows"]}|unit={facts["unit"]}|tl={facts["tl"]}')
                  print(f'SUMMARY|rows={summary["rows"]}|unit={summary["unit"]}|tl={summary["tl"]}')
                  sheets=db.session.execute(db.text('SELECT sheet_name,COUNT(*) rows FROM ims_raw_data WHERE upload_id=:u GROUP BY sheet_name ORDER BY sheet_name'),{'u':uid}).mappings().all()
                  print(f'RAW_SHEET_COUNT|{len(sheets)}')
                  for s in sheets: print(f'SHEET|{s["sheet_name"]}|rows={s["rows"]}')
                  rtypes=db.session.execute(db.text('SELECT report_type,COUNT(*) rows,COALESCE(SUM(unit),0) unit,COALESCE(SUM(tl),0) tl FROM ims_facts WHERE upload_id=:u GROUP BY report_type ORDER BY report_type'),{'u':uid}).mappings().all()
                  for r in rtypes: print(f'REPORT_TYPE|{r["report_type"]}|rows={r["rows"]}|unit={r["unit"]}|tl={r["tl"]}')
                  reps=db.session.execute(db.text("SELECT r.rep_name,COALESCE(SUM(s.tl),0) tl,COALESCE(SUM(s.unit),0) unit FROM ims_summary s JOIN representatives r ON r.id=s.representative_id WHERE s.upload_id=:u AND UPPER(COALESCE(r.region,'')) LIKE '%DIYARBAKIR%' GROUP BY r.id,r.rep_name ORDER BY r.rep_name"),{'u':uid}).mappings().all()
                  print(f'DIYARBAKIR_REP_COUNT|{len(reps)}')
                  for r in reps: print(f'DIYARBAKIR_REP|name={r["rep_name"]}|tl={r["tl"]}|unit={r["unit"]}')
              latest=db.session.execute(db.text("SELECT id,week_number,status,reconciliation_status FROM ims_uploads WHERE status='COMPLETED' ORDER BY year DESC,month DESC,week_number DESC,id DESC LIMIT 1")).mappings().first()
              print(f'DASHBOARD_UPLOAD|id={latest["id"]}|week={latest["week_number"]}|status={latest["status"]}|reconciliation={latest["reconciliation_status"]}')
              jm=db.session.execute(db.text('PRAGMA journal_mode')).scalar(); bt=db.session.execute(db.text('PRAGMA busy_timeout')).scalar()
              print(f'SQLITE|journal_mode={jm}|busy_timeout={bt}')
          PY
          REMOTE
