name: Production Result Failure Diagnostic

on:
  push:
    paths:
      - '.github/workflows/production-result-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_diag_key
          chmod 600 ~/.ssh/ims_diag_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Compare all source totals to DB
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_diag_key -p "$IMS_PORT" -o BatchMode=yes "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          from collections import defaultdict
          from decimal import Decimal
          import pandas as pd
          from app import create_app
          from app.extensions import db
          from app.models import IMSUpload, Representative, RepresentativeAlias, Target, IMSSummary, Product
          from app.services.alias_service import AliasService
          from app.services.ims_upload_lifecycle_service import IMSUploadLifecycleService

          app=create_app()
          with app.app_context():
              path=IMSUploadLifecycleService.archived_source_for_upload(29)
              df=pd.read_excel(path,sheet_name='TTS ÇIKIŞLARI',header=None)
              headers=[AliasService.normalize(v) for v in df.iloc[1].tolist()]
              total_cols=[i for i,v in enumerate(headers) if v=='TOPLAM']
              total_col=max(total_cols)
              print(f'LAYOUT|shape={df.shape}|total_cols_0based={total_cols}|selected={total_col}')

              alias_map={}
              for r in Representative.query.all():
                  for label in (r.rep_name,r.rep_code,r.ims_code):
                      if label: alias_map[AliasService.normalize(label)]=r
              for a in RepresentativeAlias.query.all():
                  if a.representative: alias_map[AliasService.normalize(a.alias_name)]=a.representative

              target_rows=Target.query.filter_by(year=2026,month=3).all()
              summary_rows=IMSSummary.query.filter_by(upload_id=29,year=2026,month=3).all()
              targets=defaultdict(Decimal); actuals=defaultdict(Decimal)
              by_product_target={}; by_product_actual={}
              for x in target_rows:
                  targets[int(x.representative_id)]+=Decimal(str(x.tl_target or 0))
                  by_product_target[(int(x.representative_id),int(x.product_id))]=Decimal(str(x.tl_target or 0))
              for x in summary_rows:
                  actuals[int(x.representative_id)]+=Decimal(str(x.tl or 0))
                  by_product_actual[(int(x.representative_id),int(x.product_id))]=Decimal(str(x.tl or 0))

              checked=0; mism=[]; unmatched=[]
              for idx,row in df.iterrows():
                  if idx<2: continue
                  raw=row.iloc[1] if len(row)>1 else None
                  name=AliasService.normalize(raw)
                  if not name or name=='NATIONAL' or (len(name)>4 and name[:3].isdigit() and name[3]==' '): continue
                  rep=alias_map.get(name)
                  if not rep:
                      unmatched.append((idx+1,str(raw))); continue
                  val=row.iloc[total_col] if total_col<len(row) else None
                  try:
                      if pd.isna(val): continue
                      source=Decimal(str(float(val)))
                  except Exception: continue
                  target=targets[int(rep.id)]; actual=actuals[int(rep.id)]
                  dbpct=actual*Decimal('100')/target if target else Decimal('0')
                  checked+=1
                  diff=abs(dbpct-source)
                  if diff>Decimal('0.55'):
                      mism.append((idx+1,rep,source,dbpct,target,actual,diff))
              print(f'FULL_PERCENT_AUDIT|checked={checked}|mismatches={len(mism)}|unmatched_source_names={len(unmatched)}')
              for rownum,rep,source,dbpct,target,actual,diff in mism:
                  print(f'MISMATCH|row={rownum}|id={rep.id}|name={rep.rep_name}|region={rep.region}|source_pct={source}|db_pct={dbpct}|target={target}|actual={actual}|diff={diff}')
                  for p in Product.query.filter_by(is_active=True).all():
                      t=by_product_target.get((int(rep.id),int(p.id)),Decimal('0')); a=by_product_actual.get((int(rep.id),int(p.id)),Decimal('0'))
                      pp=a*Decimal('100')/t if t else Decimal('0')
                      print(f'PRODUCT|rep={rep.rep_name}|product={p.product_name}|target={t}|actual={a}|pct={pp}')
              for rownum,name in unmatched[:30]: print(f'UNMATCHED_SOURCE|row={rownum}|name={name}')
              print(f'KEY_COVERAGE|target={len(by_product_target)}|summary={len(by_product_actual)}|missing={len(set(by_product_target)-set(by_product_actual))}|extra={len(set(by_product_actual)-set(by_product_target))}')
              processing=int(db.session.execute(db.text("SELECT COUNT(*) FROM ims_import_jobs WHERE status='PROCESSING'")).scalar() or 0)
              journal=db.session.execute(db.text('PRAGMA journal_mode')).scalar(); busy=db.session.execute(db.text('PRAGMA busy_timeout')).scalar()
              print(f'RUNTIME|processing={processing}|journal={journal}|busy_timeout={busy}')
          PY
          REMOTE
