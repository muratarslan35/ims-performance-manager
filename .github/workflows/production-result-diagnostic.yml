name: Production Result Failure Diagnostic

on:
  push:
    paths:
      - '.github/workflows/production-result-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_diag_key
          chmod 600 ~/.ssh/ims_diag_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Audit week 12 IMS import and week 11 replacement
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_diag_key -p "$IMS_PORT" -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          echo "WEB_ACTIVE|$(sudo systemctl is-active ims-performance-manager.service)"
          echo "WORKER_ACTIVE|$(sudo systemctl is-active ims-import-worker.service)"
          echo '--- RECENT IMS LOGS ---'
          sudo journalctl -u ims-import-worker.service --since '60 minutes ago' --no-pager | grep -Ei '12\.Hafta|11\.Hafta|TTS ÇIKIŞLARI|BRICK SATIŞLARI|completed|failed|reconciliation|sheet|row' | tail -n 250 || true
          echo '--- DB WEEK AUDIT ---'
          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          from app import create_app
          from app.extensions import db
          app=create_app()
          with app.app_context():
              insp=db.inspect(db.engine)
              for t in ('ims_uploads','ims_raw_data','ims_facts','ims_summary'):
                  cols=[c['name'] for c in insp.get_columns(t)]
                  print('COLS|'+t+'|'+','.join(cols))
              ups=db.session.execute(db.text('SELECT * FROM ims_uploads ORDER BY id DESC LIMIT 6')).mappings().all()
              for r in ups:
                  print('UPLOAD|'+'|'.join(f'{k}={v}' for k,v in r.items() if k in ('id','filename','original_filename','status','week','year','month','row_count','records_count','error_message','warning_message','uploaded_at','completed_at')))
              # Discover period/source columns and report counts for recent upload ids without mutating data.
              recent=[int(r['id']) for r in ups if r.get('id') is not None]
              for t in ('ims_raw_data','ims_facts','ims_summary'):
                  cols=[c['name'] for c in insp.get_columns(t)]
                  upload_col=next((c for c in ('upload_id','ims_upload_id','source_upload_id') if c in cols),None)
                  if upload_col:
                      for uid in recent[:4]:
                          n=db.session.execute(db.text(f'SELECT COUNT(*) FROM {t} WHERE {upload_col}=:u'),{'u':uid}).scalar()
                          print(f'COUNT|table={t}|upload={uid}|rows={n}')
              # Compare aggregate numeric values by week where week column exists.
              for t in ('ims_raw_data','ims_facts','ims_summary'):
                  cols=[c['name'] for c in insp.get_columns(t)]
                  if 'week' not in cols: continue
                  nums=[c for c in ('quantity','units','unit','box','boxes','sales_quantity','amount','sales_amount','tl','value') if c in cols]
                  for w in (11,12):
                      n=db.session.execute(db.text(f'SELECT COUNT(*) FROM {t} WHERE week=:w'),{'w':w}).scalar()
                      parts=[f'rows={n}']
                      for c in nums[:4]:
                          try:
                              v=db.session.execute(db.text(f'SELECT SUM(CAST({c} AS REAL)) FROM {t} WHERE week=:w'),{'w':w}).scalar()
                              parts.append(f'{c}_sum={v}')
                          except Exception: pass
                      print(f'WEEK|table={t}|week={w}|'+'|'.join(parts))
          PY
          echo '--- DIAGNOSTIC_COMPLETE ---'
          REMOTE
