name: Production Result Failure Diagnostic

on:
  push:
    paths:
      - '.github/workflows/production-result-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_diag_key
          chmod 600 ~/.ssh/ims_diag_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Read live status
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_diag_key -p "$IMS_PORT" -o BatchMode=yes "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          systemctl is-active ims-performance-manager.service | sed 's/^/WEB_ACTIVE|/'
          systemctl is-active ims-import-worker.service | sed 's/^/WORKER_ACTIVE|/' || true
          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          from app import create_app
          from app.extensions import db
          app=create_app()
          with app.app_context():
              processing=db.session.execute(db.text("SELECT COUNT(*) FROM ims_import_jobs WHERE status='PROCESSING'")).scalar() or 0
              latest=db.session.execute(db.text("SELECT id,status,ims_upload_id FROM ims_import_jobs ORDER BY id DESC LIMIT 1")).mappings().first()
              print(f'PROCESSING_COUNT|{int(processing)}')
              if latest:
                  print(f'LATEST_JOB|id={latest["id"]}|status={latest["status"]}|upload_id={latest["ims_upload_id"]}')
              jm=db.session.execute(db.text('PRAGMA journal_mode')).scalar()
              bt=db.session.execute(db.text('PRAGMA busy_timeout')).scalar()
              print(f'SQLITE|journal_mode={jm}|busy_timeout={bt}')
          PY
          REMOTE
