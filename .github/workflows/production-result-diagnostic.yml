name: Production Result Failure Diagnostic

on:
  push:
    paths:
      - '.github/workflows/production-result-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_diag_key
          chmod 600 ~/.ssh/ims_diag_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Read production result failure evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_diag_key -p "$IMS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          echo "WEB_ACTIVE|$(sudo systemctl is-active ims-performance-manager.service)"
          echo "WORKER_ACTIVE|$(sudo systemctl is-active ims-import-worker.service)"
          venv/bin/python - <<'PY'
          from app import create_app
          from app.extensions import db
          import os
          from openpyxl import load_workbook
          from app.models import IMSRawData, IMSUpload, Product, Representative, Target
          from app.services.alias_service import AliasService
          from app.services.official_aggregate_service import OfficialAggregateService, TARGET_TYPE
          from app.services.production_result_service import ProductionResultService
          from app.services.region_balance_unit_service import region_balance_units
          from app.services.region_performance_service import RegionPerformanceService

          app = create_app()
          with app.app_context():
              uploads = IMSUpload.query.filter_by(year=2026, month=4, status="COMPLETED").order_by(
                  IMSUpload.week_number.desc(), IMSUpload.completed_at.desc(), IMSUpload.id.desc()
              ).limit(5).all()
              print(f"APRIL_IMS_MATCH_COUNT|{len(uploads)}")
              for item in uploads:
                  print(f"APRIL_IMS|id={item.id}|week={item.week_number}|file={item.file_name}|completed={item.completed_at}")

              service = RegionPerformanceService("901", 2026, 4)
              report = service.aggregate([(2026, 4)])
              balances_upload_id = OfficialAggregateService.latest_upload_id(2026, 4, TARGET_TYPE)
              balances = region_balance_units(balances_upload_id, "901") if balances_upload_id else {}
              quota_months = ProductionResultService.quota_product_months([(2026, 4)])
              final_production = ProductionResultService.final_upload(2026, 4)
              print(
                  f"DIYARBAKIR_SOURCE|target_upload_id={balances_upload_id}|"
                  f"production_upload_id={getattr(final_production, 'id', None)}|rep_count={len(service.rep_ids)}"
              )
              products = {item.id: item for item in Product.query.all()}
              for row in report["products"]:
                  product_id = int(row["product_id"])
                  print(
                      "DIYARBAKIR_PRODUCT|"
                      f"product={row['product_name']}|target_tl={row['target_tl']}|actual_tl={row['actual_tl']}|"
                      f"realization={row['realization_percent']}|target_unit={row['target_unit']}|"
                      f"actual_unit={row['actual_unit']}|unit_difference={row['unit_difference']}|"
                      f"mf_siz_balance={balances.get(product_id)}|unit_complete={row['unit_complete']}|"
                      f"quota_exit={row['quota_exit']}|quota_months={row['quota_exit_months']}"
                  )
              product_ids = [
                  product_id for product_id, item in products.items()
                  if item.product_name in {"Stiderm", "Brimoder", "Fentivag"}
              ]
              source_rows = IMSRawData.query.filter(
                  IMSRawData.upload_id == balances_upload_id,
                  IMSRawData.sheet_type == "dashboard_balance_region",
                  IMSRawData.territory == "901",
                  IMSRawData.product_id.in_(product_ids),
              ).order_by(IMSRawData.product_id.asc(), IMSRawData.source_row.asc()).all()
              for item in source_rows:
                  print(
                      "DIYARBAKIR_RAW_BALANCE|"
                      f"product={products[item.product_id].product_name}|sheet={item.sheet_name}|"
                      f"row={item.source_row}|unit={item.unit}|tl={item.tl}|raw={item.raw_json}"
                  )
              target_rows = Target.query.filter(
                  Target.year == 2026,
                  Target.month == 4,
                  Target.representative_id.in_(service.rep_ids),
                  Target.product_id.in_(product_ids),
              ).order_by(Target.product_id.asc(), Target.representative_id.asc()).all()
              for item in target_rows:
                  print(
                      "DIYARBAKIR_PERSON_TARGET|"
                      f"product={products[item.product_id].product_name}|"
                      f"representative={item.representative.rep_name}|unit_target={item.unit_target}|tl_target={item.tl_target}"
                  )

              archive = os.path.join(app.config["UPLOAD_FOLDER"], "ims_archive", f"upload-{balances_upload_id}.xlsx")
              workbook = load_workbook(archive, read_only=True, data_only=True)
              try:
                  sheet = next(ws for ws in workbook.worksheets if "BAKIYE" in AliasService.normalize(ws.title))
                  wanted = {"STIDERM", "BRIMODER", "FENTIVAG"}
                  for column in range(1, sheet.max_column + 1):
                      headers = [sheet.cell(row, column).value for row in range(1, min(12, sheet.max_row) + 1)]
                      normalized = " | ".join(AliasService.normalize(value) for value in headers if value is not None)
                      if not any(name in normalized for name in wanted):
                          continue
                      for row in range(13, sheet.max_row + 1):
                          left, right = sheet.cell(row, 1).value, sheet.cell(row, 2).value
                          digits = "".join(ch for ch in str(left or "") if ch.isdigit())[:3]
                          if digits == "901" and AliasService.normalize(left) == AliasService.normalize(right):
                              print(
                                  "DIYARBAKIR_ARCHIVE_CELL|"
                                  f"sheet={sheet.title}|row={row}|column={column}|headers={headers}|"
                                  f"left={left}|right={right}|value={sheet.cell(row, column).value}"
                              )
              finally:
                  workbook.close()
          PY
          echo '--- WEB LOG WINDOW 13:10-13:18 UTC ---'
          sudo journalctl -u ims-performance-manager.service \
            --since '2026-08-30 13:10:00 UTC' --until '2026-08-30 13:18:30 UTC' \
            --no-pager | tail -n 200 || true
          echo '--- DIAGNOSTIC_COMPLETE ---'
          REMOTE
