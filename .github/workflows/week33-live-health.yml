name: Week 33 Live Health

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/week33-live-health.yml

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Verify login, active Week 32, and cleanup state
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" -o BatchMode=yes \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          code=$(curl --max-time 20 --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/login)
          test "$code" = 200
          echo "LOGIN_HEALTH|PASS|http=$code"
          cd "$IMS_PATH"
          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          from app import create_app
          from app.extensions import db
          from app.models import IMSUpload
          from app.services.ims_upload_lifecycle_service import IMSUploadLifecycleService
          from app.services.period_service import PeriodService
          from config import Config
          app = create_app(Config)
          with app.app_context():
              period = PeriodService.get_active_period()
              assert int(period.get('upload_id') or 0) == 45, period
              assert int(period.get('week_number') or 0) == 32, period
              upload = db.session.get(IMSUpload, 45)
              wrong = db.session.get(IMSUpload, 46)
              allowed, reason = IMSUploadLifecycleService.can_rollback(upload)
              print("ACTIVE_IMS|PASS|upload=45|week=32")
              print(f"UPLOAD_46|exists={int(wrong is not None)}|status={getattr(wrong, 'status', 'DELETED')}")
              print(f"ROLLBACK_BUTTON|allowed={int(allowed)}|reason={reason}")
          PY
          REMOTE
