name: Week 33 Live Health and Import Diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/week33-live-health.yml

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Verify login, active Week 32, and cleanup state
        run: |
          set -Eeuo pipefail
          {
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" -o BatchMode=yes \
            "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          code=$(curl --max-time 20 --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/login)
          test "$code" = 200
          echo "LOGIN_HEALTH|PASS|http=$code"
          cd "$IMS_PATH"
          PYTHONPATH="$IMS_PATH" venv/bin/python - <<'PY'
          from app import create_app
          from app.extensions import db
          from app.models import IMSImportJob, IMSUpload
          from app.services.ims_upload_lifecycle_service import IMSUploadLifecycleService
          from app.services.period_service import PeriodService
          from config import Config
          app = create_app(Config)
          with app.app_context():
              period = PeriodService.get_active_period()
              assert int(period.get('upload_id') or 0) == 45, period
              assert int(period.get('week_number') or 0) == 32, period
              upload = db.session.get(IMSUpload, 45)
              allowed, reason = IMSUploadLifecycleService.can_rollback(upload)
              print(f"ACTIVE_IMS|PASS|upload=45|week=32")
              print(f"ROLLBACK_BUTTON|allowed={int(allowed)}|reason={reason}")
              latest_job = IMSImportJob.query.order_by(IMSImportJob.id.desc()).first()
              latest_upload = IMSUpload.query.order_by(IMSUpload.id.desc()).first()
              print(
                  "LATEST_JOB|id=%s|status=%s|file=%s|stored=%s|upload=%s|error=%s"
                  % (
                      latest_job.id, latest_job.status, latest_job.file_name,
                      latest_job.stored_file_name, latest_job.ims_upload_id,
                      latest_job.error_message,
                  )
              )
              print(
                  "LATEST_UPLOAD|id=%s|status=%s|file=%s|week=%s|sheets=%s|error=%s"
                  % (
                      latest_upload.id, latest_upload.status, latest_upload.file_name,
                      latest_upload.week_number, latest_upload.sheet_count,
                      latest_upload.error_message,
                  )
              )
              source = IMSUploadLifecycleService.failed_source_for_job(latest_job.id)
              print(f"FAILED_SOURCE|path={source}|exists={int(bool(source and source.exists()))}|size={source.stat().st_size if source and source.exists() else 0}")
              if source and source.exists():
                  import pandas as pd
                  from app.services.kpi_workbook_compat import _find_matrix, _matrix_plan, _norm
                  workbook = pd.read_excel(source, sheet_name=None, header=None)
                  print("SHEETS|" + " || ".join(workbook.keys()))
                  for metric in ("tl", "unit"):
                      name, frame = _find_matrix(workbook, metric)
                      try:
                          plan = _matrix_plan(frame, metric) if frame is not None else None
                          print(f"MATRIX|metric={metric}|sheet={name}|plan={plan}")
                      except Exception as exc:
                          rows = []
                          for row_index in range(min(12, len(frame))):
                              values = [_norm(value) for value in frame.iloc[row_index].tolist()]
                              rows.append(f"r{row_index + 1}=" + "|".join(value for value in values if value)[:1200])
                          print(f"MATRIX_ERROR|metric={metric}|sheet={name}|error={exc}|headers={' // '.join(rows)}")
          PY
          REMOTE
          } 2>&1 | tee /tmp/ims-header-diagnostic.txt

      - name: Publish header diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ims-header-diagnostic
          path: /tmp/ims-header-diagnostic.txt
          retention-days: 1
