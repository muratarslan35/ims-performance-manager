name: Validate and Deploy IMS Performance Manager

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ims-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: testing
      SECRET_KEY: ci-test-secret-not-for-production
      DATABASE_URL: sqlite:////tmp/ims-ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest
      - run: python -m pytest tests/ -v
      - name: Projected 50-upload SQLite scale probe
        run: >-
          python scripts/sqlite_scale_probe.py
          --uploads 50
          --competition-per-upload 100000
          --raw-per-upload 28091
          --facts-per-upload 3164
          --max-query-seconds 3.0

  deploy:
    name: Deploy and verify production
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy, migrate and verify production
        id: production
        continue-on-error: true
        shell: bash
        run: |
          set +e
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$IMS_USER@$IMS_HOST" \
            "IMS_PATH='$IMS_PATH' bash -se" 2>&1 <<'REMOTE' | tee "$RUNNER_TEMP/ims-deploy.log"
          set -Eeuo pipefail
          cd "$IMS_PATH"
          git fetch origin main
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain)"
          git pull --ff-only origin main
          venv/bin/python -m pip install -r requirements.txt

          mkdir -p instance/backups
          stamp=$(date +%Y%m%d-%H%M%S)
          if [ -f instance/ipm.db ]; then
            venv/bin/python sqlite_online_backup.py \
              instance/ipm.db "instance/backups/ipm-predeploy-${stamp}.db"
          fi
          if [ -f instance/persistent/users.db ]; then
            venv/bin/python sqlite_online_backup.py \
              instance/persistent/users.db "instance/backups/users-predeploy-${stamp}.db"
          fi

          echo '--- MASTER SNAPSHOT BEFORE MIGRATION ---'
          venv/bin/python production_master_snapshot.py
          venv/bin/python -m flask --app run.py db upgrade
          repair_backup="instance/backups/ipm-pre-competition-backfill-${stamp}.db"
          venv/bin/python sqlite_online_backup.py instance/ipm.db "$repair_backup"
          venv/bin/python backfill_competition_data.py
          venv/bin/python verify_runtime.py
          venv/bin/python production_target_audit.py
          echo '--- MASTER SNAPSHOT AFTER MIGRATION ---'
          venv/bin/python production_master_snapshot.py

          venv/bin/python - <<'PY'
          import sqlite3
          connection = sqlite3.connect('instance/ipm.db', timeout=30)
          try:
              mode = connection.execute('PRAGMA journal_mode').fetchone()[0]
              timeout = connection.execute('PRAGMA busy_timeout').fetchone()[0]
              integrity = connection.execute('PRAGMA integrity_check').fetchone()[0]
          finally:
              connection.close()
          print(f'SQLITE_RUNTIME|journal_mode={mode}|busy_timeout={timeout}|integrity={integrity}')
          if str(mode).lower() != 'wal' or str(integrity).lower() != 'ok':
              raise SystemExit('SQLite production runtime verification failed')
          PY

          echo '--- PROJECTED DATABASE CAPACITY GATE ---'
          venv/bin/python database_capacity_audit.py \
            --database instance/ipm.db \
            --additional-uploads 49 \
            --optimize

          echo '--- REPRESENTATIVE READ PERFORMANCE GATE ---'
          venv/bin/python verify_representative_performance.py

          echo '--- ISOLATED IMS ACCEPTANCE / FINGERPRINT ---'
          acceptance_db="/tmp/ims-acceptance-${stamp}.db"
          cleanup_acceptance() { rm -f "$acceptance_db" "$acceptance_db-wal" "$acceptance_db-shm"; }
          trap cleanup_acceptance EXIT
          venv/bin/python sqlite_online_backup.py instance/ipm.db "$acceptance_db"
          DATABASE_URL="sqlite:///$acceptance_db" \
            venv/bin/python verify_ims_acceptance.py
          DATABASE_URL="sqlite:///$acceptance_db" \
            venv/bin/python verify_ims_acceptance_extras.py
          cleanup_acceptance
          trap - EXIT

          echo '--- PRODUCTION CAPACITY SNAPSHOT ---'
          echo "CPU_COUNT=$(nproc)"
          free -m
          df -h instance

          # Acceptance has passed at this point. Only now may the managed
          # production service be restarted.
          bash deploy/install_systemd_service.sh "$IMS_PATH"
          health_ok=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8000/login >/dev/null; then
              echo "Production health check passed."
              health_ok=1
              break
            fi
            sleep 2
          done
          if [ "$health_ok" != "1" ]; then
            echo "Production health check failed."
            sudo journalctl -u ims-performance-manager.service -n 100 --no-pager || true
            exit 1
          fi

          # The release is healthy and the fresh rollback set has been
          # integrity-checked. Enforce one rollback set in this managed backup
          # directory, including removal of historical manual/repair DB copies.
          echo '--- BACKUP RETENTION ---'
          venv/bin/python cleanup_old_backups.py \
            --backup-dir instance/backups \
            --keep-stamp "$stamp" \
            --purge-unmanaged-db
          echo '--- PRODUCTION CAPACITY AFTER RETENTION ---'
          df -h instance
          exit 0
          REMOTE
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish persistent deployment evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_EXIT: ${{ steps.production.outputs.exit_code }}
          CONFIGURE_OUTCOME: ${{ steps.production.outcome }}
        run: |
          status="SUCCESS"
          if [ "${DEPLOY_EXIT:-1}" != "0" ]; then status="FAILED"; fi
          evidence_file="$RUNNER_TEMP/ims-deploy.log"
          if [ -f "$evidence_file" ]; then
            evidence=$(grep -E 'IMS_ACCEPTANCE\||IMS_ACCEPTANCE_EXTRA\||SQLITE_RUNTIME\||DB_CAPACITY\||REPRESENTATIVE_PERFORMANCE\||BACKUP_RETENTION\||Production health check|PRODUCTION CAPACITY|PROJECTED DATABASE CAPACITY|CPU_COUNT|MASTER_SNAPSHOT|TARGET_AUDIT|RUNTIME' "$evidence_file" | tail -n 180 || true)
          else
            evidence="Production SSH/deploy log was not created."
          fi
          body=$(jq -n \
            --arg title "IMS production deployment ${status}" \
            --arg sha "$GITHUB_SHA" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg status "$status" \
            --arg evidence "$evidence" \
            '{title:$title, body:("Commit: `"+$sha+"`\n\nWorkflow: "+$run+"\n\nResult: **"+$status+"**\n\n```text\n"+$evidence+"\n```") }')
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues" \
            -d "$body"

      - name: Enforce production deployment result
        if: always()
        shell: bash
        env:
          DEPLOY_EXIT: ${{ steps.production.outputs.exit_code }}
        run: |
          test "${DEPLOY_EXIT:-1}" = "0"
