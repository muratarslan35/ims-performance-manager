name: Validate and Deploy IMS Performance Manager

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ims-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: testing
      SECRET_KEY: ci-test-secret-not-for-production
      DATABASE_URL: sqlite:////tmp/ims-ci.db
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest

      - name: Run every pytest test
        run: python -m pytest tests/ -v

  deploy:
    name: Deploy and verify production
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy, migrate and verify production
        shell: bash
        run: |
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" \
            "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"

          git fetch origin main
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain)"
          git pull --ff-only origin main

          venv/bin/python -m pip install -r requirements.txt

          mkdir -p instance/backups
          if [ -f instance/ipm.db ]; then
            cp instance/ipm.db "instance/backups/ipm-predeploy-$(date +%Y%m%d-%H%M%S).db"
          fi
          if [ -f instance/persistent/users.db ]; then
            cp instance/persistent/users.db "instance/backups/users-predeploy-$(date +%Y%m%d-%H%M%S).db"
          fi

          venv/bin/python -m flask --app run.py db upgrade
          repair_backup="instance/backups/ipm-pre-competition-backfill-$(date +%Y%m%d-%H%M%S).db"
          cp instance/ipm.db "$repair_backup"
          echo "Competition backfill backup created: $repair_backup"
          venv/bin/python backfill_competition_data.py
          venv/bin/python verify_runtime.py
          venv/bin/python production_target_audit.py

          pids=$(ss -ltnp | sed -n 's/.*:8000.*pid=\([0-9]*\).*/\1/p' | head -1)
          if [ -n "$pids" ]; then
            kill "$pids"
          fi

          nohup venv/bin/python run.py >/tmp/ims-performance-manager.log 2>&1 </dev/null &

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8000/login >/dev/null; then
              echo "Production health check passed."
              exit 0
            fi
            sleep 2
          done

          echo "Production health check failed."
          tail -n 100 /tmp/ims-performance-manager.log || true
          exit 1
          REMOTE
