name: Validate and Deploy IMS Performance Manager

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "PROJECT_WORK_PROGRESS.md"
      - "CODEX_HANDOFF_CURRENT.md"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ims-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify release change
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      requirements_changed: ${{ steps.classify.outputs.requirements_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect change class
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            changed=".github/workflows/deploy.yml"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            changed="$(git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA")"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            changed="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")"
          else
            changed="$(git show --pretty='' --name-only "$HEAD_SHA")"
          fi

          mode="docs"
          requirements_changed="false"
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            echo "CHANGE|$file"
            [ "$file" = "requirements.txt" ] && requirements_changed="true"
            case "$file" in
              PROJECT_WORK_PROGRESS.md|CODEX_HANDOFF_CURRENT.md|docs/*|*.md)
                ;;
              app/templates/*|app/static/*)
                [ "$mode" = "docs" ] && mode="ui"
                ;;
              .github/workflows/deploy.yml|app/ims.py|app/models.py|app/services/ims_import_service.py|app/services/*import*|app/services/aggregate_identity*|app/services/competition*|app/services/import_result_report.py|migrations/*|backfill_competition_data.py|verify_ims_acceptance.py|verify_ims_acceptance_extras.py|database_capacity_audit.py|scripts/sqlite_scale_probe.py|benchmark_ims_import.py|config.py)
                mode="heavy"
                ;;
              *)
                if [ "$mode" != "heavy" ]; then mode="backend"; fi
                ;;
            esac
          done <<< "$changed"
          echo "RELEASE_CLASS|mode=$mode|requirements_changed=$requirements_changed"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "requirements_changed=$requirements_changed" >> "$GITHUB_OUTPUT"

  pr_test:
    name: PR validation (${{ needs.classify.outputs.mode }})
    needs: classify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APP_ENV: testing
      SECRET_KEY: ci-test-secret-not-for-production
      DATABASE_URL: sqlite:////tmp/ims-ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: needs.classify.outputs.mode != 'docs'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        if: needs.classify.outputs.mode != 'docs'
        run: python -m pip install -q -r requirements.txt pytest
      - name: UI smoke tests
        if: needs.classify.outputs.mode == 'ui'
        run: |
          python -m compileall -q app
          python -m pytest -q tests/test_auth_routes.py tests/test_dashboard_cache.py tests/test_gunicorn_config.py
      - name: Backend full suite
        if: needs.classify.outputs.mode == 'backend'
        run: python -m pytest -q tests/
      - name: Import/DB full suite
        if: needs.classify.outputs.mode == 'heavy'
        run: python -m pytest -q tests/
      - name: Heavy 50-upload scale probe
        if: needs.classify.outputs.mode == 'heavy'
        run: >-
          python scripts/sqlite_scale_probe.py
          --uploads 50
          --competition-per-upload 100000
          --raw-per-upload 28091
          --facts-per-upload 3164
          --max-query-seconds 3.0
      - name: Docs-only validation
        if: needs.classify.outputs.mode == 'docs'
        run: echo 'Docs-only change; runtime tests skipped.'

  main_smoke:
    name: Main smoke (${{ needs.classify.outputs.mode }})
    needs: classify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.classify.outputs.mode != 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      APP_ENV: testing
      SECRET_KEY: ci-test-secret-not-for-production
      DATABASE_URL: sqlite:////tmp/ims-main-smoke.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: UI syntax smoke
        if: needs.classify.outputs.mode == 'ui'
        run: python -m compileall -q app
      - name: Backend/import smoke dependencies
        if: needs.classify.outputs.mode != 'ui'
        run: python -m pip install -q -r requirements.txt pytest
      - name: Backend smoke
        if: needs.classify.outputs.mode == 'backend'
        run: python -m pytest -q tests/test_auth_routes.py tests/test_dashboard_cache.py tests/test_gunicorn_config.py tests/test_query_indexes.py
      - name: Import/DB smoke
        if: needs.classify.outputs.mode == 'heavy'
        run: python -m pytest -q tests/test_dynamic_import_contract.py tests/test_ims_import_service.py tests/test_dynamic_aggregate_identity.py tests/test_gunicorn_config.py

  deploy:
    name: Deploy production (${{ needs.classify.outputs.mode }})
    needs: [classify, main_smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.classify.outputs.mode != 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
      RELEASE_MODE: ${{ needs.classify.outputs.mode }}
      REQUIREMENTS_CHANGED: ${{ needs.classify.outputs.requirements_changed }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Change-aware production deploy
        id: production
        continue-on-error: true
        shell: bash
        run: |
          set +e
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$IMS_USER@$IMS_HOST" \
            "IMS_PATH='$IMS_PATH' RELEASE_MODE='$RELEASE_MODE' REQUIREMENTS_CHANGED='$REQUIREMENTS_CHANGED' bash -se" \
            2>&1 <<'REMOTE' | tee "$RUNNER_TEMP/ims-deploy.log"
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "RELEASE_MODE|$RELEASE_MODE"
          git fetch origin main
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain)"
          git pull --ff-only origin main

          if [ "$REQUIREMENTS_CHANGED" = "true" ]; then
            venv/bin/python -m pip install -q -r requirements.txt
          fi

          sqlite_check() {
            venv/bin/python - <<'PY'
          import sqlite3
          connection = sqlite3.connect('instance/ipm.db', timeout=30)
          try:
              mode = connection.execute('PRAGMA journal_mode').fetchone()[0]
              timeout = connection.execute('PRAGMA busy_timeout').fetchone()[0]
              integrity = connection.execute('PRAGMA integrity_check').fetchone()[0]
          finally:
              connection.close()
          print(f'SQLITE_RUNTIME|journal_mode={mode}|busy_timeout={timeout}|integrity={integrity}')
          if str(mode).lower() != 'wal' or str(integrity).lower() != 'ok':
              raise SystemExit('SQLite production runtime verification failed')
          PY
          }

          if [ "$RELEASE_MODE" = "heavy" ]; then
            echo '--- HEAVY IMS/DB RELEASE GATES ---'
            mkdir -p instance/backups
            stamp=$(date +%Y%m%d-%H%M%S)
            venv/bin/python sqlite_online_backup.py instance/ipm.db "instance/backups/ipm-predeploy-${stamp}.db"
            if [ -f instance/persistent/users.db ]; then
              venv/bin/python sqlite_online_backup.py instance/persistent/users.db "instance/backups/users-predeploy-${stamp}.db"
            fi
            venv/bin/python production_master_snapshot.py
            venv/bin/python -m flask --app run.py db upgrade
            venv/bin/python backfill_competition_data.py
            venv/bin/python verify_runtime.py
            venv/bin/python production_target_audit.py
            sqlite_check
            venv/bin/python database_capacity_audit.py --database instance/ipm.db --additional-uploads 49 --optimize
            venv/bin/python verify_representative_performance.py

            acceptance_db="/tmp/ims-acceptance-${stamp}.db"
            cleanup_acceptance() { rm -f -- "$acceptance_db" "$acceptance_db-wal" "$acceptance_db-shm"; }
            trap cleanup_acceptance EXIT HUP INT TERM
            venv/bin/python sqlite_online_backup.py instance/ipm.db "$acceptance_db"
            chmod 600 "$acceptance_db"
            timeout --signal=TERM --kill-after=30s 900s env DATABASE_URL="sqlite:///$acceptance_db" venv/bin/python verify_ims_acceptance.py
            timeout --signal=TERM --kill-after=30s 900s env DATABASE_URL="sqlite:///$acceptance_db" venv/bin/python verify_ims_acceptance_extras.py
            cleanup_acceptance
            trap - EXIT HUP INT TERM
            venv/bin/python production_resource_gate.py --database instance/ipm.db --acceptance-seconds 0
          elif [ "$RELEASE_MODE" = "backend" ]; then
            echo '--- FAST BACKEND RELEASE GATES ---'
            venv/bin/python verify_runtime.py
            sqlite_check
          else
            echo '--- FAST UI RELEASE: DB/IMS GATES SKIPPED ---'
          fi

          bash deploy/install_systemd_service.sh "$IMS_PATH"
          health_ok=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 4 http://127.0.0.1:8000/login >/dev/null; then
              echo 'Production health check passed.'
              health_ok=1
              break
            fi
            sleep 1
          done
          if [ "$health_ok" != "1" ]; then
            sudo journalctl -u ims-performance-manager.service -n 80 --no-pager || true
            exit 1
          fi

          if [ "$RELEASE_MODE" = "heavy" ]; then
            venv/bin/python cleanup_old_backups.py --backup-dir instance/backups --keep-stamp "$stamp" --purge-unmanaged-db
          fi
          REMOTE
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish compact deployment evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_EXIT: ${{ steps.production.outputs.exit_code }}
        run: |
          status="SUCCESS"
          if [ "${DEPLOY_EXIT:-1}" != "0" ]; then status="FAILED"; fi
          evidence_file="$RUNNER_TEMP/ims-deploy.log"
          evidence=$(grep -E 'RELEASE_MODE\||IMS_ACCEPTANCE\||IMS_ACCEPTANCE_EXTRA\||SQLITE_RUNTIME\||Production health check|DB_CAPACITY\||PRODUCTION_RESOURCE\||REPRESENTATIVE_PERFORMANCE\|' "$evidence_file" | tail -n 100 || true)
          body=$(jq -n --arg sha "$GITHUB_SHA" --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --arg status "$status" --arg mode "$RELEASE_MODE" --arg evidence "$evidence" '{title:("IMS production deployment "+$status+" ["+$mode+"]"),body:("Commit: `"+$sha+"`\n\nWorkflow: "+$run+"\n\nMode: **"+$mode+"**\n\n```text\n"+$evidence+"\n```") }')
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues" -d "$body"

      - name: Enforce production deployment result
        if: always()
        shell: bash
        env:
          DEPLOY_EXIT: ${{ steps.production.outputs.exit_code }}
        run: test "${DEPLOY_EXIT:-1}" = "0"
