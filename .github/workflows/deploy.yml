name: Validate and Deploy IMS Performance Manager

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "PROJECT_WORK_PROGRESS.md"
      - "CODEX_HANDOFF_CURRENT.md"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ims-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify release change
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      requirements_changed: ${{ steps.classify.outputs.requirements_changed }}
      performance_changed: ${{ steps.classify.outputs.performance_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect change class
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            changed=".github/workflows/deploy.yml"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            changed="$(git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA")"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            changed="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")"
          else
            changed="$(git show --pretty='' --name-only "$HEAD_SHA")"
          fi

          mode="docs"
          requirements_changed="false"
          performance_changed="false"
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            echo "CHANGE|$file"
            [ "$file" = "requirements.txt" ] && requirements_changed="true"

            case "$file" in
              app/representatives.py|app/services/representative*|app/services/region_market_service.py|app/services/ai_analytics_service.py|app/services/actual_sales_resolution_service.py|app/services/*market*)
                performance_changed="true"
                ;;
            esac

            case "$file" in
              PROJECT_WORK_PROGRESS.md|CODEX_HANDOFF_CURRENT.md|docs/*|*.md)
                ;;
              .github/workflows/deploy.yml|.github/workflows/ims-production-maintenance.yml|scripts/run_production_maintenance.sh|tests/*)
                if [ "$mode" = "docs" ]; then mode="ops"; fi
                ;;
              app/templates/*|app/static/*)
                if [ "$mode" = "docs" ] || [ "$mode" = "ops" ]; then mode="ui"; fi
                ;;
              deploy/*|migrations/*|app/models.py|sqlite_online_backup.py|cleanup_old_backups.py|database_capacity_audit.py|scripts/sqlite_scale_probe.py|config.py|requirements.txt)
                mode="heavy"
                ;;
              verify_live_ims_gate.py|app/ims.py|ims_import_worker.py|app/services/ims_import_service.py|app/services/*import*|app/services/aggregate_identity*|app/services/competition*|app/services/workbook_preflight.py|app/services/official_brick_spread_service.py|app/services/official_aggregate_service.py|app/services/target_import_service.py|app/services/import_result_report.py|app/services/alias_service.py|app/services/vacancy_matching.py)
                if [ "$mode" != "heavy" ]; then mode="import"; fi
                ;;
              *)
                if [ "$mode" != "heavy" ] && [ "$mode" != "import" ]; then mode="backend"; fi
                ;;
            esac
          done <<< "$changed"

          echo "RELEASE_CLASS|mode=$mode|requirements_changed=$requirements_changed|performance_changed=$performance_changed"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "requirements_changed=$requirements_changed" >> "$GITHUB_OUTPUT"
          echo "performance_changed=$performance_changed" >> "$GITHUB_OUTPUT"

  pr_test:
    name: PR validation (${{ needs.classify.outputs.mode }})
    needs: classify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APP_ENV: testing
      SECRET_KEY: ci-test-secret-not-for-production
      DATABASE_URL: sqlite:////tmp/ims-ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: needs.classify.outputs.mode != 'docs'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        if: needs.classify.outputs.mode != 'docs'
        run: python -m pip install -q -r requirements.txt pytest
      - name: UI smoke tests
        if: needs.classify.outputs.mode == 'ui'
        run: |
          python -m compileall -q app
          python -m pytest -q tests/test_auth_routes.py tests/test_dashboard_cache.py tests/test_gunicorn_config.py
      - name: Backend full suite
        if: needs.classify.outputs.mode == 'backend'
        run: python -m pytest -q tests/
      - name: Import full suite
        if: needs.classify.outputs.mode == 'import'
        run: python -m pytest -q tests/
      - name: Heavy full suite
        if: needs.classify.outputs.mode == 'heavy'
        run: python -m pytest -q tests/
      - name: Ops full suite
        if: needs.classify.outputs.mode == 'ops'
        run: python -m pytest -q tests/
      - name: Docs-only validation
        if: needs.classify.outputs.mode == 'docs'
        run: echo 'Docs-only change; runtime tests skipped.'

  pr_scale:
    name: PR 50-upload scale probe
    needs: classify
    if: github.event_name == 'pull_request' && (needs.classify.outputs.mode == 'import' || needs.classify.outputs.mode == 'heavy')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: testing
      SECRET_KEY: ci-test-secret-not-for-production
      DATABASE_URL: sqlite:////tmp/ims-scale.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install scale dependencies
        run: python -m pip install -q -r requirements.txt
      - name: Run bounded 50-upload scale probe
        run: >-
          python scripts/sqlite_scale_probe.py
          --uploads 50
          --competition-per-upload 100000
          --raw-per-upload 28091
          --facts-per-upload 3164
          --max-query-seconds 3.0

  main_smoke:
    name: Main smoke (${{ needs.classify.outputs.mode }})
    needs: classify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.classify.outputs.mode != 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      APP_ENV: testing
      SECRET_KEY: ci-test-secret-not-for-production
      DATABASE_URL: sqlite:////tmp/ims-main-smoke.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: UI syntax smoke
        if: needs.classify.outputs.mode == 'ui'
        run: python -m compileall -q app
      - name: Backend/import/ops smoke dependencies
        if: needs.classify.outputs.mode != 'ui'
        run: python -m pip install -q -r requirements.txt pytest
      - name: Backend smoke
        if: needs.classify.outputs.mode == 'backend'
        run: python -m pytest -q tests/test_auth_routes.py tests/test_dashboard_cache.py tests/test_gunicorn_config.py
      - name: Import smoke
        if: needs.classify.outputs.mode == 'import'
        run: python -m pytest -q tests/test_ims_import_service.py tests/test_official_aggregate_sources.py
      - name: Heavy smoke
        if: needs.classify.outputs.mode == 'heavy'
        run: python -m pytest -q tests/test_auth_routes.py tests/test_dashboard_cache.py tests/test_gunicorn_config.py
      - name: Ops smoke
        if: needs.classify.outputs.mode == 'ops'
        run: python -m pytest -q tests/test_auth_routes.py tests/test_dashboard_cache.py tests/test_gunicorn_config.py

  deploy:
    name: Deploy production (${{ needs.classify.outputs.mode }})
    needs: [classify, main_smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.classify.outputs.mode != 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Change-aware production deploy
        shell: bash
        env:
          RELEASE_MODE: ${{ needs.classify.outputs.mode }}
          REQUIREMENTS_CHANGED: ${{ needs.classify.outputs.requirements_changed }}
          PERFORMANCE_CHANGED: ${{ needs.classify.outputs.performance_changed }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" -o BatchMode=yes "$IMS_USER@$IMS_HOST" \
            "IMS_PATH='$IMS_PATH' RELEASE_MODE='$RELEASE_MODE' REQUIREMENTS_CHANGED='$REQUIREMENTS_CHANGED' PERFORMANCE_CHANGED='$PERFORMANCE_CHANGED' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          git fetch origin main
          git reset --hard origin/main
          if [ "$REQUIREMENTS_CHANGED" = "true" ]; then
            venv/bin/pip install -q -r requirements.txt
          fi
          if [ "$RELEASE_MODE" = "heavy" ]; then
            venv/bin/flask db upgrade
          fi
          if [ "$RELEASE_MODE" = "import" ] || [ "$RELEASE_MODE" = "heavy" ]; then
            PROCESSING="$(venv/bin/python - <<'PY'
from app import create_app
from app.extensions import db
app=create_app()
with app.app_context():
    print(int(db.session.execute(db.text("SELECT COUNT(*) FROM ims_import_jobs WHERE status='PROCESSING'")).scalar() or 0))
PY
)"
            echo "PROCESSING_COUNT|$PROCESSING"
            if [ "$PROCESSING" != "0" ]; then
              echo "Import is processing; refusing deploy/restart."
              exit 1
            fi
          fi
          sudo systemctl reload-or-restart ims-performance-manager.service
          if [ "$RELEASE_MODE" = "import" ] || [ "$RELEASE_MODE" = "heavy" ]; then
            sudo systemctl restart ims-import-worker.service
          fi
          sleep 2
          echo "WEB_ACTIVE|$(systemctl is-active ims-performance-manager.service)"
          echo "WORKER_ACTIVE|$(systemctl is-active ims-import-worker.service)"
          curl --fail --silent --show-error --max-time 20 http://127.0.0.1:8000/ >/dev/null
          venv/bin/python - <<'PY'
from app import create_app
from app.extensions import db
app=create_app()
with app.app_context():
    print(f"SQLITE|journal_mode={db.session.execute(db.text('PRAGMA journal_mode')).scalar()}|busy_timeout={db.session.execute(db.text('PRAGMA busy_timeout')).scalar()}")
PY
          REMOTE
      - name: Publish compact deployment evidence
        if: always()
        run: echo "Deployment step finished; inspect prior step for production evidence."
      - name: Enforce production deployment result
        if: failure()
        run: exit 1
