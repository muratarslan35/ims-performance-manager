name: Publication Notice Live Diagnostic

on:
  push:
    branches:
      - diag/publication-notice-live

permissions:
  contents: read

jobs:
  live_check:
    runs-on: ubuntu-latest
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$IMS_DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts

      - name: Read-only live publication contract check
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 \
            "$IMS_USER@$IMS_HOST" \
            "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          venv/bin/python - <<'PY'
          import sqlalchemy as sa
          from sqlalchemy import desc
          from pathlib import Path
          from app import create_app
          from app.extensions import db
          from app.models import IMSUpload, User
          from app.services.ims_publication_service import (
              IMSPublicationService,
              ims_publication_receipts,
          )

          app = create_app()
          with app.app_context():
              latest = IMSUpload.query.filter_by(status=IMSUpload.STATUS_COMPLETED).order_by(
                  desc(IMSUpload.year), desc(IMSUpload.month), desc(IMSUpload.week_number),
                  desc(IMSUpload.completed_at), desc(IMSUpload.id),
              ).first()
              visible = IMSPublicationService.latest_visible_upload()
              if visible is None:
                  raise SystemExit("No visible IMS upload found")

              users = User.query.filter(User.active.is_(True)).order_by(
                  desc(User.last_login), desc(User.id)
              ).all()
              rows = db.session.execute(
                  sa.select(
                      ims_publication_receipts.c.user_id,
                      ims_publication_receipts.c.dismissed_at,
                  ).where(ims_publication_receipts.c.upload_id == int(visible.id))
              ).all()
              receipt_map = {int(uid): dismissed for uid, dismissed in rows}
              ready_at = visible.completed_at or visible.uploaded_at
              states = {"missing": 0, "stale": 0, "current": 0}
              recent_state = "none"
              candidate = None

              for index, user in enumerate(users):
                  dismissed = receipt_map.get(int(user.id))
                  if dismissed is None:
                      state = "missing"
                      if candidate is None:
                          candidate = user
                  elif ready_at is not None and dismissed.replace(microsecond=0) < ready_at.replace(microsecond=0):
                      state = "stale"
                  else:
                      state = "current"
                  states[state] += 1
                  if index == 0:
                      recent_state = state

              payload = IMSPublicationService.notice_for_user(candidate.id) if candidate is not None else None
              payload_upload_id = int((payload or {}).get("upload_id") or 0)
              payload_week = int((payload or {}).get("week_number") or 0)
              backend_pass = int(
                  candidate is not None
                  and payload_upload_id == int(visible.id)
                  and payload_week == int(visible.week_number or 0)
              )

              print(
                  "LIVE_NOTICE_STATE|"
                  f"latest_upload_id={getattr(latest, 'id', 0)}|"
                  f"latest_week={getattr(latest, 'week_number', 0) or 0}|"
                  f"visible_upload_id={visible.id}|"
                  f"visible_week={visible.week_number or 0}|"
                  f"active_users={len(users)}|"
                  f"missing_receipt={states['missing']}|"
                  f"stale_receipt={states['stale']}|"
                  f"current_receipt={states['current']}|"
                  f"recent_active_user_receipt={recent_state}|"
                  f"candidate_available={int(candidate is not None)}|"
                  f"endpoint_payload_upload_id={payload_upload_id}|"
                  f"endpoint_payload_week={payload_week}|"
                  f"backend_pass={backend_pass}"
              )
              if candidate is not None and not backend_pass:
                  raise SystemExit("Publication service did not return the current visible IMS")

          service = Path("app/services/ims_publication_service.py").read_text(encoding="utf-8")
          notice_start = service.index("def notice_for_user")
          dismiss_start = service.index("def dismiss", notice_start)
          notice_block = service[notice_start:dismiss_start]
          base = Path("app/templates/base.html").read_text(encoding="utf-8")
          layout = Path("app/static/js/layout.js").read_text(encoding="utf-8")
          css = Path("app/static/css/layout.css").read_text(encoding="utf-8")
          checks = {
              "service_uses_visible": int("upload = cls.latest_visible_upload()" in notice_block),
              "service_avoids_ready_job": int("latest_ready_job" not in notice_block),
              "base_loads_layout": int("filename='js/layout.js'" in base),
              "fetch_endpoint": int("fetch('/ims/publication-notice'" in layout),
              "initial_check": int("checkPublishedIMSNotice();" in layout),
              "poll_15s": int("window.setInterval(checkPublishedIMSNotice, 15000);" in layout),
              "modal_text": int("Yeni IMS başarıyla yüklendi" in layout),
              "modal_css": int(".ims-published-notice-layer" in css),
          }
          print("LIVE_FRONTEND_CONTRACT|" + "|".join(f"{key}={value}" for key, value in checks.items()))
          if not all(checks.values()):
              raise SystemExit("Live frontend/publication contract is incomplete")
          PY
          REMOTE
