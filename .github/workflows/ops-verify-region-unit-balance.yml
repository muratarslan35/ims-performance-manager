name: Inspect live region balance row

on:
  push:
    branches: ["ops/audit-diyarbakir-travazol-units"]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    env:
      IMS_HOST: ${{ vars.IMS_SERVER_HOST || '130.162.48.162' }}
      IMS_PORT: ${{ vars.IMS_SERVER_PORT || '22' }}
      IMS_USER: ${{ vars.IMS_SERVER_USER || 'ubuntu' }}
      IMS_PATH: ${{ vars.IMS_DEPLOY_PATH || '/home/ubuntu/ims_system' }}
    steps:
      - name: Configure SSH
        env:
          IMS_DEPLOY_SSH_KEY: ${{ secrets.IMS_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$IMS_DEPLOY_SSH_KEY" > ~/.ssh/ims_deploy_key
          chmod 600 ~/.ssh/ims_deploy_key
          ssh-keyscan -p "$IMS_PORT" -H "$IMS_HOST" >> ~/.ssh/known_hosts
      - name: Inspect read-only balance source
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/ims_deploy_key -p "$IMS_PORT" "$IMS_USER@$IMS_HOST" "IMS_PATH='$IMS_PATH' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$IMS_PATH"
          echo "LIVE_COMMIT|$(git rev-parse HEAD)"
          venv/bin/python - <<'PY'
          from app import create_app
          from app.extensions import db
          from app.models import IMSRawData, Product
          from app.services.official_aggregate_service import OfficialAggregateService, TARGET_TYPE
          import json, os

          app=create_app()
          with app.app_context():
              p=Product.query.filter(db.func.upper(Product.product_name)=='TRAVAZOL').first()
              uid=OfficialAggregateService.latest_upload_id(2026,2,TARGET_TYPE)
              rows=IMSRawData.query.filter_by(upload_id=uid, product_id=p.id, sheet_type='dashboard_balance_region', territory='901').all()
              print('UPLOAD',uid,'ROWS',len(rows))
              for r in rows:
                  print('ROW', {c.name:getattr(r,c.name) for c in r.__table__.columns})
              archive=os.path.join(app.config['UPLOAD_FOLDER'],'ims_archive',f'upload-{uid}.xlsx')
              print('ARCHIVE',archive,os.path.exists(archive))
              if os.path.exists(archive):
                  import openpyxl
                  wb=openpyxl.load_workbook(archive,read_only=True,data_only=True)
                  for ws in wb.worksheets:
                      if 'BAK' in ws.title.upper():
                          print('SHEET',ws.title,ws.max_row,ws.max_column)
                          for row in ws.iter_rows(values_only=True):
                              vals=[str(v) if v is not None else '' for v in row]
                              if any('901' in v and 'DIYARBAKIR' in v.upper() for v in vals):
                                  print('EXCEL_ROW',vals)
          PY
          REMOTE
