name: One-shot authoritative unit target test fix

on:
  push:
    branches:
      - fix/authoritative-unit-target-test
    paths:
      - .github/workflows/one-shot-fix-authoritative-unit-target.yml

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/authoritative-unit-target-test
      - name: Update stale unit target expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_auth_routes.py')
          text = path.read_text(encoding='utf-8')
          old = '''def test_box_target_calculation_returns_whole_boxes():
              from app.services.target_box_calculation_service import TargetBoxCalculationService

              assert TargetBoxCalculationService.unit_target(1005902, 111.655) == 9009
'''
          new = '''def test_box_target_calculation_preserves_authoritative_unit_target():
              from app.services.target_box_calculation_service import TargetBoxCalculationService

              assert TargetBoxCalculationService.unit_target(1005902, 111.655) == 1005902
'''
          if old not in text:
              raise SystemExit('Expected stale test block was not found; refusing broad edit')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/one-shot-fix-authoritative-unit-target.yml
      - name: Commit focused test correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_auth_routes.py .github/workflows/one-shot-fix-authoritative-unit-target.yml
          git commit -m "test: preserve authoritative unit target expectation"
          git push origin HEAD:fix/authoritative-unit-target-test
